<title>HR & Payroll</title>

<!--
  HR & PAYROLL: replaces the "MONTHLY ATTENDANCE UNIT-2" Google workbook.

    Workbook tab           → here
    EMPLOYEE MASTER        → Employees (hr_employees + effective-dated hr_salary_structures)
    ATTENDENCE ANNUAL /
    MACHINE DATA           → Attendance (hr_attendance, one row per employee per day)
    EMP. EXP               → Advances & Deductions (hr_transactions, hr_loans)
    ON ROLL-<Month>-26     → Statutory (hr_statutory)
    SALARY SHEET           → Salary Sheet (hr_payroll_runs / hr_payroll_lines)

  The salary is calculated on the SERVER (hr_compute_ in HR_PAYROLL_MIGRATION.sql),
  column by column as the SALARY SHEET does it, so this page, a payslip and any
  later report always show the same number. The page only displays and edits.

  LOGIN = ERP LOGIN. Launcher app key HOME_HR_PAYROLL; sso-gate.js checks the
  session. The hr_* tables have RLS on with no policy, so nothing is readable with
  the anon key: every call goes through an hr_* RPC that takes the session token
  and checks the HR_* right (Admin Panel › Tab Visibility › HR & Payroll, or per
  user under Users › Apps). Buttons without the right are hidden here, but the
  server is what actually refuses.

  Without the migration the page shows a setup screen instead of failing.
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* Same tokens as order-form.html, so the two apps look like one product. */
:root{
  --navy:#1A3C5E;--blue:#2E6DA4;--lblue:#D6E8F7;
  --amber:#D4870A;--lamber:#FDF3E1;--green:#1B6B3A;--lgreen:#E6F4EC;
  --red:#C0392B;--lred:#FBEAEA;--bg:#F2F5F9;--card:#fff;
  --border:#E0E6ED;--text:#1A1A2E;--muted:#6B7897;--input:#F8FAFC;
  --sun:#FFF6E5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:13px}
.mono{font-family:'DM Mono',monospace}
a{color:var(--blue)}

/* ── Header ── */
.hdr{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(26,60,94,.25)}
.hdr-in{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.brand h1{color:#fff;font-size:15px;font-weight:700;line-height:1.2;letter-spacing:.2px}
.brand span{color:#9EC8E8;font-size:11px;display:block}
.hdr-mid{flex:1;display:flex;justify-content:center;min-width:180px}
.msel{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:4px 6px 4px 10px}
.msel label{color:#9EC8E8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.msel select{background:transparent;border:none;color:#fff;font-weight:700;font-size:14px;padding:4px;cursor:pointer;outline:none}
.msel select option{color:var(--text)}
.hdr-right{display:flex;align-items:center;gap:8px}
.hdr-user{color:#cfe3f3;font-size:12px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:7px;padding:7px 12px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.erp{background:#fff;color:var(--navy);border-color:#fff}
.hbtn svg{width:15px;height:15px}

/* ── Nav ── */
.nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:56px;z-index:90}
.nav-in{display:flex;gap:2px;max-width:1500px;margin:0 auto;padding:0 12px;overflow-x:auto;scrollbar-width:none}
.nav-in::-webkit-scrollbar{display:none}
.nav button{background:none;border:none;border-bottom:3px solid transparent;padding:12px 14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:13px}
.nav button:hover{color:var(--navy)}
.nav button.on{color:var(--navy);border-bottom-color:var(--amber)}

.main{max-width:1500px;margin:0 auto;padding:18px}
.loading{padding:60px;text-align:center;color:var(--muted)}

/* ── Building blocks ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(26,60,94,.05)}
.card h3{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-weight:500;color:var(--muted);font-size:11px}
.grid{display:grid;gap:14px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.g3{grid-template-columns:2fr 1fr}
@media (max-width:900px){.g3{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;border-left:4px solid var(--blue)}
.kpi .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin-top:6px;font-family:'DM Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.green{border-left-color:var(--green)}.kpi.amber{border-left-color:var(--amber)}.kpi.red{border-left-color:var(--red)}.kpi.navy{border-left-color:var(--navy)}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .sp{flex:1}
.toolbar h2{font-size:17px;color:var(--navy);font-weight:700;margin-right:6px}
.inp,.sel{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--input);color:var(--text);outline:none}
.inp:focus,.sel:focus{border-color:var(--blue);background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;color:var(--navy);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.btn.pri:hover{background:var(--blue);border-color:var(--blue)}
.btn.ok{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn.dan{color:var(--red);border-color:#f0c4bf}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.3px;background:var(--lblue);color:var(--navy);white-space:nowrap}
.badge.green{background:var(--lgreen);color:var(--green)}.badge.amber{background:var(--lamber);color:#8a5600}.badge.red{background:var(--lred);color:var(--red)}.badge.grey{background:#eef1f5;color:var(--muted)}
.note{background:var(--lblue);border:1px solid #b9d5ee;color:var(--navy);border-radius:10px;padding:10px 14px;font-size:12.5px;line-height:1.6;margin-bottom:12px}
.note.warn{background:var(--lamber);border-color:#f0d39c;color:#6b4300}
.note.red{background:var(--lred);border-color:#f0c4bf;color:#7d2219}
.muted{color:var(--muted)}
.right{text-align:right}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--input);border:1px solid var(--border);font-size:12.5px;line-height:1.5}
.alert b{color:var(--navy)}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--blue)}
.alert.red .dot{background:var(--red)}.alert.amber .dot{background:var(--amber)}.alert.green .dot{background:var(--green)}
.chart-box{position:relative;height:250px}

/* ── Tables ── */
.tw{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;max-height:calc(100vh - 240px)}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
table.t th{position:sticky;top:0;background:#EEF3F9;color:var(--navy);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;padding:8px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;z-index:2}
table.t th .lt{display:block;font-size:9.5px;color:var(--muted);font-weight:600}
table.t td{padding:7px 9px;border-bottom:1px solid #EEF1F5;white-space:nowrap}
table.t tbody tr:hover td{background:#F7FAFD}
table.t td.n,table.t th.n{text-align:right;font-family:'DM Mono',monospace}
table.t tr.tot td{background:#FFF9EC;font-weight:700;position:sticky;top:33px;z-index:1;border-bottom:2px solid #f0d39c}
table.t tr.click{cursor:pointer}
table.t .lnk{color:var(--blue);cursor:pointer;font-weight:600}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* Attendance grid */
.att{font-size:12px}
.att th,.att td{padding:0!important;text-align:center}
.att th{padding:5px 2px!important;min-width:38px}
.att th small{display:block;font-size:9px;color:var(--muted);font-weight:600}
.att .stk{position:sticky;left:0;z-index:3;background:#fff;text-align:left;padding:5px 8px!important}
.att th.stk{background:#EEF3F9;z-index:4}
.att .c2{left:64px;min-width:150px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
.att .c1{min-width:64px}
.att td.sun,.att th.sun{background:var(--sun)}
.att td.ac{width:38px;height:28px;font-family:'DM Mono',monospace;font-size:12px;color:var(--text)}
.att td.ac.ot{color:var(--amber);font-weight:700}
.att td.ac.zero{color:var(--red)}
.att td.off{background:repeating-linear-gradient(45deg,#f4f6f9,#f4f6f9 4px,#eceff3 4px,#eceff3 8px)}
.att td.sm{padding:0 6px!important;font-family:'DM Mono',monospace;font-size:11.5px;text-align:right;background:#FAFBFD}

/* Salary sheet */
.sal input.np{width:92px;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;text-align:right;font-family:'DM Mono',monospace;font-size:12px;background:var(--input)}
.sal td.neg{color:var(--red);font-weight:700}
.sal td.cash{background:#F2FAF5;font-weight:700;color:var(--green)}
/* Salary Sheet headings wrap, so each column is only as wide as its data
   (cells stay on one line) or its longest heading word. width:1px asks the
   table for the narrowest column that fits; min-width keeps short ones readable. */
.sal table.t th{white-space:normal;width:1px;min-width:58px;vertical-align:bottom;line-height:1.25}
.sal th.grpE{background:#E9F4EC}.sal th.grpD{background:#FBEFEF}.sal th.grpA{background:#EEF3F9}
details.how{margin-bottom:12px}
details.how summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:12.5px}
details.how .body{margin-top:10px;font-size:12.5px;line-height:1.75;columns:2;column-gap:28px}
@media (max-width:900px){details.how .body{columns:1}}
details.how code{font-family:'DM Mono',monospace;background:var(--input);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:11.5px}

/* ── Modal ── */
.mbg{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto}
.mbg.on{display:flex}
.mdl{background:#fff;border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:calc(100vh - 56px)}
.mdl.wide{max-width:1100px}
.mdl-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.mdl-h h2{font-size:15px;color:var(--navy);flex:1}
.mdl-h .x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:2px 8px}
.mdl-b{padding:16px 18px;overflow:auto}
.mdl-f{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.fg label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fg input,.fg select,.fg textarea{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--input);outline:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--blue);background:#fff}
.fg.chk{display:flex;align-items:center;gap:8px;padding-top:18px}
.fg.chk input{width:auto}
.fg.chk label{margin:0}
.fsec{font-size:11.5px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.6px;margin:16px 0 8px;border-bottom:1px dashed var(--border);padding-bottom:4px}
.fsec:first-child{margin-top:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;overflow-x:auto}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--navy);border-bottom-color:var(--amber)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 18px;font-size:12.5px}
.kv div span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase}

/* ── Import ── */
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:14px}
.kind{border:1.5px solid var(--border);border-radius:10px;padding:12px;background:#fff;cursor:pointer;text-align:left}
.kind b{display:block;color:var(--navy);font-size:13px}
.kind span{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.kind.on{border-color:var(--navy);box-shadow:0 0 0 2px var(--lblue)}
textarea.paste{width:100%;min-height:120px;padding:10px;border:1.5px dashed var(--border);border-radius:8px;font-family:'DM Mono',monospace;font-size:11.5px;background:var(--input)}
.prog{height:8px;background:#eef1f5;border-radius:99px;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:var(--green);width:0;transition:width .2s}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(560px,calc(100vw - 32px));display:none}
.toast.err{background:var(--red)}.toast.ok{background:var(--green)}

#printFrame{position:fixed;width:0;height:0;border:0;right:0;bottom:0}
@media (max-width:640px){
  .main{padding:12px 16px}
  .hdr-in{padding:8px 16px}
  .hdr-mid{order:3;flex-basis:100%;justify-content:flex-start}
  .nav{top:96px}
  .hdr-user{display:none}
}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════════
   SETUP: same project & anon key as the ERP. The anon key reads nothing
   from hr_* directly (RLS, no policies); it can only call the hr_* RPCs,
   and every one of those checks the session token first.
   ════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL  = "https://jdlzgjgxxjkjejkhvdij.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkbHpnamd4eGpramVqa2h2ZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODUwMDcsImV4cCI6MjEwNTY2MTAwN30.ow4i6e78i-dGoJJh2-N4FX6EQE7f2FRQDgCMJHpxAWk";
const APP_KEY = 'HOME_HR_PAYROLL';
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let BOOT = null, P = {};
const S = { month: null, emps: [], empMap: {}, view: 'dashboard' };
let CHARTS = [];

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const can = k => !!P[k];
// Local date, never toISOString() (that is UTC and gives yesterday before 5:30 am).
function localISO(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
const monthStart = iso => String(iso).slice(0, 7) + '-01';
function monthLabel(iso){ const [y, m] = String(iso).split('-'); return MONTHS[+m - 1] + ' ' + y; }
function daysIn(iso){ const [y, m] = String(iso).split('-').map(Number); return new Date(y, m, 0).getDate(); }
function dmy(iso){ if (!iso) return ''; const s = String(iso).slice(0, 10).split('-'); return s.length === 3 ? s[2] + '/' + s[1] + '/' + s[0] : iso; }
const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
const fmtM = n => (n == null || n === '') ? '' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const fmtR = n => '₹ ' + Math.round(num(n)).toLocaleString('en-IN');
const fmtH = n => (n == null || n === '') ? '' : Number(n).toLocaleString('en-IN', { maximumFractionDigits: 2 });

/* ── Server calls ─────────────────────────────────────────────────────
   One door for every hr_* RPC. A session problem goes back to the
   launcher (as sso-gate does); a missing function means the migration has
   not been run, and that gets its own screen instead of a raw error. */
const SESSION_ERR = { NO_TOKEN: 1, NO_SESSION: 1, SESSION_REVOKED: 1, SESSION_EXPIRED: 1 };
const ERR_TEXT = {
  MONTH_LOCKED: 'This month is locked. Someone with the Lock right has to unlock it in the Salary Sheet first.',
  NOT_COMPUTED: 'Compute the salary sheet for this month first.',
  USED_BY_LOCKED_MONTH: 'This salary row is used by a locked month and cannot be removed.',
  NOT_FOUND: 'Record not found (it may have been removed by someone else). Refresh and try again.',
  EMP_CODE_REQUIRED: 'Emp. Code is required.',
  NAME_REQUIRED: 'Name is required for a new employee.',
  ATTENDANCE_IMPORT_ONLY: 'Attendance can only come from Import › Attendance: machine data.'
};
function errText(e){
  e = String(e || 'Unknown error');
  if (e.indexOf('NO_PERMISSION:') === 0)
    return 'You do not have the right for this (' + e.slice(14) + '). Ask the Admin: Admin Panel › Tab Visibility › HR & Payroll, or Users › Apps.';
  for (const k in ERR_TEXT) if (e.indexOf(k) >= 0) return ERR_TEXT[k];
  return e;
}
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify(Object.assign({ p_token: SARV_GATE.token }, args || {}))
    });
  } catch (e) { throw new Error('Could not reach the server. Please check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    const code = d && d.code;
    if (code === 'PGRST202' || code === '42883' || code === '42P01') {
      const e = new Error('SETUP'); e.setup = true; e.detail = (d && d.message) || ''; throw e;
    }
    throw new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
  }
  if (d && d.success === false) {
    const err = String(d.error || '');
    if (SESSION_ERR[err]) { location.replace('launcher.html?why=' + err); return new Promise(() => {}); }
    if (err === 'NO_APP_ACCESS') {
      SARV_GATE.halt('HR & Payroll', 'HR & Payroll is turned off for your login. Ask the Admin to switch it <b>ON</b> under <i>Admin Panel › Users › Apps</i>, then log in again.', err);
      return new Promise(() => {});
    }
    throw new Error(errText(err));
  }
  return d;
}

function downloadCSV(name, head, rows){
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '﻿' + [head].concat(rows).map(r => r.map(q).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
/* Export PDF: the same rows as Export CSV, laid out on A4 with the company
   name, the screen's title, the print time, page numbers and an optional
   totals row. Money / hours are formatted en-IN; the ₹ sign is left out
   because the PDF's built-in font has no glyph for it. opt: num (column
   indexes to right-align and format), foot (totals row), portrait,
   fontSize, didParseCell (autotable hook, e.g. to shade Sundays). */
function exportPDF(file, title, head, rows, opt){
  opt = opt || {};
  const J = window.jspdf && window.jspdf.jsPDF;
  if (!J || !(J.API && J.API.autoTable)) { toast('The PDF library did not load (check the internet). Export CSV still works.', 'err'); return; }
  const doc = new J({ orientation: opt.portrait ? 'portrait' : 'landscape', unit: 'mm', format: 'a4' });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), st = (BOOT && BOOT.settings) || {};
  const numSet = new Set(opt.num || []);
  const cell = (v, i) => v == null || v === '' ? '' : (numSet.has(i) && v !== true && v !== false && !isNaN(+v) ? fmtM(+v) : String(v));
  const fs = opt.fontSize || (head.length > 24 ? 5.5 : head.length > 14 ? 6.5 : 8);
  const colStyles = {}; numSet.forEach(i => { colStyles[i] = { halign: 'right' }; });
  doc.autoTable({
    head: [head], body: rows.map(r => r.map(cell)), foot: opt.foot ? [opt.foot.map(cell)] : undefined, showFoot: 'lastPage',
    startY: 22, margin: { top: 22, left: 8, right: 8, bottom: 10 }, theme: 'grid',
    styles: { fontSize: fs, cellPadding: 1, lineColor: [224, 230, 237], lineWidth: 0.1, textColor: [26, 26, 46], overflow: 'linebreak' },
    headStyles: { fillColor: [26, 60, 94], textColor: 255, fontStyle: 'bold', halign: 'center', valign: 'middle' },
    footStyles: { fillColor: [255, 249, 236], textColor: [26, 26, 46], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [247, 250, 253] },
    columnStyles: colStyles,
    didParseCell: opt.didParseCell,
    didDrawPage: () => {
      doc.setFont(undefined, 'bold'); doc.setFontSize(12); doc.setTextColor(26, 60, 94);
      doc.text(st.company || 'SARV INDIA HOME FURNISHING', 8, 11);
      doc.setFont(undefined, 'normal'); doc.setFontSize(9); doc.setTextColor(80);
      doc.text(title, 8, 16.5);
      doc.setFontSize(7); doc.setTextColor(120);
      doc.text('Printed ' + new Date().toLocaleString('en-IN') + (BOOT && BOOT.user && BOOT.user.name ? ' by ' + BOOT.user.name : ''), W - 8, 16.5, { align: 'right' });
      doc.text('Page ' + doc.internal.getNumberOfPages(), W - 8, H - 5, { align: 'right' });
    }
  });
  doc.save(file + '.pdf');
}
function exportTable(fmt, file, title, head, rows, opt){
  if (fmt === 'pdf') exportPDF(file, title, head, rows, opt);
  else downloadCSV(file + '.csv', head, rows);
}

function buildMonthSelect(){
  const now = new Date(), opts = [];
  for (let i = 1; i >= -24; i--) opts.push(localISO(new Date(now.getFullYear(), now.getMonth() + i, 1)));
  (BOOT.runs || []).forEach(r => { if (opts.indexOf(r.pay_month) < 0) opts.push(r.pay_month); });
  opts.sort().reverse();
  let saved = null; try { saved = localStorage.getItem('hr_month'); } catch (e) {}
  if (!S.month) S.month = opts.indexOf(saved) >= 0 ? saved : localISO(new Date(now.getFullYear(), now.getMonth(), 1));
  const st = {}; (BOOT.runs || []).forEach(r => { st[r.pay_month] = r.status; });
  $('monthSel').innerHTML = opts.map(m => '<option value="' + m + '"' + (m === S.month ? ' selected' : '') + '>'

let DD_ROWS = null;   // { key: [VALUES] } once read; stays null after a failed read so the next form tries again
async function loadDropdowns(){

// Values are kept in CAPITALS (as caps-input.js saves them), so the check is a plain compare.
function ddList(k){
  const d = HR_DD[k], rows = (DD_ROWS || {})[d.key];
  if (rows && rows.length) return [...new Set(rows.filter(Boolean))];
  if (d.def.length) return d.def.slice();

}
/* An existing employee's current value (data-keep) stays allowed even if it is
   no longer in the list, so editing an old record does not blank the field.
   A list that is still empty (nothing in the master, no employee has a value
   yet) checks nothing, or the very first Employee Master import would fail
   on every row. */
function ddAllowed(k, v, keep){ const l = ddList(k); return !v || v === keep || !l.length || l.indexOf(v) >= 0; }
function ddCheck(el, k){
  const v = el.value.trim().toUpperCase();
  if (ddAllowed(k, v, el.dataset.keep)) { el.value = v; return; }
  el.value = '';
  toast('Choose ' + el.dataset.label + ' from the list. New values are added in ERP › Master Data › Dropdown Master.', 'err');
}
/* Next number in the code series: the highest code's trailing number + 1,
   keeping its prefix and zero padding (1009 → 1010, EMP-009 → EMP-010). */
function nextEmpCode(){
  let best = null;
  S.emps.forEach(e => { const m = /^(.*?)(\d+)$/.exec(String(e.emp_code || '')); if (m && (!best || +m[2] > +best[2])) best = m; });
  return best ? best[1] + String(+best[2] + 1).padStart(best[2].length, '0') : '1001';
}
/* One rule set for the Employee form and Import › Employee Master. keepOf(k)
   gives the value already saved (still allowed in a 'dd' field). blankKeeps:
   in the import a blank cell keeps what is saved, so on an existing employee
   nothing is required; on the form Code and Name always are. */
function empRuleError(p, isNew, keepOf, blankKeeps){
  for (const [k, label, type, opt] of EMP_FIELDS.filter(f => f.length > 1)) {
    const o = (opt && !Array.isArray(opt)) ? opt : {}, v = p[k];
    if (v == null || v === '') { if ((o.req && !blankKeeps) || ((o.req || o.reqNew) && isNew)) return label + ' is required.'; continue; }
    if (type === 'digits' && !new RegExp('^\\d{' + o.len + '}$').test(v)) return label + ' must be exactly ' + o.len + ' digits ("' + v + '").';
    if (type === 'pan' && !/^[A-Z]{5}\d{4}[A-Z]$/.test(v)) return 'PAN must be 10 characters: 5 letters, 4 digits, 1 letter, e.g. ABCDE1234F ("' + v + '").';
    if (type === 'dd' && !ddAllowed(k, v, keepOf(k))) return label + ' "' + v + '" is not in the Dropdown Master list.';
  }

}

/* Import › Employee Master: tidy the cells the way the form's boxes do

function checkEmpImportRow(r){
  EMP_FIELDS.filter(f => f.length > 1 && r[f[0]] != null && r[f[0]] !== '').forEach(([k, , type]) => {
    if (type === 'digits') r[k] = String(r[k]).replace(/[\s\-]/g, '');
    else if (type === 'pan') r[k] = String(r[k]).replace(/\s/g, '').toUpperCase();
    else if (type === 'dd') r[k] = String(r[k]).trim().toUpperCase();

  const bad = empRuleError(r, !old, k => old ? String(old[k] || '').trim().toUpperCase() : '', true);

  if (r.duty_hours != null && !(Number.isInteger(r.duty_hours) && r.duty_hours >= 1 && r.duty_hours <= 24))

/* ════════════════════════════════════════════════════════════════════
   ATTENDANCE: one month, employees × days, hours per cell (like
   ATTENDENCE ANNUAL). READ ONLY on purpose: the hours come only from the
   biometric machine, through Import › Attendance: machine data, so no day
   can be typed or changed by hand (hr_save_attendance on the server also
   refuses anything that is not an import). To correct a day, fix it in the
   machine export and import that file again: the same day is overwritten.
   Hours above duty hours show amber (OT), 0 shows red, Sundays are shaded,
   days before joining / after exit are hatched.
   ════════════════════════════════════════════════════════════════════ */
let ATT = null;
const ATTF = { q: '', dept: '' };
async function renderAttendance(){
  const d = await rpc('hr_attendance_month', { p_month: S.month });
  // `dirty` stays empty (nothing is editable); leaveOk() still reads it.
  ATT = { month: S.month, locked: d.locked, emps: d.employees || [], hours: d.hours || {}, dirty: {}, dim: daysIn(S.month) };
  const canImp = can('HR_ATTENDANCE') && !ATT.locked;
  $('view').innerHTML = `
  <div class="toolbar"><h2>Attendance · ${monthLabel(S.month)}</h2>
    <input class="inp" placeholder="Search code / name" value="${esc(ATTF.q)}" oninput="ATTF.q=this.value;drawAtt()">
    <select class="sel" onchange="ATTF.dept=this.value;drawAtt()">${deptOptions(ATT.emps, ATTF.dept)}</select>
    <span class="sp"></span>
    <span class="muted" style="font-size:11.5px">Hours per day · <b style="color:var(--amber)">amber</b> = above duty hours · <b style="color:var(--red)">0</b> = absent</span>
    <button class="btn" onclick="exportAtt('csv')">Export CSV</button><button class="btn" onclick="exportAtt('pdf')">Export PDF</button>
    ${canImp ? '<button class="btn pri" onclick="IMP.kind=\'ATT_LONG\';IMP.raw=null;go(\'import\')">Import machine data</button>' : ''}
  </div>
  <div class="note">Attendance is <b>read only</b>. It comes only from the biometric machine through <b>Import › Attendance: machine data</b>. To correct a day, fix it in the machine export and import the file again; the same day is overwritten.</div>
  ${ATT.locked ? '<div class="note warn">This month is <b>locked</b> (salary paid). New imports for it are refused until it is unlocked in the Salary Sheet.</div>' : ''}
  ${!ATT.emps.length ? '<div class="note">No employees for this month. Import the Employee Master first (Import tab).</div>' : ''}
  <div class="tw" id="attWrap"></div>`;
  drawAtt();
}
function attRows(){
  const q = ATTF.q.trim().toUpperCase();
  return ATT.emps.filter(e => (!ATTF.dept || e.department === ATTF.dept) && (!q || (e.emp_code + ' ' + e.name).toUpperCase().indexOf(q) >= 0));
}
function attVal(code, day){
  const h = (ATT.hours[code] || {})[day];
  return h == null ? '' : String(+h);
}
function attDows(){
  const [y, m] = ATT.month.split('-').map(Number), out = [];
  for (let d = 1; d <= ATT.dim; d++) out.push(new Date(y, m - 1, d).getDay());
  return out;
}
/* One employee's month: the day values plus the three totals. */
function attLine(e, dows){
  const days = []; let hrs = 0, pres = 0, sun = 0;
  for (let d = 1; d <= ATT.dim; d++) {
    const v = attVal(e.emp_code, d); days.push(v);
    if (v === '') continue;
    const n = +v; hrs += n; if (n > 0) pres++; if (dows[d - 1] === 0) sun += n;
  }
  return { days, hrs: Math.round(hrs * 100) / 100, pres, sun: Math.round(sun * 100) / 100 };
}
function drawAtt(){
  const dim = ATT.dim, dows = attDows();
  let h = '<table class="t att"><thead><tr><th class="stk c1">Code</th><th class="stk c2">Name</th><th>Duty</th>';
  for (let d = 1; d <= dim; d++) h += '<th class="' + (dows[d - 1] === 0 ? 'sun' : '') + '">' + d + '<small>' + 'SMTWTFS'[dows[d - 1]] + '</small></th>';
  h += '<th>Hours</th><th>Present</th><th>Sun h</th></tr></thead><tbody>';
  attRows().forEach(e => {
    const L = attLine(e, dows);
    h += '<tr><td class="stk c1 mono">' + esc(e.emp_code) + '</td><td class="stk c2" title="' + esc(e.name + ' · ' + (e.department || '')) + '">' + esc(e.name) + '</td>'
      + '<td class="sm">' + (e.duty_hours == null ? '—' : fmtH(e.duty_hours)) + '</td>';
    L.days.forEach((v, i) => {
      const iso = ATT.month.slice(0, 8) + pad(i + 1), off = (e.doj && iso < e.doj) || (e.doe && iso > e.doe);
      h += '<td class="ac' + (dows[i] === 0 ? ' sun' : '') + (off ? ' off' : '') + cellCls(v, e.duty_hours) + '">' + esc(v) + '</td>';
    });
    h += '<td class="sm">' + fmtH(L.hrs) + '</td><td class="sm">' + L.pres + '</td><td class="sm">' + (L.sun ? fmtH(L.sun) : '') + '</td></tr>';
  });
  $('attWrap').innerHTML = h + '</tbody></table>';
}
function cellCls(v, duty){
  if (v === '') return '';
  const n = +v;
  return n === 0 ? ' zero' : (duty != null && n > +duty ? ' ot' : '');
}
function exportAtt(fmt){
  const dim = ATT.dim, dows = attDows(), file = 'attendance-' + ATT.month.slice(0, 7);
  const head = ['EMP. CODE', 'NAME', 'DEPARTMENT', 'DUTY HOUR'];
  for (let d = 1; d <= dim; d++) head.push(fmt === 'pdf' ? d + '\n' + 'SMTWTFS'[dows[d - 1]] : String(d));
  head.push('HOURS', 'PRESENT', 'SUN HRS');
  const rows = attRows().map(e => {
    const L = attLine(e, dows);
    return [e.emp_code, e.name, e.department || '', e.duty_hours].concat(L.days.map(v => v === '' ? '' : +v), [L.hrs, L.pres, L.sun || '']);
  });
  exportTable(fmt, file, 'Attendance · ' + monthLabel(ATT.month) + ' · hours per day (biometric machine)', head, rows, {
    num: head.map((_, i) => i).filter(i => i >= 3), fontSize: 5.5,
    didParseCell: c => { if (c.section !== 'foot' && c.column.index >= 4 && c.column.index < 4 + dim && dows[c.column.index - 4] === 0 && c.section === 'body') c.cell.styles.fillColor = [255, 246, 229]; }
  });
}

    <p class="muted" style="font-size:11.5px;margin-top:10px">The loan amount handed over is not a salary deduction. Each month "Post EMIs" adds a Loan EMI entry (never more than the balance), which is cut in AA ADVANCE.</p>`,
    '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" onclick="saveLoan(this,' + (id || 0) + ')">Save</button>');
}
async function saveLoan(btn, id){
  const code = $('ln_code').value.trim().toUpperCase();
  if (!S.empMap[code]) { toast('Unknown Emp. Code ' + code, 'err'); return; }
  if (!(+$('ln_p').value > 0)) { toast('Enter the principal.', 'err'); return; }
  await busy(btn, async () => {
    await rpc('hr_save_loan', { p_row: { id: id || null, emp_code: code, loan_date: $('ln_date').value, principal: $('ln_p').value,
      emi: $('ln_emi').value, status: $('ln_st').value, remarks: $('ln_rm').value } });
    closeModal(); toast('Loan saved', 'ok'); renderAdvances();
  });
}
async function postEmis(btn){
  if (!confirm('Add this month\'s EMI for every open loan that has none yet?')) return;
  await busy(btn, async () => { const r = await rpc('hr_post_loan_emis', { p_month: S.month }); toast(r.posted + ' EMI entr' + (r.posted === 1 ? 'y' : 'ies') + ' posted', 'ok'); renderAdvances(); });
}

/* ════════════════════════════════════════════════════════════════════
   STATUTORY (the ON ROLL register): PF / ESI / LWF / cheque per month
   ════════════════════════════════════════════════════════════════════ */
let STAT = null;
async function renderStatutory(){
  const d = await rpc('hr_list_statutory', { p_month: S.month });
  STAT = { rows: d.rows || [], locked: d.locked, dirty: {} };
  const w = can('HR_TXN') && !STAT.locked;
  $('view').innerHTML = `
  <div class="toolbar"><h2>PF / ESI / LWF / Cheque · ${monthLabel(S.month)}</h2>
    <input class="inp" id="stQ" placeholder="Search" oninput="drawStat()"><span class="sp"></span>
    ${w ? '<input class="inp" id="stAdd" list="empList" placeholder="Add Emp. Code" style="width:140px"><button class="btn" onclick="addStatRow()">+ Add</button>' : ''}
    <button class="btn" onclick="exportStat('csv')">Export CSV</button><button class="btn" onclick="exportStat('pdf')">Export PDF</button>
    ${w ? '<button class="btn pri" onclick="IMP.kind=\'STATUTORY\';IMP.raw=null;go(\'import\')">Import</button>' : ''}
    ${w ? '<button class="btn ok" id="stSave" onclick="saveStat(this)" disabled>Save</button>' : ''}</div>
  <div class="note">This is the <b>ON ROLL-${MONTHS[+S.month.slice(5, 7) - 1]}</b> register: PF (AB), ESI (AC), Welfare / LWF (AD) and the amount paid by <b>cheque</b> (AG) are cut from the cash. Employees marked PF / ESI / Welfare are listed; add anyone else by code. The quickest way to fill it is <b>Import</b>: it takes this table's Export CSV (EMP. CODE, PF, ESI, LWF, CHEQUE) or the old ON ROLL register sheet as it is.</div>
  ${STAT.locked ? '<div class="note warn">This month is locked; read-only.</div>' : ''}
  <div class="tw" id="stTbl" data-no-caps></div>`;
  drawStat();
}
function drawStat(){
  const q = (($('stQ') || {}).value || '').trim().toUpperCase(), w = can('HR_TXN') && !STAT.locked;
  const rows = STAT.rows.filter(r => !q || (r.emp_code + ' ' + r.name).toUpperCase().indexOf(q) >= 0);
  const tot = { pf: 0, esi: 0, lwf: 0, cheque_amt: 0 };
  rows.forEach(r => { for (const k in tot) tot[k] += num(stv(r, k)); });
  const cell = (r, k) => w ? '<input class="inp mono" style="width:100px;text-align:right;padding:5px 7px" type="number" min="0" step="0.01" data-c="' + esc(r.emp_code) + '" data-k="' + k + '" value="' + esc(stv(r, k)) + '" oninput="statEdit(this)">' : fmtM(r[k]);
  $('stTbl').innerHTML = `<table class="t"><thead><tr><th>Code</th><th>Name</th><th>Dept</th><th>Flags</th><th class="n">PF <span class="lt">AB</span></th><th class="n">ESI <span class="lt">AC</span></th><th class="n">Welfare <span class="lt">AD</span></th><th class="n">Cheque <span class="lt">AG</span></th></tr></thead><tbody>
  <tr class="tot"><td colspan="4">${rows.length} employee(s)</td><td class="n">${fmtM(tot.pf)}</td><td class="n">${fmtM(tot.esi)}</td><td class="n">${fmtM(tot.lwf)}</td><td class="n">${fmtM(tot.cheque_amt)}</td></tr>
  ${rows.map(r => `<tr><td class="mono">${esc(r.emp_code)}</td><td>${esc(r.name || '')}</td><td>${esc(r.department || '')}</td>
    <td>${r.pf_flag ? '<span class="badge">PF</span> ' : ''}${r.esi_flag ? '<span class="badge">ESI</span> ' : ''}${r.welfare_flag ? '<span class="badge">LWF</span>' : ''}</td>
    <td class="n">${cell(r, 'pf')}</td><td class="n">${cell(r, 'esi')}</td><td class="n">${cell(r, 'lwf')}</td><td class="n">${cell(r, 'cheque_amt')}</td></tr>`).join('')
    || '<tr><td colspan="8" class="empty">Nobody is marked PF / ESI / Welfare for this month.</td></tr>'}</tbody></table>`;
}
const stv = (r, k) => { const d = STAT.dirty[r.emp_code]; return d && k in d ? d[k] : (r[k] == null ? '' : r[k]); };
function statEdit(i){
  const c = i.dataset.c; STAT.dirty[c] = STAT.dirty[c] || {}; STAT.dirty[c][i.dataset.k] = i.value;
  const b = $('stSave'), n = Object.keys(STAT.dirty).length; b.disabled = !n; b.textContent = 'Save ' + n + ' row' + (n > 1 ? 's' : '');
}
function addStatRow(){
  const c = $('stAdd').value.trim().toUpperCase(), e = S.empMap[c];
  if (!e) { toast('Unknown Emp. Code', 'err'); return; }
  if (!STAT.rows.find(r => r.emp_code === c)) STAT.rows.unshift({ emp_code: c, name: e.name, department: e.department, pf_flag: e.pf_flag, esi_flag: e.esi_flag, welfare_flag: e.welfare_flag });
  $('stAdd').value = ''; drawStat();
}
async function saveStat(btn){
  const rows = Object.keys(STAT.dirty).map(c => { const r = STAT.rows.find(x => x.emp_code === c) || {}; const o = { emp_code: c };
    ['pf', 'esi', 'lwf', 'cheque_amt'].forEach(k => { o[k] = stv(r, k) || 0; }); return o; });
  await busy(btn, async () => {
    const r = await rpc('hr_save_statutory', { p_month: S.month, p_rows: rows, p_source: 'MANUAL' });
    STAT.dirty = {}; toast(r.saved + ' row(s) saved' + (r.errors.length ? ', ' + r.errors.length + ' failed' : ''), r.errors.length ? 'err' : 'ok'); renderStatutory();
  });
}
function exportStat(fmt){
  const rows = STAT.rows.map(r => [r.emp_code, r.name, stv(r, 'pf'), stv(r, 'esi'), stv(r, 'lwf'), stv(r, 'cheque_amt')]);
  exportTable(fmt, 'on-roll-' + S.month.slice(0, 7), 'PF / ESI / LWF / Cheque · ' + monthLabel(S.month),
    ['EMP. CODE', 'NAME', 'PF', 'ESI', 'LWF', 'CHEQUE'], rows,
    { num: [2, 3, 4, 5], portrait: true, foot: ['', rows.length + ' employees'].concat([2, 3, 4, 5].map(i => rows.reduce((a, r) => a + num(r[i]), 0))) });
}

/* ════════════════════════════════════════════════════════════════════
   SALARY SHEET: the SALARY SHEET tab, computed on the server
   ════════════════════════════════════════════════════════════════════ */
// key, label, sheet column, kind (t text, h hours, d days, i int, m money), group, in compact view
const SHEET_COLS = [
  ['emp_code', 'Code', 'B', 't', 'A', 1], ['name', 'Name', 'D', 't', 'A', 1], ['department', 'Dept', 'G', 't', 'A', 1],
  ['designation', 'Designation', 'I', 't', 'A', 0], ['salary_class', 'Sal. Class', 'J', 't', 'A', 1],
  ['duty_hours', 'Duty Hr', 'K', 'h', 'A', 1], ['salary', 'Salary', 'L', 'm', 'A', 1],
  // M / N / O carry the old sheet's own headings and stay in the compact view: they show how P splits up.
  ['work_hours', 'W.HRS W/O SUNDAY & W/O OT', 'M', 'h', 'A', 1], ['reg_ot', 'REGULAR DAYS OT', 'N', 'h', 'A', 1], ['sunday_hours', 'SUNDAY W.HRS', 'O', 'h', 'A', 1],
  ['total_ot', 'Total OT', 'P', 'h', 'A', 1], ['days', 'Days', 'Q', 'd', 'A', 0], ['absent_days', 'Absent', 'R', 'i', 'A', 0],
  ['present_days', 'Present', 'S', 'i', 'A', 1], ['weekly_off', 'W.Off', 'T', 'i', 'A', 1], ['total_days', 'Total Days', 'U', 'd', 'A', 1],
  ['ot_amt', 'OT Amt', 'V', 'm', 'E', 1], ['salary_amt', 'Salary Amt', 'W', 'm', 'E', 1], ['other_earn', 'Incent./Arrear', '+', 'm', 'E', 0],
  ['total_salary', 'Total Salary', 'X', 'm', 'E', 1],
  ['food', 'Night Food', 'Y', 'm', 'D', 0], ['debit', 'Debit Note', 'Z', 'm', 'D', 0], ['advance', 'Advance', 'AA', 'm', 'D', 0],
  ['pf', 'PF', 'AB', 'm', 'D', 0], ['esi', 'ESI', 'AC', 'm', 'D', 0], ['lwf', 'Welfare', 'AD', 'm', 'D', 0],
  ['statutory_total', 'PF/ESI/WF', 'AE', 'm', 'D', 0], ['total_deduction', 'Total Ded.', 'AF', 'm', 'D', 1],
  ['cheque_amt', 'Cheque', 'AG', 'm', 'D', 1], ['cash', 'Cash', 'AH', 'm', 'E', 1], ['net_cash_paid', 'Net Cash Paid', 'AI', 'm', 'E', 1]
];
const FLAG_TEXT = { NO_ATTENDANCE: 'No attendance', NEGATIVE_CASH: 'Negative cash', NO_STATUTORY: 'PF/ESI entry missing', ON_HOLD: 'On hold' };
const SALF = { q: '', dept: '', flag: '', full: 0 };
let PAY = null;
function loadSalPrefs(){ try { SALF.full = +(localStorage.getItem('hr_sal_full') || 0); } catch (e) {} }
loadSalPrefs();
async function renderSalary(){
  PAY = await rpc('hr_get_payroll', { p_month: S.month });
  const run = PAY.run, locked = run && run.status === 'LOCKED';
  const miss = (run && run.missing) || [];
  $('view').innerHTML = `
  <div class="toolbar"><h2>Salary Sheet · ${monthLabel(S.month)}</h2>
    ${run ? (locked ? '<span class="badge green">LOCKED by ' + esc(run.locked_by || '') + '</span>' : '<span class="badge amber">DRAFT</span>') : '<span class="badge grey">NOT COMPUTED</span>'}
    <span class="muted" style="font-size:12px">${run && run.computed_at ? 'computed ' + new Date(run.computed_at).toLocaleString('en-IN') + ' by ' + esc(run.computed_by || '') + ' · ' + daysIn(S.month) + '-day month' : ''}</span>
    <span class="sp"></span>
    ${can('HR_PAYROLL') && !locked ? '<button class="btn pri" onclick="computeMonth(this)">' + (run ? '↻ Recompute' : 'Compute salary') + '</button>' : ''}
    ${can('HR_LOCK') && run ? (locked ? '<button class="btn warn" onclick="lockMonth(this,false)">Unlock</button>' : '<button class="btn ok" onclick="lockMonth(this,true)">Lock month</button>') : ''}
  </div>
  ${miss.length ? '<div class="note red"><b>' + miss.length + ' employee(s) are not on this sheet</b> because they have no salary structure (duty hours + salary): '
    + miss.slice(0, 12).map(m => '<a href="javascript:void 0" onclick="openEmployee(\'' + esc(m.emp_code) + '\')">' + esc(m.emp_code) + ' ' + esc(m.name) + '</a>').join(', ') + (miss.length > 12 ? ' and ' + (miss.length - 12) + ' more' : '') + '.</div>' : ''}
  <details class="how"><summary>How each column is calculated (same as the SALARY SHEET)</summary><div class="body">
    <div><b>K</b> duty hours and <b>L</b> salary: the employee's salary row in force for this month.</div>
    <div><b>P TOTAL OT</b> = hours above K on weekdays + every hour worked on Sunday. 0 for a class with OT not counted (CLASS 2).</div>
    <div><b>O SUNDAY W.HRS</b> = every hour worked on Sundays · <b>N REGULAR DAYS OT</b> = P − O, the hours above K on weekdays
      · <b>M W.HRS W/O SUNDAY &amp; W/O OT</b> = all hours − P, so weekday hours up to K only · <b>Q DAYS</b> = M ÷ K</div>
    <div><b>R</b> = days employed with no hours · <b>S</b> = days with hours</div>
    <div><b>T W.OFF</b>: for each Sunday, 1 if the employee worked more than ${esc((BOOT.settings || {}).wo_min_hours)} hrs on at least ${esc((BOOT.settings || {}).wo_min_days)} of the ${esc((BOOT.settings || {}).wo_window_days)} days ending that Sunday. 0 for PER DAY and CLASS 2.</div>
    <div><b>U</b> = T + Q · days in month = ${(BOOT.settings || {}).days_basis === 'FIXED' ? esc(BOOT.settings.fixed_days) + ' (fixed)' : 'calendar days (' + daysIn(S.month) + ')'}</div>
    <div><b>V OT AMT</b> = P ÷ days ÷ K × L (0 for FIXED) · <b>W</b> = L for FIXED, else U ÷ days × L · <b>X</b> = W + V (+ incentive / arrear)</div>
    <div><b>Y / Z / AA</b> = PAID night food / debit notes / advances (+ loan EMI) cut in this month</div>
    <div><b>AB / AC / AD / AG</b> = PF / ESI / Welfare / cheque from the ON ROLL register · <b>AE</b> = AB + AC + AD · <b>AF</b> = Y + Z + AA + AE</div>
    <div><b>AH CASH</b> = X − AF − AG · <b>AI NET CASH PAID</b> is typed in when cash is handed over and survives a recompute.</div>
  </div></details>
  ${run ? `<div class="toolbar">
    <input class="inp" placeholder="Search code / name" value="${esc(SALF.q)}" oninput="SALF.q=this.value;drawSal()">
    <select class="sel" onchange="SALF.dept=this.value;drawSal()">${deptOptions(PAY.lines, SALF.dept)}</select>
    <select class="sel" onchange="SALF.flag=this.value;drawSal()"><option value="">All rows</option><option value="ANY"${SALF.flag === 'ANY' ? ' selected' : ''}>Flagged only</option>${Object.keys(FLAG_TEXT).map(k => '<option value="' + k + '"' + (SALF.flag === k ? ' selected' : '') + '>' + FLAG_TEXT[k] + '</option>').join('')}<option value="UNPAID"${SALF.flag === 'UNPAID' ? ' selected' : ''}>Cash not yet paid</option></select>
    <label style="font-size:12px;display:flex;gap:5px;align-items:center"><input type="checkbox" ${SALF.full ? 'checked' : ''} onchange="SALF.full=this.checked?1:0;try{localStorage.setItem('hr_sal_full',SALF.full)}catch(e){};drawSal()"> All columns</label>
    <span class="sp"></span>
    <button class="btn" onclick="exportSal('csv')">Export CSV</button><button class="btn" onclick="exportSal('pdf')">Export PDF</button>
    <button class="btn" onclick="printPayslips(salRows())">Print payslips</button>
    <button class="btn" onclick="printRegister()">Print register</button>
  </div><div class="tw sal" id="salTbl" data-no-caps></div>`
  : '<div class="card" style="text-align:center;padding:40px"><p style="margin-bottom:12px">The salary sheet for ' + monthLabel(S.month) + ' has not been computed yet.</p>'
    + '<p class="muted" style="font-size:12.5px">Before computing: employees with duty hours + salary, the month\'s attendance, advances (PAID), and the PF / ESI register.</p></div>'}`;
  if (run) drawSal();
}
function salRows(){
  const q = SALF.q.trim().toUpperCase();
  return PAY.lines.filter(l => (!SALF.dept || l.department === SALF.dept)
    && (!q || (l.emp_code + ' ' + l.name).toUpperCase().indexOf(q) >= 0)
    && (!SALF.flag || (SALF.flag === 'ANY' ? (l.flags || []).length : SALF.flag === 'UNPAID' ? l.net_cash_paid == null : (l.flags || []).indexOf(SALF.flag) >= 0)));
}
function fmtCol(kind, v){ return kind === 'm' ? fmtM(v) : kind === 'h' ? fmtH(v) : kind === 'd' ? fmtH(Math.round(num(v) * 100) / 100) : esc(v == null ? '' : v); }
function drawSal(){
  const cols = SHEET_COLS.filter(c => SALF.full || c[5]), rows = salRows();
  const editable = can('HR_PAYROLL') && PAY.run && PAY.run.status !== 'LOCKED';
  const tot = {}; cols.forEach(c => { if (c[3] !== 't') tot[c[0]] = rows.reduce((a, r) => a + num(r[c[0]]), 0); });
  let h = '<table class="t"><thead><tr>' + cols.map(c => '<th class="' + (c[3] === 't' ? '' : 'n ') + 'grp' + c[4] + '">' + c[1] + '<span class="lt">' + c[2] + '</span></th>').join('') + '<th>Flags</th></tr></thead><tbody>';
  h += '<tr class="tot">' + cols.map((c, i) => i === 0 ? '<td colspan="1">' + rows.length + '</td>' : c[3] === 't' ? '<td>' + (i === 1 ? 'TOTAL (filtered)' : '') + '</td>'
    : '<td class="n">' + (c[0] === 'duty_hours' ? '' : fmtCol(c[3], tot[c[0]])) + '</td>').join('') + '<td></td></tr>';
  rows.forEach(l => {
    h += '<tr>' + cols.map(c => {
      const v = l[c[0]];
      if (c[0] === 'name') return '<td><span class="lnk" onclick="openEmployee(\'' + esc(l.emp_code) + '\')">' + esc(v) + '</span></td>';
      if (c[0] === 'net_cash_paid' && editable) return '<td class="n"><input class="np" type="number" step="1" min="0" value="' + (v == null ? '' : v) + '" placeholder="' + Math.round(num(l.cash)) + '" data-c="' + esc(l.emp_code) + '" onchange="setNetPaid(this)" title="Cash actually handed over"></td>';
      if (c[0] === 'cash') return '<td class="n cash' + (num(v) < 0 ? ' neg' : '') + '">' + fmtM(v) + '</td>';
      return '<td class="' + (c[3] === 't' ? '' : 'n') + (c[0] === 'emp_code' ? ' mono' : '') + '">' + fmtCol(c[3], v) + '</td>';
    }).join('') + '<td>' + (l.flags || []).map(f => '<span class="badge ' + (f === 'NEGATIVE_CASH' ? 'red' : 'amber') + '">' + esc(FLAG_TEXT[f] || f) + '</span> ').join('')
      + ' <button class="btn sm" onclick="printPayslips([PAY.lines.find(x=>x.emp_code===' + esc(JSON.stringify(l.emp_code)) + ')])">Slip</button></td></tr>';
  });
  if (!rows.length) h += '<tr><td colspan="' + (cols.length + 1) + '" class="empty">No rows match.</td></tr>';
  $('salTbl').innerHTML = h + '</tbody></table>';
}
async function computeMonth(btn){
  if (PAY && PAY.run && !confirm('Recompute ' + monthLabel(S.month) + ' from the current attendance, salary rows, advances and PF/ESI? Net Cash Paid (AI) is kept.')) return;
  await busy(btn, async () => {
    const r = await rpc('hr_compute_month', { p_month: S.month });
    toast(r.count + ' employees computed · Cash ' + fmtR(r.totals.cash) + (r.missing.length ? ' · ' + r.missing.length + ' without salary left out' : ''), 'ok');
    await refreshRuns(); renderSalary();
  });
}
async function lockMonth(btn, lock){
  const msg = lock ? 'Lock ' + monthLabel(S.month) + '? Attendance, advances, PF/ESI and the salary sheet of this month become read-only.'
                   : 'Unlock ' + monthLabel(S.month) + '? It can then be changed and recomputed. This is recorded in the audit log.';
  if (!confirm(msg)) return;
  await busy(btn, async () => { await rpc('hr_lock_month', { p_month: S.month, p_lock: lock }); toast(lock ? 'Month locked' : 'Month unlocked', 'ok'); await refreshRuns(); renderSalary(); });
}
async function setNetPaid(inp){
  const v = inp.value === '' ? null : Number(inp.value);
  try {
    await rpc('hr_set_net_paid', { p_month: S.month, p_code: inp.dataset.c, p_amount: v, p_remarks: null });
    const l = PAY.lines.find(x => x.emp_code === inp.dataset.c); if (l) l.net_cash_paid = v;
    inp.style.borderColor = 'var(--green)'; setTimeout(() => { inp.style.borderColor = ''; }, 1200);
  } catch (e) { toast(e.message, 'err'); inp.style.borderColor = 'var(--red)'; }
}
function exportSal(fmt){
  // PDF: the columns on screen (compact, or all with "All columns"), filtered rows, totals at the end.
  if (fmt === 'pdf') {
    const rows = salRows(), cols = SHEET_COLS.filter(c => SALF.full || c[5]);
    const foot = cols.map((c, i) => i === 1 ? 'TOTAL (' + rows.length + ')' : (c[3] === 't' || c[0] === 'duty_hours') ? ''
      : Math.round(rows.reduce((a, r) => a + num(r[c[0]]), 0) * 100) / 100);
    const st = PAY.run ? (PAY.run.status === 'LOCKED' ? 'LOCKED' : 'DRAFT') : '';
    return exportPDF('salary-sheet-' + S.month.slice(0, 7), 'Salary Sheet · ' + monthLabel(S.month) + ' · ' + st + (SALF.dept ? ' · ' + SALF.dept : ''),
      cols.map(c => c[1] + (c[2] ? '\n' + c[2] : '')),
      rows.map(l => cols.map(c => c[3] === 'd' ? Math.round(num(l[c[0]]) * 100) / 100 : l[c[0]])),
      { num: cols.map((c, i) => c[3] === 't' ? -1 : i).filter(i => i >= 0), foot });
  }
  downloadCSV('salary-sheet-' + S.month.slice(0, 7) + '.csv', SHEET_COLS.map(c => c[1] + ' (' + c[2] + ')').concat(['FLAGS']),
    salRows().map(l => SHEET_COLS.map(c => l[c[0]]).concat([(l.flags || []).join(' ')])));
}

function printHtml(title, inner, landscape){
  const f = $('printFrame');
  f.onload = () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { toast('Could not open the print dialog.', 'err'); } };
  f.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>' + PRINT_CSS
    + (landscape ? '@page{size:A4 landscape;margin:8mm}' : '') + '</style></head><body>' + inner + '</body></html>';
}
function inWords(n){
  n = Math.round(Math.abs(num(n)));
  if (!n) return 'Zero';
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = x => x < 20 ? a[x] : b[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : '');
  const three = x => (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : '');
  const cr = Math.floor(n / 1e7); n %= 1e7; const lk = Math.floor(n / 1e5); n %= 1e5; const th = Math.floor(n / 1e3); n %= 1e3;
  return ((cr ? three(cr) + ' Crore ' : '') + (lk ? two(lk) + ' Lakh ' : '') + (th ? two(th) + ' Thousand ' : '') + (n ? three(n) : '')).trim();
}

      return rows.filter(r => { const k = txKey(r); if (have[k]) { have[k]--; return false; } return true; });
    },

};

function sampleSheet(kind, m){
  const def = IMPORTS[kind];
  // PF / ESI / LWF: the simpler of its two layouts, column for column the screen's Export CSV.
  if (kind === 'STATUTORY')
    return [['EMP. CODE', 'NAME', 'PF', 'ESI', 'LWF', 'CHEQUE']]
      .concat(SAMPLES.STATUTORY().map(s => [s.emp_code, s.name, s.pf, s.esi, s.lwf, s.cheque_amt]));
  const head = def.fields.map(f => f[2][0]);
  return [head].concat(SAMPLES[kind](m).map(r => def.fields.map(f => r[f[0]] == null ? '' : r[f[0]])));
}
function downloadSample(){
  const rows = sampleSheet(IMP.kind, IMP.month || S.month);
  downloadCSV('sample-' + IMPORTS[IMP.kind].label.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/-$/, '') + '.csv', rows[0], rows.slice(1));
}

function monthFromName(name, dateIso){

  if (i < 0) return dateIso ? monthStart(dateIso) : S.month;
  let y = dateIso ? +dateIso.slice(0, 4) : +S.month.slice(0, 4);
  const dm = dateIso ? +dateIso.slice(5, 7) - 1 : i;

function parseDelimited(text){

    if (q) { if (ch === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += ch; }

    if (!code) return;
    const o = { code };
    tr.querySelectorAll('[data-k]').forEach(i => { if (i.dataset.k !== 'code') o[i.dataset.k] = i.type === 'checkbox' ? i.checked : i.value; });
    classes.push(o);
  });
  await busy(btn, async () => { await rpc('hr_save_settings', { p_settings: st, p_classes: classes }); await refreshRuns(); toast('Settings saved. Recompute open months to apply them.', 'ok'); renderSettings(); });
}
</script>

<script src="app-back.js"></script>
