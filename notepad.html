<!--
  MY NOTEPAD: every user's own productivity tools, opened from the launcher tile right of My SOPs.
    Saved tools  Notes (word pad), Sticky Notes, Draw Pad, Sheet (Excel-style formulas), Table, To-do
    Utilities    Timer (stopwatch / countdown / pomodoro), Office In-Out (own punch log), Calculator
    Also         search over everything, pin, colour, duplicate, Trash (30 days), JSON backup / import.

  TOOLS is the one list every screen is built from (sidebar, Home "New" buttons, cards, editors). A new
  tool = one entry there: a saved tool gives blank / text / preview / edit, a utility gives view. Saved
  tools all live in ONE server table (np_items: kind + jsonb body), so a new kind needs no migration.

  DATA (sql/NOTEPAD_MIGRATION.sql): private to the logged-in user, token-checked np_* RPCs, RLS with no
  policies. Offline-first: the device keeps a copy (IndexedDB sarv_notepad, key per user) and every edit
  is saved there at once and pushed when online (rev check: an item changed on two devices keeps BOTH
  versions, never loses one). Without the migration everything still works on this device and the
  status pill says so. The Timer and Calculator history stay on the device only.

  LOGIN = ERP LOGIN (launcher.html). Like My SOPs it has no app key (gate booted with app: null): it is
  the user's own notebook, so every logged-in user has it. No caps-input.js (notes keep their case).
-->
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f9f9fb;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;--gray:#8e8e93;--yellow:#ffcc00;--pink:#ff2d55;--indigo:#5856d6;
  --blur:saturate(180%) blur(22px);--bar:rgba(249,249,249,.84);--scrim:rgba(0,0,0,.4);
  --spring:cubic-bezier(.32,.72,0,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --side:236px;--toolsh:54px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--gray:#98989d;--yellow:#ffd60a;--pink:#ff375f;--indigo:#5e5ce6;
  --bar:rgba(29,29,31,.84);--scrim:rgba(0,0,0,.6);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--label);overscroll-behavior:none}
body{font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── bar, tools, main ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep)}
.nav .row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.nav .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none}
.nbtn{display:flex;align-items:center;gap:3px;color:var(--blue);font-size:17px;padding:8px;border-radius:10px;min-width:44px;transition:opacity .15s;position:relative;z-index:1}
.nbtn:active{opacity:.35}
.pillbtn{display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;background:var(--fill);font-size:13px;font-weight:600;color:var(--label2);position:relative;z-index:1;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pillbtn i{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.pillbtn.warn i{background:var(--orange)}.pillbtn.off i{background:var(--gray)}.pillbtn.busy i{background:var(--blue);animation:pulse 1s ease infinite}
@keyframes pulse{50%{opacity:.3}}
.tools{position:fixed;left:0;right:0;top:calc(var(--sat) + 44px);height:var(--toolsh);z-index:15;display:flex;gap:8px;overflow-x:auto;padding:9px 12px;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep);scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;border-radius:18px;background:var(--fill);font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s,transform .15s}
.tool:active{transform:scale(.95)}
.tool .ti{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c,var(--gray))}
.tool.on{background:var(--blue);color:#fff}
.tool.on .ti{background:rgba(255,255,255,.25)}
.tool .n{font-size:12px;color:var(--label2);font-weight:500}
.tool.on .n{color:rgba(255,255,255,.8)}
.tools .gapx{flex:1}
.main{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:calc(var(--sat) + 44px + var(--toolsh));padding-bottom:calc(var(--sab) + 60px)}
@media (min-width:900px){
  .tools{top:calc(var(--sat) + 44px);bottom:0;right:auto;width:var(--side);height:auto;flex-direction:column;overflow-y:auto;padding:14px 10px;gap:2px;box-shadow:.5px 0 0 var(--sep)}
  .tool{width:100%;height:40px;border-radius:10px;background:none;padding:0 10px}
  .tool:hover{background:var(--fill)}
  .tool.on{background:var(--blue)}
  .tool .n{margin-left:auto}
  .tools .gapx{min-height:16px}
  .main{left:var(--side);padding-top:calc(var(--sat) + 44px)}
}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px}
.large{font-size:32px;font-weight:700;letter-spacing:.01em;margin:4px 0 2px}
.sub{color:var(--label2);font-size:15px;margin:0 0 14px}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.hrow .large{flex:1;min-width:0;margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 15px;border-radius:19px;background:var(--blue);color:#fff;font-size:15px;font-weight:600;transition:transform .15s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.96);opacity:.85}
.btn.gray{background:var(--fill);color:var(--label)}
.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange)}
.btn.sm{height:32px;padding:0 12px;font-size:14px;border-radius:16px}
.btn[disabled]{opacity:.4;pointer-events:none}
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;color:var(--label2);margin-bottom:14px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;color:var(--label)}
.sec{margin:22px 0 0}
.sec>h3{margin:0 0 8px 4px;font-size:13px;font-weight:500;text-transform:uppercase;color:var(--label2);display:flex;align-items:center;gap:8px}
.sec>h3 .n{background:var(--fill);border-radius:9px;padding:0 7px;font-size:12px}
.empty{text-align:center;padding:54px 24px;color:var(--label2)}
.empty .ring{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center}
.empty b{display:block;font-size:19px;color:var(--label);margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:flex-start;background:rgba(255,149,0,.12);color:var(--label);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}

/* ── New buttons + widgets ── */
.newg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.newb{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;background:var(--card);text-align:left;font-weight:600;font-size:15px;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.newb:active{transform:scale(.96)}
.newb .ti{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
.newb small{display:block;font-weight:400;color:var(--label2);font-size:12.5px;margin-top:-6px}
.widg{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:12px}
.wcard{background:var(--card);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.wcard .ti{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
.wcard b{display:block;font-size:15px}.wcard span{color:var(--label2);font-size:13.5px}

/* ── cards ── */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{position:relative;background:var(--card);border-radius:14px;padding:12px 12px 10px;min-height:132px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:transform .15s;overflow:hidden;width:100%;animation:rise .4s var(--spring) both;animation-delay:calc(var(--i,0)*22ms)}
.card:active{transform:scale(.97)}
.card.tinted{background:var(--tint)}
.card.tinted,.card.tinted .cm,.card.tinted .pv{color:#1c1c1e}
.card .top{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--label2);font-weight:600}
.card .top .ti{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--c)}
.card .top .pin{color:var(--orange)}
.card .cm{margin-left:auto;width:28px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.card .cm:active{background:var(--fill)}
.card .t{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .pv{flex:1;color:var(--label2);font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;white-space:pre-wrap;word-break:break-word}
.card .pv img{width:100%;height:84px;object-fit:cover;border-radius:8px;background:#fff;display:block}
.card .pv table{border-collapse:collapse;font-size:11px;width:100%}
.card .pv td{border:.5px solid var(--sep);padding:1px 4px;white-space:nowrap;overflow:hidden;max-width:60px;text-overflow:ellipsis}
.card .d{font-size:11.5px;color:var(--label3)}
.card.tinted .d{color:rgba(0,0,0,.4)}
.card .bar{height:4px;border-radius:2px;background:var(--fill2);overflow:hidden}.card .bar i{display:block;height:100%;background:var(--green)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ── sticky board ── */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;align-items:start}
.stk{border-radius:4px 4px 16px 4px;padding:12px 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.06);color:#1c1c1e;display:flex;flex-direction:column;gap:6px;animation:rise .4s var(--spring) both;transform:rotate(var(--rot,0deg))}
.stk textarea{border:0;outline:0;background:transparent;resize:none;min-height:120px;font-size:15.5px;line-height:1.4;color:#1c1c1e;width:100%;overflow:hidden}
.stk .sf{display:flex;align-items:center;gap:4px;font-size:11.5px;color:rgba(0,0,0,.45)}
.stk .sf button{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.55)}
.stk .sf button:active{background:rgba(0,0,0,.08)}
.stk .sf .sp{flex:1}
.stk .sf .on{color:#c25e00}

/* ── editor (pushed screen) ── */
.ed{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .42s var(--spring);box-shadow:-6px 0 24px rgba(0,0,0,.15)}
.ed.in{transform:none}
.ebar{flex:none;padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep)}
.ebar .row{height:48px;display:flex;align-items:center;gap:4px;padding:0 6px}
.etitle{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px;font-weight:600;padding:6px 4px;text-align:center}
.est{font-size:12px;color:var(--label2);white-space:nowrap}
.etb{flex:none;display:flex;gap:4px;align-items:center;overflow-x:auto;padding:6px 8px;background:var(--bar);box-shadow:0 .5px 0 var(--sep);scrollbar-width:none}
.etb::-webkit-scrollbar{display:none}
.etb:empty{display:none}
.tb{flex:none;min-width:36px;height:36px;padding:0 8px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:4px;font-size:14px;font-weight:600;color:var(--label)}
.tb:active,.tb.on{background:var(--fill2)}
.tb.on{color:var(--blue)}
.tbsep{flex:none;width:1px;height:22px;background:var(--sep);margin:0 4px}
.ebody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
.ebody.pad{padding:16px 16px calc(var(--sab) + 40px)}
.efoot{flex:none;padding:6px 14px calc(var(--sab) + 6px);font-size:12px;color:var(--label2);background:var(--bar);box-shadow:0 -.5px 0 var(--sep);display:flex;gap:12px}

/* notes */
.rich{max-width:820px;margin:0 auto;min-height:60vh;outline:0;font-size:17px;line-height:1.55;user-select:text;-webkit-user-select:text;word-break:break-word}
.rich:empty::before{content:attr(data-ph);color:var(--label3)}
.rich h1{font-size:28px;margin:.4em 0 .2em}.rich h2{font-size:22px;margin:.4em 0 .2em}.rich h3{font-size:18px;margin:.4em 0 .2em}
.rich blockquote{margin:.5em 0;padding:4px 14px;border-left:3px solid var(--blue);color:var(--label2)}
.rich pre{background:var(--fill);padding:10px 12px;border-radius:8px;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.rich table{border-collapse:collapse;margin:.6em 0;min-width:50%}
.rich td,.rich th{border:1px solid var(--sep);padding:6px 9px;min-width:60px;vertical-align:top}
.rich th{background:var(--fill)}
.rich img{max-width:100%;border-radius:8px}
.rich ul.chk{list-style:none;padding-left:4px}
.rich ul.chk li{position:relative;padding-left:30px;margin:4px 0}
.rich ul.chk li::before{content:"";position:absolute;left:2px;top:.22em;width:18px;height:18px;border-radius:50%;border:1.6px solid var(--label3);box-sizing:border-box}
.rich ul.chk li.done{color:var(--label3);text-decoration:line-through}
.rich ul.chk li.done::before{background:var(--orange);border-color:var(--orange)}
.rich a{color:var(--blue)}
.rich hr{border:0;border-top:1px solid var(--sep);margin:1em 0}

/* draw */
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px;background:var(--fill)}
.paper{position:relative;box-shadow:0 2px 12px rgba(0,0,0,.18);background:#fff;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.sw{width:26px;height:26px;border-radius:13px;border:2px solid var(--card);box-shadow:0 0 0 1px var(--sep)}
.sw.on{box-shadow:0 0 0 2px var(--blue)}
.size{width:96px;accent-color:var(--blue)}
input[type=color].cpick{width:30px;height:30px;padding:0;border:0;background:none}

/* sheet */
.fbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--card);box-shadow:0 .5px 0 var(--sep)}
.fbar .cref{min-width:46px;text-align:center;font:600 13px ui-monospace,Menlo,Consolas,monospace;color:var(--label2);background:var(--fill);border-radius:6px;padding:5px 6px}
.fbar .fx{font:italic 600 14px Georgia,serif;color:var(--label2)}
.fbar input{flex:1;min-width:0;border:0;outline:0;background:none;font:15px ui-monospace,Menlo,Consolas,monospace;padding:6px 0;user-select:text}
.gridw{overflow:auto;height:100%;-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;background:var(--card)}
.grid th{position:sticky;top:0;z-index:2;background:var(--card2);font:600 12px system-ui;color:var(--label2);height:26px;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);min-width:110px}
.grid th.rh{position:sticky;left:0;z-index:1;min-width:44px;width:44px}
.grid thead th.rh{z-index:3}
.grid td{padding:0;border-right:.5px solid var(--sep);border-bottom:.5px solid var(--sep);height:30px}
.grid td input{width:110px;height:30px;border:0;outline:0;background:none;padding:0 6px;font-size:14px;user-select:text;-webkit-user-select:text}
.grid td input:focus{box-shadow:inset 0 0 0 2px var(--blue);background:var(--card)}
.grid td input.num{text-align:right;font-variant-numeric:tabular-nums}
.grid td input.err{color:var(--red)}
.grid td input.fm{color:var(--indigo)}
.grid td input.b{font-weight:700}
.grid td input.al-c{text-align:center}.grid td input.al-r{text-align:right}.grid td input.al-l{text-align:left}
.grid th.sel{background:rgba(0,122,255,.16);color:var(--blue)}

/* table */
.ttab{border-collapse:separate;border-spacing:0;background:var(--card);border-radius:12px;overflow:hidden;min-width:100%}
.ttab th{background:var(--card2);text-align:left;padding:0;border-bottom:.5px solid var(--sep);border-right:.5px solid var(--sep);position:sticky;top:0;z-index:1}
.ttab th .hc{display:flex;align-items:center}
.ttab th input{flex:1;min-width:90px;border:0;outline:0;background:none;font-weight:700;font-size:14px;padding:9px 8px}
.ttab th .hm{width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--label2)}
.ttab th .ty{font-size:10.5px;color:var(--label3);font-weight:600;padding-right:4px;text-transform:uppercase}
.ttab td{border-bottom:.5px solid var(--sep);border-right:.5px solid var(--sep);padding:0}
.ttab td input[type=text],.ttab td input[type=date]{width:100%;min-width:110px;border:0;outline:0;background:none;padding:9px 8px;font-size:14.5px;user-select:text}
.ttab td input.num{text-align:right;font-variant-numeric:tabular-nums}
.ttab td input[type=checkbox]{width:20px;height:20px;margin:8px auto;display:block;accent-color:var(--green)}
.ttab td.rx{width:34px;text-align:center}
.ttab td.rx button{width:30px;height:30px;color:var(--label3)}
.ttab tfoot td{background:var(--card2);font-weight:700;font-size:13.5px;padding:8px;text-align:right}
.ttab tfoot td.lbl{text-align:left;color:var(--label2);font-weight:600}

/* to-do */
.todo{max-width:720px;margin:0 auto}
.tadd{display:flex;gap:8px;margin-bottom:14px}
.tadd input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;outline:0;background:var(--card);padding:0 14px;font-size:16px}
.tlist{background:var(--card);border-radius:12px;overflow:hidden}
.trow{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 14px;min-height:48px;position:relative}
.trow+.trow::before{content:"";position:absolute;top:0;left:48px;right:0;height:.5px;background:var(--sep)}
.tck{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--label3);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .2s,border-color .2s}
.trow.done .tck{background:var(--orange);border-color:var(--orange)}
.trow input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:16px;padding:8px 0}

/* ══ Tools registry ════════════════════════════════════════════════════

     blank()     new body          text(b)  words for search      empty(b) true = nothing typed (dropped on close)
     preview(it) card body (HTML)  edit(it, ED) the editor        board    true = edited in place (no editor)
   A utility has view() instead. Order here = order in the sidebar. */
const TOOLS = [];

/* ══ State + device copy ═══════════════════════════════════════════════ */
const S = { user:null, uid:'', view:'home', q:'', missing:false, syncing:false, lastErr:'', loaded:false, renderWanted:false };

    if (!window.indexedDB) return rej(new Error('no idb'));

    r.onupgradeneeded = () => r.result.createObjectStore('kv');

    async get(k){ try { const db = await open(); return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

      catch (e) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e2) {} } }
  };

const SESSION_ERR = { NO_TOKEN:1, NO_SESSION:1, SESSION_REVOKED:1, SESSION_EXPIRED:1, USER_INACTIVE:1 };

  }

}

/* ══ Items ═════════════════════════════════════════════════════════════ */
const fromServer = (row, full) => ({ id:row.id, kind:row.kind, title:row.title || '', body:row.body || {}, color:row.color || null, pinned:!!row.pinned,

/* ══ Sync ══════════════════════════════════════════════════════════════

    if (PU.month === istDay(d.row.at).slice(0, 7)) PU.rows.push(d.row);
    toast('Punched ' + kind + ' at ' + istTime(d.row.at)); buzz([10, 30, 10]);
    loadPunch();
  } catch (e) { toast(e.missing ? 'Admin: run sql/NOTEPAD_MIGRATION.sql first.' : e.message, true); loadPunch(); }
  finally { PU.busy = false; render(); }
}
setInterval(() => { const c = document.querySelector('[data-pclock]'); if (c && !ED) c.textContent = new Date(srvNow()).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', second:'2-digit', hour12:true, timeZone:'Asia/Kolkata' }); }, 1000);

/* ══ CALCULATOR ════════════════════════════════════════════════════════ */
const CA = { expr:'', hist:null };
function calcVal(){ if (!CA.expr.trim()) return { v:'', err:false }; const v = FX.calc(CA.expr); return { v:FX.show(v), err:FX.isErr(v) }; }
function viewCalc(){
  CA.hist = CA.hist || LS.get('np_calc_hist', []);
  const r = calcVal();
  const K = [['C', 'fn'], ['(', 'fn'], [')', 'fn'], ['÷', 'op'], ['7'], ['8'], ['9'], ['×', 'op'], ['4'], ['5'], ['6'], ['−', 'op'], ['1'], ['2'], ['3'], ['+', 'op'], ['%', 'fn'], ['0'], ['.'], ['=', 'eq'], ['⌫', 'fn'], ['^', 'fn'], ['GST 18%', 'fn'], ['√', 'fn']];
  return '<div class="large" style="margin-bottom:14px">Calculator</div><div class="calc"><div class="cdisp"><input data-cin value="' + esc(CA.expr) + '" placeholder="0" inputmode="decimal" autocomplete="off"><div class="res' + (r.err ? ' err' : '') + '" data-cres>' + esc(r.v || '0') + '</div></div>'
    + '<div class="keys">' + K.map(k => '<button class="key ' + (k[1] || '') + '" data-k="' + esc(k[0]) + '"' + (k[0].length > 3 ? ' style="font-size:15px"' : '') + '>' + esc(k[0]) + '</button>').join('') + '</div>'
    + (CA.hist.length ? '<div class="sec"><h3 style="justify-content:space-between"><span>History</span><button class="btn gray sm" data-kh="clear">Clear</button></h3><div class="grpl">' + CA.hist.map((x, i) => '<button class="li" style="width:100%" data-kh="' + i + '"><span class="k" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(x.e) + '</span><span class="v">= ' + esc(x.r) + '</span></button>').join('') + '</div></div>' : '') + '</div>';
}
function calcKey(k){
  if (k === 'C') CA.expr = '';
  else if (k === '⌫') CA.expr = CA.expr.slice(0, -1);
  else if (k === '=') { const r = calcVal(); if (r.v && !r.err) { CA.hist.unshift({ e:CA.expr, r:r.v }); CA.hist = CA.hist.slice(0, 40); LS.set('np_calc_hist', CA.hist); CA.expr = r.v; } }
  else if (k === '√') CA.expr = 'SQRT(' + (CA.expr || '') + ')';
  else if (k === 'GST 18%') CA.expr = '(' + (CA.expr || '0') + ')*1.18';
  else CA.expr += { '×':'×', '÷':'÷', '−':'-' }[k] || k;
  const i = document.querySelector('[data-cin]'); if (i) i.value = CA.expr;
  paintCalc(); buzz(4);
}
function paintCalc(){ const r = calcVal(), el = document.querySelector('[data-cres]'); if (el) { el.textContent = r.v || '0'; el.className = 'res' + (r.err ? ' err' : ''); } }

/* ══ TRASH ═════════════════════════════════════════════════════════════ */
function viewTrash(){
  const l = items().filter(x => x.deletedAt).sort((a, b) => String(b.deletedAt).localeCompare(String(a.deletedAt)));
  return '<div class="hrow"><div class="large">Trash</div>' + (l.length ? '<button class="btn red sm" data-empty="1">Empty Trash</button>' : '') + '</div><p class="sub">Items stay here 30 days, then they are deleted for good.</p>'
    + (l.length ? '<div class="cards">' + l.map((it, i) => cardHtml(it, i, true)).join('') + '</div>' : emptyHtml(IC.trash, 'Trash is empty', 'Deleted notes, drawings and sheets wait here for 30 days.'));
}

/* ══ HOME ══════════════════════════════════════════════════════════════ */
function viewHome(){
  const u = S.user || {}, hr = new Date().getHours(), name = String(u.user_name || u.name || '').split(/[\s(]/)[0];
  const all = live(), q = S.q;
  let h = '<div class="large">Good ' + (hr < 12 ? 'morning' : hr < 17 ? 'afternoon' : 'evening') + (name ? ', ' + esc(name.charAt(0) + name.slice(1).toLowerCase()) : '') + '</div>'
    + '<p class="sub">' + esc(new Date().toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' })) + ' · ' + all.length + ' item' + (all.length === 1 ? '' : 's') + ' in your notepad</p>';
  if (S.missing) h += '<div class="banner">Saved on this device only for now. Admin: run sql/NOTEPAD_MIGRATION.sql to keep it on the server too.</div>';
  h += searchHtml('Search all notes, sheets, tables, to-dos');
  if (q) {
    const hits = sortItems(all.filter(x => matchQ(x, q)));
    return h + (hits.length ? '<div class="cards">' + hits.map((it, i) => cardHtml(it, i)).join('') + '</div>' : emptyHtml(IC.search, 'Nothing found', 'No item has all of those words.'));
  }
  h += '<div class="newg">' + TOOLS.filter(t => t.saved).map(t => '<button class="newb" data-new="' + t.id + '"><span class="ti" style="--c:' + t.c + '">' + t.icon + '</span>New ' + esc(t.newLabel) + '<small>' + esc(t.hint) + '</small></button>').join('') + '</div>';
  // Widgets: punch status + a running timer
  const st = PU.loaded ? punchState() : null, s = TM.s;
  const tmRun = s && (s.sw.run || s.cd.run || s.po.run);
  h += '<div class="widg"><button class="wcard" data-go="punch"><span class="ti" style="--c:#30b0c7">' + IC.punch + '</span><span><b>Office In-Out</b><span>' + (!st ? 'Tap to punch' : st.inNow ? 'IN since ' + esc(istTime(st.list.filter(p => p.kind === 'IN').pop().at)) + ' · ' + fmtHM(st.ms) : st.list.length ? 'OUT · ' + fmtHM(st.ms) + ' today' : 'Not punched in today') + '</span></span></button>'
    + '<button class="wcard" data-go="timer"><span class="ti" style="--c:#af52de">' + IC.timer + '</span><span><b>Timer</b><span>' + (tmRun ? (s.cd.run ? 'Countdown · rings at ' + new Date(s.cd.end).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' }) : s.po.run ? 'Pomodoro · ' + (s.po.phase === 'work' ? 'focus' : 'break') : 'Stopwatch running') : 'Stopwatch, countdown, pomodoro') + '</span></span></button>'
    + '<button class="wcard" data-go="calc"><span class="ti" style="--c:#ff9500">' + IC.calc + '</span><span><b>Calculator</b><span>With % , GST and history</span></span></button></div>';
  const pins = sortItems(all.filter(x => x.pinned)), recent = sortItems(all.filter(x => !x.pinned)).slice(0, 16);
  if (pins.length) h += '<div class="sec"><h3>Pinned<span class="n">' + pins.length + '</span></h3><div class="cards">' + pins.map((it, i) => cardHtml(it, i)).join('') + '</div></div>';
  h += '<div class="sec"><h3>Recent</h3>' + (recent.length ? '<div class="cards">' + recent.map((it, i) => cardHtml(it, i)).join('') + '</div>' : emptyHtml(IC.note, 'Your notepad is empty', 'Start with a note, a sticky, a drawing or a sheet above.')) + '</div>';
  if (!PU.loaded && !PU.busy) loadPunch();
  return h;
}
function viewSaved(t){
  const list = sortItems(live().filter(x => x.kind === t.id && matchQ(x, S.q)));
  return '<div class="hrow"><div class="large">' + esc(t.label) + '</div><button class="btn" data-new="' + t.id + '">' + IC.plus + 'New ' + esc(t.newLabel.toLowerCase()) + '</button></div>'
    + searchHtml('Search ' + t.label.toLowerCase())
    + (list.length ? '<div class="cards">' + list.map((it, i) => cardHtml(it, i)).join('') + '</div>' : emptyHtml(t.icon, S.q ? 'Nothing found' : 'Nothing here yet', S.q ? 'No item has all of those words.' : 'Tap New ' + t.newLabel.toLowerCase() + ' to start. Everything saves by itself.'));
}
const searchHtml = ph => '<label class="search">' + IC.search + '<input data-q="1" placeholder="' + esc(ph) + '" value="' + esc(S.q) + '" autocomplete="off"></label>';
const emptyHtml = (icon, title, text) => '<div class="empty"><div class="ring">' + icon.replace(/width="18" height="18"/, 'width="30" height="30"') + '</div><b>' + esc(title) + '</b>' + esc(text) + '</div>';
function cardHtml(it, i, trash){
  const t = TOOL(it.kind) || { label:it.kind, icon:IC.note, c:'#8e8e93', preview:() => '' }, tint = tintOf(it.color);
  return '<button class="card' + (tint ? ' tinted' : '') + '" style="--i:' + Math.min(i, 14) + (tint ? ';--tint:' + tint : '') + '" data-' + (trash ? 'trash' : 'open') + '="' + esc(it.id) + '">'
    + '<div class="top"><span class="ti" style="--c:' + t.c + '">' + t.icon.replace(/width="18" height="18"/, 'width="12" height="12"') + '</span>' + esc(t.label) + (it.pinned ? '<span class="pin">' + IC.pin + '</span>' : '') + (it._edit && !navigator.onLine ? '<span title="Not synced yet">·</span>' : '')
    + '<span class="cm" data-cm="' + esc(it.id) + '">' + IC.more + '</span></div>'
    + (it.title ? '<div class="t">' + esc(it.title) + '</div>' : '') + (t.preview ? t.preview(it) : '')
    + '<div class="d">' + (trash ? 'Deleted ' + esc(fmtWhen(it.deletedAt)) : esc(fmtWhen(it.updatedAt))) + '</div></button>';
}

TOOLS.push({ id:'timer', label:'Timer', icon:IC.timer, c:'#af52de', view:viewTimer });
TOOLS.push({ id:'punch', label:'Office In-Out', icon:IC.punch, c:'#30b0c7', view:viewPunch });
TOOLS.push({ id:'calc', label:'Calculator', icon:IC.calc, c:'#ff9500', view:viewCalc });
TOOLS.push({ id:'trash', label:'Trash', icon:IC.trash, c:'#8e8e93', view:viewTrash, bottom:true });

/* ══ Render + events ═══════════════════════════════════════════════════ */
function paintTools(){
  const cnt = k => live().filter(x => x.kind === k).length;
  const html = t => '<button class="tool' + (S.view === t.id ? ' on' : '') + '" data-tool="' + t.id + '"><span class="ti" style="--c:' + t.c + '">' + t.icon.replace(/width="18" height="18"/, 'width="14" height="14"') + '</span>' + esc(t.label)
    + (t.saved ? '<span class="n">' + (cnt(t.id) || '') + '</span>' : t.id === 'trash' ? '<span class="n">' + (items().filter(x => x.deletedAt).length || '') + '</span>' : '') + '</button>';
  $('tools').innerHTML = TOOLS.filter(t => !t.bottom).map(html).join('') + '<span class="gapx"></span>' + TOOLS.filter(t => t.bottom).map(html).join('');
  const on = $('tools').querySelector('.on'); if (on && innerWidth < 900) on.scrollIntoView({ inline:'nearest', block:'nearest' });
}
function render(){
  S.renderWanted = false;
  paintTools();
  const t = TOOL(S.view) || TOOL('home');
  const html = t.view ? t.view(t) : viewSaved(t);
  $('main').innerHTML = '<div class="wrap">' + html + '</div>';
  $('main').querySelectorAll('.stk textarea').forEach(autoH);
}
/* Re-render only when the user is not typing in the main view (a sync must never steal the caret). */
function softRender(){
  if (ED) { paintTools(); return; }
  const a = document.activeElement;
  if (a && $('main').contains(a) && /INPUT|TEXTAREA/.test(a.tagName)) { S.renderWanted = true; paintTools(); return; }
  render();
}
function setView(v){
  S.view = v; S.q = '';
  try { history.replaceState(history.state, '', '#' + v); } catch (e) {}
  render(); $('main').scrollTop = 0;
}
async function createAndOpen(kind){
  const t = TOOL(kind), it = newItem(kind);
  if (t.board) {
    touch(it); if (S.view !== kind) setView(kind); else render();
    const ta = document.querySelector('[data-stkid="' + it.id + '"] textarea'); if (ta) ta.focus();
    return;
  }
  openEditor(it);
}
$('tools').addEventListener('click', e => { const b = e.target.closest('[data-tool]'); if (b) { buzz(5); setView(b.dataset.tool); } });
$('main').addEventListener('click', async e => {
  const t = e.target;
  const cm = t.closest('[data-cm]'); if (cm) { e.stopPropagation(); const it = DB.items[cm.dataset.cm]; if (!it) return; if (it.deletedAt) return trashMenu(it); return itemMenu(it); }
  const op = t.closest('[data-open]'); if (op) { const it = DB.items[op.dataset.open]; if (!it) return; const tl = TOOL(it.kind); if (tl && tl.board) return setView(it.kind); return openEditor(it); }
  const tr = t.closest('[data-trash]'); if (tr) { const it = DB.items[tr.dataset.trash]; if (it) trashMenu(it); return; }
  const nw = t.closest('[data-new]'); if (nw) { buzz(6); return createAndOpen(nw.dataset.new); }
  const go = t.closest('[data-go]'); if (go) return setView(go.dataset.go);
  if (t.closest('[data-empty]')) { const l = items().filter(x => x.deletedAt); if (l.length && await confirmBox('Empty the Trash?', l.length + ' item' + (l.length > 1 ? 's' : '') + ' will be deleted for good.', 'Delete all')) { l.forEach(purgeItem); render(); } return; }
  // sticky board
  const stk = t.closest('[data-stkid]');
  if (stk) { const it = DB.items[stk.dataset.stkid]; if (!it) return;
    if (t.closest('[data-scol]')) { const i = await iosMenu({ title:'Colour', items:STK_COL.map(c => ({ t:c.charAt(0).toUpperCase() + c.slice(1), dot:tintOf(c) })) }); if (i >= 0) { it.color = STK_COL[i]; touch(it); render(); } return; }
    if (t.closest('[data-spin]')) { it.pinned = !it.pinned; touch(it); render(); return; }
    if (t.closest('[data-sdel]')) { if ((it.body.text || '').trim() && !(await confirmBox('Delete this sticky?', 'It goes to the Trash for 30 days.', 'Delete'))) return; trashItem(it); render(); return; } }
  // timer / punch / calc
  const tm = t.closest('[data-tm]'); if (tm) { TM.s.mode = tm.dataset.tm; tmSave(); return render(); }
  const tx = t.closest('[data-tx]'); if (tx) return timerAct(tx.dataset.tx, tx);
  const cdp = t.closest('[data-cdp]'); if (cdp) { TM.s.cd.total = TM.s.cd.left = +cdp.dataset.cdp * 60000; tmSave(); return render(); }
  const pow = t.closest('[data-pow]'); if (pow) { const w = +pow.dataset.pow, p = TM.s.po; p.work = w; p.brk = w === 25 ? 5 : w === 50 ? 10 : 15; p.run = false; p.phase = 'work'; p.left = w * 60000; tmSave(); return render(); }
  const pu = t.closest('[data-punch]'); if (pu) return doPunch(pu.dataset.punch);
  const pm = t.closest('[data-pm]'); if (pm) { const [y, m] = PU.month.split('-').map(Number), d = new Date(y, m - 1 + (+pm.dataset.pm), 1); PU.rows = []; loadPunch(d.getFullYear() + '-' + two(d.getMonth() + 1)); return render(); }
  if (t.closest('[data-pcsv]')) { const out = ['Date,Kind,Time,Note'].concat(PU.rows.map(p => [p.day, p.kind, istTime(p.at), csvCell(p.note || '')].join(','))); return download('office-in-out-' + PU.month + '.csv', '﻿' + out.join('\r\n'), 'text/csv;charset=utf-8'); }
  const k = t.closest('[data-k]'); if (k) return calcKey(k.dataset.k);
  const kh = t.closest('[data-kh]'); if (kh) { if (kh.dataset.kh === 'clear') { CA.hist = []; LS.set('np_calc_hist', []); return render(); } const x = CA.hist[+kh.dataset.kh]; if (x) { CA.expr = x.e; render(); } }
});
$('main').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { S.q = t.value; const pos = t.selectionStart; render(); const n = $('main').querySelector('[data-q]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) {} } return; }
  if (t.dataset.stk) { const it = DB.items[t.closest('[data-stkid]').dataset.stkid]; if (!it) return; autoH(t); it.body = { text:t.value }; it.title = t.value.split('\n')[0].slice(0, 60); queueSave(it); return; }
  if (t.dataset.cin != null) { CA.expr = t.value; paintCalc(); }
});
$('main').addEventListener('keydown', e => { if (e.target.dataset.cin != null && e.key === 'Enter') { e.preventDefault(); calcKey('='); } });
$('main').addEventListener('focusout', () => { setTimeout(() => { if (S.renderWanted && !$('main').contains(document.activeElement)) render(); }, 50); });
document.addEventListener('keydown', e => {
  if (ED || S.view !== 'calc' || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
  const m = { '*':'×', '/':'÷', '-':'−', 'Enter':'=', 'Backspace':'⌫', 'Escape':'C' }; const k = m[e.key] || (/^[0-9.+()%^]$/.test(e.key) ? e.key : null);
  if (k) { e.preventDefault(); calcKey(k); }
});
async function trashMenu(it){
  const i = await iosMenu({ title:it.title || TOOL(it.kind).label, message:'In the Trash since ' + fmtWhen(it.deletedAt), items:[{ t:'Restore' }, { t:'Delete for good', s:'d' }] });
  if (i === 0) { restoreItem(it); toast('Restored'); render(); }
  if (i === 1 && await confirmBox('Delete for good?', 'This cannot be undone.', 'Delete')) { purgeItem(it); render(); }
}

/* ── Sync pill menu: sync now, backup, import ── */
$('syncBtn').addEventListener('click', async () => {
  const n = dirtyCount();
  const info = S.missing ? 'Saved on this device only (server not set up yet).' : !navigator.onLine ? 'Offline. ' + n + ' change' + (n === 1 ? '' : 's') + ' wait to be sent.' : S.lastErr ? 'Last sync failed: ' + S.lastErr : n ? n + ' change' + (n === 1 ? '' : 's') + ' to send.' : 'Everything is saved on the server.';
  const list = [{ t:'Sync now', f:() => sync().then(() => toast(S.lastErr ? 'Sync failed: ' + S.lastErr : S.missing ? 'Server not set up yet' : 'Synced', !!S.lastErr)) },
    { t:'Download backup (.json)', f:() => download('my-notepad-backup-' + istDay(Date.now()) + '.json', JSON.stringify({ app:'sarv-notepad', v:1, at:nowIso(), items:items().filter(x => !x.deletedAt).map(x => ({ id:x.id, kind:x.kind, title:x.title, body:x.body, color:x.color, pinned:x.pinned, tags:x.tags, updatedAt:x.updatedAt, partial:x.big && !x._full })) }, null, 1), 'application/json') },
    { t:'Import backup', f:importBackup }, { t:'Trash', f:() => setView('trash') }];
  const i = await iosMenu({ title:'My Notepad', message:info, items:list });
  if (i >= 0) list[i].f();
});
async function importBackup(){
  const f = await pickFile('.json,application/json'); if (!f) return;
  let d; try { d = JSON.parse(await readAs(f, 'readAsText')); } catch (e) { return toast('That is not a notepad backup file.', true); }
  const l = (d && Array.isArray(d.items)) ? d.items.filter(x => x && TOOL(x.kind) && TOOL(x.kind).saved) : [];
  if (!l.length) return toast('No items found in that file.', true);
  if (!(await confirmBox('Import ' + l.length + ' item' + (l.length > 1 ? 's' : '') + '?', 'They are added next to what you have; nothing is overwritten.', 'Import'))) return;
  l.forEach(x => { const it = newItem(x.kind, { title:String(x.title || ''), body:x.body && typeof x.body === 'object' ? x.body : TOOL(x.kind).blank(), color:x.color || null, pinned:!!x.pinned }); touch(it); });
  toast(l.length + ' items imported'); render();
}

$('bkBtn').addEventListener('click', () => { location.href = 'launcher.html'; });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { sync(); if (S.view === 'punch' || S.view === 'home') loadPunch(); } else { if (ED) { if (ED.flush) ED.flush(); flushSave(ED.it); } } });
window.addEventListener('pagehide', () => { if (ED) { if (ED.flush) ED.flush(); flushSave(ED.it); } });

/* ══ Boot ══════════════════════════════════════════════════════════════ */
(async function boot(){
  let u;
  try { u = await SARV_GATE.boot({ url:SUPABASE_URL, key:SUPABASE_ANON, app:null, label:'My Notepad' }); }
  finally { if (window.sarvSsoPrebootDone) window.sarvSsoPrebootDone(); }
  S.user = u || SARV_GATE.user || {};
  S.uid = String(S.user.id || S.user.user_id || S.user.emp_code || S.user.user_name || 'me');
  tmLoad();
  const saved = await KV.get('np:' + S.uid);
  if (saved && saved.items) { DB.items = saved.items; DB.since = saved.since || null; }
  const h = (location.hash || '').replace('#', '');
  if (TOOL(h)) S.view = h;
  S.loaded = true; render(); paintSync();
  await sync();
  setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 5000);   // data sync every 5 s (changes since the cursor only)
})();
