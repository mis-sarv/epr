<!--
  LEAVE APPROVAL (launcher tile "Leave Approval", leaveTile() in launcher.html; sql/LEAVE_APPROVAL_MIGRATION.sql)
    Apply      Employee Details come from the ERP login (Name, Emp Code, Department, Designation: fixed, never
               typed); Leave Type, Duration (Half Day + shift / Full Day / More Than 1 Day), Reasons (tick + remarks),
               WHOM TO APPROVE = the Admin's approval steps for the user's department: a Compulsory step must have
               its approver, an Optional one may be switched on; approvers ONLY from the Admin's list of that step
               (one user = picked by itself; the applicant himself is never offered). Confirm sheet → lv_save.
    My Leaves  own requests with their step-by-step pipeline (who, status, time, remarks); Cancel with a reason
               (pending, or approved before its first day).
    Approvals  To Approve (the steps waiting for me) → Approve / Reject (reason) with my OWN PIN (lv_decide);
               Decided by me; All (Admin: every request, and an Admin may decide the step in turn for anyone).
    Setup      Admin only (lv_admin_get / lv_admin_save with the Admin PIN): approval steps (name, Compulsory /
               Optional, departments, approver users, order), one after the other or all at once, how many days
               back / ahead a leave may be applied, Leave Types and Reasons. A new setting = one key in the config
               (lv_default_cfg_ on the server fills what is missing), no migration.
  The SERVER checks everything again (list-only approvers, compulsory steps, dates, overlap, PIN, whose turn).
  Data every 5 s while on screen (AUTO SYNC), redrawn only when it changed. Without the migration: a note only.
  LOGIN = ERP LOGIN (launcher.html), gate booted with app: null like My Notepad (every employee applies for leave).
  iOS look of its own (like bill-check / notepad), so no caps-input.js / hover-tip.js: remarks keep their case.
  The old browser-only prototype (localStorage ios_leave_requests_v1 + WhatsApp links) is gone: anybody with a
  link could "approve" there.
-->

async function rpc(fn, args) {
  let r;
  try { r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON, Authorization:'Bearer ' + SUPABASE_ANON },

  const d = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status)); e.code = d && d.code; e.missing = e.code === 'PGRST202' || e.code === '42883' || e.code === '42P01'; throw e; }
  if (d && d.success === false) {
    const c = String(d.error || '');
    if (SESSION_ERR[c]) { location.replace('launcher.html?why=' + c); return new Promise(() => {}); }
    const e = new Error((ERR[c] || c || 'Unknown error') + (d.step ? ': ' + d.step : '')); e.code = c; e.data = d; throw e;
  }
  return d;
}

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => { t.className = 'toast'; }, 3200);
}
const dmy = d => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); return m ? m[3] + '-' + m[2] + '-' + m[1] : (d || '-'); };
const when = iso => { if (!iso) return ''; const t = new Date(iso); if (isNaN(t)) return ''; const p = n => String(n).padStart(2, '0'); return p(t.getDate()) + '-' + p(t.getMonth() + 1) + '-' + t.getFullYear() + ' ' + p(t.getHours()) + ':' + p(t.getMinutes()); };
const addDays = (iso, n) => { const t = new Date(iso + 'T00:00:00'); t.setDate(t.getDate() + n); const p = x => String(x).padStart(2, '0'); return t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()); };

async function loadBoot() {
  try {
    const d = await rpc('lv_boot');
    S.noMig = false;
    S.me = d.me; S.cfg = d.cfg; S.steps = d.steps || []; S.counts = d.counts || {}; S.today = String(d.today || '').slice(0, 10);

    $('who').textContent = [S.me.name, S.me.empCode].filter(Boolean).join(' · ');

/* ── AUTO SYNC (every 5 s while on screen, online, no sheet open and no box with the cursor) ── */
async function autoSync() {
  if (document.hidden || navigator.onLine === false || S.noMig || !S.me || S.sheets > 0) return;

// What blocks sending (the server checks the same again)
function sendBlock() {

    if (st.mandatory && !(st.users || []).length) return st.label + ': the Admin has not set its approver';

function paintSend() {

  if (r.duration === 'MULTI' && !(r.to > r.from)) return toast('To Date must be after From Date', true);

    const others = stepOthers(st); if (!others.length) return '<div class="row"><span class="l">' + esc(st.label) + '</span><span class="v">Own step · skipped</span></div>';
    const u = others.find(x => String(x.id) === String(S.f.pick[st.code])) || {};

    + '<div class="row"><span class="l">Department</span><span class="v">' + esc(S.me.dept || '-') + '</span></div>'
    + '<div class="row"><span class="l">Leave Type</span><span class="v dark">' + esc(type.label || r.leaveType) + '</span></div>'
    + '<div class="row"><span class="l">Duration</span><span class="v dark">' + (r.duration === 'HALF' ? 'Half Day · ' + esc(r.halfShift) : r.duration === 'FULL' ? 'Full Day' : 'More Than 1 Day') + '</span></div>'
    + '<div class="row"><span class="l">Date</span><span class="v dark">' + esc(dmy(r.from)) + (r.duration === 'MULTI' ? ' to ' + esc(dmy(r.to)) : '') + ' · ' + days + ' day' + (days === 1 ? '' : 's') + '</span></div>'
    + '<div class="row"><span class="l">Reason</span><span class="v">' + esc(reasons.concat(r.remarks ? [r.remarks] : []).join(', ')) + '</span></div>'

    + '<div class="err" id="sErr"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px"><button type="button" class="btn gray" data-x>Edit</button><button type="button" class="btn green" id="sOk">Confirm &amp; Send</button></div>');
  sh.el.querySelector('#sOk').addEventListener('click', async () => {
    const b = sh.el.querySelector('#sOk'); b.disabled = true; b.textContent = 'Sending...';

/* ── LISTS ────────────────────────────────────────────────────────────── */

  const words = S.q.trim().toUpperCase().split(/\s+/).filter(Boolean);
  if (words.length) list = list.filter(r => { const hay = [r.no, r.name, r.empCode, r.dept, r.leaveLabel, r.status, dmy(r.from), dmy(r.to), (r.steps || []).map(s => s.approver + ' ' + s.label).join(' ')].join(' ').toUpperCase(); return words.every(w => hay.indexOf(w) >= 0); });
  box.innerHTML = head + (!rows ? '<div class="empty">Loading…</div>'
    : list.length ? '<div class="card">' + list.map(r => reqHtml(r, scope)).join('') + '</div>'
    : '<div class="empty">' + (scope === 'TODO' ? 'Nothing waiting for your approval.' : scope === 'MINE' ? (rows.length ? 'Nothing matches.' : 'No leave applied yet.') : 'Nothing here.') + '</div>');
  box.querySelectorAll('[data-seg]').forEach(b => b.addEventListener('click', () => { S.seg = b.getAttribute('data-seg'); paintList(S.seg); loadList(S.seg); }));
  box.querySelectorAll('[data-mf]').forEach(b => b.addEventListener('click', () => { S.mineFilter = b.getAttribute('data-mf'); paintList('MINE'); }));
  const q = $('q-' + scope);
  if (q) q.addEventListener('input', () => { S.q = q.value; const pos = q.selectionStart; paintList(scope); const q2 = $('q-' + scope); if (q2) { q2.focus(); try { q2.setSelectionRange(pos, pos); } catch (e) {} } });
  box.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => act(b.getAttribute('data-act'), b.getAttribute('data-id'), scope)));
}
function findReq(id) { for (const k in S.lists) { const r = (S.lists[k] || []).find(x => String(x.id) === String(id)); if (r) return r; } return null; }
async function act(kind, id, scope) {
  const r = findReq(id); if (!r) return;
  const span = esc(dmy(r.from)) + (r.to !== r.from ? ' to ' + esc(dmy(r.to)) : '');
  if (kind === 'CANCEL') {
    const res = await askPin({ title:'Cancel leave ' + r.no, sub:esc(r.leaveLabel) + ' · ' + span, reason:true, reasonReq:true, reasonPh:'Why it is cancelled', noPin:true, okLabel:'Cancel leave', red:true,
      run:v => rpc('lv_cancel', { p_id:id, p_reason:v.reason }) });
    if (res) { toast('Leave ' + r.no + ' cancelled'); loadList('MINE'); }
    return;
  }
  const rej = kind === 'REJECT', st = (r.steps || []).find(s => s.status === 'PENDING' && String(s.approverId) === meId()) || (r.steps || []).find(s => s.status === 'PENDING') || {};
  const res = await askPin({ title:(rej ? 'Reject' : 'Approve') + ' · ' + r.name, sub:esc(r.no) + ' · ' + esc(r.leaveLabel) + ' · ' + span + ' · ' + esc(r.days) + ' day(s)<br>Step: <b>' + esc(st.label || '-') + '</b>' + (String(st.approverId) !== meId() ? ' (Admin, for ' + esc(st.approver || '-') + ')' : ''),
    reason:true, reasonReq:rej, reasonPh:rej ? 'Reason (the employee sees it)' : 'Remarks (optional)', okLabel:rej ? 'Reject' : 'Approve', red:rej, auto:!rej,
    run:v => rpc('lv_decide', { p_id:id, p_action:kind, p_pin:v.pin, p_remarks:v.reason || null }) });
  if (res) { buzz(20); toast(r.name + ': ' + (rej ? 'rejected' : 'approved') + (res.via === 'ADMIN' ? ' (as Admin)' : '')); loadList(S.seg); if (S.seg !== 'TODO') loadList('TODO', true); }
}

/* ── SHEETS: a bottom sheet, and the reason + own-PIN step (4+ digits send by themselves) ── */
function sheet(html) {
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="sheet" role="dialog" aria-modal="true"><div class="gr"></div>' + html + '</div>';
  document.body.appendChild(ov); S.sheets++;
  const key = e => { if (e.key === 'Escape') { e.preventDefault(); api.close(); if (api.onClose) api.onClose(); } };
  const api = { el:ov, close() { if (!ov.isConnected) return; ov.remove(); S.sheets = Math.max(0, S.sheets - 1); document.removeEventListener('keydown', key, true); } };
  document.addEventListener('keydown', key, true);
  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('[data-x]')) { api.close(); if (api.onClose) api.onClose(); } });
  return api;
}
function askPin(o) {
  return new Promise(resolve => {
    const sh = sheet('<h3>' + esc(o.title) + '</h3><div class="sub">' + (o.sub || '') + '</div>'
      + (o.reason ? '<textarea class="inp" id="pReason" maxlength="300" placeholder="' + esc(o.reasonPh || '') + '"></textarea>' : '')
      + (o.noPin ? '' : '<input class="inp pin" id="pPin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="Your PIN" name="lv-pin" style="margin-top:10px">')
      + '<div class="err" id="pErr"></div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px"><button type="button" class="btn gray" data-x>Back</button><button type="button" class="btn ' + (o.red ? 'red' : 'green') + '" id="pOk">' + esc(o.okLabel || 'OK') + '</button></div>');
    let done = false, t = null;
    sh.onClose = () => { clearTimeout(t); if (!done) { done = true; resolve(null); } };
    const pin = sh.el.querySelector('#pPin'), rea = sh.el.querySelector('#pReason'), err = sh.el.querySelector('#pErr'), ok = sh.el.querySelector('#pOk');
    let busy = false;
    const submit = async () => {
      clearTimeout(t);
      if (busy) return;
      const v = { pin:pin ? pin.value : '', reason:rea ? rea.value.trim() : '' };
      if (o.reasonReq && rea && !v.reason) { err.textContent = 'Write the reason first'; rea.focus(); return; }
      if (pin && v.pin.length < 4) { err.textContent = 'Enter your PIN'; pin.focus(); return; }
      busy = true; ok.disabled = true; err.textContent = '';
      try { const d = await o.run(v); done = true; sh.close(); resolve(d || true); }
      catch (e) {
        busy = false; ok.disabled = false; err.textContent = e.message;
        if (e.code === 'WRONG_PIN' && pin) { buzz([14, 50, 14]); pin.value = ''; pin.focus(); }
        if (e.code === 'ALREADY_DONE' || e.code === 'NOT_YOUR_STEP') { done = true; setTimeout(() => { sh.close(); resolve(null); go(S.tab); }, 900); }
      }
    };
    ok.addEventListener('click', submit);
    if (pin) {
      pin.addEventListener('input', () => { pin.value = pin.value.replace(/\D/g, '').slice(0, 8); err.textContent = ''; clearTimeout(t);
        if (o.auto && pin.value.length >= 4) t = setTimeout(submit, PIN_AUTO_MS); });
      pin.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });
    }
    setTimeout(() => { (o.reasonReq && rea ? rea : pin || rea || ok).focus(); }, 250);
  });
}

/* ── SETUP (Admin) ────────────────────────────────────────────────────── */
async function loadAdmin() {
  const v = $('v-setup');
  if (S.admin && S.admin.dirty) { paintAdmin(); return; }   // unsaved changes stay while moving between tabs
  v.innerHTML = '<div class="empty">Loading the setup…</div>';
  try {
    const d = await rpc('lv_admin_get');
    S.admin = { cfg:JSON.parse(JSON.stringify(d.cfg)), users:d.users || [], depts:d.depts || [], savedAt:d.savedAt, savedBy:d.savedBy, configured:d.configured, dirty:false };
    ['steps', 'leaveTypes', 'reasons'].forEach(k => { if (!Array.isArray(S.admin.cfg[k])) S.admin.cfg[k] = []; });
    S.admin.cfg.steps.forEach(st => { st.depts = Array.isArray(st.depts) ? st.depts : []; st.users = Array.isArray(st.users) ? st.users.map(String) : []; });
    paintAdmin();
  } catch (e) { v.innerHTML = '<div class="note n-bad">Could not load the setup: ' + esc(e.message) + '</div>'; }
}
const userById = id => (S.admin.users || []).find(u => String(u.id) === String(id));
const codeOf = s => String(s || '').trim().toUpperCase().replace(/\s+/g, ' ');
function paintAdmin() {
  const A = S.admin, c = A.cfg, v = $('v-setup');
  v.innerHTML =
      '<div class="note ' + (A.configured ? 'n-info' : 'n-warn') + '">' + (A.configured ? 'Saved ' + esc(when(A.savedAt)) + (A.savedBy ? ' by ' + esc(A.savedBy) : '') + '.' : 'Not saved yet: employees cannot send a leave until you save the approvers here.')
    + ' Every employee sees only the steps of his department and may choose approvers only from the list you set here. A compulsory step cannot be left out.'
    + (A.dirty ? ' <b>Unsaved changes.</b>' : '') + '</div>'
    + '<h2 class="sec">Approval Steps <span class="r">in this order</span></h2><div id="aSteps"></div>'
    + '<button type="button" class="btn gray full" id="aAddStep" style="margin-top:8px">+ Add step</button>'
    + '<h2 class="sec">Rules</h2><div class="card">'
    + '<div class="row"><span class="l">One step after the other</span><span class="v" style="font-size:12px">' + (c.sequential ? 'the next approver gets it after the previous one approves' : 'every approver at once') + '</span><button type="button" class="sw' + (c.sequential ? ' on' : '') + '" id="aSeq"></button></div>'
    + '<div class="row"><span class="l">Days back allowed</span><span class="v"><input type="number" class="inp sm" id="aBack" min="0" max="60" value="' + esc(c.backDays) + '" style="width:80px;text-align:right"></span></div>'
    + '<div class="row"><span class="l">Days ahead allowed</span><span class="v"><input type="number" class="inp sm" id="aAhead" min="1" max="400" value="' + esc(c.aheadDays) + '" style="width:80px;text-align:right"></span></div>'
    + '</div>'
    + listEditor('Leave Types', 'leaveTypes', 'e.g. Earned Leave')
    + listEditor('Reasons of Leave', 'reasons', 'e.g. Family Function')
    + '<div style="margin-top:18px"><button type="button" class="btn blue full" id="aSave">Save setup (Admin PIN)</button></div>'
    + '<div style="height:12px"></div>';
  paintAdminSteps();
  $('aAddStep').onclick = () => { c.steps.push({ code:'', label:'', mandatory:true, depts:[], users:[] }); A.dirty = true; paintAdminSteps(); };
  $('aSeq').onclick = () => { c.sequential = !c.sequential; A.dirty = true; paintAdmin(); };
  $('aBack').onchange = e => { c.backDays = Math.max(0, Math.min(60, Number(e.target.value) || 0)); A.dirty = true; };
  $('aAhead').onchange = e => { c.aheadDays = Math.max(1, Math.min(400, Number(e.target.value) || 180)); A.dirty = true; };
  v.querySelectorAll('[data-lst]').forEach(box => bindListEditor(box));
  $('aSave').onclick = saveAdmin;
}
function paintAdminSteps() {
  const A = S.admin, steps = A.cfg.steps, box = $('aSteps');
  box.innerHTML = steps.map((st, i) => '<div class="card" style="margin-top:' + (i ? 10 : 0) + 'px" data-i="' + i + '">'
    + '<div class="row"><span class="pill p-blue">' + (i + 1) + '</span><input class="inp" data-f="label" value="' + esc(st.label) + '" placeholder="Step name, e.g. Department Head" style="flex:1">'
    + '<button type="button" class="mini" data-mv="-1" aria-label="Move up"' + (i ? '' : ' disabled') + '>' + ico('up', 14) + '</button><button type="button" class="mini" data-mv="1" aria-label="Move down"' + (i < steps.length - 1 ? '' : ' disabled') + '>' + ico('down', 14) + '</button>'
    + '<button type="button" class="mini red" data-del aria-label="Remove the step">' + ico('x', 14) + '</button></div>'
    + '<div class="row"><span class="l">Compulsory</span><span class="v" style="font-size:12px">' + (st.mandatory ? 'the employee cannot leave it out' : 'optional: the employee may ask it') + '</span><button type="button" class="sw' + (st.mandatory ? ' on' : '') + '" data-mand></button></div>'
    + '<div class="row" style="flex-wrap:wrap"><span class="l">Departments</span><span class="v" style="font-size:12px">' + ((st.depts || []).length ? '' : 'all departments') + '</span>'
    + '<div style="flex-basis:100%">' + (st.depts || []).map((d, k) => '<span class="uchip">' + esc(d) + '<button type="button" data-dd="' + k + '" aria-label="Remove">✕</button></span>').join('')
    + '<select class="inp" data-adddept style="margin-top:4px"><option value="">+ Only for a department…</option>' + (A.depts || []).filter(d => (st.depts || []).indexOf(d) < 0).map(d => '<option value="' + esc(d) + '">' + esc(d) + '</option>').join('') + '</select></div></div>'
    + '<div class="row" style="flex-wrap:wrap"><span class="l">Approvers</span><span class="v" style="font-size:12px">' + ((st.users || []).length ? (st.users.length === 1 ? 'picked by itself' : 'the employee chooses one of these') : '<span style="color:var(--red)">none yet</span>') + '</span>'
    // every active user picked (the All option): one chip instead of a chip per user
    + '<div style="flex-basis:100%">' + (allUsersIn(st)
        ? '<span class="uchip">All users (' + A.users.length + ')<button type="button" data-dall aria-label="Remove all">✕</button></span>'
          + '<div class="v" style="font-size:11px;margin-top:2px">A login made later is not in it: open Choose approvers and tick All again.</div>'
        : (st.users || []).map((id, k) => { const u = userById(id) || { name:'(inactive user)' }; return '<span class="uchip">' + esc(u.name) + (u.empCode ? ' · ' + esc(u.empCode) : '') + '<button type="button" data-du="' + k + '" aria-label="Remove">✕</button></span>'; }).join(''))
    + '<button type="button" class="mini" data-addu style="margin-top:4px">+ Choose approvers</button></div></div>'
    + '</div>').join('') || '<div class="empty">No step: add one.</div>';
  box.querySelectorAll('[data-i]').forEach(card => {
    const i = Number(card.getAttribute('data-i')), st = steps[i];
    card.querySelector('[data-f="label"]').addEventListener('input', e => { st.label = e.target.value; st.code = codeOf(e.target.value); A.dirty = true; });
    card.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => { const j = i + Number(b.getAttribute('data-mv')); if (j < 0 || j >= steps.length) return; steps.splice(j, 0, steps.splice(i, 1)[0]); A.dirty = true; paintAdminSteps(); }));
    card.querySelector('[data-del]').addEventListener('click', () => { if (st.label && !confirm('Remove the step "' + st.label + '"?')) return; steps.splice(i, 1); A.dirty = true; paintAdminSteps(); });
    card.querySelector('[data-mand]').addEventListener('click', () => { st.mandatory = !st.mandatory; A.dirty = true; paintAdminSteps(); });
    card.querySelectorAll('[data-dd]').forEach(b => b.addEventListener('click', () => { st.depts.splice(Number(b.getAttribute('data-dd')), 1); A.dirty = true; paintAdminSteps(); }));
    card.querySelector('[data-adddept]').addEventListener('change', e => { if (!e.target.value) return; st.depts = (st.depts || []).concat([e.target.value]); A.dirty = true; paintAdminSteps(); });
    card.querySelectorAll('[data-du]').forEach(b => b.addEventListener('click', () => { st.users.splice(Number(b.getAttribute('data-du')), 1); A.dirty = true; paintAdminSteps(); }));
    const dall = card.querySelector('[data-dall]');
    if (dall) dall.addEventListener('click', () => { if (!confirm('Remove all ' + st.users.length + ' approvers of "' + (st.label || 'this step') + '"?')) return; st.users = []; A.dirty = true; paintAdminSteps(); });
    card.querySelector('[data-addu]').addEventListener('click', () => pickUsers(st));
  });
}
// Every active login is an approver of this step (the picker's All option)
function allUsersIn(st) {
  const A = S.admin, have = new Set((st.users || []).map(String));
  return A.users.length > 1 && A.users.every(u => have.has(String(u.id)));
}
/* Approvers of a step: a search list of the active ERP users, ticked ones kept. The first row, All, ticks every
   user of the list on screen (every active login when nothing is searched; only the matches while searching), and
   untick clears them; it shows ticked while all of those are ticked. The employee then chooses any one of them
   when applying (never himself: lv_save). */
function pickUsers(st) {
  const A = S.admin, sel = new Set((st.users || []).map(String));
  const sh = sheet('<h3>Approvers · ' + esc(st.label || 'step') + '</h3><div class="sub">Only these users may approve this step. Tick one or more, or All.</div>'
    + '<div class="search" style="margin-bottom:6px">' + ico('search', 16) + '<input class="inp" id="uQ" placeholder="Search name, Emp Code, department…"></div>'
    + '<div class="ulist" id="uList"></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px"><button type="button" class="btn gray" data-x>Cancel</button><button type="button" class="btn blue" id="uOk">Use</button></div>');
  const q = sh.el.querySelector('#uQ'), listEl = sh.el.querySelector('#uList'), okBtn = sh.el.querySelector('#uOk');
  const paintOk = () => { okBtn.textContent = sel.size ? 'Use (' + sel.size + ')' : 'Use'; };
  const draw = () => {
    const words = (q.value || '').trim().toUpperCase().split(/\s+/).filter(Boolean);
    const list = A.users.filter(u => { const h = [u.name, u.empCode, u.dept, u.desig].join(' ').toUpperCase(); return words.every(w => h.indexOf(w) >= 0); });
    const allOn = list.length > 0 && list.every(u => sel.has(String(u.id)));
    const allRow = list.length ? '<label style="background:var(--fill,#f2f2f7);border-radius:10px;padding:9px 8px"><input type="checkbox" data-all' + (allOn ? ' checked' : '') + '><span><b>All' + (words.length ? ' shown' : ' users') + ' (' + list.length + ')</b><small>'
        + (words.length ? 'Every user matching this search' : 'Every active login: the employee may send the leave to anyone') + '</small></span></label>' : '';
    const top = listEl.scrollTop;   // a tick redraws the list (the All row follows it): stay where the finger was
    listEl.innerHTML = allRow + (list.map(u => '<label><input type="checkbox" data-u="' + esc(u.id) + '"' + (sel.has(String(u.id)) ? ' checked' : '') + '><span><b>' + esc(u.name) + '</b><small>' + esc([u.empCode, u.desig, u.dept].filter(Boolean).join(' · ')) + '</small></span></label>').join('') || '<div class="empty">Nobody matches.</div>');
    listEl.querySelectorAll('[data-u]').forEach(cb => cb.addEventListener('change', () => { if (cb.checked) sel.add(cb.getAttribute('data-u')); else sel.delete(cb.getAttribute('data-u')); draw(); }));
    const all = listEl.querySelector('[data-all]');
    if (all) all.addEventListener('change', () => { list.forEach(u => { if (all.checked) sel.add(String(u.id)); else sel.delete(String(u.id)); }); draw(); });
    listEl.scrollTop = top;
    paintOk();
  };
  q.addEventListener('input', draw); draw();
  okBtn.addEventListener('click', () => { st.users = [...sel]; A.dirty = true; sh.close(); paintAdminSteps(); });
}
function listEditor(title, key, ph) {
  return '<h2 class="sec">' + esc(title) + '</h2><div class="card" data-lst="' + key + '">'
    + (S.admin.cfg[key] || []).map((x, i) => '<div class="row"><input class="inp" data-li="' + i + '" value="' + esc(x.label) + '"><button type="button" class="mini red" data-ld="' + i + '" aria-label="Remove">' + ico('x', 14) + '</button></div>').join('')
    + '<div class="row"><input class="inp" data-lnew placeholder="' + esc(ph) + '"><button type="button" class="mini" data-ladd>Add</button></div></div>';
}
function bindListEditor(box) {
  const key = box.getAttribute('data-lst'), list = S.admin.cfg[key];
  box.querySelectorAll('[data-li]').forEach(inp => inp.addEventListener('input', () => { list[Number(inp.getAttribute('data-li'))].label = inp.value; S.admin.dirty = true; }));
  box.querySelectorAll('[data-ld]').forEach(b => b.addEventListener('click', () => { list.splice(Number(b.getAttribute('data-ld')), 1); S.admin.dirty = true; paintAdmin(); }));
  const add = () => { const inp = box.querySelector('[data-lnew]'), t = inp.value.trim(); if (!t) return; if (list.some(x => x.code === codeOf(t))) return toast('Already in the list', true); list.push({ code:codeOf(t), label:t }); S.admin.dirty = true; paintAdmin(); };
  box.querySelector('[data-ladd]').addEventListener('click', add);
  box.querySelector('[data-lnew]').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
}
async function saveAdmin() {
  const c = S.admin.cfg;
  c.steps.forEach(st => { st.label = (st.label || '').trim(); st.code = codeOf(st.code || st.label); });
  if (!c.steps.length) return toast('Add at least one approval step', true);
  if (c.steps.some(st => !st.label)) return toast('Every step needs a name', true);
  const codes = c.steps.map(st => st.code); if (codes.some((k, i) => codes.indexOf(k) !== i)) return toast('Two steps have the same name', true);
  if (!(c.leaveTypes || []).length) return toast('Keep at least one Leave Type', true);
  const empty = c.steps.find(st => st.mandatory && !(st.users || []).length);
  if (empty) {
    const msg = '"' + empty.label + '" is compulsory but has no approver: nobody of its departments can send a leave until you add one.\n\nSave anyway?';
    if (!(window.IosDialog ? await IosDialog.confirm(msg) : window.confirm(msg))) return;
  }
  (c.leaveTypes || []).forEach(x => { x.code = x.code || codeOf(x.label); });
  (c.reasons || []).forEach(x => { x.code = x.code || codeOf(x.label); });
  const res = await askPin({ title:'Save Leave Setup', sub:c.steps.length + ' approval step(s) · ' + (c.leaveTypes || []).length + ' leave type(s). Confirm with the Admin PIN.', okLabel:'Save', auto:true,
    run:v => rpc('lv_admin_save', { p_cfg:c, p_pin:v.pin }) });
  if (res) { S.admin.dirty = false; toast('Leave setup saved'); await loadBoot(); S.admin = null; loadAdmin(); }
}
