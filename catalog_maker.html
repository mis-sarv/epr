<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- ERP single sign-on (launcher.html login): first, so a logged-in user
         never sees a flash. Templates are saved on the server through the
         token-checked cat_* RPCs (sql/CATALOG_TEMPLATES_MIGRATION.sql). -->
    <script src="sso-preboot.js"></script>
    <script src="sso-gate.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SARV INDIA CATALOGS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600;700&family=Montserrat:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Add LocalForage to bypass 5MB Storage Limits -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        
        /* Custom scrollbar for editor */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* A4 Page Styling for Preview & Export */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            transform-origin: top center;
        }
        
        /* Print styles used by html2pdf */
        @media print {
            .a4-page {
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
        }

        /* PDF export: the pages are laid out off screen at real A4 size and
           captured one by one (generatePDF). No shadow, nothing scaled. */
        #pdf-export-container {
            position: fixed; left: -10000px; top: 0; width: 210mm;
            pointer-events: none;
        }
        #pdf-export-container .a4-page { box-shadow: none; margin: 0; transform: none; }
        /* Pictures are background images, not <img object-fit>: html2canvas
           (inside html2pdf) ignores object-fit, so an <img> came out
           stretched in the PDF. background-size:cover it does draw. */
        .cm-photo { background-size: cover; background-position: center; background-repeat: no-repeat; }

        #preview-wrapper {
            /* Scale down A4 to fit in the preview window nicely */
            transform: scale(0.45);
            transform-origin: top center;
            height: 140mm;
        }
        
        @media (min-width: 1536px) {
            #preview-wrapper { transform: scale(0.6); height: 180mm; }
        }
    </style>
</head>
<body class="bg-gray-50 h-screen flex overflow-hidden">

    <!-- Custom Modal for Alerts and Confirms -->
    <div id="custom-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center transition-opacity">
        <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4 shadow-xl">
            <p id="custom-modal-text" class="text-gray-800 mb-6 font-medium text-center whitespace-pre-line"></p>
            <!-- Only for cmDialog({input}) — e.g. the template name on Save -->
            <input id="custom-modal-input" type="text" maxlength="120" class="hidden w-full border border-gray-300 rounded p-2 mb-5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <div class="flex justify-center gap-3" id="custom-modal-buttons">
                <!-- Buttons injected dynamically -->
            </div>
        </div>
    </div>

    <!-- Templates saved on the server (openTemplateLibrary / renderTemplateList) -->
    <div id="tpl-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-40 flex items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-3xl mx-4 flex flex-col" style="max-height: 85vh;">
            <div class="flex items-center justify-between px-5 py-3 border-b border-gray-200">
                <h3 class="text-base font-bold text-gray-800"><i class="fas fa-folder-open text-indigo-600"></i> Catalog Templates</h3>
                <button onclick="closeTemplateLibrary()" class="text-gray-500 hover:text-gray-800 text-sm font-semibold px-2">&#10005; Close</button>
            </div>
            <div class="px-5 py-3 border-b border-gray-100 flex gap-2 items-center">
                <input id="tpl-search" type="text" oninput="renderTemplateList()" placeholder="Search by name or who saved it..." class="flex-1 border border-gray-300 rounded p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                <button onclick="loadTemplateList()" class="border border-gray-300 rounded px-3 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-50" title="Reload the list">&#8635; Refresh</button>
            </div>
            <div id="tpl-list" class="flex-1 overflow-y-auto px-5 py-3 text-sm"></div>
        </div>
    </div>

    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col shadow-sm z-10">
        <div class="p-5 border-b border-gray-200 bg-gray-900 text-white">
            <h1 class="text-xl font-bold tracking-wider">SARV INDIA</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-widest">Catalog Studio</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4" id="page-list">
            <!-- Pages will be injected here via JS -->
        </div>

        <div class="p-4 border-t border-gray-200 flex flex-col gap-2 bg-gray-50">
            <!-- Global Font Settings -->
            <div class="mb-2 p-3 bg-white border border-gray-200 rounded-lg shadow-sm">
                <label class="block text-xs font-bold text-gray-700 uppercase tracking-wide mb-2"><i class="fas fa-font"></i> Global Font Style</label>
                <select id="setting-heading-font" onchange="updateGlobalSetting('headingFont', this.value)" class="w-full mb-2 border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="'Montserrat', sans-serif">Montserrat (Modern & Clean)</option>
                    <option value="'Cinzel', serif">Cinzel (Classic Elegant)</option>
                    <option value="'Playfair Display', serif">Playfair Display (Serif)</option>
                    <option value="'Poppins', sans-serif">Poppins (Round & Bold)</option>
                </select>
                <select id="setting-body-font" onchange="updateGlobalSetting('bodyFont', this.value)" class="w-full border border-gray-300 rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="'Inter', sans-serif">Inter (Professional)</option>
                    <option value="'Poppins', sans-serif">Poppins (Modern)</option>
                </select>
            </div>

            <!-- Server templates: the list, a fresh one, and the two saves.
                 The browser keeps a draft on its own as you type (saveDataLocally). -->
            <div class="grid grid-cols-2 gap-2">
                <button onclick="openTemplateLibrary()" class="bg-white text-gray-700 border border-gray-300 font-semibold py-2 px-2 rounded-lg hover:bg-gray-50 transition shadow-sm flex justify-center items-center gap-1.5 text-sm" title="Templates saved on the server: open one to edit, or delete">
                    <i class="fas fa-folder-open"></i> Templates
                </button>
                <button onclick="newTemplate()" class="bg-white text-gray-700 border border-gray-300 font-semibold py-2 px-2 rounded-lg hover:bg-gray-50 transition shadow-sm flex justify-center items-center gap-1.5 text-sm" title="Start a new catalog from the sample pages">
                    <i class="fas fa-file"></i> New
                </button>
            </div>
            <button onclick="addNewPage()" class="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 font-semibold py-2 px-4 rounded-lg hover:bg-indigo-100 transition shadow-sm flex justify-center items-center gap-2">
                <i class="fas fa-plus"></i> Add New Page
            </button>
            <button onclick="cloudSave(false)" id="cloud-save-btn" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition shadow-sm flex justify-center items-center gap-2" title="Save this template on the server (updates the open template)">
                <i class="fas fa-cloud-upload-alt"></i> Save to Server
            </button>
            <button onclick="cloudSave(true)" class="w-full bg-white text-indigo-700 border border-indigo-300 font-semibold py-1.5 px-4 rounded-lg hover:bg-indigo-50 transition shadow-sm flex justify-center items-center gap-2 text-sm" title="Keep the open template as it is and save this as a separate template under a new name">
                <i class="fas fa-copy"></i> Save as New Template
            </button>
            <button onclick="generatePDF()" class="w-full bg-green-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-green-700 transition shadow-md flex justify-center items-center gap-2 mt-2">
                <i class="fas fa-file-pdf"></i> Export to PDF
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Toolbar -->
        <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm">
            <div class="flex items-center gap-3 min-w-0">
                <h2 class="text-lg font-semibold text-gray-700 whitespace-nowrap" id="current-editing-title">Editing: Page 1</h2>
                <!-- Which server template is open and whether it is saved (paintCloudBar) -->
                <span id="cloud-bar" class="text-xs font-semibold px-2.5 py-1 rounded-full border truncate max-w-[420px]"></span>
            </div>
            <button onclick="deleteCurrentPage()" id="btn-delete-page" class="text-red-500 hover:text-red-700 text-sm font-medium flex items-center gap-1 transition">
                <i class="fas fa-trash-alt"></i> Delete Page
            </button>
        </header>

        <!-- Main Workspace -->
        <div class="flex-1 flex overflow-hidden">
            
            <!-- Left: Form Controls -->
            <section class="w-[400px] bg-white border-r border-gray-200 overflow-y-auto p-6 flex flex-col gap-5 shadow-inner" id="sidebar-form-container">
                
                <!-- PRODUCT PAGE EDITOR -->
                <div id="product-editor" class="flex flex-col gap-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Page Number</label>
                        <input type="text" id="input-pageNum" oninput="updateCurrentPage('pageNum', this.value)" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Brand Name (Top Left)</label>
                        <input type="text" id="input-brandText" oninput="updateCurrentPage('brandText', this.value)" placeholder="e.g. TOUCHWOOD" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Footer Text (Bottom Left)</label>
                        <input type="text" id="input-footerText" oninput="updateCurrentPage('footerText', this.value)" placeholder="e.g. SUPER CLOUDY COLLECTION" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Title Line 1</label>
                            <input type="text" id="input-title1" oninput="updateCurrentPage('title1', this.value)" placeholder="e.g. BOTANICAL" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Title Line 2</label>
                            <input type="text" id="input-title2" oninput="updateCurrentPage('title2', this.value)" placeholder="e.g. OLIVE" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none transition">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Description</label>
                        <textarea id="input-description" oninput="updateCurrentPage('description', this.value)" placeholder="Enter description here..." rows="4" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none transition resize-none"></textarea>
                    </div>

                    <div class="p-4 bg-gray-50 border border-gray-200 rounded-lg">
                        <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-3">Blanket Specifications</label>
                        <div class="space-y-3">
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-semibold text-gray-500 w-20">Size:</span>
                                <select id="input-size" onchange="updateCurrentPage('size', this.value)" class="flex-1 border border-gray-300 rounded p-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                    <option value="Double Bed">Double Bed</option>
                                    <option value="Single Bed">Single Bed</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-semibold text-gray-500 w-20">Ply:</span>
                                <select id="input-ply" onchange="updateCurrentPage('ply', this.value)" class="flex-1 border border-gray-300 rounded p-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
                                    <option value="Single Ply">Single Ply</option>
                                    <option value="Double Ply">Double Ply</option>
                                    <option value="Three Ply">Three Ply</option>
                                </select>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="text-sm font-semibold text-gray-500 w-20">Weight:</span>
                                <div class="flex-1 flex relative">
                                    <input type="number" step="0.1" id="input-weight" oninput="updateCurrentPage('weight', this.value)" placeholder="e.g. 4.5" class="w-full border border-gray-300 rounded-l p-1.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <span class="bg-gray-200 border border-l-0 border-gray-300 rounded-r px-3 py-1.5 text-sm text-gray-600 font-medium">KG</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="p-4 bg-indigo-50 border border-indigo-100 rounded-lg">
                        <label class="block text-xs font-bold text-indigo-800 uppercase tracking-wide mb-3"><i class="fas fa-palette"></i> Page Theme Colors</label>
                        
                        <!-- Saved Themes Manager -->
                        <div class="mb-4 flex gap-2">
                            <select id="theme-select" class="flex-1 border border-gray-300 rounded p-1.5 text-sm outline-none bg-white">
                                <option value="">Select a saved theme...</option>
                            </select>
                            <button onclick="applyTheme()" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm font-semibold hover:bg-indigo-700 transition">Apply</button>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 uppercase">Background</label>
                                <input type="color" id="input-bgColor" oninput="updateCurrentPage('bgColor', this.value)" class="w-full h-8 cursor-pointer border border-gray-300 rounded p-0.5 bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 uppercase">Accent (Titles)</label>
                                <input type="color" id="input-accentColor" oninput="updateCurrentPage('accentColor', this.value)" class="w-full h-8 cursor-pointer border border-gray-300 rounded p-0.5 bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 uppercase">Main Text</label>
                                <input type="color" id="input-textColor" oninput="updateCurrentPage('textColor', this.value)" class="w-full h-8 cursor-pointer border border-gray-300 rounded p-0.5 bg-white">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-gray-500 uppercase">Box Background</label>
                                <input type="color" id="input-boxBgColor" oninput="updateCurrentPage('boxBgColor', this.value)" class="w-full h-8 cursor-pointer border border-gray-300 rounded p-0.5 bg-white">
                            </div>
                            <div class="col-span-2">
                                <label class="block text-[10px] font-bold text-gray-500 uppercase">Box Text</label>
                                <input type="color" id="input-boxTextColor" oninput="updateCurrentPage('boxTextColor', this.value)" class="w-full h-8 cursor-pointer border border-gray-300 rounded p-0.5 bg-white">
                            </div>
                        </div>

                        <div class="flex gap-2">
                            <input type="text" id="new-theme-name" placeholder="Theme name..." class="flex-1 border border-gray-300 rounded p-1.5 text-sm outline-none">
                            <button onclick="saveTheme()" class="bg-white text-indigo-700 border border-indigo-300 px-3 py-1.5 rounded text-sm font-semibold hover:bg-indigo-50 transition">Save Theme</button>
                        </div>
                    </div>
                </div>

                <!-- COVER PAGE EDITOR (NEW) -->
                <div id="cover-editor" class="hidden flex-col gap-5">
                    
                    <div class="p-3 bg-blue-50 border border-blue-200 rounded-lg">
                        <p class="text-sm text-blue-800"><i class="fas fa-info-circle"></i> This is your <b>Cover Page</b>. It will always be printed first.</p>
                    </div>

                    <!-- Texts & Colors Section -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Company/Logo Text</label>
                            <input type="text" id="input-cover-logoText" oninput="updateCurrentPage('logoText', this.value)" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <!-- LOGO IMAGE UPLOAD & POSITIONING -->
                        <div class="p-3 border border-gray-200 rounded bg-white shadow-sm">
                            <label class="block text-xs font-bold text-indigo-800 uppercase tracking-wide mb-2"><i class="fas fa-image"></i> Company Logo</label>
                            
                            <div class="flex items-center gap-2 mb-3 border-b border-gray-100 pb-3">
                                <button onclick="document.getElementById('logo-upload').click()" class="bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-1.5 rounded text-sm font-semibold hover:bg-indigo-100 transition shadow-sm flex items-center gap-2">
                                    <i class="fas fa-upload"></i> Upload Logo
                                </button>
                                <button onclick="updateCurrentPage('logoImage', '')" class="text-red-500 hover:text-red-700 text-xs font-medium px-2"><i class="fas fa-times"></i> Remove</button>
                                <input id="logo-upload" type="file" class="sr-only" accept="image/png, image/jpeg" onchange="handleLogoUpload(event)">
                            </div>
                            
                            <div class="space-y-3 mt-2">
                                <div>
                                    <div class="flex justify-between mb-1"><label class="text-[10px] font-bold text-gray-500 uppercase">Logo Size (px)</label><span id="val-logo-size" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1 rounded">80</span></div>
                                    <input type="range" id="input-cover-logoWidth" min="20" max="350" value="80" oninput="document.getElementById('val-logo-size').innerText=this.value; updateCurrentPage('logoWidth', this.value)" class="w-full accent-indigo-600">
                                </div>
                                <div>
                                    <div class="flex justify-between mb-1"><label class="text-[10px] font-bold text-gray-500 uppercase">Move Left/Right (X)</label><span id="val-logo-x" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1 rounded">0</span></div>
                                    <input type="range" id="input-cover-logoOffsetX" min="-300" max="500" value="0" oninput="document.getElementById('val-logo-x').innerText=this.value; updateCurrentPage('logoOffsetX', this.value)" class="w-full accent-indigo-600">
                                </div>
                                <div>
                                    <div class="flex justify-between mb-1"><label class="text-[10px] font-bold text-gray-500 uppercase">Move Up/Down (Y)</label><span id="val-logo-y" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-1 rounded">0</span></div>
                                    <input type="range" id="input-cover-logoOffsetY" min="-300" max="300" value="0" oninput="document.getElementById('val-logo-y').innerText=this.value; updateCurrentPage('logoOffsetY', this.value)" class="w-full accent-indigo-600">
                                </div>
                            </div>
                        </div>

                        <div class="p-3 border border-gray-200 rounded bg-gray-50">
                            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2">Main Title</label>
                            <textarea id="input-cover-mainTitle" oninput="updateCurrentPage('mainTitle', this.value)" rows="2" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                            <div class="flex gap-2 mt-2">
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Color</label>
                                    <input type="color" id="input-cover-mainTitleColor" oninput="updateCurrentPage('mainTitleColor', this.value)" class="w-full h-8 cursor-pointer rounded">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Size (px)</label>
                                    <input type="number" id="input-cover-mainTitleSize" oninput="updateCurrentPage('mainTitleSize', this.value)" class="w-full border border-gray-300 rounded p-1 text-sm">
                                </div>
                            </div>
                        </div>

                        <div class="p-3 border border-gray-200 rounded bg-gray-50">
                            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2">Sub Title</label>
                            <textarea id="input-cover-subTitle" oninput="updateCurrentPage('subTitle', this.value)" rows="2" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                            <div class="flex gap-2 mt-2">
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Color</label>
                                    <input type="color" id="input-cover-subTitleColor" oninput="updateCurrentPage('subTitleColor', this.value)" class="w-full h-8 cursor-pointer rounded">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Size (px)</label>
                                    <input type="number" id="input-cover-subTitleSize" oninput="updateCurrentPage('subTitleSize', this.value)" class="w-full border border-gray-300 rounded p-1 text-sm">
                                </div>
                            </div>
                        </div>

                        <div class="p-3 border border-gray-200 rounded bg-gray-50">
                            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2">Highlight Box (Years)</label>
                            <textarea id="input-cover-boxText" oninput="updateCurrentPage('boxText', this.value)" rows="2" class="w-full border border-gray-300 rounded p-2 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                            <div class="flex gap-2 mt-2">
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Box Color</label>
                                    <input type="color" id="input-cover-boxColor" oninput="updateCurrentPage('boxColor', this.value)" class="w-full h-8 cursor-pointer rounded">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Text Color</label>
                                    <input type="color" id="input-cover-boxTextColor" oninput="updateCurrentPage('boxTextColor', this.value)" class="w-full h-8 cursor-pointer rounded">
                                </div>
                                <div class="flex-1">
                                    <label class="block text-[10px] text-gray-500 uppercase">Size (px)</label>
                                    <input type="number" id="input-cover-boxTextSize" oninput="updateCurrentPage('boxTextSize', this.value)" class="w-full border border-gray-300 rounded p-1 text-sm">
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-3 border border-gray-200 rounded bg-white shadow-sm">
                            <label class="block text-xs font-bold text-gray-800 uppercase tracking-wide mb-2"><i class="fas fa-search-plus"></i> Cover Main Image Size</label>

    <script>
        // Default Placeholder Image
        const DEFAULT_IMAGE = "https://placehold.co/1200x800/e2e8f0/475569?text=Upload+Blanket+Image";

        let globalSettings = {
            headingFont: "'Montserrat', sans-serif",
            bodyFont: "'Inter', sans-serif"
        };

        // ── Small helpers used by the page templates ──────────────────────
        // Typed text goes into HTML strings, so it is escaped: a "<" or "&" in a
        // description used to break the page (or inject markup).
        function esc(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        // A colour from a colour box, or the default when it is missing / not a hex colour.
        function col(v, def) { return /^#[0-9a-f]{6}$/i.test(String(v || '')) ? v : def; }
        function num(v, def) { const n = parseFloat(v); return isFinite(n) ? n : def; }
        // "#rrggbb" + alpha → rgba(). The templates used "#rrggbb40" (8-digit hex),
        // which html2canvas does not read reliably, so borders went missing in the PDF.
        function hexA(hex, a) {
            const h = col(hex, '#000000').slice(1);
            return 'rgba(' + parseInt(h.slice(0, 2), 16) + ',' + parseInt(h.slice(2, 4), 16) + ',' + parseInt(h.slice(4, 6), 16) + ',' + a + ')';
        }
        // A picture as a background (see .cm-photo): url() quoted, quotes escaped.
        function bgImg(src) { return "background-image:url('" + String(src || DEFAULT_IMAGE).replace(/'/g, '%27') + "');"; }

        /* ── Cover page background waves ("linings") ─────────────────────────
           They used to be an inline <svg> sized only by CSS classes
           (h-full / w-[80%] / right-[-10%], preserveAspectRatio="none").
           html2canvas draws such an SVG at its default size or not at all, so
           the waves were missing from the exported PDF.
           Now the SVG is built with its own pixel size and shown as an <img>:
             - preview: the SVG itself as a data URI (sharp at any zoom);
             - PDF: the same SVG first painted onto a canvas → PNG
               (wavesPng), so html2canvas only has to place a plain picture.
           Box: left 30%, width 80% of the page (the old right:-10%), full
           height; the page's overflow:hidden clips the part outside. */
        const WAVE_W = 1270, WAVE_H = 2245;   // 80% × 100% of A4 at 2× (html2canvas scale)
        function wavesSvg(page) {
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + WAVE_W + '" height="' + WAVE_H + '" viewBox="0 0 500 1000" preserveAspectRatio="none">'
                + '<path d="M500,0 L200,0 C350,300 -50,600 250,1000 L500,1000 Z" fill="' + col(page.waveColor1, '#e5e7eb') + '"/>'
                + '<path d="M500,0 L350,0 C450,400 150,700 350,1000 L500,1000 Z" fill="' + col(page.waveColor2, '#9ca3af') + '"/>'
                + '<path d="M500,200 C300,500 400,800 500,1000 Z" fill="' + col(page.waveColor3, '#4b5563') + '"/>'
                + '</svg>';
        }
        function wavesDataUri(page) { return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(wavesSvg(page)); }
        function wavesPng(page) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = WAVE_W; c.height = WAVE_H;
                    c.getContext('2d').drawImage(img, 0, 0, WAVE_W, WAVE_H);
                    resolve(c.toDataURL('image/png'));
                };
                img.onerror = () => reject(new Error('Cover waves could not be drawn'));
                img.src = wavesDataUri(page);
            });
        }

        // Custom Modal Function to replace alert() and confirm()
        function showModal(msg, type = 'alert', onConfirm = null) {
            const modal = document.getElementById('custom-modal');
            const text = document.getElementById('custom-modal-text');
            const buttons = document.getElementById('custom-modal-buttons');
            
            text.innerText = msg;
            buttons.innerHTML = '';
            document.getElementById('custom-modal-input').classList.add('hidden');

            if (type === 'alert') {
                const btn = document.createElement('button');
                btn.className = 'px-6 py-2 bg-indigo-600 text-white rounded shadow-sm hover:bg-indigo-700 transition';
                btn.innerText = 'OK';
                btn.onclick = () => modal.classList.add('hidden');
                buttons.appendChild(btn);
            } else if (type === 'confirm') {
                const cancelBtn = document.createElement('button');
                cancelBtn.className = 'px-4 py-2 bg-gray-200 text-gray-800 rounded shadow-sm hover:bg-gray-300 transition';
                cancelBtn.innerText = 'Cancel';
                cancelBtn.onclick = () => modal.classList.add('hidden');
                
                const confirmBtn = document.createElement('button');
                confirmBtn.className = 'px-4 py-2 bg-red-600 text-white rounded shadow-sm hover:bg-red-700 transition';
                confirmBtn.innerText = 'Delete';
                confirmBtn.onclick = () => {
                    modal.classList.add('hidden');
                    if(onConfirm) onConfirm();
                };
                
                buttons.appendChild(cancelBtn);
                buttons.appendChild(confirmBtn);
            }
            
            modal.classList.remove('hidden');
        }

        /* ── Dialog with buttons and an optional text box ──────────────────
           cmDialog({msg, input, value, buttons:[{label, value, cls}]}) → Promise
           of the chosen button's value (null = Cancel / Esc). With `input`,
           the OK value is the typed text. Same box as showModal. */
        function cmDialog(o) {
            return new Promise(resolve => {
                const modal = document.getElementById('custom-modal');
                const inp = document.getElementById('custom-modal-input');
                const buttons = document.getElementById('custom-modal-buttons');
                document.getElementById('custom-modal-text').innerText = o.msg || '';
                inp.classList.toggle('hidden', !o.input);
                inp.value = o.value || '';
                buttons.innerHTML = '';
                const done = v => { modal.classList.add('hidden'); inp.onkeydown = null; resolve(v); };
                const list = o.buttons || [{ label: 'Cancel', value: null }, { label: 'OK', value: true, primary: true }];
                list.forEach(b => {
                    const btn = document.createElement('button');
                    btn.className = 'px-4 py-2 rounded shadow-sm transition ' + (b.cls ||
                        (b.primary ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-gray-200 text-gray-800 hover:bg-gray-300'));
                    btn.innerText = b.label;
                    btn.onclick = () => done(o.input && b.value === true ? inp.value.trim() : b.value);
                    buttons.appendChild(btn);
                });
                if (o.input) {
                    inp.onkeydown = e => {
                        if (e.key === 'Enter') { e.preventDefault(); done(inp.value.trim()); }
                        if (e.key === 'Escape') done(null);
                    };
                }
                modal.classList.remove('hidden');
                if (o.input) setTimeout(() => { inp.focus(); inp.select(); }, 30);
            });
        }

        /* ══ SERVER TEMPLATES (Supabase) ═════════════════════════════════
           Save / edit workflow:
             - Templates   → the list on the server; Open loads one for editing.
             - New         → a fresh catalog from the sample pages, not saved yet.
             - Save to Server → first save asks a name and creates the template;
               after that it UPDATES the open template.
             - Save as New → asks a new name; the open template stays as it was.
           Every update carries the version it was opened at. If someone else
           saved in between, the server answers CONFLICT and the user picks:
           open their version, or save this one as a new template. Nobody's
           work is overwritten silently.
           While typing, the work is also kept in this browser (localforage
           'touchwood_catalog' + 'touchwood_catalog_meta'), so a refresh comes
           back to the same template with its unsaved changes.
           Server side: sql/CATALOG_TEMPLATES_MIGRATION.sql (cat_* RPCs, right
           HOME_CATALOG_MAKER checked on every call). */
        const SUPABASE_URL  = "https://jdlzgjgxxjkjejkhvdij.supabase.co";
        const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkbHpnamd4eGpramVqa2h2ZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODUwMDcsImV4cCI6MjEwNTY2MTAwN30.ow4i6e78i-dGoJJh2-N4FX6EQE7f2FRQDgCMJHpxAWk";
        const SESSION_ERR = { NO_TOKEN: 1, NO_SESSION: 1, SESSION_REVOKED: 1, SESSION_EXPIRED: 1, USER_INACTIVE: 1 };
        const CAT_ERR_TEXT = {
            NOT_ALLOWED: 'Catalog Templates is not switched on for your login. Ask the Admin (Tab Visibility / Users › Apps: Catalog Templates).',
            NAME_REQUIRED: 'Please give the template a name.',
            NAME_TAKEN: 'A template with this name already exists. Please choose another name.',
            NO_PAGES: 'The catalog has no pages to save.',
            NOT_FOUND: 'This template is no longer on the server (it may have been deleted).'
        };

        // The open server template. id null = not saved on the server yet.
        let cloud = { id: null, name: '', version: null, updatedBy: '', updatedAt: '' };
        let dirty = false;          // changed since the last server save / open
        let tplRows = [];           // the Templates list
        let cloudBusy = false;

        async function rpc(fn, args) {
            let r;
            try {
                r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON },
                    body: JSON.stringify(Object.assign({ p_token: (window.SARV_GATE && SARV_GATE.token) || '' }, args || {}))
                });
            } catch (e) { throw new Error('Could not reach the server. Please check the internet connection.'); }
            const d = await r.json().catch(() => null);
            if (!r.ok) {
                const code = d && d.code;
                if (code === 'PGRST202' || code === '42883' || code === '42P01') {
                    throw new Error('Catalog Templates are not set up on the server yet. Admin: run sql/CATALOG_TEMPLATES_MIGRATION.sql in the Supabase SQL Editor.');
                }
                if (r.status === 413) throw new Error('This catalog is too large to save in one go. Use fewer or smaller pictures.');
                throw new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
            }
            if (d && d.success === false) {
                const err = String(d.error || '');
                if (SESSION_ERR[err]) { location.replace('launcher.html?why=' + err); return new Promise(() => {}); }
                const e = new Error(CAT_ERR_TEXT[err] || err || 'The server refused the request.');
                e.code = err; e.data = d; throw e;
            }
            return d;
        }

        function fmtWhen(ts) {
            if (!ts) return '';
            const d = new Date(ts); if (isNaN(d)) return '';
            const p = n => String(n).padStart(2, '0');
            return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        function paintCloudBar() {
            const el = document.getElementById('cloud-bar'); if (!el) return;
            let txt, cls;
            if (!cloud.id) {
                txt = (cloud.name ? cloud.name + ' · ' : 'New template · ') + 'not saved on the server';
                cls = 'bg-amber-50 border-amber-300 text-amber-800';
            } else if (dirty) {
                txt = cloud.name + ' · unsaved changes';
                cls = 'bg-amber-50 border-amber-300 text-amber-800';
            } else {
                txt = cloud.name + ' · saved' + (cloud.updatedBy ? ' by ' + cloud.updatedBy : '') + (cloud.updatedAt ? ', ' + fmtWhen(cloud.updatedAt) : '');
                cls = 'bg-green-50 border-green-300 text-green-800';
            }
            el.className = 'text-xs font-semibold px-2.5 py-1 rounded-full border truncate max-w-[420px] ' + cls;
            el.textContent = txt;
            el.title = txt + (cloud.version ? ' (version ' + cloud.version + ')' : '');
        }
        function markDirty() {
            if (!dirty) { dirty = true; paintCloudBar(); }
        }
        // The browser draft remembers which server template it belongs to.
        function persistMeta() {
            try { localforage.setItem('touchwood_catalog_meta', { cloud, dirty }); } catch (e) {}
        }

        async function askTemplateName(def, why) {
            const name = await cmDialog({ msg: why || 'Template name', input: true, value: def,
                buttons: [{ label: 'Cancel', value: null }, { label: 'Save', value: true, primary: true }] });
            return name ? name.replace(/\s+/g, ' ').trim() : null;
        }

        async function cloudSave(asNew) {
            if (cloudBusy) return;
            let id = asNew ? null : cloud.id;
            let name = cloud.name;
            if (!id) {
                name = await askTemplateName(asNew && cloud.name ? cloud.name + ' COPY' : (cloud.name || ''),
                    asNew ? 'Save as a NEW template. Name:' : 'Save this catalog on the server. Template name:');
                if (!name) return;
            }
            const btn = document.getElementById('cloud-save-btn');
            const orig = btn.innerHTML;
            cloudBusy = true;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';
            try {
                for (;;) {
                    try {
                        const d = await rpc('cat_save', { p_tpl: { id, name, pages: catalogData, settings: globalSettings, version: id ? cloud.version : null } });
                        cloud = { id: d.id, name: d.name, version: d.version, updatedBy: d.updated_by || '', updatedAt: d.updated_at || '' };
                        dirty = false;
                        paintCloudBar();
                        await saveDataLocally(true);
                        btn.innerHTML = '<i class="fas fa-check"></i> Saved to Server';
                        setTimeout(() => { btn.innerHTML = orig; }, 1800);
                        return;
                    } catch (e) {
                        if (e.code === 'NAME_TAKEN' || e.code === 'NAME_REQUIRED') {
                            name = await askTemplateName(name, CAT_ERR_TEXT[e.code] + '\nTemplate name:');
                            if (!name) { btn.innerHTML = orig; return; }
                            continue;
                        }
                        if (e.code === 'CONFLICT') {
                            const x = e.data || {};
                            const pick = await cmDialog({
                                msg: '"' + cloud.name + '" was saved on the server by ' + (x.updated_by || 'someone else')
                                    + (x.updated_at ? ' at ' + fmtWhen(x.updated_at) : '') + ' after you opened it.\n\nWhat do you want to do?',
                                buttons: [{ label: 'Cancel', value: null }, { label: 'Open their version', value: 'open' },
                                          { label: 'Save mine as new', value: 'new', primary: true }]
                            });
                            btn.innerHTML = orig;
                            if (pick === 'open') { dirty = false; await openTemplate(cloud.id); }
                            if (pick === 'new') { cloudBusy = false; btn.disabled = false; await cloudSave(true); }
                            return;
                        }
                        if (e.code === 'NOT_FOUND' && id) {
                            // Deleted on the server meanwhile: keep the work, save it as a fresh template.
                            cloud.id = null; cloud.version = null; paintCloudBar();
                            btn.innerHTML = orig;
                            showModal(CAT_ERR_TEXT.NOT_FOUND + ' Press Save to Server again to save it as a new template.');
                            return;
                        }
                        throw e;
                    }
                }
            } catch (e) {
                btn.innerHTML = orig;
                showModal('Could not save on the server: ' + e.message);
            } finally {
                cloudBusy = false;
                btn.disabled = false;
            }
        }

        function openTemplateLibrary() {
            document.getElementById('tpl-modal').classList.remove('hidden');
            loadTemplateList();
            setTimeout(() => document.getElementById('tpl-search').focus(), 30);
        }
        function closeTemplateLibrary() { document.getElementById('tpl-modal').classList.add('hidden'); }

        async function loadTemplateList() {
            const host = document.getElementById('tpl-list');
            host.innerHTML = '<div class="text-gray-500 py-6 text-center">Loading templates...</div>';
            try {
                const d = await rpc('cat_list', {});
                tplRows = d.rows || [];
                renderTemplateList();
            } catch (e) {
                host.innerHTML = '<div class="text-red-600 py-6 text-center">' + esc(e.message) + '</div>';
            }
        }
        function renderTemplateList() {
            const host = document.getElementById('tpl-list');
            const words = String(document.getElementById('tpl-search').value || '').toUpperCase().split(/\s+/).filter(Boolean);
            const rows = tplRows.filter(t => {
                const hay = [t.name, t.updated_by, t.created_by].join(' ').toUpperCase();
                return words.every(w => hay.indexOf(w) >= 0);
            });
            if (!tplRows.length) { host.innerHTML = '<div class="text-gray-500 py-6 text-center">No templates on the server yet. Make a catalog and press <b>Save to Server</b>.</div>'; return; }
            if (!rows.length) { host.innerHTML = '<div class="text-gray-500 py-6 text-center">No template matches the search.</div>'; return; }
            host.innerHTML = '<table class="w-full border-collapse">'
                + '<thead><tr class="text-left text-[11px] uppercase tracking-wide text-gray-500 border-b">'
                + '<th class="py-2 pr-2">Template</th><th class="py-2 pr-2 w-16 text-center">Pages</th><th class="py-2 pr-2">Last saved</th><th class="py-2 w-40 text-right"></th></tr></thead><tbody>'
                + rows.map(t => {
                    const isOpen = cloud.id && Number(cloud.id) === Number(t.id);
                    return '<tr class="border-b border-gray-100 ' + (isOpen ? 'bg-indigo-50' : 'hover:bg-gray-50') + '">'
                        + '<td class="py-2 pr-2 font-semibold text-gray-800">' + esc(t.name) + (isOpen ? ' <span class="text-[10px] font-bold text-indigo-600">(OPEN)</span>' : '') + '</td>'
                        + '<td class="py-2 pr-2 text-center text-gray-600">' + (Number(t.page_count) || 0) + '</td>'

            return v === true;

        async function openTemplate(id) {
            if (Number(cloud.id) !== Number(id) || dirty) {
                if (!(await okToDiscard('Open this template'))) return;
            }
            try {
                const d = await rpc('cat_get', { p_id: id });
                const t = d.template || {};
                const pages = Array.isArray(t.pages) ? t.pages : [];
                if (!pages.length) throw new Error('This template has no pages.');
                if (!pages.find(p => p.pageType === 'cover')) pages.unshift(JSON.parse(JSON.stringify(defaultPages[0])));
                catalogData = pages;
                if (t.settings && typeof t.settings === 'object') {
                    globalSettings = Object.assign({}, globalSettings, t.settings);
                    localStorage.setItem('touchwood_settings', JSON.stringify(globalSettings));
                    document.getElementById('setting-heading-font').value = globalSettings.headingFont;
                    document.getElementById('setting-body-font').value = globalSettings.bodyFont;
                }
                cloud = { id: t.id, name: t.name, version: t.version, updatedBy: t.updated_by || '', updatedAt: t.updated_at || '' };
                dirty = false;
                currentPageId = catalogData[0].id;
                renderSidebar();
                loadPageIntoEditor(currentPageId);
                paintCloudBar();
                await saveDataLocally(true);
                closeTemplateLibrary();
            } catch (e) {
                showModal('Could not open the template: ' + e.message);
            }
        }

            try {

            } finally {

            // Use the New Big Database (localforage)
            try {
                let savedData = await localforage.getItem('touchwood_catalog');
                
                // Smart Migration: If data is in the old 5MB storage, move it to the new big storage
                if (!savedData) {
                    const oldData = localStorage.getItem('touchwood_catalog');
                    if (oldData) {
                        savedData = JSON.parse(oldData);
                        localStorage.removeItem('touchwood_catalog'); // Free up the old limit space
                    }
                }

                // An empty / broken save would leave catalogData[0] undefined below
                if (Array.isArray(savedData) && savedData.length) {
                    catalogData = savedData;
                    // Ensure older saves have a cover page
                    if (!catalogData.find(p => p.pageType === 'cover')) {
                        catalogData.unshift(defaultPages[0]);

                }
            } catch (e) {

            }

            // Load Saved Themes
