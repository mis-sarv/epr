        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 300; // Reduced logo max size
                    const MAX_HEIGHT = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/png'); // PNG keeps the logo's transparency
                    updateCurrentPage('logoImage', dataUrl);
                    saveDataLocally();
                };
                img.onerror = () => showModal("This file could not be read as an image.");
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
            // Reset, so choosing the same file again still fires onchange
            event.target.value = '';
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            event.target.value = '';   // same file again must still fire onchange
            if (file) processImageFile(file);
        }
        // "or drag and drop" was promised on the box but never handled
        function handleImageDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('border-indigo-500', 'bg-indigo-50');
            const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
            if (file) processImageFile(file);
        }
        function processImageFile(file) {
            if (!/^image\//.test(file.type)) { showModal("Please choose an image file (PNG or JPG)."); return; }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    
                    // Further optimized dimensions to drastically reduce storage footprint
                    const MAX_WIDTH = 1000;
                    const MAX_HEIGHT = 1000;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    
                    // Fill background white to prevent black backgrounds if uploading transparent PNGs
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(0, 0, width, height);
                    
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // Use JPEG with 0.6 compression ratio. This prevents storage limits while looking good on PDF.
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    updateCurrentPage('image', dataUrl);
                    saveDataLocally();
                };
                img.onerror = () => showModal("This file could not be read as an image.");
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // silent = the quiet auto-save after typing: no "Saved!" flash on the button
        async function saveDataLocally(silent) {
            clearTimeout(autoSaveTimer);
            try {
                // Save to the Big Database instead of the limited localStorage
                await localforage.setItem('touchwood_catalog', catalogData);
                persistMeta();
                if (silent === true) return;
                const btn = document.getElementById('save-btn');
                if (!btn) return;   // the old "Save Changes" button is now Save to Server
                btn.innerHTML = '<i class="fas fa-check"></i> Saved!';
                btn.classList.replace('text-gray-700', 'text-green-600');
                setTimeout(() => {
                    btn.innerHTML = '<i class="fas fa-save"></i> Save Changes';
                    btn.classList.replace('text-green-600', 'text-gray-700');
                }, 2000);
            } catch (e) {
                showModal("A storage error occurred, but you can still generate your PDF right now.");
                console.error("Failed to save to localforage:", e);
            }
        }

        /* Page templates. Rules that keep the PDF identical to the preview:
             - text is escaped (esc) and written RIGHT AFTER its tag: with
               whitespace-pre-line, the template's own line break + indent
               before ${...} printed as an extra blank line above titles;
             - pictures are .cm-photo backgrounds (html2canvas has no object-fit);
             - see-through colours are rgba() (hexA), not 8-digit hex;
             - the cover's waves are an <img> (wavesSvg), never inline SVG.
           opts.wavesSrc: the PNG made for the PDF export (generatePDF). */
        /* The product page's picture area. One picture (the editor's normal
           case) fills it. `page.images` (several pictures) is filled only by
           Design Master › Online Catalogue (render mode, below): a design's
           photoshoot photos as a grid, 1 → full, 2 → side by side, 3–4 → 2×2,
           5–6 → 3×2, labelled with the shade name when given. */
        function photoAreaHTML(page, boxBg) {
            const imgs = Array.isArray(page.images) && page.images.length ? page.images : null;
            if (!imgs || imgs.length === 1) {
                const src = imgs ? imgs[0].src : page.image;
                return `<div class="cm-photo w-full h-full shadow-lg border-8 box-border" role="img" aria-label="Blanket" style="${bgImg(src)} border-color: ${boxBg}; background-color: ${boxBg};"></div>`;
            }
            const n = imgs.length, cols = n === 2 ? 2 : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
            return `<div class="w-full h-full box-border border-8 shadow-lg" style="border-color: ${boxBg}; background-color: ${boxBg}; display: grid; gap: 3mm; grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, 1fr);">`
                + imgs.map(im => `<div class="cm-photo relative" style="${bgImg(im.src)}">${im.label
                    ? `<span style="position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);color:#1f2937;font-size:11px;font-weight:700;text-align:center;padding:3px 4px;letter-spacing:.04em;">${esc(im.label)}</span>` : ''}</div>`).join('')
                + `</div>`;
        }
        // The spec box rows: the editor's Size / Ply / Weight, or `page.specs`
        // ([[label, value], ...]) when Online Catalogue gives a design's own.
        function specRows(page) {
            if (Array.isArray(page.specs) && page.specs.length) return page.specs.filter(r => r && r[1] != null && String(r[1]).trim() !== '');
            return [['Size', page.size || '-'], ['Ply', page.ply || '-'], ['Weight', page.weight ? page.weight + ' KG' : '-']];
        }

        function generatePageHTML(page, opts) {
            if (page.pageType === 'cover') {
                return generateCoverHTML(page, opts);
            }

            const bgC = col(page.bgColor, '#fbfbfb');
            const accC = col(page.accentColor, '#111827');
            const txtC = col(page.textColor, '#4b5563');
            const boxBg = col(page.boxBgColor, '#ffffff');
            const boxTxt = col(page.boxTextColor, '#1f2937');
            const hFont = esc(globalSettings.headingFont), bFont = esc(globalSettings.bodyFont);

            return `
            <div class="a4-page flex flex-col pt-[15mm] pb-[15mm] px-[20mm] box-border relative z-0" style="background-color: ${bgC}; font-family: ${bFont};">
                <div class="text-center absolute top-[15mm] left-[20mm] right-[20mm] flex justify-between items-start z-10">
                    <div class="text-left">
                        <h3 class="text-3xl tracking-widest uppercase font-bold" style="letter-spacing: 0.2em; color: ${accC}; font-family: ${hFont};">${esc(page.brandText !== undefined ? page.brandText : 'TOUCHWOOD')}</h3>
                        <p class="text-sm tracking-[0.3em] mt-1 uppercase" style="color: ${txtC}; opacity: 0.8; font-family: ${hFont};">PREMIUM CATALOG</p>
                    </div>
                </div>

                <div class="mt-[25mm] h-[150mm] w-full relative z-0">
                    ${photoAreaHTML(page, boxBg)}
                </div>

                <div class="mt-[15mm] flex justify-between items-end flex-grow">
                    <div class="w-[55%]">
                        <div class="mb-6 relative">
                            <div class="absolute -top-12 -left-6 text-9xl font-bold opacity-10 z-[-1] select-none" style="color: ${accC}; font-family: ${hFont};">${esc(page.pageNum || '00')}</div>
                            <h1 class="text-[45px] leading-none uppercase tracking-wide break-words font-bold" style="color: ${accC}; font-family: ${hFont};">${esc(page.title1 || '')}</h1>
                            <h2 class="text-[35px] leading-tight uppercase tracking-widest break-words" style="color: ${txtC}; font-family: ${hFont};">${esc(page.title2 || '')}</h2>
                        </div>
                        <p class="text-[15px] leading-relaxed pr-10 border-l-4 pl-4 py-1 whitespace-pre-line text-justify" style="color: ${txtC}; border-left-color: ${hexA(accC, 0.25)};">${esc(page.description || 'Add description...')}</p>
                    </div>

                    <div class="w-[35%] p-6 shadow-sm border rounded-sm" style="background-color: ${boxBg}; border-color: ${hexA(boxTxt, 0.13)};">
                        <h3 class="text-sm font-bold tracking-widest mb-4 uppercase border-b pb-2" style="color: ${boxTxt}; border-bottom-color: ${hexA(boxTxt, 0.25)}; font-family: ${hFont};">Blanket Specifications</h3>
                        <ul class="space-y-${Array.isArray(page.specs) && page.specs.length > 3 ? '2' : '4'}">
                            ${specRows(page).map(r => `
                            <li class="flex justify-between items-center gap-3 text-[15px]" style="color: ${boxTxt};">
                                <span class="font-semibold opacity-70 whitespace-nowrap">${esc(r[0])}</span>
                                <span class="font-bold text-right">${esc(r[1])}</span>
                            </li>`).join('')}
                        </ul>
                    </div>
                </div>

                <div class="mt-auto border-t-2 pt-5 flex justify-between items-center uppercase" style="border-top-color: ${hexA(accC, 0.13)}; color: ${txtC};">
                    <span class="text-[13px] tracking-[0.2em] font-semibold" style="font-family: ${hFont};">${esc(page.footerText !== undefined ? page.footerText : 'SUPER CLOUDY COLLECTION')}</span>
                    <span class="text-[13px] tracking-widest font-bold px-3 py-1 rounded-sm" style="background-color: ${accC}; color: ${bgC}; font-family: ${hFont};">PAGE ${esc(page.pageNum || '00')}</span>
                </div>
            </div>
            `;
        }

        function generateCoverHTML(page, opts) {
            const o = opts || {};
            const hFont = esc(globalSettings.headingFont), bFont = esc(globalSettings.bodyFont);
            const contactC = col(page.contactColor, '#4b5563');
            const imgSize = num(page.coverImageSize, 240);
            const wavesSrc = o.wavesSrc || wavesDataUri(page);
            return `
            <div class="a4-page relative z-0 bg-white overflow-hidden text-left block" style="font-family: ${bFont};">
                <!-- Decorative right-side waves: a picture of its own pixel size (see wavesSvg) -->
                <img src="${wavesSrc}" alt="" class="absolute top-0 z-0 pointer-events-none select-none" style="left: 30%; width: 80%; height: 100%; max-width: none; display: block;">

                <div class="relative z-10 w-full h-full">

                    <!-- Top Logo / Company Name -->
                    <div class="absolute top-[20mm] left-[20mm] right-[20mm] flex items-center gap-3 tracking-wide font-bold z-20" style="color: ${contactC}; font-family: ${hFont}; font-size: 24px;">
                        <span>${esc(page.logoText || '')}</span>
                        ${page.logoImage
                            ? `<img src="${page.logoImage}" style="width: ${num(page.logoWidth, 80)}px; max-width: none; height: auto; transform: translate(${num(page.logoOffsetX, 0)}px, ${num(page.logoOffsetY, 0)}px);" alt="Logo">`
                            : ''
                        }
                    </div>

                    <!-- Main Title Area -->
                    <div class="absolute top-[55mm] left-[20mm] right-[20mm]">
                        <h1 class="uppercase whitespace-pre-line tracking-tight font-bold" style="color: ${col(page.mainTitleColor, '#374151')}; font-size: ${num(page.mainTitleSize, 65)}px; line-height: 1.05; font-family: ${hFont};">${esc(page.mainTitle || '')}</h1>
                        <p class="mt-6 whitespace-pre-line leading-relaxed" style="color: ${col(page.subTitleColor, '#4b5563')}; font-size: ${num(page.subTitleSize, 16)}px; max-width: 80%;">${esc(page.subTitle || '')}</p>
                    </div>

                    <!-- Highlight Box & Circular Image -->
                    <div class="absolute top-[140mm] left-[0] flex items-center w-[120%]">
                        <!-- Left Highlight Box -->
                        <div class="p-10 pl-[20mm] py-12 rounded-r-3xl w-[55%]" style="background-color: ${col(page.boxColor, '#374151')};">
                            <h2 class="whitespace-pre-line leading-tight font-bold" style="color: ${col(page.boxTextColor, '#ffffff')}; font-size: ${num(page.boxTextSize, 55)}px; font-family: ${hFont};">${esc(page.boxText || '')}</h2>
                        </div>

                        <!-- Circular Image -->
                        <div class="absolute right-[5%] z-20 rounded-full border-[12px] border-white shadow-2xl overflow-hidden bg-gray-200 box-border" style="width: ${imgSize}px; height: ${imgSize}px; top: 50%; transform: translateY(-50%);">
                            <div class="cm-photo w-full h-full rounded-full" role="img" aria-label="Cover Image" style="${bgImg(page.image)}"></div>
                        </div>
                    </div>

                    <!-- Prepared By -->
                    <div class="absolute bottom-[65mm] left-[20mm] right-[20mm]">
                        <p class="font-medium tracking-wide uppercase mb-1" style="color: ${contactC}; font-size: ${num(page.preparedByLabelSize, 14)}px;">${esc(page.preparedByLabel !== undefined ? page.preparedByLabel : 'Prepared By:')}</p>
                        <p class="font-bold" style="color: ${col(page.preparedByColor, '#374151')}; font-family: ${hFont}; font-size: ${num(page.preparedByNameSize, 24)}px;">${esc(page.preparedBy || '')}</p>
                    </div>

                    <!-- Contact Details Footer -->
                    <div class="absolute bottom-[20mm] left-[20mm] right-[20mm] space-y-4 font-medium tracking-wide" style="color: ${contactC}; font-size: ${num(page.contactTextSize, 14)}px;">
                        ${page.phone ? `<div class="flex items-center gap-4"><i class="fas fa-phone rounded-full p-2.5 bg-gray-100 w-9 h-9 flex items-center justify-center"></i> <span>${esc(page.phone)}</span></div>` : ''}
                        ${page.website ? `<div class="flex items-center gap-4"><i class="fas fa-globe rounded-full p-2.5 bg-gray-100 w-9 h-9 flex items-center justify-center"></i> <span>${esc(page.website)}</span></div>` : ''}
                        ${page.email ? `<div class="flex items-center gap-4"><i class="fas fa-envelope rounded-full p-2.5 bg-gray-100 w-9 h-9 flex items-center justify-center"></i> <span>${esc(page.email)}</span></div>` : ''}
                    </div>

                </div>
            </div>
            `;
        }

        function renderLivePreview() {
            const page = catalogData.find(p => p.id === currentPageId);
            if (page) {
                document.getElementById('live-preview').innerHTML = generatePageHTML(page);
            }
        }

        // Every <img> inside `root` loaded (or failed), so nothing is captured half-drawn.
        function waitForImages(root) {
            return Promise.all([...root.querySelectorAll('img')].map(img =>
                img.complete && img.naturalWidth ? Promise.resolve()
                    : new Promise(res => { img.onload = img.onerror = () => res(); })));
        }

        /* PDF export, ONE PAGE AT A TIME.
           It used to hand the whole stack of pages to html2pdf in one go. That
           slices one tall picture into A4 pieces, and since 297mm is never a
           whole number of pixels the cut drifted a little on every page, and
           sometimes left a sliver or a blank page. Now each page is captured
           on its own canvas and placed full-bleed (0,0 → 210×297 mm) on its
           own PDF page, so every page lines up exactly.
           The cover's waves are turned into a PNG first (wavesPng), and the
           export waits for fonts and pictures before capturing.
           buildPdf(ordered pages, progress) → the jsPDF document; used by the
           editor's Export button AND by render mode (Design Master). */
        async function buildPdf(ordered, onProgress) {
            const exportContainer = document.getElementById('pdf-export-container');
            exportContainer.innerHTML = '';
            exportContainer.style.display = 'block';
            try {
                const pages = [];
                for (const page of ordered) {
                    const opts = {};
                    if (page.pageType === 'cover') {
                        try { opts.wavesSrc = await wavesPng(page); }
                        catch (e) { console.warn(e); }   // the SVG data URI is still drawn
                    }
                    const wrapper = document.createElement('div');
                    wrapper.innerHTML = generatePageHTML(page, opts).trim();
                    const el = wrapper.firstElementChild;
                    // inline: html2pdf captures a CLONE outside this container, where
                    // the #pdf-export-container rule no longer reaches
                    el.style.boxShadow = 'none';
                    exportContainer.appendChild(el);
                    pages.push(el);
                }

                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await waitForImages(exportContainer);

                const H2C = { scale: 2, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0, logging: false };
                const JSPDF = { unit: 'mm', format: 'a4', orientation: 'portrait' };

                /* The jsPDF document. jsPDF is inside the html2pdf bundle but not
                   exposed globally, so an empty A4 is made from a tiny blank
                   element; page 1 is then covered completely by the cover image.
                   (html2pdf's own toPdf is not used for the real pages: a 297mm
                   page is 2246px at scale 2, one more than its page slice of
                   2245px, so it spilled a sliver onto an extra blank page.) */
                const blank = document.createElement('div');
                blank.style.cssText = 'width:10px;height:10px;background:#fff';
                exportContainer.appendChild(blank);
                const pdf = await html2pdf().set({ margin: 0, html2canvas: { scale: 1, logging: false }, jsPDF: JSPDF })
                    .from(blank).toPdf().get('pdf');
                while (pdf.getNumberOfPages() > 1) pdf.deletePage(pdf.getNumberOfPages());

                for (let i = 0; i < pages.length; i++) {
                    if (onProgress) onProgress(i + 1, pages.length);
                    const canvas = await html2pdf().set({ margin: 0, html2canvas: H2C, jsPDF: JSPDF })
                        .from(pages[i]).toCanvas().get('canvas');
                    if (i > 0) pdf.addPage('a4', 'portrait');
                    pdf.setPage(i + 1);
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                }
                return pdf;
            } finally {
                exportContainer.style.display = 'none';
                exportContainer.innerHTML = '';
            }
        }

        async function generatePDF() {
            if (pdfBusy) return;
            pdfBusy = true;
            const btn = document.querySelector('button[onclick="generatePDF()"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating PDF...';
            btn.disabled = true;
            try {
                // Ensure cover page is always first!
                const coverPage = catalogData.find(p => p.pageType === 'cover');
                const productPages = catalogData.filter(p => p.pageType !== 'cover');
                const ordered = (coverPage ? [coverPage] : []).concat(productPages);
                const pdf = await buildPdf(ordered, (i, n) => {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Page ' + i + ' of ' + n + '...';
                });
                pdf.save((cloud.name ? cloud.name.replace(/[^A-Za-z0-9]+/g, '_') : 'Touchwood_Catalog') + '.pdf');
            } catch (err) {
                console.error("PDF Generation Error: ", err);
                showModal("An error occurred while generating the PDF" + (err && err.message ? ": " + err.message : "."));
            } finally {
                btn.innerHTML = originalContent;
                btn.disabled = false;
                pdfBusy = false;
            }
        }

        /* ══ RENDER MODE: catalog_maker.html#render ═══════════════════════
           Production › Design Master › Online Catalogue loads this page in a
           hidden iframe and asks it for a PDF: a saved template + the
           selected designs. The PDF is made by the SAME page templates and
           export as the editor, so it looks exactly like the template.

           Messages (only from the parent window; replies go only to it):
             parent → {cm:'render', reqId, template:{pages, settings}, designs, opts}
             this   → {cm:'ready'} once loaded,
                      {cm:'progress', reqId, text},
                      {cm:'done', reqId, blob, pages}  or  {cm:'error', reqId, message}
           designs: [{design_no, sku, quality, bed_size, design_type, shades,
                      photos:[{src, label}], rate}] — photos already as data URLs
           (the parent has loaded them), so nothing here depends on CORS.
           opts: {unit, customer}.

           Page mapping (renderPagesFrom): the template's cover page first; its
           picture is the template's own, or the first design's first photo
           when the template still has the placeholder. Then one product page
           per design in the look of the template's FIRST product page (colours,
           brand, footer, fonts): title = design no, sub-title = quality,
           specs = the design's own, photos as a grid, 6 per page (more photos
           continue on a second page of the same design).
           Nothing is read from or written to this browser's draft here. */
        const RENDER_MODE = location.hash === '#render';
        const RENDER_PHOTOS_PER_PAGE = 6;

        function renderPagesFrom(template, designs, opts) {
            const o = opts || {};
            const tPages = Array.isArray(template.pages) ? template.pages : [];
            const cover = JSON.parse(JSON.stringify(tPages.find(p => p.pageType === 'cover') || defaultPages[0]));
            const proto = tPages.find(p => p.pageType !== 'cover') || defaultPages[1];
            const firstPhoto = (designs.find(d => d.photos && d.photos.length) || {}).photos;
            if ((!cover.image || cover.image === DEFAULT_IMAGE) && firstPhoto) cover.image = firstPhoto[0].src;

            const out = [cover];
            let no = 0;
            designs.forEach(d => {
                const photos = (d.photos || []).filter(p => p && p.src);
                const chunks = [];
                for (let i = 0; i < Math.max(1, photos.length); i += RENDER_PHOTOS_PER_PAGE) chunks.push(photos.slice(i, i + RENDER_PHOTOS_PER_PAGE));
                const shades = Array.isArray(d.shades) ? d.shades.filter(Boolean) : [];
                const desc = [
                    shades.length ? 'Available in ' + shades.length + ' shade' + (shades.length > 1 ? 's' : '') + ': ' + shades.join(', ') + '.' : '',
                    d.design_type && d.design_type !== 'N/A' ? 'Design type: ' + d.design_type + '.' : ''
                ].filter(Boolean).join('\n');
                chunks.forEach((chunk, ci) => {
                    no++;
                    const pageNum = String(no).padStart(2, '0');
                    out.push({
                        id: 'render_' + no, pageType: 'product',
                        brandText: proto.brandText !== undefined ? proto.brandText : 'TOUCHWOOD',
                        footerText: proto.footerText !== undefined ? proto.footerText : 'SUPER CLOUDY COLLECTION',
                        title1: String(d.design_no || ''),
                        title2: chunks.length > 1 ? (d.quality || '') + ' · ' + (ci + 1) + '/' + chunks.length : (d.quality || ''),
                        description: desc || proto.description || '',
                        pageNum: pageNum,
                        image: chunk[0] ? chunk[0].src : DEFAULT_IMAGE,
                        images: chunk.length ? chunk : null,
                        specs: [
                            ['Design No', d.design_no], ['SKU No', d.sku], ['Quality', d.quality],
                            ['Bed Size', d.bed_size], ['Shades', shades.length ? String(shades.length) : ''],
                            ['Rate', d.rate ? 'Rs. ' + Number(d.rate).toLocaleString('en-IN', { maximumFractionDigits: 2 }) + (o.unit ? ' ' + o.unit : '') : '']
                        ],
                        bgColor: proto.bgColor, accentColor: proto.accentColor, textColor: proto.textColor,
                        boxBgColor: proto.boxBgColor, boxTextColor: proto.boxTextColor
                    });
                });
            });
            return out;
        }

        function startRenderMode() {
            if (window.sarvSsoPrebootDone) window.sarvSsoPrebootDone();
            let queue = Promise.resolve();
            window.addEventListener('message', e => {
                if (e.source !== window.parent || !e.data || e.data.cm !== 'render') return;
                const m = e.data, reply = x => window.parent.postMessage(Object.assign({ reqId: m.reqId }, x), '*');
                // One render at a time; a newer request waits for the running one.
                queue = queue.then(async () => {
                    try {
                        const t = m.template || {};
                        if (t.settings && typeof t.settings === 'object') globalSettings = Object.assign({}, globalSettings, t.settings);
                        const ordered = renderPagesFrom(t, Array.isArray(m.designs) ? m.designs : [], m.opts);
                        const pdf = await buildPdf(ordered, (i, n) => reply({ cm: 'progress', text: 'Template PDF: page ' + i + ' of ' + n + '…' }));
                        reply({ cm: 'done', blob: pdf.output('blob'), pages: pdf.getNumberOfPages() });
                    } catch (err) {
                        console.error('[CM] render failed:', err);
                        reply({ cm: 'error', message: (err && err.message) || String(err) });
                    }
                });
            });
            window.parent.postMessage({ cm: 'ready' }, '*');
        }

        // Start as soon as the page is parsed. window.onload also waited for
        // every font, icon and the placeholder picture to download, so the
        // editor sat empty on a slow connection (or for good if one hung).
        const START = RENDER_MODE ? startRenderMode : init;
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', START);
        else START();
    </script>
    <!-- Floating "← Apps" button (hidden inside the ERP iframe and without a session). -->
    <script src="app-back.js"></script>
    <!-- Yellow spotlight that follows the mouse (desktop only). See cursor-glow.js. -->
    <script src="cursor-glow.js"></script>
</body>
</html>
