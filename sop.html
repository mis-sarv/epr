<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="date-dmy.js"></script><script src="caps-input.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>SOPs</title>
<!-- First, so a logged-in user never sees a flash of anything else. -->
<script src="sso-preboot.js"></script>
<script src="sso-gate.js"></script>
<!--
  SOPs: Standard Operating Procedures, one page in two modes.

    sop.html          MY SOPs. Every SOP meant for the logged-in user, shown
                      as swipeable step cards (picture, instructions, tick
                      boxes, tip, caution) ending in "I have read and
                      understood". Opened from the launcher's "My SOPs" tile,
                      which shows only when something is assigned.
    sop.html#master   SOP MASTER. Create / edit SOPs, their steps and
                      pictures, assign them by designation and / or by user,
                      and see who has read them. Opened inside the ERP from
                      Masters › SOP Master (iframe #sopFrame), or directly.

  WHO SEES WHAT is decided on the server (SOP_MASTER_MIGRATION.sql, sop_*
  RPCs), never here: an ACTIVE SOP reaches a user picked by name, a user whose
  designation is on the SOP (app_users.designation, else the Employee
  Master's), or everybody when the SOP lists ALL. Editing needs the
  HOME_SOP_MASTER right (Admin / MD / GM by default, Tab Visibility or Users ›
  Apps to change), checked again by the server on every call.

  LOGIN = ERP LOGIN (launcher.html). The gate is booted without an app key:
  My SOPs is for everyone with a session, and what they get is only what is
  assigned to them.

  Pictures: a step shows an uploaded photo, or else one of the built-in line
  pictures (SOP_ICONS below). Photos are shrunk on the phone before saving.
-->
<style>
  :root {
    --bg: #eef2f6; --card: #fff; --ink: #0f172a; --ink2: #334155; --mute: #64748b; --line: #e2e8f0;
    --brand: #0f766e; --brand-d: #115e59; --ok: #15803d; --ok-bg: #f0fdf4; --bad: #b91c1c; --bad-bg: #fef2f2;
    --warn: #b45309; --warn-bg: #fffbeb; --tip: #0369a1; --tip-bg: #f0f9ff;
    --r: 14px; --sh: 0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.06);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; font-size: 15px; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; font-size: 15px; }
  [hidden] { display: none !important; }

  /* ── Header ─────────────────────────────────────────────────────── */
  .top { position: sticky; top: 0; z-index: 50; background: #0f172a; color: #fff; display: flex; align-items: center; gap: 10px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); }
  .top .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--brand); display: grid; place-items: center; flex: 0 0 auto; }
  .top .tt { flex: 1; min-width: 0; }
  .top .tt b { display: block; font-size: 16px; letter-spacing: .2px; }
  .top .tt small { display: block; font-size: 11.5px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hb { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .hb:hover { background: rgba(255,255,255,.18); }
  .hb.icon { padding: 7px 10px; }
  main { max-width: 1180px; margin: 0 auto; padding: 14px 14px 90px; }

  /* ── My SOPs: summary + filters + cards ─────────────────────────── */
  .hero { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 16px; display: flex; gap: 16px; align-items: center; }
  .ring { width: 74px; height: 74px; flex: 0 0 auto; position: relative; }
  .ring svg { transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; font-size: 17px; }
  .hero h2 { margin: 0 0 3px; font-size: 18px; }
  .hero p { margin: 0; color: var(--mute); font-size: 13.5px; line-height: 1.45; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: #f1f5f9; color: var(--ink2); border: 1px solid var(--line); white-space: nowrap; }
  .bar { display: flex; gap: 10px; align-items: center; margin: 14px 0 12px; flex-wrap: wrap; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink2); border-radius: 999px; padding: 8px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .chip i { font-style: normal; opacity: .7; margin-left: 4px; }
  .search { flex: 1; min-width: 180px; position: relative; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); outline: none; }
  .search input:focus { border-color: var(--brand); }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--mute); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .sc { text-align: left; border: 0; padding: 0; background: var(--card); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; display: flex; flex-direction: column; transition: transform .15s ease, box-shadow .15s ease; color: inherit; }
  .sc:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(15,23,42,.06), 0 10px 24px rgba(15,23,42,.1); }
  .sc:active { transform: scale(.99); }
  .sc-cover { position: relative; height: 128px; }
  .sc-cover svg { display: block; width: 100%; height: 100%; }
  .sc-code { position: absolute; left: 10px; top: 10px; background: rgba(15,23,42,.78); color: #fff; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: .3px; }
  .sc-st { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; letter-spacing: .3px; }
  .st-new { background: #fef3c7; color: #92400e; }
  .st-upd { background: #ffedd5; color: #9a3412; }
  .st-read { background: #dcfce7; color: #166534; }
  .st-info { background: #e0f2fe; color: #075985; }
  .sc-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .sc-cat { font-size: 11px; font-weight: 800; color: var(--c, var(--brand)); letter-spacing: .5px; }
  .sc h3 { margin: 0; font-size: 15.5px; line-height: 1.3; }
  .sc p { margin: 0; color: var(--mute); font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sc-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .empty { text-align: center; color: var(--mute); padding: 46px 16px; background: var(--card); border-radius: var(--r); box-shadow: var(--sh); line-height: 1.6; }
  .note { padding: 11px 13px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; margin-bottom: 12px; }
  .note.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid #fecaca; }
  .note.warn { background: var(--warn-bg); color: #92400e; border: 1px solid #fde68a; }

  /* ── Player: the step cards ─────────────────────────────────────── */
  .pl { position: fixed; inset: 0; z-index: 200; background: #0b1220; display: flex; flex-direction: column; color: #fff; }
  .pl-in { width: 100%; max-width: 560px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .pl-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; padding-top: max(10px, env(safe-area-inset-top)); }
  .pl-top .tt { flex: 1; min-width: 0; }
  .pl-top .tt small { display: block; font-size: 11px; color: #94a3b8; font-weight: 700; letter-spacing: .4px; }
  .pl-top .tt b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rb { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); color: #fff; font-size: 17px; display: grid; place-items: center; flex: 0 0 auto; }
  .rb:hover { background: rgba(255,255,255,.16); }
  .pl-prog { display: flex; gap: 4px; padding: 4px 12px 8px; }
  .pl-prog button { flex: 1; height: 5px; border: 0; padding: 0; border-radius: 3px; background: rgba(255,255,255,.18); position: relative; overflow: hidden; }
  .pl-prog button.done { background: var(--c); }
  .pl-prog button.cur { background: rgba(255,255,255,.18); }
  .pl-prog button.cur::after { content: ''; position: absolute; inset: 0; background: var(--c); animation: fillbar .5s ease forwards; transform-origin: left; }
  @keyframes fillbar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .pl-track { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pl-track::-webkit-scrollbar { display: none; }
  .slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; padding: 4px 12px 8px; }
  .scard { height: 100%; background: var(--card); color: var(--ink); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .vis { position: relative; flex: 0 0 auto; aspect-ratio: 16 / 10; max-height: 40vh; width: 100%; background: #f1f5f9; overflow: hidden; }
  .vis > svg, .vis > img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .vis > img { cursor: zoom-in; background: #0f172a; object-fit: contain; }
  .vis .badge { position: absolute; left: 12px; top: 12px; background: var(--c); color: #fff; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 999px; letter-spacing: .4px; box-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .vis .zoom { position: absolute; right: 10px; bottom: 10px; background: rgba(15,23,42,.7); color: #fff; font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; pointer-events: none; }
  .txt { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px 20px; -webkit-overflow-scrolling: touch; }
  .txt h2 { margin: 0 0 10px; font-size: 19px; line-height: 1.3; }
  .txt .kick { font-size: 11.5px; font-weight: 800; color: var(--c); letter-spacing: .6px; margin-bottom: 4px; }
  .rich { font-size: 15px; line-height: 1.6; color: var(--ink2); }
  .rich p { margin: 0 0 8px; }
  .rich ul, .rich ol { margin: 0 0 10px; padding-left: 20px; }
  .rich li { margin: 3px 0; }
  .rich ul li::marker { color: var(--c); }
  .chk { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 4px; }
  .chk button { display: flex; gap: 10px; align-items: center; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 12px; font-size: 14.5px; font-weight: 600; color: var(--ink2); transition: border-color .15s, background .15s; }
  .chk button .bx { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #cbd5e1; flex: 0 0 auto; display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 900; transition: all .15s; }
  .chk button.on { border-color: var(--c); background: #f8fafc; background: color-mix(in srgb, var(--c) 7%, #fff); color: var(--ink); }
  .chk button.on .bx { background: var(--c); border-color: var(--c); transform: scale(1.05); }
  .call { display: flex; gap: 10px; padding: 11px 12px; border-radius: 12px; margin-top: 12px; font-size: 14px; line-height: 1.5; }
  .call svg { flex: 0 0 auto; margin-top: 1px; }
  .call b { display: block; font-size: 11.5px; letter-spacing: .5px; margin-bottom: 1px; }
  .call.tip { background: var(--tip-bg); color: #0c4a6e; border: 1px solid #bae6fd; }
  .call.warn { background: var(--bad-bg); color: #7f1d1d; border: 1px solid #fecaca; }
  .cov-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .hint { display: flex; align-items: center; gap: 8px; color: var(--mute); font-size: 13px; margin-top: 14px; }
  .hint .arr { animation: nudge 1.3s ease-in-out infinite; color: var(--c); font-weight: 900; }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
  .ack { margin-top: 16px; }
  .ack .go { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 15.5px; font-weight: 800; background: var(--c); color: #fff; box-shadow: 0 4px 14px color-mix(in srgb, var(--c) 40%, transparent); }
  .ack .go:disabled { opacity: .55; cursor: default; box-shadow: none; }
  .ack .done { display: flex; gap: 10px; align-items: center; background: var(--ok-bg); border: 1px solid #bbf7d0; color: #166534; border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; }
  .ack .done .tick { width: 30px; height: 30px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; font-weight: 900; flex: 0 0 auto; animation: pop .35s ease; }
  @keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .pl-nav { display: flex; align-items: center; gap: 10px; padding: 6px 12px 12px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
  .pl-nav .nb { flex: 1; border: 0; border-radius: 12px; padding: 13px; font-size: 15px; font-weight: 800; }
  .pl-nav .prev { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.14); }
  .pl-nav .next { background: var(--c); color: #fff; }
  .pl-nav .nb:disabled { opacity: .35; cursor: default; }
  .pl-nav .cnt { min-width: 56px; text-align: center; font-weight: 800; font-size: 13px; color: #cbd5e1; }
  .ov { position: absolute; inset: 0; z-index: 5; background: rgba(11,18,32,.97); display: flex; flex-direction: column; }
  .ov-h { display: flex; align-items: center; gap: 10px; padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); }
  .ov-h b { flex: 1; font-size: 15px; }
  .ov-g { flex: 1; overflow-y: auto; padding: 4px 14px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; align-content: start; max-width: 900px; width: 100%; margin: 0 auto; }
  .ov-i { border: 2px solid transparent; background: #fff; color: var(--ink); border-radius: 12px; overflow: hidden; padding: 0; text-align: left; }
  .ov-i.cur { border-color: var(--c); }
  .ov-i .ov-v { height: 78px; background: #f1f5f9; }
  .ov-i .ov-v svg, .ov-i .ov-v img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ov-i .ov-t { padding: 8px 9px; font-size: 12px; font-weight: 700; line-height: 1.3; }
  .ov-i .ov-t small { display: block; color: var(--c); font-size: 10.5px; font-weight: 800; margin-bottom: 2px; }
  .zoomer { position: fixed; inset: 0; z-index: 400; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; }
  .zoomer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .zoomer .rb { position: absolute; right: 14px; top: max(14px, env(safe-area-inset-top)); }

  /* Wide screens: picture beside the text, so nothing needs scrolling.
     Only in the player; the editor's preview stays phone-shaped. */
  @media (min-width: 900px) and (min-height: 540px) {
    .pl-in { max-width: 1040px; }
    .pl .slide { padding: 6px 18px 10px; }
    .pl .scard { flex-direction: row; }
    .pl .vis { aspect-ratio: auto; max-height: none; width: 52%; height: 100%; }
    .pl .txt { padding: 26px 28px; }
    .pl .txt h2 { font-size: 23px; }
    .pl .rich { font-size: 16px; }
    .pl-nav { max-width: 560px; width: 100%; margin: 0 auto; }
  }

  /* ── SOP Master ─────────────────────────────────────────────────── */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border-radius: 12px; box-shadow: var(--sh); padding: 12px 14px; }
  .stat small { display: block; color: var(--mute); font-size: 11.5px; font-weight: 700; letter-spacing: .3px; }
  .stat b { font-size: 22px; }
  .mbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .mbar select { padding: 9px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); max-width: 46vw; }
  .btn { border: 0; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 800; background: var(--brand); color: #fff; white-space: nowrap; }
  .btn:hover { background: var(--brand-d); }
  .btn.ghost { background: var(--card); color: var(--ink2); border: 1px solid var(--line); }
  .btn.ghost:hover { background: #f8fafc; }
  .btn.red { background: var(--card); color: var(--bad); border: 1px solid #fecaca; }
  .btn.red:hover { background: var(--bad-bg); }
  .btn.sm { padding: 7px 11px; font-size: 12.5px; border-radius: 8px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .mc { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); overflow: hidden; display: flex; flex-direction: column; border-top: 4px solid var(--c); }
  .mc-h { display: flex; gap: 12px; padding: 12px 14px 8px; align-items: flex-start; }
  .mc-ic { width: 46px; height: 46px; border-radius: 12px; background: color-mix(in srgb, var(--c) 12%, #fff); color: var(--c); display: grid; place-items: center; flex: 0 0 auto; }
  .mc-h h3 { margin: 2px 0 0; font-size: 14.5px; line-height: 1.3; }
  .mc-h small { font-size: 11px; font-weight: 800; color: var(--mute); letter-spacing: .3px; }
  .mc-b { padding: 0 14px 10px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--c) 10%, #fff); color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 22%, #fff); }
  .tag.gray { background: #f1f5f9; color: var(--ink2); border-color: var(--line); }
  .meter { height: 7px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--ok); border-radius: 4px; }
  .mc-r { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); font-weight: 600; }
  .mc-f { display: flex; gap: 6px; padding: 10px 14px 12px; border-top: 1px solid var(--line); background: #fafbfc; }
  .mc-f .btn { flex: 1; }
  .stp { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 5px; letter-spacing: .3px; }
  .stp.ACTIVE { background: #dcfce7; color: #166534; }
  .stp.DRAFT { background: #fef3c7; color: #92400e; }
  .stp.INACTIVE { background: #f1f5f9; color: #64748b; }

  /* Editor (full screen) */
  .ed { position: fixed; inset: 0; z-index: 150; background: var(--bg); display: flex; flex-direction: column; }
  .ed-top { background: #0f172a; color: #fff; display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); }
  .ed-top .tt { flex: 1; min-width: 0; font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ed-body { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 14px; overflow: hidden; max-width: 1280px; width: 100%; margin: 0 auto; }
  .ed-form { flex: 1; min-width: 0; overflow-y: auto; padding-bottom: 80px; }
  .ed-prev { width: 340px; flex: 0 0 auto; display: none; flex-direction: column; gap: 8px; }
  .ed-prev .ph { flex: 1; min-height: 0; max-height: 640px; background: #0b1220; border-radius: 26px; padding: 12px 8px; box-shadow: var(--sh); display: flex; }
  .ed-prev .ph .slide { padding: 0; }
  .ed-prev .ph .vis { max-height: 34%; }
  .ed-prev .ph .txt { padding: 12px 14px; }
  .ed-prev .ph .txt h2 { font-size: 16px; }
  .ed-prev .ph .rich { font-size: 13.5px; }
  .ed-prev .cap { font-size: 12px; color: var(--mute); text-align: center; font-weight: 600; }
  @media (min-width: 1000px) { .ed-prev { display: flex; } }
  .sec { background: var(--card); border-radius: var(--r); box-shadow: var(--sh); padding: 14px; margin-bottom: 14px; }
  .sec > h4 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .sec > h4 .n { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 12px; display: grid; place-items: center; }
  .sec > h4 .r { margin-left: auto; font-weight: 600; color: var(--mute); font-size: 12px; }
  .fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .f.wide { grid-column: 1 / -1; }
  .f label { font-size: 12px; font-weight: 700; color: var(--ink2); }
  .f label .req { color: var(--bad); }
  .f input, .f textarea, .f select { width: 100%; padding: 9px 11px; border: 1px solid #cbd5e1; border-radius: 9px; background: #fff; outline: none; color: var(--ink); }
  .f input:focus, .f textarea:focus, .f select:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,118,110,.12); }
  .f textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
  .f .h { font-size: 11.5px; color: var(--mute); }

    + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + SOP_ICONS[iconKey(k)][1] + '</svg>';
}
/* The large picture: the line icon on a white disc over a tinted card with a
   dot pattern. Flat fills only. */
let SCENE_N = 0;
function scene(k, color){
  const c = /^#[0-9a-f]{6}$/i.test(color || '') ? color : '#0f766e', id = 'sd' + (++SCENE_N);
  return '<svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'
    + '<defs><pattern id="' + id + '" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="' + c + '" fill-opacity=".16"/></pattern></defs>'
    + '<rect width="320" height="200" fill="#fff"/><rect width="320" height="200" fill="' + c + '" fill-opacity=".09"/>'
    + '<rect width="320" height="200" fill="url(#' + id + ')"/>'
    + '<circle cx="268" cy="30" r="64" fill="' + c + '" fill-opacity=".1"/><circle cx="36" cy="186" r="76" fill="' + c + '" fill-opacity=".08"/>'
    + '<circle cx="160" cy="100" r="64" fill="#fff"/><circle cx="160" cy="100" r="72" fill="none" stroke="' + c + '" stroke-opacity=".28" stroke-width="2" stroke-dasharray="3 7"/>'
    + '<g transform="translate(160 100) scale(3.4) translate(-12 -12)" fill="none" stroke="' + c + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">'
    + SOP_ICONS[iconKey(k)][1] + '</g></svg>';
}
// Plain text with "- " / "• " bullets and "1. " numbered lines turned into lists.
function rich(t){
  const lines = String(t || '').replace(/\r/g, '').split('\n');
  let out = '', list = null;
  const close = () => { if (list) { out += '</' + list + '>'; list = null; } };
  lines.forEach(l => {
    const s = l.trim();
    let m;
    if ((m = s.match(/^[-•*]\s+(.*)$/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += '<li>' + esc(m[1]) + '</li>'; }
    else if ((m = s.match(/^\d+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += '<li>' + esc(m[1]) + '</li>'; }
    else { close(); if (s) out += '<p>' + esc(s) + '</p>'; }
  });
  close();
  return out;
}

/* ── Server calls: one door for every sop_* RPC ──────────────────────── */
const SESSION_ERR = { NO_TOKEN: 1, NO_SESSION: 1, SESSION_REVOKED: 1, SESSION_EXPIRED: 1, USER_INACTIVE: 1 };
const ERR_TEXT = {
  NOT_ALLOWED: 'You do not have SOP Master access. Ask the Admin to switch on "SOP Master" for you (Admin Panel › Tab Visibility, or Users › Apps).',
  NOT_ASSIGNED: 'This SOP is no longer assigned to you. Refresh the list.',
  NOT_FOUND: 'This SOP was not found; it may have been deleted. Refresh the list.',
  VERSION_CHANGED: 'This SOP was updated while you were reading it. It has been reloaded; please go through the new version.',
  TITLE_REQUIRED: 'Give the SOP a title.',
  STEPS_REQUIRED: 'Add at least one step.',
  STEP_TITLE_REQUIRED: 'Every step needs a title.',
  IMAGE_INVALID: 'One of the step photos could not be read. Remove it and add it again.',
  TOO_BIG: 'The photos in this SOP are too large in total. Remove a few photos or split the SOP into two.',
  DUP_CODE: 'Another SOP already uses this code. Choose a different code, or leave it empty for the next free one.'
};
async function rpc(fn, args){
  let r;
  try {
    r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify(Object.assign({ p_token: SARV_GATE.token }, args || {}))
    });
  } catch (e) { throw new Error('Could not reach the server. Please check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    const code = d && d.code;
    if (code === 'PGRST202' || code === '42883' || code === '42P01') {
      const e = new Error('SOPs are not set up on the server yet. Admin: run sql/SOP_MASTER_MIGRATION.sql in the Supabase SQL Editor.');
      e.code = 'NOT_SET_UP'; throw e;
    }
    throw new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
  }
  if (d && d.success === false) {
    const err = String(d.error || '');
    if (SESSION_ERR[err]) { location.replace('launcher.html?why=' + err); return new Promise(() => {}); }
    let msg = ERR_TEXT[err] || err;
    if (d.step) msg = 'Step ' + d.step + ': ' + msg;
    const e = new Error(msg); e.code = err; e.step = d.step; throw e;
  }
  return d;
}
function busy(on, text){ $('busy').style.display = on ? 'flex' : 'none'; if (text) $('busyText').textContent = text; }
let toastT = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => { t.style.display = 'none'; }, 2800); }

/* ── Mode and header ─────────────────────────────────────────────────── */
let MODE = 'my', ME = {}, MANAGE = false;
function modeFromHash(){ return /^#master/i.test(location.hash) ? 'master' : 'my'; }
function paintHeader(){
  $('topTitle').textContent = MODE === 'master' ? 'SOP Master' : 'My SOPs';
  $('topSub').textContent = [ME.name, ME.designation].filter(Boolean).join(' · ') || ' ';
  document.title = MODE === 'master' ? 'SOP Master' : 'My SOPs';
  const sw = $('swBtn');
  // The way across: My SOPs ⇄ SOP Master (only for users who may edit).

  sw.textContent = MODE === 'master' ? 'My SOPs' : 'SOP Master';
  sw.onclick = () => { location.hash = MODE === 'master' ? '' : 'master'; };

  $('meBtn').hidden = IN_FRAME;

window.addEventListener('hashchange', () => {

function reload(manual){ return (MODE === 'master' ? loadMaster(manual) : loadMy(manual)); }

/* ══ MY SOPs ═══════════════════════════════════════════════════════════ */
let MY = [], MY_FILTER = 'ALL', MY_Q = '';
try { MY_FILTER = sessionStorage.getItem('sop_filter') || 'ALL'; } catch (e) {}
// NEW: never read · UPDATED: read an older version · READ · INFO: no confirmation asked.
function myState(r){
  if (r.acked_at) return 'READ';
  if (!r.require_ack) return 'INFO';
  return r.acked_version ? 'UPDATED' : 'NEW';
}
const STATE_LABEL = { NEW: ['NEW', 'st-new'], UPDATED: ['UPDATED', 'st-upd'], READ: ['✓ READ', 'st-read'], INFO: ['FOR INFO', 'st-info'] };
async function loadMy(manual){
  if (!MY.length) $('main').innerHTML = '<div class="empty">Loading your SOPs…</div>';
  try {
    const d = await rpc('sop_my_list');
    ME = d.me || {}; MANAGE = !!ME.manage; MY = d.rows || [];
    paintHeader(); renderMy();
    if (manual) toast('List refreshed');
  } catch (e) {
    paintHeader();
    $('main').innerHTML = '<div class="note bad">' + esc(e.message || e) + '</div>';
  }
}
function setMyFilter(f){ MY_FILTER = f; try { sessionStorage.setItem('sop_filter', f); } catch (e) {} renderMy(); }
function renderMy(){
  const toRead = MY.filter(r => myState(r) === 'NEW' || myState(r) === 'UPDATED');
  const read = MY.filter(r => myState(r) === 'READ');
  const need = MY.filter(r => r.require_ack).length;
  const pct = need ? Math.round(read.length * 100 / need) : 100;
  const R = 31, C = 2 * Math.PI * R;
  let h = '<section class="hero"><div class="ring"><svg width="74" height="74" viewBox="0 0 74 74"><circle cx="37" cy="37" r="' + R + '" fill="none" stroke="#e2e8f0" stroke-width="8"/>'
    + '<circle cx="37" cy="37" r="' + R + '" fill="none" stroke="#0f766e" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - pct / 100)).toFixed(1) + '"/></svg>'
    + '<span>' + pct + '%</span></div><div style="min-width:0;"><h2>' + esc(greet()) + (ME.name ? ', ' + esc(firstName(ME.name)) : '') + '</h2>'
    + '<p>' + (MY.length
        ? (toRead.length ? '<b style="color:#92400e;">' + toRead.length + ' SOP' + (toRead.length > 1 ? 's' : '') + ' to read.</b> ' : '<b style="color:#166534;">All caught up.</b> ')
          + read.length + ' of ' + need + ' confirmed as read.'
        : 'No SOP is assigned to you yet.') + '</p>'
    + (ME.designation ? '<div style="margin-top:7px;"><span class="pill">' + esc(ME.designation) + '</span>' + (ME.department ? ' <span class="pill">' + esc(ME.department) + '</span>' : '') + '</div>' : '')
    + '</div></section>';
  const cnt = { ALL: MY.length, TODO: toRead.length, READ: read.length };
  h += '<div class="bar"><div class="chips">'
    + [['ALL', 'All'], ['TODO', 'To read'], ['READ', 'Read']].map(([k, l]) => '<button class="chip' + (MY_FILTER === k ? ' on' : '') + '" onclick="setMyFilter(\'' + k + '\')">' + l + '<i>' + cnt[k] + '</i></button>').join('')
    + '</div><label class="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
    + '<input type="search" id="myQ" placeholder="Search SOPs" value="' + esc(MY_Q) + '" oninput="MY_Q=this.value;renderMyGrid()"></label></div><div id="myGrid"></div>';
  $('main').innerHTML = h;
  renderMyGrid();
}
function renderMyGrid(){
  const q = MY_Q.trim().toUpperCase();
  const list = MY.filter(r => {
    const s = myState(r);
    if (MY_FILTER === 'TODO' && !(s === 'NEW' || s === 'UPDATED')) return false;
    if (MY_FILTER === 'READ' && s !== 'READ') return false;
    return !q || [r.sop_code, r.title, r.category, r.department, r.summary].some(v => String(v || '').toUpperCase().indexOf(q) >= 0);
  });
  if (!list.length) {
    $('myGrid').innerHTML = '<div class="empty">' + (MY.length ? 'Nothing here. Try another filter.' : 'When an SOP is assigned to you, or to your designation, it appears here.') + '</div>';
    return;
  }
  $('myGrid').innerHTML = '<div class="grid">' + list.map(r => {
    const s = myState(r), lb = STATE_LABEL[s];
    return '<button class="sc" style="--c:' + esc(r.color) + '" onclick="openSop(' + r.id + ')">'
      + '<div class="sc-cover">' + scene(r.icon, r.color) + '<span class="sc-code">' + esc(r.sop_code) + '</span><span class="sc-st ' + lb[1] + '">' + lb[0] + (s === 'UPDATED' ? ' v' + r.version : '') + '</span></div>'
      + '<div class="sc-body"><div class="sc-cat">' + esc([r.category, r.department].filter(Boolean).join(' · ') || 'SOP') + '</div>'
      + '<h3>' + esc(r.title) + '</h3>' + (r.summary ? '<p>' + esc(r.summary) + '</p>' : '')
      + '<div class="sc-meta"><span class="pill">' + r.step_count + ' steps</span><span class="pill">' + r.est_minutes + ' min</span><span class="pill">v' + r.version + '</span>'
      + (r.acked_at ? '<span class="pill" style="color:#166534;">Read ' + esc(stamp(r.acked_at).slice(0, 10)) + '</span>' : '') + '</div></div></button>';
  }).join('') + '</div>';
}
function greet(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; }
function firstName(n){ const s = String(n || '').trim().split(/\s+/)[0] || ''; return s.charAt(0) + s.slice(1).toLowerCase(); }

async function openSop(id){
  busy(true, 'Opening…');
  try {
    const d = await rpc('sop_get', { p_id: id });
    openPlayer(d.sop, { mine: d.mine });
  } catch (e) { alert(e.message || e); if (e.code === 'NOT_ASSIGNED' || e.code === 'NOT_FOUND') reload(); }
  finally { busy(false); }
}

/* ══ PLAYER ════════════════════════════════════════════════════════════
   Slides: cover, one per step, and a closing card with the confirmation.
   The track is a CSS scroll-snap strip, so a swipe on the phone and a
   trackpad on the desktop work natively; the buttons, the progress bar,
   the step list and the arrow keys all move the same strip. Where the user
   stopped and which boxes they ticked are kept on this device, per SOP
   version. */
let P = null;
function openPlayer(sop, opt){
  opt = opt || {};
  const steps = Array.isArray(sop.steps) ? sop.steps : [];
  const key = 'sop_v_' + (sop.id || 'draft') + '_' + (sop.version || 1);
  // idx -1 so the first go() always paints the bar and buttons for this SOP.
  P = { sop, steps, n: steps.length + 2, idx: -1, preview: !!opt.preview, mine: !!opt.mine,
        key, checks: opt.preview ? {} : lsGet(key + '_chk', {}) };
  const c = /^#[0-9a-f]{6}$/i.test(sop.color || '') ? sop.color : '#0f766e';
  $('pl').style.setProperty('--c', c);
  $('plCode').textContent = (sop.sop_code || 'NEW SOP') + ' · V' + (sop.version || 1) + (P.preview ? ' · PREVIEW' : '');
  $('plTitle').textContent = sop.title || 'Untitled SOP';
  $('plProg').innerHTML = Array.from({ length: P.n }, (_, i) => '<button onclick="go(' + i + ')" aria-label="Slide ' + (i + 1) + '"></button>').join('');
  $('plTrack').innerHTML = slideCover() + steps.map((s, i) => slideStep(s, i)).join('') + slideEnd();
  $('plOv').hidden = true;
  $('pl').hidden = false;
  document.body.style.overflow = 'hidden';
  // Pick up where they stopped, unless it was the end already.
  const pos = P.preview ? 0 : lsGet(key + '_pos', 0);
  const start = pos > 0 && pos < P.n - 1 ? pos : 0;
  requestAnimationFrame(() => { go(start, true); if (start) toast('Continuing from step ' + start); });
}
function closePlayer(silent){
  if (!P) return;
  $('pl').hidden = true; $('zoomer').hidden = true;
  document.body.style.overflow = '';
  const wasPreview = P.preview; P = null;
  if (!silent && !wasPreview && MODE === 'my') renderMy();
}
function slideCover(){
  const s = P.sop;
  const des = (s.designations || []).map(d => '<span class="pill">' + esc(d === 'ALL' ? 'ALL EMPLOYEES' : d) + '</span>').join(' ');
  return '<section class="slide"><div class="scard"><div class="vis">' + scene(s.icon, s.color) + '<span class="badge">' + esc(s.sop_code || 'SOP') + '</span></div>'
    + '<div class="txt"><div class="kick">' + esc([s.category, s.department].filter(Boolean).join(' · ') || 'STANDARD OPERATING PROCEDURE') + '</div>'
    + '<h2>' + esc(s.title || 'Untitled SOP') + '</h2>' + (s.summary ? '<div class="rich">' + rich(s.summary) + '</div>' : '')
    + '<div class="cov-meta"><span class="pill">' + P.steps.length + ' steps</span><span class="pill">About ' + esc(s.est_minutes || 5) + ' min</span><span class="pill">Version ' + esc(s.version || 1) + '</span></div>'
    + (des ? '<div style="font-size:12px;color:var(--mute);font-weight:700;margin-bottom:5px;">FOR</div><div class="cov-meta" style="margin-top:0;">' + des + '</div>' : '')
    + '<div class="hint"><span>Swipe or tap Next to start</span><span class="arr">→</span></div>'
    + '</div></div></section>';
}
function slideStep(st, i){
  const vis = st.image
    ? '<img src="' + esc(st.image) + '" alt="' + esc(st.title) + '" onclick="zoom(this.src)"><span class="zoom">Tap to zoom</span>'
    : scene(st.icon, P.sop.color);
  const checks = (st.checks || []).map((c, j) => {
    const on = !!P.checks[i + ':' + j];
    return '<button class="' + (on ? 'on' : '') + '" onclick="tick(' + i + ',' + j + ',this)"><span class="bx">' + (on ? '✓' : '') + '</span><span>' + esc(c) + '</span></button>';
  }).join('');
  return '<section class="slide"><div class="scard"><div class="vis">' + vis + '<span class="badge">STEP ' + (i + 1) + ' / ' + P.steps.length + '</span></div>'
    + '<div class="txt"><h2>' + esc(st.title) + '</h2><div class="rich">' + rich(st.text) + '</div>'
    + (checks ? '<div class="chk">' + checks + '</div>' : '')
    + (st.tip ? '<div class="call tip">' + icon('check', 20, 2) + '<div><b>TIP</b>' + esc(st.tip) + '</div></div>' : '')
    + (st.warn ? '<div class="call warn">' + icon('warning', 20, 2) + '<div><b>CAUTION</b>' + esc(st.warn) + '</div></div>' : '')
    + '</div></div></section>';
}
function slideEnd(){
  return '<section class="slide"><div class="scard"><div class="vis">' + scene('check', P.sop.color) + '<span class="badge">DONE</span></div>'
    + '<div class="txt" id="plEnd">' + endHtml() + '</div></div></section>';
}
function endHtml(){
  const s = P.sop;
  let total = 0, done = 0;
  P.steps.forEach((st, i) => (st.checks || []).forEach((_, j) => { total++; if (P.checks[i + ':' + j]) done++; }));
  let h = '<div class="kick">ALL ' + P.steps.length + ' STEPS SEEN</div><h2>You have reached the end</h2>'
    + '<div class="rich"><p>Go back to any step with ‹ Back or ☰ All steps.</p></div>'
    + (total ? '<div class="cov-meta"><span class="pill" style="' + (done === total ? 'color:#166534;' : 'color:#92400e;') + '">' + done + ' of ' + total + ' points ticked</span></div>' : '');
  h += '<div class="ack">';
  if (P.preview) h += '<button class="go" disabled>I have read and understood</button><div class="hint">Preview: users confirm reading here.</div>';
  else if (!s.require_ack) h += '<div class="done"><span class="tick">i</span><span>This SOP is for information. No confirmation is needed.</span></div>';
  else if (s.acked_at) h += '<div class="done"><span class="tick">✓</span><span>You confirmed reading version ' + esc(s.version) + ' on ' + esc(stamp(s.acked_at)) + '.</span></div>';
  else if (!P.mine) h += '<div class="hint">This SOP is not assigned to you, so there is nothing to confirm.</div>';
  else h += '<button class="go" id="ackBtn" onclick="ackSop()">I have read and understood</button>'
    + (total && done < total ? '<div class="hint">Tip: tick the points above as you check them at work.</div>' : '');
  return h + '</div>';
}
function tick(i, j, btn){
  const k = i + ':' + j, on = !P.checks[k];
  if (on) P.checks[k] = 1; else delete P.checks[k];
  btn.classList.toggle('on', on); btn.querySelector('.bx').textContent = on ? '✓' : '';
  if (!P.preview) lsSet(P.key + '_chk', P.checks);
  if (navigator.vibrate && on) try { navigator.vibrate(12); } catch (e) {}
  const end = $('plEnd'); if (end) end.innerHTML = endHtml();
}
async function ackSop(){
  const b = $('ackBtn'); if (b) { b.disabled = true; b.textContent = 'Saving…'; }
  try {
    const d = await rpc('sop_ack', { p_id: P.sop.id, p_version: P.sop.version });
    P.sop.acked_at = d.acked_at; P.sop.acked_version = d.version;
    const row = MY.find(r => r.id === P.sop.id); if (row) { row.acked_at = d.acked_at; row.acked_version = d.version; }
    $('plEnd').innerHTML = endHtml();
    toast('Thank you. Reading confirmed.');
  } catch (e) {
    if (e.code === 'VERSION_CHANGED') { alert(e.message); const id = P.sop.id; closePlayer(true); await loadMy(); openSop(id); return; }
    alert(e.message || e); if (b) { b.disabled = false; b.textContent = 'I have read and understood'; }
  }
}
function go(i, instant){
  if (!P) return;
  i = Math.max(0, Math.min(P.n - 1, i));
  const tr = $('plTrack');
  tr.scrollTo({ left: i * tr.clientWidth, behavior: instant ? 'auto' : 'smooth' });
  setIdx(i);
}
function setIdx(i){
  if (!P || i === P.idx) return;
  P.idx = i;
  [...$('plProg').children].forEach((b, k) => { b.className = k < i ? 'done' : k === i ? 'cur' : ''; });
  $('plPrev').disabled = i === 0;
  const last = i === P.n - 1;
  $('plNext').textContent = i === 0 ? 'Start ›' : last ? 'Close' : i === P.n - 2 ? 'Finish ›' : 'Next ›';
  $('plNext').onclick = last ? () => closePlayer() : () => go(P.idx + 1);
  $('plCnt').textContent = i === 0 ? 'Cover' : last ? 'End' : i + ' / ' + P.steps.length;
  if (!P.preview) lsSet(P.key + '_pos', i);
  // Each card starts at its top, whichever way the user came in.
  const s = $('plTrack').children[i]; const t = s && s.querySelector('.txt'); if (t) t.scrollTop = 0;
}
// The strip is the source of truth: a swipe moves it, and the index follows.
let scrollRaf = 0;
$('plTrack').addEventListener('scroll', () => {
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => {
    const tr = $('plTrack'); if (!P || !tr.clientWidth) return;
    const i = Math.round(tr.scrollLeft / tr.clientWidth);
    if (i !== P.idx) setIdx(i);
  });
}, { passive: true });
// After a rotation or resize, keep the same card in view.
window.addEventListener('resize', () => { if (P) go(P.idx, true); });
function toggleOverview(on){
  if (!P) return;
  if (on) {
    $('plOvG').innerHTML = [{ cover: 1 }].concat(P.steps).map((st, k) => {
      const v = st.cover ? scene(P.sop.icon, P.sop.color) : st.image ? '<img src="' + esc(st.image) + '" alt="">' : scene(st.icon, P.sop.color);
      const nChk = st.cover ? 0 : (st.checks || []).length;
      const nOn = st.cover ? 0 : (st.checks || []).filter((_, j) => P.checks[(k - 1) + ':' + j]).length;
      return '<button class="ov-i' + (k === P.idx ? ' cur' : '') + '" onclick="toggleOverview(false);go(' + k + ')"><div class="ov-v">' + v + '</div>'
        + '<div class="ov-t"><small>' + (st.cover ? 'COVER' : 'STEP ' + k + (nChk ? ' · ' + nOn + '/' + nChk + ' ✓' : '')) + '</small>' + esc(st.cover ? P.sop.title : st.title) + '</div></button>';
    }).join('');
  }
  $('plOv').hidden = !on;
}
function zoom(src){ $('zoomImg').src = src; $('zoomer').hidden = false; }
document.addEventListener('keydown', e => {
  if (!$('zoomer').hidden && e.key === 'Escape') { $('zoomer').hidden = true; return; }
  if (!P || $('pl').hidden) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); go(P.idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); go(P.idx - 1); }
  else if (e.key === 'Escape') { if (!$('plOv').hidden) toggleOverview(false); else closePlayer(); }
});

/* ══ SOP MASTER ════════════════════════════════════════════════════════ */
let ML = [], META = null, MF = { q: '', st: 'ALL', des: '' };
async function loadMaster(manual){
  if (!ML.length) $('main').innerHTML = '<div class="empty">Loading SOP Master…</div>';
  try {
    const d = await rpc('sop_admin_list');
    ME = d.me || {}; MANAGE = true; ML = d.rows || [];
    paintHeader(); renderMaster();
    if (manual) toast('List refreshed');
  } catch (e) {
    paintHeader();
    $('main').innerHTML = '<div class="note bad">' + esc(e.message || e) + '</div>'
      + (e.code === 'NOT_ALLOWED' ? '<button class="btn ghost" onclick="location.hash=\'\'">Open My SOPs</button>' : '');
  }
}
async function ensureMeta(force){
  if (META && !force) return META;
  const d = await rpc('sop_admin_meta');
  META = d; return META;
}
function renderMaster(){
  const act = ML.filter(r => r.status === 'ACTIVE');
  const reach = act.reduce((s, r) => s + (r.assigned_count || 0), 0), acked = act.reduce((s, r) => s + (r.acked_count || 0), 0);
  const allDes = [...new Set(ML.flatMap(r => r.designations || []))].sort();
  let h = '<div class="stats">'
    + '<div class="stat"><small>TOTAL SOPs</small><b>' + ML.length + '</b></div>'
    + '<div class="stat"><small>ACTIVE</small><b>' + act.length + '</b></div>'
    + '<div class="stat"><small>READ CONFIRMED</small><b>' + (reach ? Math.round(acked * 100 / reach) : 0) + '%</b></div>'
    + '<div class="stat"><small>STILL TO READ</small><b>' + Math.max(0, reach - acked) + '</b></div></div>'
    + '<div class="mbar"><label class="search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>'
    + '<input type="search" placeholder="Search code, title, category" value="' + esc(MF.q) + '" oninput="MF.q=this.value;renderMasterGrid()"></label>'
    + '<select onchange="MF.st=this.value;renderMasterGrid()">' + [['ALL', 'All status'], ['ACTIVE', 'Active'], ['DRAFT', 'Draft'], ['INACTIVE', 'Inactive']].map(([k, l]) => '<option value="' + k + '"' + (MF.st === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select>'
    + '<select onchange="MF.des=this.value;renderMasterGrid()"><option value="">All designations</option>' + allDes.map(d => '<option' + (MF.des === d ? ' selected' : '') + '>' + esc(d) + '</option>').join('') + '</select>'
    + '<button class="btn" onclick="openEditor()">+ New SOP</button></div><div id="mGrid"></div>';
  $('main').innerHTML = h;
  renderMasterGrid();
}
function renderMasterGrid(){
  const q = MF.q.trim().toUpperCase();
  const list = ML.filter(r => (MF.st === 'ALL' || r.status === MF.st)
    && (!MF.des || (r.designations || []).indexOf(MF.des) >= 0)
    && (!q || [r.sop_code, r.title, r.category, r.department].some(v => String(v || '').toUpperCase().indexOf(q) >= 0)));
  if (!list.length) {
    $('mGrid').innerHTML = '<div class="empty">' + (ML.length ? 'No SOP matches the filters.' : 'No SOPs yet.<br><button class="btn" style="margin-top:12px;" onclick="openEditor()">+ Create the first SOP</button>') + '</div>';
    return;
  }
  $('mGrid').innerHTML = '<div class="grid">' + list.map(r => {
    const des = r.designations || [], pct = r.assigned_count ? Math.round((r.acked_count || 0) * 100 / r.assigned_count) : 0;
    return '<div class="mc" style="--c:' + esc(r.color) + '"><div class="mc-h"><div class="mc-ic">' + icon(r.icon, 24) + '</div>'
      + '<div style="min-width:0;flex:1;"><small>' + esc(r.sop_code) + ' · V' + r.version + '</small> <span class="stp ' + esc(r.status) + '">' + esc(r.status) + '</span><h3>' + esc(r.title) + '</h3></div></div>'
      + '<div class="mc-b"><div class="tags">'
      + des.slice(0, 4).map(d => '<span class="tag">' + esc(d === 'ALL' ? 'ALL EMPLOYEES' : d) + '</span>').join('')
      + (des.length > 4 ? '<span class="tag gray">+' + (des.length - 4) + '</span>' : '')
      + (r.user_count ? '<span class="tag gray">' + r.user_count + ' by name</span>' : '')
      + (!des.length && !r.user_count ? '<span class="tag gray">NOT ASSIGNED</span>' : '') + '</div>'
      + '<div class="mc-r"><span>' + r.step_count + ' steps · ' + r.est_minutes + ' min' + (r.category ? ' · ' + esc(r.category) : '') + '</span></div>'
      + (r.require_ack ? '<div class="meter"><i style="width:' + pct + '%"></i></div><div class="mc-r"><span>Read: <b>' + (r.acked_count || 0) + '</b> of ' + (r.assigned_count || 0) + ' users</span><span>' + pct + '%</span></div>'
        : '<div class="mc-r"><span>For information (' + (r.assigned_count || 0) + ' users), no confirmation</span></div>')
      + '<div class="mc-r" style="font-size:11px;"><span>Updated ' + esc(stamp(r.updated_at)) + (r.updated_by ? ' by ' + esc(r.updated_by) : '') + '</span></div></div>'
      + '<div class="mc-f"><button class="btn ghost sm" onclick="previewSaved(' + r.id + ')">Preview</button>'
      + '<button class="btn ghost sm" onclick="showReport(' + r.id + ')">Who read</button>'
      + '<button class="btn sm" onclick="openEditor(' + r.id + ')">Edit</button></div></div>';
  }).join('') + '</div>';
}
async function previewSaved(id){
  busy(true, 'Opening…');
  try { const d = await rpc('sop_get', { p_id: id }); openPlayer(d.sop, { preview: true }); }
  catch (e) { alert(e.message || e); } finally { busy(false); }
}
async function showReport(id){
  const r0 = ML.find(x => x.id === id) || {};
  $('rpTitle').textContent = (r0.sop_code || '') + ' · who has read it';
  $('rpBody').innerHTML = '<div class="empty" style="box-shadow:none;">Loading…</div>'; $('rpDlg').hidden = false;
  try {
    const d = await rpc('sop_ack_report', { p_id: id });
    const rows = d.rows || [], yes = rows.filter(x => x.acked_at);
    const how = { USER: 'BY NAME', DESIGNATION: 'DESIGNATION', ALL: 'ALL' };
    $('rpBody').innerHTML = (rows.length
      ? '<div class="stats" style="margin-bottom:6px;grid-template-columns:repeat(3,1fr);"><div class="stat"><small>ASSIGNED</small><b>' + rows.length + '</b></div><div class="stat"><small>READ V' + d.version + '</small><b style="color:#15803d;">' + yes.length + '</b></div><div class="stat"><small>NOT YET</small><b style="color:#b91c1c;">' + (rows.length - yes.length) + '</b></div></div>'
        + rows.sort((a, b) => (!!a.acked_at - !!b.acked_at) || String(a.name).localeCompare(String(b.name))).map(x =>
          '<div class="rrow"><div class="nm"><b>' + esc(x.name) + '</b><small>' + esc([x.emp_code, x.designation, x.department].filter(Boolean).join(' · ') || '-') + ' · via ' + how[x.how] + '</small></div>'
          + (x.acked_at ? '<div class="rok">✓ READ<br><small style="font-weight:600;color:var(--mute);">' + esc(stamp(x.acked_at)) + '</small></div>'
            : x.last_version ? '<div class="rold">READ OLD V' + esc(x.last_version) + '</div>' : '<div class="rno">NOT READ</div>') + '</div>').join('')
      : '<div class="empty" style="box-shadow:none;">Nobody is assigned yet. Add a designation or pick users in Edit.</div>')
      + (r0.require_ack ? '' : '<div class="note warn" style="margin-top:10px;">This SOP does not ask for a reading confirmation.</div>');
  } catch (e) { $('rpBody').innerHTML = '<div class="note bad">' + esc(e.message || e) + '</div>'; }
}

/* ── Editor ────────────────────────────────────────────────────────────
   ED is the SOP being edited. Inputs write into it as they change (data-f
   on each box names the field; data-i on a step card names the step), so the
   live preview, Preview and Save all read one object. Structural changes
   (add / move / delete a step, a photo, a picture) re-draw the step list. */
let ED = null, ED_ORIG = '', ED_DIRTY = false, ED_FOCUS = -1, US_Q = '', US_SEL_ONLY = false, IC_TARGET = null;
const blankStep = () => ({ title: '', text: '', icon: 'list', image: null, tip: '', warn: '', checks: [] });
async function openEditor(id){
  busy(true, id ? 'Opening…' : 'Preparing…');
  try {
    await ensureMeta(true);
    if (id) {
      const d = await rpc('sop_get', { p_id: id });
      const s = d.sop;
      ED = { id: s.id, sop_code: s.sop_code, title: s.title, category: s.category || '', department: s.department || '', summary: s.summary || '',
             color: s.color, icon: s.icon, est_minutes: s.est_minutes, status: s.status, require_ack: s.require_ack, version: s.version,
             designations: (s.designations || []).slice(), assigned_users: (s.assigned_users || []).slice(),
             steps: (s.steps || []).map(st => Object.assign(blankStep(), st, { checks: (st.checks || []).slice() })) };
    } else {
      ED = { id: null, sop_code: '', title: '', category: '', department: '', summary: '', color: COLORS[0], icon: 'clipboard', est_minutes: 5,
             status: 'ACTIVE', require_ack: true, version: 1, designations: [], assigned_users: [], steps: [blankStep()] };
    }
  } catch (e) { busy(false); alert(e.message || e); return; }
  busy(false);
  ED_ORIG = JSON.stringify(ED.steps) + '|' + ED.title + '|' + ED.summary;
  ED_DIRTY = false; ED_FOCUS = -1; US_Q = ''; US_SEL_ONLY = false;
  $('edTitle').textContent = ED.id ? 'Edit ' + ED.sop_code + ' · V' + ED.version : 'New SOP';
  $('edDel').hidden = !ED.id;
  renderEditor();
  $('ed').hidden = false; document.body.style.overflow = 'hidden';
  $('edForm').scrollTop = 0;
}
function closeEditor(force){
  if (!force && ED_DIRTY && !confirm('Close without saving? Your changes will be lost.')) return;
  $('ed').hidden = true; ED = null; document.body.style.overflow = '';
}
function renderEditor(){
  const m = META || {};
  const dl = (id, arr) => '<datalist id="' + id + '">' + (arr || []).map(v => '<option value="' + esc(v) + '">').join('') + '</datalist>';
  $('edForm').innerHTML =
    '<div class="sec"><h4><span class="n">1</span>SOP details</h4><div class="fg">'
    + '<div class="f"><label>SOP Code</label><input data-f="sop_code" value="' + esc(ED.sop_code) + '" placeholder="' + esc(ED.id ? '' : (m.next_code || 'SOP-001') + ' (automatic)') + '" maxlength="30"><span class="h">Leave empty for the next number.</span></div>'
    + '<div class="f"><label>Status</label><select data-f="status">' + [['ACTIVE', 'Active: shown to users'], ['DRAFT', 'Draft: not shown yet'], ['INACTIVE', 'Inactive: retired']].map(([k, l]) => '<option value="' + k + '"' + (ED.status === k ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></div>'
    + '<div class="f wide"><label>Title <span class="req">*</span></label><input data-f="title" value="' + esc(ED.title) + '" placeholder="e.g. Material inward at store" maxlength="160"></div>'
    + '<div class="f"><label>Category</label><input data-f="category" list="dlCat" value="' + esc(ED.category) + '" placeholder="e.g. Store, Safety, Production"></div>'
    + '<div class="f"><label>Department</label><input data-f="department" list="dlDep" value="' + esc(ED.department) + '" placeholder="e.g. Knitting"></div>'
    + '<div class="f"><label>Time to read (minutes)</label><input data-f="est_minutes" type="number" min="1" max="600" value="' + esc(ED.est_minutes) + '"></div>'
    + '<div class="f" data-no-caps><label>Short summary</label><textarea data-f="summary" rows="2" placeholder="What this SOP is for, in one or two lines">' + esc(ED.summary) + '</textarea></div>'
    + '<div class="f"><label>Colour</label><div class="sw">' + COLORS.map(c => '<button type="button" style="background:' + c + '" class="' + (ED.color === c ? 'on' : '') + '" onclick="setColor(\'' + c + '\')" aria-label="Colour ' + c + '"></button>').join('') + '</div></div>'
    + '<div class="f"><label>Cover picture</label><button type="button" class="picbtn" onclick="pickIcon(\'cover\')"><span class="pi" style="background:' + esc(ED.color) + '1a;color:' + esc(ED.color) + '">' + icon(ED.icon, 22) + '</span>' + esc(SOP_ICONS[iconKey(ED.icon)][0]) + ' <span style="margin-left:auto;color:var(--mute);">Change ▾</span></button></div>'
    + '<div class="f wide"><label class="tog"><input type="checkbox" data-f="require_ack"' + (ED.require_ack ? ' checked' : '') + '> Users must confirm "I have read and understood"</label></div>'
    + '</div></div>'
    + '<div class="sec"><h4><span class="n">2</span>Assign to<span class="r" id="reachTop"></span></h4>'
    + '<div class="f"><label>Designations</label><div class="dchips" id="desChips"></div>'
    + '<div class="dadd"><input id="desIn" list="dlDes" placeholder="Type or pick a designation, then Enter" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addDes();}">'
    + '<button type="button" class="btn ghost" onclick="addDes()">Add</button><button type="button" class="btn ghost" onclick="toggleAll()" id="allBtn"></button></div>'
    + '<span class="h">Everyone with this designation (ERP user, or the Employee Master by Emp Code) gets this SOP, including people who join later.</span></div>'
    + '<div class="f" style="margin-top:12px;"><label>Individual users</label>'
    + '<div class="dadd" style="margin:0 0 6px;"><input id="usQ" placeholder="Search name, emp code, designation" value="' + esc(US_Q) + '" oninput="US_Q=this.value;renderUsers()">'
    + '<label class="tog" style="white-space:nowrap;"><input type="checkbox" onchange="US_SEL_ONLY=this.checked;renderUsers()"' + (US_SEL_ONLY ? ' checked' : '') + '> Picked only</label></div>'
    + '<div class="ulist" id="usList"></div></div><div class="reach" id="reach"></div></div>'
    + '<div class="sec"><h4><span class="n">3</span>Steps<span class="r">Swipe order = this order</span></h4><div id="stList"></div>'
    + '<button type="button" class="addst" onclick="addStep()">+ Add step</button></div>'
    + dl('dlCat', m.categories) + dl('dlDep', m.departments) + dl('dlDes', ['ALL'].concat(m.designations || []));
  renderDes(); renderUsers(); renderSteps(); renderPreview();
}
function setColor(c){ ED.color = c; ED_DIRTY = true; renderEditor(); }
function normDes(s){ return String(s || '').trim().replace(/\s+/g, ' ').toUpperCase(); }
function addDes(){
  const v = normDes($('desIn').value); if (!v) return;
  if (ED.designations.indexOf(v) < 0) ED.designations.push(v);
  $('desIn').value = ''; ED_DIRTY = true; renderDes(); renderUsers();
}
function delDes(i){ ED.designations.splice(i, 1); ED_DIRTY = true; renderDes(); renderUsers(); }
function toggleAll(){
  const i = ED.designations.indexOf('ALL');
  if (i >= 0) ED.designations.splice(i, 1); else ED.designations.push('ALL');
  ED_DIRTY = true; renderDes(); renderUsers();
}
function renderDes(){
  $('desChips').innerHTML = ED.designations.length
    ? ED.designations.map((d, i) => '<span class="dchip' + (d === 'ALL' ? ' all' : '') + '">' + esc(d === 'ALL' ? 'ALL EMPLOYEES' : d) + '<button type="button" onclick="delDes(' + i + ')" aria-label="Remove">✕</button></span>').join('')
    : '<span style="color:var(--mute);font-size:13px;">No designation yet</span>';
  $('allBtn').textContent = ED.designations.indexOf('ALL') >= 0 ? 'Remove "All"' : 'All employees';
}
// Why a user would get this SOP: the same rule as the server's sop_match_.
function userVia(u){
  if (ED.assigned_users.indexOf(u.id) >= 0) return 'BY NAME';
  if (ED.designations.indexOf('ALL') >= 0) return 'ALL';
  if (u.designation && ED.designations.indexOf(u.designation) >= 0) return 'DESIGNATION';
  return '';
}
function renderUsers(){
  const us = (META && META.users) || [], q = US_Q.trim().toUpperCase();
  const list = us.filter(u => (!US_SEL_ONLY || ED.assigned_users.indexOf(u.id) >= 0)
    && (!q || [u.name, u.emp_code, u.designation, u.department].some(v => String(v || '').toUpperCase().indexOf(q) >= 0)));
  $('usList').innerHTML = list.length ? list.slice(0, 400).map(u => {
    const on = ED.assigned_users.indexOf(u.id) >= 0, via = userVia(u);
    return '<label class="urow"><input type="checkbox"' + (on ? ' checked' : '') + ' onchange="toggleUser(\'' + esc(u.id) + '\',this.checked)">'
      + '<span class="nm"><b>' + esc(u.name) + '</b><small>' + esc([u.emp_code, u.designation, u.department].filter(Boolean).join(' · ') || 'No designation') + '</small></span>'
      + (via && via !== 'BY NAME' ? '<span class="via">✓ VIA ' + via + '</span>' : '') + '</label>';
  }).join('') : '<div style="padding:14px;color:var(--mute);font-size:13px;">No user matches.</div>';
  const n = us.filter(userVia).length, byName = ED.assigned_users.length;
  const txt = 'Reaches <b>' + n + '</b> user' + (n === 1 ? '' : 's') + ' now' + (byName ? ' (' + byName + ' picked by name)' : '') + '.'
    + (ED.status !== 'ACTIVE' ? ' Shown to them only when the status is Active.' : '');
  $('reach').innerHTML = txt; $('reachTop').innerHTML = n + ' users';
}
function toggleUser(id, on){
  const i = ED.assigned_users.indexOf(id);
  if (on && i < 0) ED.assigned_users.push(id); else if (!on && i >= 0) ED.assigned_users.splice(i, 1);
  ED_DIRTY = true; renderUsers();
}
function renderSteps(){
  const n = ED.steps.length;
  $('stList').innerHTML = ED.steps.map((st, i) => {
    const th = st.image ? '<img src="' + esc(st.image) + '" alt="">' : scene(st.icon, ED.color);
    return '<div class="st' + (i === ED_FOCUS ? ' focus' : '') + '" data-i="' + i + '">'
      + '<div class="st-h"><span class="no">' + (i + 1) + '</span><input data-s="title" value="' + esc(st.title) + '" placeholder="Step title, e.g. Weigh the material" maxlength="140">'
      + '<button type="button" class="ib" onclick="moveStep(' + i + ',-1)" title="Move up"' + (i === 0 ? ' disabled' : '') + '>▲</button>'
      + '<button type="button" class="ib" onclick="moveStep(' + i + ',1)" title="Move down"' + (i === n - 1 ? ' disabled' : '') + '>▼</button>'
      + '<button type="button" class="ib opt" onclick="dupStep(' + i + ')" title="Duplicate">⧉</button>'
      + '<button type="button" class="ib x" onclick="delStep(' + i + ')" title="Delete step"' + (n === 1 ? ' disabled' : '') + '>✕</button></div>'
      + '<div class="st-b"><div class="st-pic"><div class="th">' + th + '</div><div class="row">'
      + '<button type="button" class="btn ghost" onclick="pickIcon(' + i + ')">Picture</button>'
      + '<label class="btn ghost">Camera<input type="file" accept="image/*" capture="environment" onchange="addPhoto(' + i + ',this)"></label>'
      + '<label class="btn ghost">Gallery<input type="file" accept="image/*" onchange="addPhoto(' + i + ',this)"></label>'
      + (st.image ? '<button type="button" class="btn red" onclick="delPhoto(' + i + ')">Remove photo</button>' : '')
      + '</div></div><div class="st-f" data-no-caps>'
      + '<div class="f"><label>Instructions</label><textarea data-s="text" rows="4" placeholder="What to do, in simple words. Start a line with - for a bullet or 1. for a numbered point.">' + esc(st.text) + '</textarea></div>'
      + '<div class="two"><div class="f"><label>Tip (optional)</label><textarea data-s="tip" rows="2" placeholder="A helpful hint">' + esc(st.tip) + '</textarea></div>'
      + '<div class="f"><label>Caution (optional)</label><textarea data-s="warn" rows="2" placeholder="Danger or a common mistake">' + esc(st.warn) + '</textarea></div></div>'
      + '<div class="f"><label>Tick points (optional, one per line)</label><textarea data-s="checks" rows="2" placeholder="Gate entry seen&#10;Invoice received">' + esc((st.checks || []).join('\n')) + '</textarea></div>'
      + '</div></div></div>';
  }).join('');
}
// One listener for every box in the form: data-f = SOP field, data-s = step field.
$('edForm').addEventListener('input', e => {
  const el = e.target; if (!ED) return;
  if (el.dataset.f) {
    const f = el.dataset.f;
    ED[f] = el.type === 'checkbox' ? el.checked : f === 'est_minutes' ? (parseInt(el.value, 10) || '') : el.value;
    if (f === 'status') renderUsers();
  } else if (el.dataset.s) {
    const i = +el.closest('.st').dataset.i, f = el.dataset.s;
    ED.steps[i][f] = f === 'checks' ? el.value.split('\n').map(s => s.trim()).filter(Boolean) : el.value;
  } else return;
  ED_DIRTY = true; schedulePreview();
});
$('edForm').addEventListener('change', e => { if (e.target.dataset.f === 'require_ack' || e.target.dataset.f === 'status') e.target.dispatchEvent(new Event('input', { bubbles: true })); });
// The preview follows the step being typed into; the details show the cover.
$('edForm').addEventListener('focusin', e => {
  const st = e.target.closest && e.target.closest('.st');
  const i = st ? +st.dataset.i : -1;
  if (i === ED_FOCUS) return;
  ED_FOCUS = i;
  document.querySelectorAll('#stList .st').forEach(x => x.classList.toggle('focus', +x.dataset.i === i));
  renderPreview();
});
let prevT = null;
function schedulePreview(){ clearTimeout(prevT); prevT = setTimeout(renderPreview, 180); }
function draftSop(){
  return Object.assign({}, ED, { sop_code: ED.sop_code || (META && META.next_code) || 'NEW', title: ED.title || 'Untitled SOP',
    steps: ED.steps.map(s => Object.assign({}, s, { title: s.title || 'Untitled step' })) });
}
function renderPreview(){
  if (!ED || getComputedStyle(document.querySelector('.ed-prev')).display === 'none') return;
  // The player's slide builders read P, so a throwaway P is set up for them.
  const keep = P, d = draftSop();
  P = { sop: d, steps: d.steps, n: d.steps.length + 2, idx: 0, preview: true, checks: {} };
  const i = ED_FOCUS;
  $('edPrev').style.setProperty('--c', d.color);
  $('edPrev').innerHTML = i >= 0 && d.steps[i] ? slideStep(d.steps[i], i) : slideCover();
  $('edPrevCap').textContent = i >= 0 ? 'Live preview · step ' + (i + 1) : 'Live preview · cover';
  P = keep;
}
function addStep(){ ED.steps.push(blankStep()); ED_FOCUS = ED.steps.length - 1; ED_DIRTY = true; renderSteps(); renderPreview();
  const el = document.querySelector('#stList .st:last-child input'); if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.focus({ preventScroll: true }); } }
function moveStep(i, d){ const j = i + d; if (j < 0 || j >= ED.steps.length) return; [ED.steps[i], ED.steps[j]] = [ED.steps[j], ED.steps[i]]; ED_FOCUS = j; ED_DIRTY = true; renderSteps(); renderPreview(); }
function dupStep(i){ ED.steps.splice(i + 1, 0, JSON.parse(JSON.stringify(ED.steps[i]))); ED_FOCUS = i + 1; ED_DIRTY = true; renderSteps(); renderPreview(); }
function delStep(i){
  const st = ED.steps[i];
  if ((st.title || st.text || st.image) && !confirm('Delete step ' + (i + 1) + (st.title ? ' "' + st.title + '"' : '') + '?')) return;
  ED.steps.splice(i, 1); ED_FOCUS = -1; ED_DIRTY = true; renderSteps(); renderPreview();
}
function pickIcon(target){
  IC_TARGET = target;
  const cur = target === 'cover' ? ED.icon : ED.steps[target].icon;
  $('icGrid').innerHTML = Object.keys(SOP_ICONS).map(k => '<button type="button" class="' + (k === cur ? 'on' : '') + '" onclick="setIcon(\'' + k + '\')">' + icon(k, 30, 1.6) + SOP_ICONS[k][0] + '</button>').join('');
  $('icDlg').hidden = false;
}
function setIcon(k){
  if (IC_TARGET === 'cover') { ED.icon = k; $('icDlg').hidden = true; ED_DIRTY = true; renderEditor(); return; }
  const st = ED.steps[IC_TARGET]; st.icon = k;
  // Picking a picture on a step that has a photo would do nothing visible, so ask.
  if (st.image && confirm('This step has a photo, which is shown instead of the picture. Remove the photo?')) st.image = null;
  ED_FOCUS = IC_TARGET; $('icDlg').hidden = true; ED_DIRTY = true; renderSteps(); renderPreview();
}
function compress(f){
  return new Promise(res => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', PHOTO_JPEG_Q));
      } catch (e) { URL.revokeObjectURL(url); res(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(null); };
    img.src = url;
  });
}
async function addPhoto(i, inp){
  const f = inp.files && inp.files[0]; inp.value = '';
  if (!f || !/^image\//.test(f.type)) return;
  busy(true, 'Processing photo…');
  const d = await compress(f); busy(false);
  if (!d) return alert('This photo could not be read. Please try another one.');
  ED.steps[i].image = d; ED_FOCUS = i; ED_DIRTY = true; renderSteps(); renderPreview();
}
function delPhoto(i){ ED.steps[i].image = null; ED_FOCUS = i; ED_DIRTY = true; renderSteps(); renderPreview(); }
function previewDraft(){
  if (!ED) return;
  openPlayer(draftSop(), { preview: true });
  if (ED_FOCUS >= 0) requestAnimationFrame(() => go(ED_FOCUS + 1, true));
}
function validateEd(){
  if (!String(ED.title || '').trim()) { const el = document.querySelector('[data-f=title]'); el.scrollIntoView({ block: 'center' }); el.focus(); return ERR_TEXT.TITLE_REQUIRED; }
  if (!ED.steps.length) return ERR_TEXT.STEPS_REQUIRED;
  const bad = ED.steps.findIndex(s => !String(s.title || '').trim());
  if (bad >= 0) { const el = document.querySelectorAll('#stList .st input[data-s=title]')[bad]; if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); } return 'Step ' + (bad + 1) + ': ' + ERR_TEXT.STEP_TITLE_REQUIRED; }
  if (JSON.stringify(ED.steps).length > STEPS_WARN_BYTES) return ERR_TEXT.TOO_BIG;
  return '';
}
function saveSop(){
  const err = validateEd(); if (err) return alert(err);
  if (!ED.designations.length && !ED.assigned_users.length && ED.status === 'ACTIVE'
      && !confirm('This SOP is not assigned to anyone yet, so nobody will see it. Save anyway?')) return;
  const changed = (JSON.stringify(ED.steps) + '|' + ED.title + '|' + ED.summary) !== ED_ORIG;
  // A content change on a saved SOP: new version, or a correction? The user decides.
  if (ED.id && changed && ED.require_ack) { $('verNext').textContent = ED.version + 1; $('verCur').textContent = ED.version; $('verDlg').hidden = false; return; }
  doSave(false);
}
async function doSave(bump){
  $('verDlg').hidden = true;
  const b = $('edSave'); b.disabled = true;
  busy(true, 'Saving SOP…');
  try {
    const d = await rpc('sop_save', { p_sop: ED, p_bump: !!bump });
    closeEditor(true);
    toast('Saved ' + d.sop_code + ' · V' + d.version);
    await loadMaster();
  } catch (e) { alert(e.message || e); }
  finally { busy(false); b.disabled = false; }
}
async function deleteSop(){
  if (!ED || !ED.id) return;
  if (!confirm('Delete ' + ED.sop_code + ' "' + ED.title + '" for good?\n\nIts reading record is deleted too. To only stop showing it, set the status to Inactive instead.')) return;
  busy(true, 'Deleting…');
  try { await rpc('sop_delete', { p_id: ED.id }); closeEditor(true); toast('Deleted'); await loadMaster(); }
  catch (e) { alert(e.message || e); } finally { busy(false); }
}
// Unsaved work is not lost to a stray tab close.
window.addEventListener('beforeunload', e => { if (ED && ED_DIRTY) { e.preventDefault(); e.returnValue = ''; } });

/* Log out ends the session in EVERY app (one login for all), so it is asked first. */
function askLogout(){
  if (!confirm('Do you want to Log out?\n\nYou will be logged out of all apps.')) return;
  SARV_GATE.logout({ url: SUPABASE_URL, key: SUPABASE_ANON });
}

/* ── Boot ──────────────────────────────────────────────────────────── */
(async function boot(){
  // No app key: My SOPs is for everyone with a session; the server decides what each one gets.
  await SARV_GATE.boot({ url: SUPABASE_URL, key: SUPABASE_ANON, app: null, label: 'SOPs' });
  ME = { name: (SARV_GATE.user || {}).name };
  MODE = modeFromHash();
  paintHeader();
  try { await reload(); }
  finally { if (window.sarvSsoPrebootDone) window.sarvSsoPrebootDone(); }
  // A newly assigned SOP shows up without a refresh; never while one is open.
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !P && !ED) reload(); });
})();
</script>
