<!--
  FMS TRACKING (launcher app HOME_FMS_TRACKING; server sql/FMS_TRACKING_MIGRATION.sql, read only)
    Two flows, one row per document, every step with PLANNED time, ACTUAL time, who did it / who has to, and delay:
      INWARD    (2026-11-26) a FIELD BOY PR (no PO): PR Entry → Field Boy Pickup (item photos, mobile.html) → Requester
                Approval (my-requests.html) → Gate In …; every other PR:
                PR Entry → Vendor Info → PO Generated → MD Approval (PO) → Sent to Vendor (delivery date +
                every follow-up, received / ordered) → Gate In → Gate Approval → Unloader → Store Inward → MD Approval (if asked) → GM Bill Check →
                EA Bill Check → MD-1 Bill Check → Debit Note (if raised; the Accounts Check waits for it) → Accounts Check        (fmt_inward)
      DISPATCH  Dharam Kanta (Tare) → Loading (every packing slip / waste bill with its time) → Outward Dharam
                Kanta (Gross) → Dispatch Approval (if asked) → Gate Out                            (fmt_dispatch)
    A step COMPLETES BY ITSELF: the server reads the ERP / gate / packing records; nothing is typed here.
    Planned = the previous step's actual + the step's TAT (hours; Admin › TAT settings, fmt_tat_save with the Admin
    PIN, defaults in TAT_DEF). A step not recorded while a later one is done = "Skipped" (old records, a route
    without it), so it never blocks the row. Filters: dates, unit, status, "waiting at" step, search; list or table;
    CSV. Re-read every 60 s while on screen (a report, not on the 5 s timer). Without the migration: a note only.
-->

<script>
const SUPABASE_URL = "https://jdlzgjgxxjkjejkhvdij.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkbHpnamd4eGpramVqa2h2ZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODUwMDcsImV4cCI6MjEwNTY2MTAwN30.ow4i6e78i-dGoJJh2-N4FX6EQE7f2FRQDgCMJHpxAWk";
const APP_KEY = 'HOME_FMS_TRACKING';
const REFRESH_MS = 60000;   // a report: every minute while on screen (not the 5 s timer)
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

/* ── THE TWO FLOWS ───────────────────────────────────────────────────────────────────────────────
   Each step: code, label, who works on it (doer), default TAT hours (planned = previous actual + TAT) and
   read(row) → { st, at, by, lines[], need } from the server's row:
     st: 'done' | 'wait' (not done yet) | 'na' (not needed for this row) | 'hold' | 'rej'   (late / overdue / skipped
     are worked out after, from the planned time and the later steps). */
const TAT_DEF = {
  inward:   { FB_PICK: 24, FB_APPR: 24, VENDOR: 24, PO_GEN: 24, PO_MD: 24, PO_SENT: 12, GATE_IN: 72, GATE_APPR: 1, UNLOADER: 2, STORE: 4, MD_APPR: 4, GM: 24, EA: 24, MD1: 24, AC: 24, DEBIT: 48 },
  dispatch: { LOADING: 6, DK_GROSS: 2, DISP_APPR: 1, GATE_OUT: 1 }
};
const tim = v => v ? new Date(v) : null;
const chk = (r, k) => ((r.steps || {}).CHECK || {})[k] || null;
const checkStep = (code, label, doer) => ({ code, label, doer, read: r => {
  if (r.cancelled) return { st: 'na', lines: ['Record cancelled'] };
  if (!r.docId) return { st: 'wait' };
  const c = chk(r, code);
  if (!c) return { st: 'wait' };
  if (c.status === 'OKAY') return { st: 'done', at: tim(c.at), by: c.by, lines: c.remarks ? ['Remarks: ' + c.remarks] : [] };
  if (c.status === 'HOLD') return { st: 'hold', at: tim(c.at), by: c.by, lines: ['On HOLD' + (c.remarks ? ': ' + c.remarks : '')] };
  return { st: 'wait', lines: [c.status] };
} });
/* PURCHASE STEPS (2026-11-26): r.prpo = {prs:[…], pos:[…]} from the server (fmt_prpo_), each record with its own time,
   person and remarks. A step is done when EVERY PO / PR of the row has done it (its time = the last one); its records are
   listed under the step (items) with their times, persons and remarks. A row without PO / PR = these steps not needed. */
const PO_PAST_MD = ['MD Approved', 'Vendor Verified', 'Partially Received', 'Received', 'Closed (Short)'];
const prsOf = r => (r.prpo && r.prpo.prs) || [], posOf = r => (r.prpo && r.prpo.pos) || [];
/* FIELD BOY (2026-11-26): a row whose PR(s) are Field Boy PRs and that has no PO goes PR Entry → Field Boy Pickup →
   Requester Approval → Gate; Vendor Info / PO / MD / Sent are "not needed" there, the two Field Boy steps everywhere else. */
const fbPrs = r => prsOf(r).filter(p => p.fb);
const isFbRow = r => fbPrs(r).length > 0 && !posOf(r).length;
const FB_ST = { NEW: 'not bought yet', PHOTO: 'photo taken, not sent', SENT: 'sent to the requester', APPROVED: 'approved by the requester', REJECTED: 'sent back by the requester' };
const fbHist = p => ((p.fb && p.fb.history) || []).filter(h => h && typeof h === 'object');
const hItems = h => (h.items || []).filter(Boolean).join(', ');
const maxAt = list => list.reduce((m, d) => (d && (!m || d > m)) ? d : m, null);
const minAt = list => list.reduce((m, d) => (d && (!m || d < m)) ? d : m, null);
const sigTxt = (g, w) => [w || '', g && g.by ? 'by ' + g.by + (g.as ? ' (' + g.as + ')' : '') : '', g && g.remarks ? '· Remarks: ' + g.remarks : ''].filter(Boolean).join(' ');
const dmy = v => { if (!v) return ''; const d = new Date(String(v).length <= 10 ? v + 'T00:00:00' : v); return isNaN(d) ? String(v) : p2(d.getDate()) + '-' + p2(d.getMonth() + 1) + '-' + d.getFullYear(); };
const PURCHASE_STEPS = [
  { code: 'PR', label: 'PR Entry', doer: 'Requester', read: r => {
      const prs = prsOf(r); if (!prs.length) return { st: 'na', lines: [r.prpo ? 'No PR linked' : 'No PO / PR on this entry'] };

  ['fFrom', 'fTo', 'fUnit'].forEach(id => $(id).addEventListener('change', () => { saveUi(); S.rows = { inward: null, dispatch: null }; load(); }));
  ['fStep', 'fSort'].forEach(id => $(id).addEventListener('change', () => { saveUi(); paint(); }));
  $('fQ').addEventListener('input', () => { clearTimeout(boot.t); boot.t = setTimeout(paint, 200); });
  $('quick').addEventListener('click', ev => { const b = ev.target.closest('[data-q]'); if (!b) return; S.quick = b.getAttribute('data-q'); paint(); });
  $('stats').addEventListener('click', ev => { const t = ev.target.closest('[data-step]'); if (!t) return; $('fStep').value = $('fStep').value === t.getAttribute('data-step') ? '' : t.getAttribute('data-step'); paint(); });
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { S.view = b.getAttribute('data-view'); saveUi(); paint(); }));
  $('out').addEventListener('click', ev => { const t = ev.target.closest('[data-i]'); if (t) showRow(S.ev[Number(t.getAttribute('data-i'))]); });
  $('dim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetOpen()) closeSheet(); });
  $('bRefresh').addEventListener('click', () => load());
  $('bCsv').addEventListener('click', csv);
  $('bTat').addEventListener('click', openTat);
  window.addEventListener('scroll', () => $('nav').classList.toggle('scrolled', window.scrollY > 4), { passive: true });
  await load();
  setInterval(() => { if (!document.hidden && !sheetOpen() && navigator.onLine !== false && !(document.activeElement && document.activeElement.id === 'fQ')) load(true); }, REFRESH_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - S.at > REFRESH_MS) load(true); });
})();
</script>

<script src="app-back.js"></script>
