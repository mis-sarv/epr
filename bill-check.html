<!DOCTYPE html>
<html lang="en">
<head><script src="offline-sync.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Bill Check</title>
<!-- First, so a logged-in user never sees a flash of anything else. -->
<script src="sso-preboot.js"></script>
<script src="sso-gate.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<!--
  BILL CHECK: the inbox of the bill check pipeline
  GM > EA > MD-1 > MD-2 > Accounts, then a Debit Note (raised by MD-1 / MD-2,
  verified by the Accountant with proof files).

  The same data as ERP › Print History / Reports › Preview, in its own app:
    - To Check  the records waiting at a step THIS user may do, shown on their
                own (grouped by step; a step needs every earlier one OKAY).
    - Done      the records this user has passed.
    - Debit     Debit Notes: waiting for verification / verified.
    - All       every record and where it stands (read only unless it is theirs).
  Tapping a record opens the pipeline sheet: attachments strip (Store PDF,
  Actual Bill, Unloader photos, Field Boy photos), the whole pipeline, the
  user's own step and the Debit Note. OKAY is possible only after every page /
  photo has been looked at in the viewer (HOLD any time).

  LOGIN = ERP LOGIN (launcher.html), app key HOME_BILL_CHECK. Everything that
  changes data goes through the token-checked scs_* functions of
  sql/STORE_CHECK_PIPELINE_MIGRATION.sql, which decide the rights again on the
  server (RPT_CHK_<step>, RPT_DEBIT_RAISE / RPT_DEBIT_VERIFY). The list itself
  is read like the ERP reads it (inward_entries / outward_entries with the
  anon key); nothing here can check a step the server does not allow.

  LOOK = iOS: grouped inset lists, large title, segmented control, card
  sheets with the page scaling behind, action sheets and alerts, springs,
  light / dark with the device. The pipeline (codes, labels, order) and the
  rights come from the server (scs_get), so a new step needs no change here.
  This page loads no caps-input.js on purpose: remarks keep the case typed.

  ACCOUNTANT COPY: a Store entry saves only its Supplier Copy; the ERP keeps a clean
  Accountant Copy base aside (store_account_copy, sql/STORE_ACCOUNT_COPY_MIGRATION.sql).
  A step that signs (GM, MD-1, MD-2: 'sign' in the server's flow) asks the checker's OWN
  PIN when passing the bill (OKAY / DEBIT), and then stamps their saved signature, name +
  time and the check remark onto the LATEST copy with pdf-lib (CHECK REMARKS box under the
  signatures); the next step receives that updated copy, and ERP › Preview shows it.
  HOLD signs nothing. A bill from before this feature has no base: it is checked as before.
-->
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--card2:#f9f9fb;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.18);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);
  --blue:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--purple:#af52de;--teal:#30b0c7;--gray:#8e8e93;
  --blur:saturate(180%) blur(22px);--bar:rgba(249,249,249,.82);--scrim:rgba(0,0,0,.4);
  --spring:cubic-bezier(.32,.72,0,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#40c8e0;--gray:#98989d;
  --bar:rgba(29,29,31,.82);--scrim:rgba(0,0,0,.6);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--label);overscroll-behavior:none}
body{font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",system-ui,Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.011em;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;letter-spacing:inherit;user-select:text;-webkit-user-select:text}
svg{display:block}
#app{position:fixed;inset:0;background:var(--bg);overflow:hidden;transform-origin:50% 0;
  transition:transform .5s var(--spring),border-radius .5s var(--spring),filter .5s var(--spring)}
body.sheeted #app{transform:translateY(calc(var(--sat) + 8px)) scale(.925);border-radius:12px;filter:brightness(.82)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ── navigation bar + large title ── */
.nav{position:absolute;top:0;left:0;right:0;z-index:5;padding-top:var(--sat);background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.nav .row{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;max-width:760px;margin:0 auto}
.nav .ttl{position:absolute;left:0;right:0;text-align:center;font-weight:600;font-size:17px;pointer-events:none}
.nbtn{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;padding:8px;border-radius:10px;min-width:44px;transition:opacity .15s}
.nbtn:active{opacity:.35}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(180deg,#a2a2a8,#7d7d83);color:#fff;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;margin:0 4px}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-top:calc(var(--sat) + 44px + var(--ctrl-h,172px));padding-bottom:calc(var(--sab) + 40px)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.large{font-size:34px;font-weight:700;letter-spacing:.012em;margin:2px 0 6px;transition:opacity .2s}
.sub{color:var(--label2);font-size:15px;margin:0 0 12px}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--label2)}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--fill2);border-top-color:var(--label2);animation:sp .8s linear infinite;margin-bottom:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── search + segmented control ── */
.search{display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:36px;padding:0 8px;color:var(--label2);margin-bottom:10px}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:17px}
.search input::placeholder{color:var(--label2)}
.search .x{width:18px;height:18px;border-radius:50%;background:var(--label3);color:var(--bg);display:none;align-items:center;justify-content:center}
.search.has .x{display:flex}
.seg{position:relative;display:grid;background:var(--fill);border-radius:9px;padding:2px;height:32px}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;border-radius:7px;background:var(--card);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .35s var(--spring)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg .thumb{background:#636366}}
.seg button{position:relative;z-index:1;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:7px;white-space:nowrap}
.seg button.on{font-weight:600}
.seg .bdg{min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.seg .bdg.q{background:var(--label3)}
.ctrl{position:absolute;left:0;right:0;top:calc(var(--sat) + 44px);z-index:4;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep);padding:8px 0 10px}
.ctrl .in{max-width:760px;margin:0 auto;padding:0 16px;display:flex;flex-direction:column;gap:8px}
.ctrl .chips{padding:0 16px;margin:0 -16px}
.ctrl .search{margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 2px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 13px;border-radius:15px;background:var(--fill);font-size:14px;font-weight:500;display:flex;align-items:center;transition:background .2s,color .2s,transform .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--blue);color:#fff}
.chip.sp{width:1px;padding:0;background:var(--sep);height:20px;align-self:center;border-radius:0}

/* ── grouped inset lists ── */
.sec{margin:22px 0 0}
.sec>h3{margin:0 0 6px 16px;font-size:13px;font-weight:400;text-transform:uppercase;color:var(--label2);letter-spacing:-.003em;display:flex;align-items:center;gap:8px}
.sec>h3 .n{background:var(--fill);border-radius:9px;padding:0 7px;font-size:12px;color:var(--label2)}
.sec>.foot{margin:6px 16px 0;font-size:13px;color:var(--label2)}
.grp{background:var(--card);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:44px;width:100%;text-align:left;transition:background .15s}
button.cell:active,.cell.tap:active{background:var(--fill)}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.cell.rec{padding-left:14px;animation:rise .45s var(--spring) both;animation-delay:calc(var(--i,0)*28ms)}
.cell.rec+.cell.rec::before{left:62px}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ico{flex:none;width:38px;height:38px;border-radius:9px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;letter-spacing:.02em}
.mid{flex:1;min-width:0}
.mid .t{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid .s{color:var(--label2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.end{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.end .d{color:var(--label2);font-size:13px}
.end .a{font-size:14px;font-weight:500}
.chev{flex:none;color:var(--label3)}
.dbn{margin-top:6px;padding:4px 8px;border-radius:7px;background:rgba(255,59,48,.12);color:var(--red);font-size:12.5px;font-weight:600;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pdots{display:flex;gap:3px;margin-top:5px}
.pdots i{width:15px;height:4px;border-radius:2px;background:var(--fill2)}
.pdots i.ok{background:var(--green)}.pdots i.hold{background:var(--orange)}.pdots i.next{background:var(--blue)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:rgba(52,199,89,.16);color:var(--green)}.pill.hold{background:rgba(255,149,0,.16);color:var(--orange)}
.pill.red{background:rgba(255,59,48,.14);color:var(--red)}.pill.blue{background:rgba(0,122,255,.14);color:var(--blue)}.pill.gray{background:var(--fill);color:var(--label2)}
.empty{text-align:center;padding:64px 24px;color:var(--label2);animation:rise .5s var(--spring) both}
.empty .ring{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;background:var(--fill);display:flex;align-items:center;justify-content:center;color:var(--label2)}
.empty b{display:block;font-size:20px;color:var(--label);margin-bottom:4px}
.more{display:block;margin:14px auto 0;color:var(--blue);font-size:15px;padding:8px 16px}
.skel .cell{pointer-events:none}
.sk{background:linear-gradient(90deg,var(--fill) 25%,var(--fill2) 37%,var(--fill) 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:6px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:14px;color:var(--label2)}
.banner b{color:var(--label)}

/* ── sheets ── */
.layer{position:fixed;inset:0;z-index:50;pointer-events:none}
.layer>*{pointer-events:auto}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .4s var(--spring)}
.scrim.in{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;width:min(100%,680px);height:calc(100% - var(--sat) - 10px);background:var(--bg);border-radius:12px 12px 0 0;
  display:flex;flex-direction:column;overflow:hidden;transform:translate(-50%,100%);transition:transform .5s var(--spring);box-shadow:0 -2px 20px rgba(0,0,0,.25)}
.sheet.in{transform:translate(-50%,0)}
.sheet.drag{transition:none}
.sheet.small{height:auto;max-height:calc(100% - var(--sat) - 40px);background:var(--bg)}
.shead{flex:none;position:relative;padding:8px 8px 0;background:var(--bar);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:0 .5px 0 var(--sep);touch-action:none;z-index:2}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:0 auto 4px}
.shead .row{height:44px;display:flex;align-items:center;justify-content:space-between}
.shead .row .tt{position:absolute;left:70px;right:70px;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(var(--sab) + 28px)}
.hero{background:var(--card);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center}
.hero .ico{width:52px;height:52px;border-radius:12px;font-size:13px}
.hero .no{font-size:22px;font-weight:700;letter-spacing:.01em}
.hero .pt{color:var(--label2);font-size:15px;margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 16px;font-size:15px;position:relative}
.kv+.kv::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.kv span:first-child{color:var(--label2);flex:none}.kv span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
.film{display:flex;gap:10px;overflow-x:auto;padding:12px 14px;scroll-snap-type:x proximity;scrollbar-width:none}
.film::-webkit-scrollbar{display:none}
.th{flex:none;width:92px;scroll-snap-align:start;text-align:center;font-size:11px;color:var(--label2);transition:transform .15s}
.th:active{transform:scale(.94)}
.th .im{position:relative;width:92px;height:116px;border-radius:9px;background:var(--fill);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 .5px var(--sep)}
.th .im img,.th .im canvas{width:100%;height:100%;object-fit:cover}
.th .tick{position:absolute;right:5px;bottom:5px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:none;align-items:center;justify-content:center;animation:pop .35s var(--spring)}
.th.seen .tick{display:flex}
.th .lb{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.prog{padding:4px 16px 14px}
.prog .tx{display:flex;justify-content:space-between;font-size:14px;margin-bottom:7px}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px;transition:width .6s var(--spring)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:13px;background:var(--blue);color:#fff;font-weight:600;font-size:17px;transition:transform .15s,opacity .2s,filter .15s}
.btn:active{transform:scale(.97);filter:brightness(.9)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.gray{background:var(--fill);color:var(--blue)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange)}
.btn.sm{height:36px;font-size:15px;border-radius:10px;width:auto;padding:0 16px}
.gap{height:10px}
/* timeline */
.tl{padding:6px 0}
.step{position:relative;display:flex;gap:13px;padding:10px 16px}
.step .dot{position:relative;flex:none;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--fill2);z-index:1}
.step .dot.ok{background:var(--green)}.step .dot.hold{background:var(--orange)}.step .dot.next{background:var(--blue)}.step .dot.red{background:var(--red)}
.step .dot.next::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--blue);opacity:.5;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.7}100%{transform:scale(1.5);opacity:0}}
.step:not(:last-child)::before{content:"";position:absolute;left:29px;top:36px;bottom:-8px;width:2px;background:var(--fill2)}
.step.done:not(:last-child)::before{background:var(--green)}
.step .bd{flex:1;min-width:0;padding-top:3px}
.step .bd b{font-size:16px;font-weight:600}
.step .bd small{display:block;color:var(--label2);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.me{margin-left:6px;vertical-align:1px}
.pf{display:flex;flex-wrap:wrap;gap:10px;padding:4px 16px 14px}
.pf .it{position:relative;width:84px;border-radius:9px;background:var(--fill);overflow:hidden;font-size:10.5px;color:var(--label2);text-align:center}
.pf .it img{display:block;width:100%;height:84px;object-fit:cover}
.pf .it .pd{height:84px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--red);font-size:16px}
.pf .it span{display:block;padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf .it .rm{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center}
.pad{padding:12px 16px}
.field{width:100%;border:0;outline:0;background:var(--fill);border-radius:10px;padding:11px 12px;font-size:17px;resize:none}
.field+.field{margin-top:8px}
.seg2{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;height:44px}
.seg2 .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:8px;transition:transform .35s var(--spring),background .25s}
.seg2 button{position:relative;z-index:1;font-weight:600;font-size:16px;opacity:.6;transition:opacity .2s,color .2s}
.seg2 button.on{opacity:1;color:#fff}
.seg2 button:disabled{opacity:.25}
.note{font-size:13px;color:var(--label2);margin:8px 4px 0;line-height:1.35}
.note.warn{color:var(--orange)}

/* ── viewer ── */
.viewer{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column;opacity:0;transform:scale(1.04);transition:opacity .3s var(--spring),transform .4s var(--spring)}
.viewer.in{opacity:1;transform:none}
.vbar{flex:none;padding:calc(var(--sat) + 4px) 8px 8px;display:flex;align-items:center;justify-content:space-between;background:rgba(28,28,30,.78);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);position:relative;z-index:3}
.vbar .nbtn{color:#0a84ff}
.vbar .vt{position:absolute;left:84px;right:84px;text-align:center;min-width:0}
.vbar .vt b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbar .vt small{display:block;font-size:12px;color:rgba(235,235,245,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.car{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.car::-webkit-scrollbar{display:none}
.car.lock{overflow-x:hidden}
.vs{flex:none;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-x;position:relative}
.vs.zoomed{touch-action:none}
.vs>.vi{max-width:100%;max-height:100%;object-fit:contain;background:#fff;border-radius:2px;transform-origin:50% 50%;will-change:transform;-webkit-user-drag:none}
.vs.anim>.vi{transition:transform .35s var(--spring)}
.vs .msg{max-width:320px;text-align:center;color:rgba(235,235,245,.7);font-size:15px;padding:20px}
.vs .msg b{display:block;color:#fff;font-size:19px;margin-bottom:6px}
.vs .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vs .ld .spin{border-color:rgba(255,255,255,.2);border-top-color:#fff;width:28px;height:28px}
.vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:44px;height:44px;border-radius:50%;background:rgba(60,60,67,.7);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#fff;display:none;align-items:center;justify-content:center}
.vnav.l{left:12px}.vnav.r{right:12px}
@media (hover:hover) and (pointer:fine){.vnav{display:flex}.vnav:disabled{opacity:.25}}

<script>
'use strict';
const SUPABASE_URL  = "https://jdlzgjgxxjkjejkhvdij.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkbHpnamd4eGpramVqa2h2ZGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwODUwMDcsImV4cCI6MjEwNTY2MTAwN30.ow4i6e78i-dGoJJh2-N4FX6EQE7f2FRQDgCMJHpxAWk";
const APP_KEY = 'HOME_BILL_CHECK';
/* Only records saved on or after this day are checked here; older ones stay hidden (Print History in the ERP still has them).
   One place to change it. Saved time (created_at), India time, so a back-dated entry saved today still shows. */
const CHECK_FROM = '2026-11-17T00:00:00+05:30';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const buzz = (n) => { try { navigator.vibrate && navigator.vibrate(n || 8); } catch (e) {} };

/* ── Icons (SF Symbols look: thin round strokes) ── */
const IC = {
  chev:'<svg width="8" height="14" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>',

  doc:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  inbox:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/></svg>',
  done:'<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  eye:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'
};

/* ══ State ═════════════════════════════════════════════════════════════ */
const FLOW0 = [{code:'GM',label:'GM Bill Check',short:'GM'},{code:'EA',label:'EA Bill Check',short:'EA'},{code:'MD1',label:'MD-1 Bill Check',short:'MD1'},{code:'MD2',label:'MD-2 Bill Check',short:'MD2'},{code:'AC',label:'Accounts Check',short:'AC'}];
const S = {
  user:null, flow:FLOW0, can:null, missing:false, rows:[], loaded:false, loading:false,
  seg:'TODO', type:'ALL', store:'ALL', q:'', days:60, show:{},
  map:{},                 // 'inward:12' -> pipeline row from scs_get
  att:{},                 // key -> {state, slides, errs}
  seen:{}                 // key -> Set of slide numbers looked at in the viewer
};
const TYPE_LOOK = { 'INWARD':['IN','#0a84ff'], 'INWARD NB':['NB','#ff3b30'], 'OUTWARD':['OUT','#34c759'], 'ISSUE':['ISS','#af52de'] };
const ERR = {
  NOT_ALLOWED:'You do not have the right for this ({x}). Ask the Admin (Admin Panel › Users › Manage access).',
  WAIT_PREV:'Not yet: {x} must be OKAY first.', REMARK_REQUIRED:'Write a reason of at least 3 letters.',
  CANCELLED:'This record is cancelled.', NOT_FOUND:'This record was not found. Refresh the list.',
  DEBIT_EXISTS:'A Debit Note is already raised on this record.', WRONG_STATE:'The Debit Note is not in the state this needs. Refresh.',
  PROOF_REQUIRED:'Attach at least one proof (photo / PDF) first.', DEBIT_PENDING:'A Debit Note is waiting for the Accountant. Verify it first.', PIN_INVALID:'Incorrect PIN.', NO_BASE:'This bill has no Accountant Copy to stamp.',
  DEBIT_NO_REQUIRED:'Enter the Debit No.', AMOUNT_REQUIRED:'Enter the Debit amount (more than 0).', BAD_STATUS:'This choice is not possible on this step.', BAD_FILE:'Only a photo or a PDF can be attached.',
  FILE_TOO_BIG:'That file is too big. Use a smaller photo / PDF.', TOO_MANY_FILES:'At most 6 proof files per Debit Note.'
};
const SESSION_ERR = { NO_TOKEN:1, NO_SESSION:1, SESSION_REVOKED:1, SESSION_EXPIRED:1, USER_INACTIVE:1 };

/* ══ Server ════════════════════════════════════════════════════════════ */
async function rest(path, extra){
  let r;
  try { r = await fetch(SUPABASE_URL + '/rest/v1/' + path, { headers: Object.assign({ apikey:SUPABASE_ANON, Authorization:'Bearer ' + SUPABASE_ANON }, extra || {}) }); }
  catch (e) { throw new Error('Could not reach the server. Check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status)); e.code = d && d.code; throw e; }
  return d || [];
}
async function restAll(path, max){          // PostgREST stops at 1000 rows a response: page it
  let all = [];
  for (let from = 0; from < (max || 1400); from += 1000) {
    const part = await rest(path, { 'Range-Unit':'items', Range: from + '-' + (from + 999) });
    all = all.concat(part);
    if (part.length < 1000) break;
  }
  return all;
}
async function rpc(fn, args){
  let r;
  try { r = await fetch(SUPABASE_URL + '/rest/v1/rpc/' + fn, { method:'POST',
      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON, Authorization:'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify(Object.assign({ p_token: SARV_GATE.token }, args || {})) }); }
  catch (e) { throw new Error('Could not reach the server. Check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
    e.code = d && d.code; e.missing = e.code === 'PGRST202' || e.code === '42883' || e.code === '42P01'; throw e;
  }
  if (d && d.success === false) {
    const c = String(d.error || '');
    if (SESSION_ERR[c]) { location.replace('launcher.html?why=' + c); return new Promise(() => {}); }
    const e = new Error((ERR[c] || c || 'Unknown error').replace('{x}', d.detail || 'this step')); e.code = c; throw e;
  }
  return d;
}

/* ══ Pipeline rules (same as ERP › Print History) ══════════════════════ */
const rowOf = r => S.map[r.key] || null;
const stepOf = (r, code) => ((rowOf(r) || {}).steps || {})[code] || null;
const debitOf = r => { const d = (rowOf(r) || {}).debit; return d && d.status !== 'WITHDRAWN' ? d : null; };
const labelOf = c => c === 'DEBIT' ? 'Debit Note' : ((S.flow.find(s => s.code === c) || {}).label || c);
const canDo = (code, store) => !!(S.can && S.can[code] && S.can[code][store || 'STORE 2']);
function stageOf(r){ for (const s of S.flow) { const x = stepOf(r, s.code); if (!x || x.status !== 'OKAY') return { step:s, hold:!!x && x.status === 'HOLD' }; } return { step:null, hold:false }; }
function prevOk(r, code){ for (const s of S.flow) { if (s.code === code) return { ok:true }; const x = stepOf(r, s.code); if (!x || x.status !== 'OKAY') return { ok:false, label:s.label }; } return { ok:true }; }
function mineStep(r){                         // the step this record waits at, when it is this user's
  if (r.cancelled) return null;
  const st = stageOf(r);
  return st.step && canDo(st.step.code, r.store) ? st : null;
}
function doneStep(r){                         // the latest step of this user's that is OKAY
  let hit = null;
  S.flow.forEach(s => { const x = stepOf(r, s.code); if (x && x.status === 'OKAY' && canDo(s.code, r.store)) hit = s; });
  return hit;
}

/* ══ Data ══════════════════════════════════════════════════════════════ */
const isCancelled = n => String(n || '').startsWith('CANCELLED');
async function loadList(){
  if (S.loading) return; S.loading = true;
  try {
    const since = encodeURIComponent(new Date(CHECK_FROM).toISOString());
    const inSel = 'id,document_no,entry_type,receiving_date,invoice_no,supplier_name,po_number,notes,created_at,inward_lines(qty,line_total,items(name))';
    const outSel = 'id,document_no,entry_type,outward_date,gate_pass_no,party_name,receiver_name,notes,created_at,outward_lines(qty,items(name))';
    const get = async (table, sel, extra) => {
      const base = (s) => table + '?select=' + s + '&created_at=gte.' + since + '&order=created_at.desc';
      try { return await restAll(base(sel.replace('created_at,', 'created_at,store,'))); }      // store column (STORE1_MIGRATION)
      catch (e) { return await restAll(base(sel)); }
    };
    const [ins, outs] = await Promise.all([get('inward_entries', inSel), get('outward_entries', outSel)]);
    const rows = [];
    ins.forEach(e => { const L = e.inward_lines || [];
      rows.push({ kind:'inward', id:e.id, key:'inward:' + e.id, type:e.entry_type || 'INWARD', no:e.document_no, invoice:e.invoice_no || '', date:e.receiving_date || (e.created_at || '').slice(0, 10),
        party:e.supplier_name || e.po_number || '', amount:L.reduce((s, l) => s + (+l.line_total || 0), 0), qty:L.reduce((s, l) => s + (+l.qty || 0), 0),
        items:L.map(l => l.items && l.items.name).filter(Boolean).slice(0, 3).join(', '), store:e.store || 'STORE 2', cancelled:isCancelled(e.notes), created:e.created_at || '' }); });
    outs.forEach(e => { const L = e.outward_lines || [];
      rows.push({ kind:'outward', id:e.id, key:'outward:' + e.id, type:e.entry_type || 'OUTWARD', no:e.document_no, invoice:e.gate_pass_no || '', date:e.outward_date || (e.created_at || '').slice(0, 10),
        party:e.party_name || e.receiver_name || '', amount:0, qty:L.reduce((s, l) => s + (+l.qty || 0), 0),
        items:L.map(l => l.items && l.items.name).filter(Boolean).slice(0, 3).join(', '), store:e.store || 'STORE 2', cancelled:isCancelled(e.notes), created:e.created_at || '' }); });
    rows.sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    S.rows = rows.slice(0, 2800);
    await loadPipelines();
    S.loaded = true;
  } catch (e) { S.loadErr = e.message || String(e); S.loaded = true; }
  finally { S.loading = false; }
  paintAll();
}
async function loadPipelines(){
  try {
    const keys = S.rows.map(r => r.key);
    const d = await rpc('scs_get', { p_keys: keys });
    S.missing = false;
    if (Array.isArray(d.flow) && d.flow.length) S.flow = d.flow;
    S.map = {}; (d.rows || []).forEach(x => { S.map[x.key] = x; });
    if (d.can) S.can = d.can;
    S.loadErr = '';
  } catch (e) {
    if (e.missing || /scs_get|store_check/i.test(e.message || '')) S.missing = true; else S.loadErr = e.message;
  }
}

/* ══ Attachments (the same sources as ERP › Print History › Preview) ═══ */
let PDFJS_P = null;
function pdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (PDFJS_P) return PDFJS_P;
  PDFJS_P = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => {
      const src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const w = document.createElement('script'); w.src = src;
      w.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = src; res(window.pdfjsLib); } catch (e) { rej(e); } };
      w.onerror = () => { PDFJS_P = null; rej(new Error('The page viewer could not be loaded (internet?).')); };
      document.head.appendChild(w);
    };
    s.onerror = () => { PDFJS_P = null; rej(new Error('The page viewer could not be loaded (internet?).')); };
    document.head.appendChild(s);
  });
  return PDFJS_P;
}
async function pdfDoc(url){ const lib = await pdfJs(); return lib.getDocument({ url, withCredentials:false }).promise; }
const ATT_LABEL = { STORE:r => r.kind === 'inward' ? 'Supplier Copy' : 'Receiver Copy', ACCOUNT:() => 'Accountant Copy', BILL:r => r.kind === 'inward' ? 'Actual Bill' : 'Attachments', UNLOAD:() => 'Unloader', FIELD:() => 'Field Boy' };

async function loadAttachments(r, force){
  let a = S.att[r.key];
  if (a && !force && a.state !== 'error') return a;
  a = S.att[r.key] = { state:'loading', slides:[], errs:[] };
  paintSheet();
  try {
    const q = await rest((r.kind === 'inward' ? 'inward_entries' : 'outward_entries') + '?select=*&id=eq.' + encodeURIComponent(r.id));
    const rec = q[0] || {};
    const pd = {};
    try { (await rest('pdf_documents?select=document_no,variant,public_url&document_no=eq.' + encodeURIComponent(r.no))).forEach(p => { if (p.public_url) pd[p.variant] = p.public_url; }); } catch (e) {}
    const ctx = { rec, invUnload:[], pd };
    const run = (id, fn) => fn(r, ctx).then(x => ({ id, x }), e => ({ id, e: e.message || String(e) }));
    const out = {};
    const first = await Promise.all([run('STORE', attStore), run('ACCOUNT', attAccount), run('BILL', attBill), r.kind === 'inward' ? run('FIELD', attField) : Promise.resolve(null)]);
    first.forEach(o => { if (o) out[o.id] = o; });
    if (r.kind === 'inward') { const u = await run('UNLOAD', attUnload); out.UNLOAD = u; }
    const slides = [];
    ['STORE', 'ACCOUNT', 'BILL', 'UNLOAD', 'FIELD'].forEach(id => {
      const o = out[id]; if (!o) return;
      const label = ATT_LABEL[id](r);
      if (o.e) { a.errs.push(label + ': ' + o.e); return; }
      if (o.x == null) return;                                    // does not apply (Field Boy on a normal receipt)
      const list = o.x.slides || [];
      if (!list.length) a.empty = (a.empty || []).concat({ label, text:o.x.empty || 'Nothing attached.' });
      list.forEach((s, i) => slides.push(Object.assign({ group:id, label, pos:i + 1, of:list.length }, s)));
    });
    slides.forEach((s, i) => { s.n = i; });
    a.slides = slides; a.state = a.errs.length ? 'error' : 'ready'; a.accUrl = (ctx.acc && ctx.acc.currentUrl) || '';
    if (CUR && CUR.r === r && ctx.acc) CUR.acc = ctx.acc;
  } catch (e) { a.state = 'error'; a.errs.push(e.message || String(e)); }
  paintSheet();
  return a;
}
async function attStore(r, ctx){
  const url = ctx.pd.SINGLE || ctx.pd.TWO_PAGE;

}

async function attAccount(r, ctx){

  catch (e) { if (e.missing || /acc_get|store_account_copy|schema cache/i.test(e.message || '')) return { slides:[], empty:'The Accountant Copy is not set up yet (Admin: run sql/STORE_ACCOUNT_COPY_MIGRATION.sql).' }; throw e; }

async function attBill(r, ctx){
  const url = ctx.pd.INVOICE, what = r.kind === 'inward' ? 'bill' : 'attachment';
  if (!url) return { slides:[], empty:'No ' + what + ' photo was attached when this record was saved.' };
  const doc = await pdfDoc(url), slides = [];
  for (let p = 1; p <= doc.numPages; p++) {
    let txt = '';                                                  // the Unloader's photos are appended; their footer names them
    try { const pg = await doc.getPage(p); const tc = await pg.getTextContent(); txt = tc.items.map(x => x.str).join(' '); } catch (e) {}
    const cap = ((txt.match(/((?:UNLOADING PHOTO|Photo)[^·]*?)\s+·\s+Printed:/i) || [])[1] || '').trim();
    const s = { type:'pdf', doc, page:p, open:url, caption:(r.kind === 'inward' ? 'Actual bill' : 'Attachment') + ' · page ' + p + ' of ' + doc.numPages + (cap ? ' · ' + cap : '') };
    if (/UNLOADING PHOTO/i.test(txt) && r.kind === 'inward') { ctx.invUnload.push(Object.assign({}, s, { caption:cap || ('Unloading photo · invoice page ' + p) })); continue; }
    slides.push(s);
  }
  return { slides, empty:"The Original Invoice PDF holds only the Unloader's photos; no bill photo of its own." };
}
async function attUnload(r, ctx){

  const who = a && a.name ? a.name + (a.emp_code ? ' (' + a.emp_code + ')' : '') : '';
  const aid = src && (src.approval_id || (src.approver ? src.id : null));
  let photos = [];
  if (aid) {
    try { photos = (await rest('inward_unload_photos?select=seq,image_data&approval_id=eq.' + encodeURIComponent(aid) + '&order=seq')).filter(p => String(p.image_data || '').startsWith('data:image')); }

async function attField(r, ctx){
  const nos = String(ctx.rec.req_no || '').split(',').map(s => s.trim()).filter(Boolean);
  if (!nos.length) return null;
  const prs = (await rest('purchase_requirements?select=id,req_no,purchaser_name,pdf_snapshot&req_no=in.(' + nos.map(n => '"' + n.replace(/"/g, '') + '"').join(',') + ')'))
    .filter(p => p.pdf_snapshot && p.pdf_snapshot.fieldChecklist);          // only a Field Boy purchase has this
  if (!prs.length) return null;
  const lines = await rest('purchase_requirement_lines?select=*&requirement_id=in.(' + prs.map(p => p.id).join(',') + ')&order=id');
  let mine = null;
  try { const il = await rest('inward_lines?select=item_id&inward_id=eq.' + encodeURIComponent(r.id)); mine = new Set(il.map(x => String(x.item_id || '')).filter(Boolean)); } catch (e) {}
  const use = lines.filter(l => !mine || !mine.size || mine.has(String(l.item_id || '')));
  const ids = [...new Set(use.map(l => l.item_id).filter(Boolean))], names = {};
  if (ids.length) { try { (await rest('items?select=id,name&id=in.(' + ids.join(',') + ')')).forEach(i => { names[i.id] = i.name; }); } catch (e) {} }
  const slides = [];

    const ph = ln.photo && typeof ln.photo === 'object' ? ln.photo : null;
    if (!ph || !ph.url) return;

      caption:(names[l.item_id] || l.item_name || 'Item') + ' · Qty ' + (l.qty != null ? l.qty : '-') + (l.uom ? ' ' + l.uom : '') + ' · ' + (pr.req_no || '') + ' · ' + (pr.purchaser_name || 'Field Boy') });
  });
  return { slides, empty:'Field Boy PR ' + prs.map(p => p.req_no).join(', ') + ': no item photo for the items on this Inward.' };
}
/* A PDF page as a canvas: small for the strip, sharp for the viewer. */
async function pdfCanvas(s, cssW){
  const page = await s.doc.getPage(s.page), vp1 = page.getViewport({ scale:1 });
  const dpr = Math.min(2.5, Math.max(1.5, window.devicePixelRatio || 1));
  const scale = Math.min(cssW * dpr / vp1.width, 4000 / Math.max(vp1.width, vp1.height)), vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  await page.render({ canvasContext:c.getContext('2d'), viewport:vp }).promise;
  return c;
}
async function fillThumb(box, s){

  if (s.type === 'pdf') { try { const c = await (s._th || (s._th = pdfCanvas(s, 110))); const k = document.createElement('canvas'); k.width = c.width; k.height = c.height; k.getContext('2d').drawImage(c, 0, 0); box.prepend(k); } catch (e) {} }
}

const fmtAmt = n => n > 0 ? '₹' + n.toLocaleString('en-IN', { maximumFractionDigits:2 }) : '';
function matchQ(r, q){
  if (!q) return true;
  const hay = [r.no, r.party, r.invoice, r.items, r.type].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.indexOf(w) >= 0);
}
function baseRows(){ return S.rows.filter(r => (S.type === 'ALL' || r.type === S.type) && (S.store === 'ALL' || r.store === S.store) && matchQ(r, S.q)); }
function segData(rows){
  const todo = {}, done = {}, deb = { RAISED:[], VERIFIED:[] }, all = {};
  rows.forEach(r => {
    const m = mineStep(r); if (m) (todo[m.step.code] = todo[m.step.code] || []).push({ r, hold:m.hold });
    const d = doneStep(r); if (d) (done[d.code] = done[d.code] || []).push({ r });
    const db = debitOf(r); if (db) deb[db.status].push({ r });
    const st = rowOf(r) && Object.keys(rowOf(r).steps || {}).length ? stageOf(r) : null;
    const k = !st ? 'NEW' : !st.step ? 'DONE' : st.hold ? 'HOLD' : st.step.code;
    (all[k] = all[k] || []).push({ r });
  });
  Object.keys(todo).forEach(k => todo[k].sort((a, b) => (a.hold ? 1 : 0) - (b.hold ? 1 : 0)));   // fresh ones first, held ones after
  return { todo, done, deb, all };
}

function paintList(){

  if (S.missing) { L.innerHTML = emptyHtml(IC.doc, 'Not set up yet', 'Admin: run sql/STORE_CHECK_PIPELINE_MIGRATION.sql in the Supabase SQL Editor (after STORE_RECORD_STATUS_MIGRATION.sql).'); return; }
  if (S.loadErr && !S.rows.length) { L.innerHTML = emptyHtml(IC.bang, 'Could not load', S.loadErr); return; }
  const d = segData(baseRows());
  let h = '';
  const noStep = !S.flow.some(s => canDo(s.code, 'STORE 1') || canDo(s.code, 'STORE 2'));
  if (S.seg === 'TODO') {
    S.flow.forEach(s => { if (d.todo[s.code]) h += sectionHtml('t' + s.code, s.label, d.todo[s.code], 'Waiting for your check'); });
    if (!h) h = emptyHtml(IC.inbox, noStep ? 'No step assigned' : 'All caught up', noStep ? 'The Admin gives a bill check step in Manage access. You can still browse All.' : 'Nothing is waiting for your check. New bills appear here on their own.');

const LAYERS = [];
function pushLayer(l){ LAYERS.push(l); try { history.pushState({ bc:LAYERS.length }, ''); l.hist = true; } catch (e) {} document.body.classList.toggle('sheeted', LAYERS.some(x => x.kind === 'sheet')); }
function closeLayer(l){ if (!l || l.closed) return; if (l.hist) { l.closing = true; try { history.back(); return; } catch (e) {} } doClose(l); }
function doClose(l){
  if (!l || l.closed) return; l.closed = true;
  const i = LAYERS.indexOf(l); if (i >= 0) LAYERS.splice(i, 1);
  l.el.classList.remove('in'); if (l.scrim) l.scrim.classList.remove('in');
  document.body.classList.toggle('sheeted', LAYERS.some(x => x.kind === 'sheet'));
  setTimeout(() => { l.el.remove(); if (l.scrim) l.scrim.remove(); if (l.onClose) l.onClose(); }, 520);
}
window.addEventListener('popstate', () => { const l = LAYERS[LAYERS.length - 1]; if (l) doClose(l); });
function openSheet(opts){
  const layer = $('layer'), scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet' + (opts.small ? ' small' : '');
  el.innerHTML = '<div class="shead"><div class="grab"></div><div class="row"><button class="nbtn" data-x="1">' + esc(opts.left || 'Close') + '</button><div class="tt"></div><span data-r="1"></span></div></div><div class="sbody"></div>';
  scrim.style.zIndex = el.style.zIndex = String(50 + LAYERS.length * 2);
  layer.appendChild(scrim); layer.appendChild(el);
  const l = { kind:'sheet', el, scrim, body:el.querySelector('.sbody'), onClose:opts.onClose };
  scrim.addEventListener('click', () => closeLayer(l));
  el.querySelector('[data-x]').addEventListener('click', () => closeLayer(l));
  pushLayer(l);
  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('in'); scrim.classList.add('in'); }));
  // Drag the head down to dismiss (the iOS card gesture).
  const head = el.querySelector('.shead'); let y0 = null, dy = 0, t0 = 0;
  head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; t0 = Date.now(); el.classList.add('drag'); head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = 'translate(-50%,' + dy + 'px)'; });
  const end = () => { if (y0 == null) return; y0 = null; el.classList.remove('drag'); const fast = dy / Math.max(1, Date.now() - t0) > .6; el.style.transform = ''; if (dy > 110 || (fast && dy > 30)) closeLayer(l); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
  return l;
}

/* ══ Accountant Copy: PIN, then the sign / time / remark stamped on the latest file ══ */
const SIGN_FALLBACK = { GM:'gm', MD1:'md', MD2:'md2' };

function wrapText(text, font, size, maxW){

/* Adds this step's sign (image, NAME, time) into its cell and rewrites the CHECK REMARKS box with every

async function stampCopy(r, step, sig, remarks){
  if (!window.PDFLib) throw new Error('pdf-lib did not load (check the internet connection).');

      page.drawText(t, { x:(s.x + s.w / 2) * MM - font.widthOfTextAtSize(t, size) / 2, y:H - yMm * MM, size, font, color:ink }); };

      const x = stamps[s.code]; if (!x) return;

/* A photo is shrunk to about 1600 px JPEG (the server takes 2.5 MB); a PDF goes as it is (max 1.8 MB). */
function readProof(file){
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 1800000) return reject(new Error(file.name + ': the PDF is too big (max 1.8 MB).'));

    }

    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));

      let q = .82, d = c.toDataURL('image/jpeg', q); while (d.length > 2000000 && q > .4) { q -= .12; d = c.toDataURL('image/jpeg', q); }

    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name + ': this photo format cannot be read.')); };
    img.src = url;
  });
}

  const u = S.user || {};
  const i = await iosMenu({ title:u.user_name || u.name || 'Account', message:[u.emp_code, u.role].filter(Boolean).join(' · '), items:[{ t:'Refresh' }, { t:'Open ERP' }, { t:'Log out', s:'d' }] });
  if (i === 0) refresh(true); else if (i === 1) location.href = 'index.html';
  else if (i === 2) { const c = await iosAlert({ title:'Log out?', message:'This ends the session in every app.', buttons:[{ t:'Cancel' }, { t:'Log out', s:'d' }] }); if (c.i === 1) SARV_GATE.logout({ url:SUPABASE_URL, key:SUPABASE_ANON }); }
}
async function refresh(manual){ if (manual) toast('Refreshing…'); await loadList(); }

/* Large title collapses into the bar; pull down to refresh. */
(function(){
  const sc = $('scroll'), ctrl = $('ctrl'), ptr = $('ptr');
  const fit = () => document.documentElement.style.setProperty('--ctrl-h', ctrl.offsetHeight + 'px');
  fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(ctrl); else window.addEventListener('resize', fit);
  let y0 = null, pull = 0;
  sc.addEventListener('touchstart', e => { if (sc.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  sc.addEventListener('touchmove', e => { if (y0 == null) return; pull = Math.max(0, (e.touches[0].clientY - y0) * .45); if (pull > 0) { ptr.style.transition = 'none'; ptr.style.height = Math.min(pull, 70) + 'px'; } }, { passive:true });
  sc.addEventListener('touchend', () => { if (y0 == null) return; ptr.style.transition = 'height .4s cubic-bezier(.32,.72,0,1)'; if (pull > 56) { ptr.style.height = '44px'; refresh().finally(() => { ptr.style.height = '0'; }); buzz(10); } else ptr.style.height = '0'; y0 = null; pull = 0; });
})();

/* ══ Boot ══════════════════════════════════════════════════════════════ */
(async function boot(){
  S.user = await SARV_GATE.boot({ url:SUPABASE_URL, key:SUPABASE_ANON, app:APP_KEY, label:'Bill Check' });
  paintAll();
  try { await loadList(); } finally { if (window.sarvSsoPrebootDone) window.sarvSsoPrebootDone(); }
  // New bills show up on their own; never while a sheet is open, so nothing moves under the checker.
  setInterval(() => { if (!LAYERS.length && document.visibilityState === 'visible') loadList(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!LAYERS.length && document.visibilityState === 'visible') loadList(); });
})();
</script>
