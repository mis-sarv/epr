<!--
  BILL CHECK: the inbox of the bill check pipeline
  GM > EA > MD-1 > Accounts, then a Debit Note (raised by MD-1 / MD-2,
  verified by the Accountant with proof files). Issue bills are NOT here.

  ISSUE BILL CHECK = this same page opened as bill-check.html#issue (its own
  launcher tile, app key HOME_ISSUE_BILL_CHECK): Issue bills only, pipeline
  Stock Auditor Check (signs the "Stock Auditor Sign" cell) > Authority Sign
  (signs the "Authority Sign" cell), rights ISS_CHK_SA / ISS_CHK_AUTH, no
  Debit Note, no Actual Invoice No. (sql/ISSUE_BILL_CHECK_MIGRATION.sql).

  The same data as ERP › Print History / Reports › Preview, in its own app:
    - To Check  the records waiting at a step THIS user may do, shown on their
                own (grouped by step; a step needs every earlier one OKAY).
    - Done      the records this user has passed.
    - Debit     Debit Notes: waiting for verification / verified.
    - All       every record and where it stands (read only unless it is theirs).
  Tapping a record opens the pipeline sheet: attachments strip (Store PDF,
  Actual Bill, PO / PR / Yarn Unloading PDFs, Unloader photos, Field Boy photos)
  with the whole pipeline inside the same Attachments card, the
  user's own step and the Debit Note. OKAY is possible only after every page /
  photo has been looked at in the viewer (HOLD any time).

  LOGIN = ERP LOGIN (launcher.html), app key HOME_BILL_CHECK. Everything that
  changes data goes through the token-checked scs_* functions of
  sql/STORE_CHECK_PIPELINE_MIGRATION.sql, which decide the rights again on the
  server (RPT_CHK_<step>, RPT_DEBIT_RAISE / RPT_DEBIT_VERIFY). The list itself
  is read like the ERP reads it (inward_entries / outward_entries with the
  anon key); nothing here can check a step the server does not allow.

  LOOK = iOS: grouped inset lists, large title, segmented control, card
  sheets with the page scaling behind, action sheets and alerts, springs,
  light / dark with the device. The pipeline (codes, labels, order) and the
  rights come from the server (scs_get), so a new step needs no change here.
  This page loads no caps-input.js on purpose: remarks keep the case typed.

  ACCOUNTANT COPY: a Store entry saves only its Supplier Copy; the ERP keeps a clean
  Accountant Copy base aside (store_account_copy, sql/STORE_ACCOUNT_COPY_MIGRATION.sql).
  A step that signs (GM, MD-1, MD-2: 'sign' in the server's flow) asks the checker's OWN
  PIN when passing the bill (OKAY / DEBIT), and then stamps their saved signature, name +
  time and the check remark onto the LATEST copy with pdf-lib (CHECK REMARKS box under the
  signatures); the next step receives that updated copy, and ERP › Preview shows it.
  HOLD signs nothing. A bill from before this feature has no base: it is checked as before.
  WHO SEES IT (Bill Check, not Issue): the Accountant Copy is an attachment ONLY for a user with
  the EA step, and only once MD-1 Bill Check is OKAY (accVisible); for everyone else, and before
  MD-1, it is not shown at all. The signing steps still stamp it in the background (acc_get).
  PRINT ACCOUNT COPY (EA only): two buttons under the tabs, "Print Account Copy" (S.seg 'PRINT' = still to
  print) and "Printed Account Copy" (S.seg 'PRINTED' = printed, downloaded or skipped; a bill moves there
  as soon as it is). Every Print / Download asks the user's OWN PIN first and the server checks it before it
  records the print (acc_print_mark p_pin, PIN_INVALID); only then the copy prints / saves. A copy printed
  again (it was printed / downloaded before) carries a "DUPLICATE · PRINT NO. n" line with the first print
  time and this one, stamped on every page with pdf-lib (accDupStamp). Every bill past MD-1, series
  by series, oldest first; only the oldest not-yet-printed bill of a series can be printed or
  downloaded, the later ones are locked like the check order. Printed state on the server
  (sql/BILL_CHECK_ACCOUNT_PRINT_MIGRATION.sql, acc_print_list / acc_print_mark); without it, on this
  device only (localStorage bc_acc_printed:<user id>).
-->

/* The bill check pipeline sits inside the Attachments card, under the attachments (paintSheet) */

.vs>.vpipe{width:min(720px,100%);max-height:100%;overflow-y:auto;background:var(--bg);color:var(--label);border-radius:12px;padding:14px 0 18px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch;align-self:center}

/* ══ Server ════════════════════════════════════════════════════════════ */
async function rest(path, extra){
  let r;

  catch (e) { throw new Error('Could not reach the server. Check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) { const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status)); e.code = d && d.code; throw e; }
  return d || [];
}
async function restAll(path, max){          // PostgREST stops at 1000 rows a response: page it
  let all = [];
  for (let from = 0; from < (max || 1400); from += 1000) {
    const part = await rest(path, { 'Range-Unit':'items', Range: from + '-' + (from + 999) });
    all = all.concat(part);

}
async function rpc(fn, args){
  let r;

      headers:{ 'Content-Type':'application/json', apikey:SUPABASE_ANON, Authorization:'Bearer ' + SUPABASE_ANON },
      body: JSON.stringify(Object.assign({ p_token: SARV_GATE.token }, args || {})) }); }
  catch (e) { throw new Error('Could not reach the server. Check the internet connection.'); }
  const d = await r.json().catch(() => null);
  if (!r.ok) {
    const e = new Error((d && (d.message || d.hint)) || ('HTTP ' + r.status));
    e.code = d && d.code; e.missing = e.code === 'PGRST202' || e.code === '42883' || e.code === '42P01'; throw e;
  }
  if (d && d.success === false) {
    const c = String(d.error || '');
    if (SESSION_ERR[c]) { location.replace('launcher.html?why=' + c); return new Promise(() => {}); }
    const e = new Error((ERR[c] || c || 'Unknown error').replace('{x}', d.detail || 'this step')); e.code = c; throw e;
  }
  return d;
}

  const n = {}; roles.forEach(x => { n[x.code] = count(x.code); }); S.role = ''; LOCKS = null;

function stageOf(r){ for (const s of S.flow) { const x = stepOf(r, s.code); if (!x || x.status !== 'OKAY') return { step:s, hold:!!x && x.status === 'HOLD' }; } return { step:null, hold:false }; }

function mineStep(r){                         // the step this record waits at, when it is this user's
  if (r.cancelled) return null;

  return st.step && canDo(st.step.code, r.store) ? st : null;
}
/* ── Series order (bill-check app only) ──────────────────────────────────
   Bills are checked in the order of their series: one series = store + entry type (Inward / Inward NB / Outward / Issue of
   Store 1 or Store 2), oldest first (the order the numbers were issued). At a step the user can check only the OLDEST bill
   still waiting there for that series; the later ones are locked ("Check <no> first"). A bill the user HOLDs stops blocking:
   the next one in the series opens at once. A held bill is re-checked any time. Cancelled bills are not in the series.
   Computed over ALL loaded rows (never over the search / type filter), so a filter cannot unlock anything. */
const seqSeries = r => (r.store || '') + '|' + (r.type || '');

let LOCKS = null;
function seqLocks(){
  if (LOCKS) return LOCKS;
  const by = {}; LOCKS = {};

  Object.keys(by).forEach(k => { const l = by[k].sort(seqCmp); l.forEach((r, i) => { if (i) LOCKS[r.key] = { no:l[0].no, key:l[0].key }; }); });

const lockOf = r => seqLocks()[r.key] || null;

const SAVING = {};
/* The bill to open after a check: the next one of the SAME series at the same step (the one the check just unlocked), else the first

   current search / type / store filter shows. */
function pickNext(prev, code){

  const open = x => { const m = mineStep(x); return m && !m.hold && !lockOf(x) ? m : null; };
  const same = pool.filter(x => { const m = open(x); return m && m.step.code === code && seqSeries(x) === seqSeries(prev) && seqCmp(x, prev) > 0; }).sort(seqCmp)[0];
  if (same) return same;

/* A bill on HOLD at a step stays there (it does not go on), but the person of the NEXT step can see it, VIEW ONLY: it is listed

/* ── Accountant Copy: who sees it ─────────────────────────────────────────

const isEa = store => canDo('EA', store);

const acMode = r => { if (ISSUE_MODE || !r || r.kind !== 'inward' && r.kind !== 'outward') return false; const m = mineStep(r); return !!m && m.step.code === 'AC'; };

/* ── Print Account Copy (EA only) ─────────────────────────────────────────

   ("Print <no> first"). A printed bill can be printed again any time. A bill without an Accountant Copy is SKIPPED (on purpose,
   by the EA) so it does not hold up its series. Computed over ALL loaded rows, never over the search / filter.

const PRINT_LS = () => 'bc_acc_printed:' + ((S.user && S.user.id) || '');

const isPrinted = r => !!S.printed[r.key];
let PLOCKS = null;
function printLocks(){

  Object.keys(by).forEach(k => { const l = by[k].sort(seqCmp); l.forEach((r, i) => { if (i) PLOCKS[r.key] = { no:l[0].no, key:l[0].key }; }); });

const printLockOf = r => printLocks()[r.key] || null;
async function loadPrinted(){

  }
}
// how many times this copy was really printed / downloaded (a skip is not a print); older lists only had 'times'
function printsOf(r){

/* Records a print / download / skip. PRINT / DOWNLOAD carry the user's own PIN: the server checks it before it

   older call). Resolves {prints, firstPrintAt, by, at}; throws on a wrong PIN (code PIN_INVALID). */

  } else {

    } catch (e) {

/* A copy printed again: one line on top of every page, "DUPLICATE · PRINT NO. n · FIRST PRINTED dd/mm/yyyy hh:mm ·
   THIS PRINT dd/mm/yyyy hh:mm BY name", red. The copy's own page is drawn a little smaller (DUP_SCALE, centred, lower)
   so the line gets a band of its own about 7 mm from the top edge: never over the heading / copy tag, and inside the
   area every printer prints (the Store PDF's own margin is only 4-8 mm). */
const DUP_SCALE = 0.965;
async function accDupStamp(blob, m){

  const { PDFDocument, StandardFonts, rgb } = window.PDFLib, MM = 72 / 25.4;
  const bytes = await blob.arrayBuffer(), src = await PDFDocument.load(bytes), out = await PDFDocument.create();
  const font = await out.embedFont(StandardFonts.HelveticaBold);

    const free = height * (1 - DUP_SCALE);                          // the room the smaller copy leaves: 3/4 of it on top
    pg.drawPage(ep, { x:width * (1 - DUP_SCALE) / 2, y:free * 0.25, xScale:DUP_SCALE, yScale:DUP_SCALE });
    let size = 7.5; while (size > 5 && font.widthOfTextAtSize(txt, size) > width - 30) size -= 0.25;
    const w = font.widthOfTextAtSize(txt, size), x = (width - w) / 2, y = height - 7 * MM - size * 0.35;

  catch (e) { busy(false); buzz([20, 40, 20]); return toast(e.code === 'PIN_INVALID' ? 'Incorrect PIN: nothing printed.' : (e.message || String(e)), true); }

  }

const LAYERS = [];

function doClose(l){
  if (!l || l.closed) return; l.closed = true;
  const i = LAYERS.indexOf(l); if (i >= 0) LAYERS.splice(i, 1);
  l.el.classList.remove('in'); if (l.scrim) l.scrim.classList.remove('in');
  document.body.classList.toggle('sheeted', LAYERS.some(x => x.kind === 'sheet'));
  setTimeout(() => { l.el.remove(); if (l.scrim) l.scrim.remove(); if (l.onClose) l.onClose(); }, 520);
}
window.addEventListener('popstate', () => { const l = LAYERS[LAYERS.length - 1]; if (l) doClose(l); });
function openSheet(opts){
  const layer = $('layer'), scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet' + (opts.small ? ' small' : '');
  el.innerHTML = '<div class="shead"><div class="grab"></div><div class="row"><button class="nbtn" data-x="1">' + esc(opts.left || 'Close') + '</button><div class="tt"></div><span data-r="1"></span></div></div><div class="sbody"></div>';
  scrim.style.zIndex = el.style.zIndex = String(50 + LAYERS.length * 2);
  layer.appendChild(scrim); layer.appendChild(el);

  scrim.addEventListener('click', () => closeLayer(l));

  requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.add('in'); scrim.classList.add('in'); }));
  // Drag the head down to dismiss (the iOS card gesture).
  const head = el.querySelector('.shead'); let y0 = null, dy = 0, t0 = 0;
  head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; t0 = Date.now(); el.classList.add('drag'); head.setPointerCapture(e.pointerId); });
  head.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); el.style.transform = 'translate(-50%,' + dy + 'px)'; });
  const end = () => { if (y0 == null) return; y0 = null; el.classList.remove('drag'); const fast = dy / Math.max(1, Date.now() - t0) > .6; el.style.transform = ''; if (dy > 110 || (fast && dy > 30)) closeLayer(l); };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);

function iosAlert(o){

      + (o.input ? '<input data-in="1" placeholder="' + esc(o.input) + '" maxlength="500"' + (o.inputType === 'password' ? ' type="password" inputmode="numeric" autocomplete="off"' : '') + '>' : '') + '</div><div class="bt' + (btns.length > 2 ? ' col' : '') + '">'
      + btns.map((b, i) => '<button data-i="' + i + '" class="' + (b.s || '') + '">' + esc(b.t) + '</button>').join('') + '</div></div>';
    document.body.appendChild(sc); requestAnimationFrame(() => sc.classList.add('in'));
    const inp = sc.querySelector('[data-in]'); if (inp) setTimeout(() => inp.focus(), 300);
    let fin = false, autoT = 0;

    const primary = () => { const bi = btns.findIndex(b => /b/.test(b.s || '')); return bi < 0 ? 0 : bi; };
    sc.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) done(+b.dataset.i); });
    if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') done(primary()); });
    /* o.auto = n: a PIN of n or more digits submits by itself 0.6 s after the last key (like the launcher's login),
       so a 6-digit PIN is not tried at 4. */
    if (inp && o.auto) inp.addEventListener('input', () => {

}

function toast(msg, err){
  const t = $('toast'); t.className = 'toast' + (err ? ' err' : ''); t.innerHTML = (err ? IC.bang : '<span style="color:#30d158">' + IC.check + '</span>') + '<span>' + esc(msg) + '</span>';
  requestAnimationFrame(() => t.classList.add('in')); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('in'), err ? 4200 : 2400); buzz(err ? [12, 40, 12] : 10);
}
const busy = on => $('busy').classList.toggle('on', !!on);

/* ══ The record sheet: attachments, pipeline, own step, Debit Note ═════ */
let CUR = null;            // {r, layer, hist, proofs}
async function openRecord(key){
  const r = S.rows.find(x => x.key === key); if (!r) return;
  if (CUR && CUR.layer && !CUR.layer.closed) { CUR.r = r; CUR.hist = null; CUR.proofs = null; CUR.cmts = null; paintSheet(); }
  else { CUR = { r, hist:null, proofs:null, acc:null, dbOpen:false, layer:openSheet({ left:'Close', onClose:() => { CUR = null; paintList(); paintHeader(); } }) }; paintSheet(); }
  refreshAtt(r);
  loadHistory(r);
  loadComments(r);
  loadProofs(r);
}
/* A step before this one may have stamped a newer Accountant Copy since the attachments were cached:
   the cached set is dropped (and "looked at" starts again) when the copy's file is not the same. */
async function refreshAtt(r){
  const a = S.att[r.key];
  if (!a || a.state !== 'ready') return loadAttachments(r, !!a);
  if (a.accShown !== accVisible(r) || a.acMode !== acMode(r)) { S.seen[r.key] = new Set(); return loadAttachments(r, true); }
  try {
    const d = await rpc('acc_get', { p_kind:r.kind, p_record_id:String(r.id) });
    if (CUR && CUR.r === r) CUR.acc = d.row || null;
    // only a copy that is shown can be "newer than what was looked at"
    if (a.accShown && ((d.row || {}).currentUrl || '') !== (a.accUrl || '')) { S.seen[r.key] = new Set(); return loadAttachments(r, true); }
  } catch (e) {}
  paintSheet();
}
/* ══ ATTACHMENT COMMENTS (sql/BILL_CHECK_ATT_COMMENT_MIGRATION.sql) ═══════
   The viewer's Comment button writes a comment on the attachment on screen (attKey = its group + caption, so it
   names the exact page); it belongs to the commenter's step of this bill: the step it waits at for them, else the
   first step they may do in its store (the server keeps it only when they may do it, else "Other comments").
   The pipeline shows each step's comments highlighted under it (.step.has-cm / .cm), the thumbnails a count.
   Without the migration the button says so and nothing else changes. */
const attKey = s => String(s.group || '') + ':' + String(s.caption || (s.label + ' ' + (s.pos || 1)));
const attName = s => s.label + (s.of > 1 ? ' ' + s.pos : '');
function cmtStep(r){ const m = mineStep(r); if (m) return m.step; return S.flow.find(x => canDo(x.code, r.store)) || null; }
const cmtsOf = r => (CUR && CUR.r === r && CUR.cmts) || [];
async function loadComments(r){
  try { const d = await rpc('scs_comments', { p_kind:r.kind, p_record_id:String(r.id) }); if (CUR && CUR.r === r) { CUR.cmts = d.rows || []; CUR.cmtOff = false; paintSheet(); } }
  catch (e) { if (CUR && CUR.r === r) { CUR.cmts = []; CUR.cmtOff = !!e.missing; paintSheet(); } }
}
async function addComment(r, s){
  if (CUR && CUR.cmtOff) { toast('Comments need sql/BILL_CHECK_ATT_COMMENT_MIGRATION.sql (Admin).', true); return false; }
  const step = cmtStep(r);
  const c = await iosAlert({ title:'Comment on ' + attName(s), message:(s.caption || '') + ' · It shows in the pipeline under ' + (step ? step.label : 'Other comments') + '.',
    input:'Write your comment', buttons:[{ t:'Cancel' }, { t:'Save', s:'b' }] });
  if (c.i !== 1) return false;
  if (!c.value) { toast('Write the comment first', true); return false; }
  try {
    const d = await rpc('scs_comment_save', { p_kind:r.kind, p_record_id:String(r.id), p_step:step ? step.code : null,
      p_att_key:attKey(s), p_att_label:attName(s), p_att_caption:s.caption || '', p_text:c.value });
    if (CUR && CUR.r === r) CUR.cmts = (CUR.cmts || []).concat(d.row ? [d.row] : []);
    const st = d.row && S.flow.find(x => x.code === d.row.step);
    toast('Comment saved' + (st ? ' under ' + st.label : ' (Other comments)'));
    buzz(8);
    return true;
  } catch (e) {
    if (e.missing) { if (CUR) CUR.cmtOff = true; toast('Comments need sql/BILL_CHECK_ATT_COMMENT_MIGRATION.sql (Admin).', true); }
    else toast('Comment not saved: ' + (e.message || e), true);
    return false;
  }
}
async function delComment(id){
  const c = await iosAlert({ title:'Delete this comment?', buttons:[{ t:'Cancel' }, { t:'Delete', s:'d' }] });
  if (c.i !== 1) return;
  try { await rpc('scs_comment_delete', { p_id:+id }); if (CUR && CUR.cmts) CUR.cmts = CUR.cmts.filter(x => String(x.id) !== String(id)); toast('Comment deleted'); paintSheet(); }
  catch (e) { toast('Not deleted: ' + (e.message || e), true); }
}
function cmItemHtml(c){
  return '<div class="cm">' + (c.mine ? '<button data-cmdel="' + esc(String(c.id)) + '">Delete</button>' : '')
    + '<span class="att">' + esc(c.attLabel || 'Attachment') + '</span>: ' + esc(c.text)
    + '<small>' + esc([c.attCaption && c.attCaption !== c.attLabel ? c.attCaption : '', c.by ? c.by + (c.emp ? ' (' + c.emp + ')' : '') : '', c.at ? fmtStamp(c.at) : ''].filter(Boolean).join(' · ')) + '</small></div>';
}
async function loadHistory(r){ try { const d = await rpc('scs_history', { p_kind:r.kind, p_record_id:String(r.id) }); if (CUR && CUR.r === r) { CUR.hist = d.rows || []; paintSheet(); } } catch (e) { if (CUR && CUR.r === r) { CUR.hist = []; } } }
async function loadProofs(r){
  const d = debitOf(r); if (!d || !d.proofs) { if (CUR && CUR.r === r) CUR.proofs = []; return; }
  try { const x = await rpc('scs_debit_proofs', { p_kind:r.kind, p_record_id:String(r.id) }); if (CUR && CUR.r === r) { CUR.proofs = x.rows || []; paintSheet(); } } catch (e) { if (CUR && CUR.r === r) CUR.proofs = []; }
}
function nextTodo(){ LOCKS = null; const d = segData(baseRows()); const list = []; S.flow.forEach(s => (d.todo[s.code] || []).forEach(x => { if (!x.hold && !lockOf(x.r)) list.push(x.r); })); const i = list.findIndex(x => CUR && x.key === CUR.r.key); return list.find((x, k) => k !== i && (i < 0 || k > i)) || list.find(x => !CUR || x.key !== CUR.r.key) || null; }
/* The bill check pipeline as a timeline: every step with its status, remarks, who / when, its own history
   (scs_history) and the attachment comments under it (highlighted), Party Consent after MD-1, then the comments
   of no step. Drawn in the sheet's Attachments card AND as the "Bill Check Pipeline" slide of the viewer (right
   after the Supplier Copy), so the two are always the same. */
function pipeTimeline(r){
  const store = r.store, stage = stageOf(r);
  // Each step carries its own history (scs_history rows of that step, oldest first) instead of a separate list at the bottom.
  const histOf = code => (CUR.hist || []).filter(x => x.step === code);
  const hxHtml = code => { const l = histOf(code); return l.length ? '<div class="hx">' + l.map(x => '<div><b>' + esc(x.status) + '</b>' + (x.old ? ' (was ' + esc(x.old) + ')' : '')
      + esc([x.remarks ? ' · “' + x.remarks + '”' : '', x.by ? ' · ' + x.by + (x.emp ? ' (' + x.emp + ')' : '') : '', x.at ? ' · ' + fmtStamp(x.at) : ''].join('')) + '</div>').join('') + '</div>' : ''; };
  return '<div class="tl">' + S.flow.map(s => {
    const x = stepOf(r, s.code), can = canDo(s.code, store) && !r.cancelled, cls = x ? (x.status === 'OKAY' ? 'ok' : 'hold') : (stage.step && stage.step.code === s.code ? 'next' : '');
    const onCopy = CUR.acc && CUR.acc.stamps && CUR.acc.stamps[s.code];
    const sub = x ? [x.invoiceNo ? 'Actual Invoice No. ' + x.invoiceNo : '', x.remarks ? '“' + x.remarks + '”' : '', onCopy ? 'signed on the Accountant Copy' : '', x.by ? x.by + (x.emp ? ' (' + x.emp + ')' : '') : '', x.at ? fmtStamp(x.at) : '', x.total != null ? 'looked at ' + x.seen + ' of ' + x.total : ''].filter(Boolean).join(' · ')
      : (cls === 'next' ? 'Waiting here' : 'Not reached yet');
    const cms = (CUR.cmts || []).filter(c => c.step === s.code);
    return '<div class="step' + (x && x.status === 'OKAY' ? ' done' : '') + (cms.length ? ' has-cm' : '') + '"><span class="dot ' + cls + '">' + (cls === 'ok' ? IC.check : cls === 'hold' ? IC.bang : '') + '</span><div class="bd"><b>' + esc(s.label) + '</b>'
      + (x ? '<span class="pill ' + (x.status === 'OKAY' ? 'ok' : 'hold') + ' me">' + esc(x.status) + '</span>' : '') + (can ? '<span class="pill blue me">Your step</span>' : '') + '<small>' + esc(sub) + '</small>' + hxHtml(s.code) + (cms.length ? '<div class="cms">' + cms.map(cmItemHtml).join('') + '</div>' : '') + '</div></div>'
      + (s.code === 'MD1' ? consentStepHtml(r, store) : '');
  }).join('') + (() => {
    // comments without a step of this flow (the commenter has no step here)
    const rest = (CUR.cmts || []).filter(c => !S.flow.some(s => s.code === c.step));
    return rest.length ? '<div class="step has-cm"><span class="dot"></span><div class="bd"><b>Other comments</b><div class="cms">' + rest.map(cmItemHtml).join('') + '</div></div></div>' : '';
  })() + '</div>';
}
function paintSheet(){
  if (!CUR || CUR.layer.closed) return;
  LOCKS = null;
  const r = CUR.r, a = S.att[r.key], look = TYPE_LOOK[r.type] || ['REC', '#8e8e93'], el = CUR.layer.el, body = CUR.layer.body;
  const keepScroll = body.scrollTop, keep = {}; body.querySelectorAll('[data-keep]').forEach(i => { keep[i.dataset.keep] = i.value; });
  const si = seenInfo(r), store = r.store, mine = mineStep(r), db = debitOf(r);
  el.querySelector('.tt').textContent = r.no || APP_NAME;
  const nx = nextTodo(), rb = el.querySelector('[data-r]');
  rb.outerHTML = nx && S.seg === 'TODO' && mine ? '<button class="nbtn" data-r="1" data-next="' + esc(nx.key) + '">Next' + '<span style="margin-left:4px;display:inline-flex">' + IC.chev + '</span></button>' : '<span data-r="1" style="width:60px"></span>';
  let h = '<div class="hero"><span class="ico" style="background:' + look[1] + '">' + look[0] + '</span><div style="min-width:0"><div class="no">' + esc(r.no || '—') + '</div><div class="pt">' + esc(r.party || '—') + '</div></div></div><div class="gap"></div>'
    // Details in the least space: one line of facts, the items under it
    + '<div class="grp"><div class="meta">'
    + [r.type, fmtDate(r.date), (r.kind === 'inward' ? 'Inv ' : 'GP ') + (r.invoice || '—'), r.store, r.amount > 0 ? fmtAmt(r.amount) : '', 'Qty ' + (r.qty || 0)]
      .filter(Boolean).map((v, i) => '<b>' + esc(v) + '</b>').join('<span class="dotsep">·</span>')
    + (r.items ? '<span class="items">' + esc(r.items) + '</span>' : '') + '</div></div>';
  // Bill check pipeline: drawn INSIDE the Attachments card, under the attachments (it used to be its own section below)
  const stage = stageOf(r), started = rowOf(r) && Object.keys(rowOf(r).steps || {}).length;
  const pipe = '<div class="att-pipe-h">Bill check pipeline' + (CUR.hist == null ? '<span class="n">…</span>' : '') + '</div>' + pipeTimeline(r);
  // Attachments
  h += '<div class="sec"><h3>Attachments' + (a && needSeen(a).length ? '<span class="n">' + needSeen(a).length + '</span>' : '') + '</h3><div class="grp">';
  if (!a || a.state === 'loading') h += '<div class="film">' + [0, 1, 2, 3].map(() => '<div class="th"><div class="im sk"></div></div>').join('') + '</div><div class="note" style="padding:0 16px 12px">Collecting the PDF, bill and photos…</div>';
  else {
    if (a.slides.length) h += '<div class="film">' + a.slides.map(s => '<button class="th' + (seenSet(r.key).has(s.n) ? ' seen' : '') + '" data-view="' + s.n + '"><div class="im" data-th="' + s.n + '"><span class="tick">' + IC.check + '</span>' + ((n => n ? '<span class="cmb" title="Comments">' + n + '</span>' : '')((CUR.cmts || []).filter(c => c.attKey === attKey(s)).length)) + '</div><div class="lb">' + esc(s.label + (s.of > 1 ? ' ' + s.pos : '')) + '</div></button>').join('') + '</div>';
    if (a.acMode) {
      const has = g => a.slides.some(x => x.group === g);
      h += '<div class="note" style="padding:0 16px 8px">Accounts Check: only the Accountant Copy, the Pipeline and the Actual Bill.</div>'
        + '<div class="dlrow">' + [['ACCOUNT', 'Accountant Copy'], ['PIPE', 'Pipeline'], ['BILL', 'Actual Bill']].filter(x => has(x[0]))
          .map(x => '<button class="btn gray" data-dlg="' + x[0] + '">Download ' + esc(x[1]) + '</button>').join('') + '</div>';
    }
    (a.empty || []).forEach(e => { h += '<div class="kv"><span>' + esc(e.label) + '</span><span style="color:var(--orange)">' + esc(e.text) + '</span></div>'; });
    a.errs.forEach(e => { h += '<div class="kv"><span style="color:var(--red)">Not loaded</span><span>' + esc(e) + '</span></div>'; });
    if (si.total) h += '<div class="prog"><div class="tx"><span>Looked at <b>' + si.n + '</b> of ' + si.total + '</span><span style="color:' + (si.n >= si.total ? 'var(--green)' : 'var(--label2)') + '">' + (si.n >= si.total ? 'All seen' : (si.total - si.n) + ' to go') + '</span></div><div class="bar"><i style="width:' + Math.round(si.n * 100 / si.total) + '%"></i></div></div>'
      + '<div class="pad" style="padding-top:0"><button class="btn gray" data-view="next">' + IC.eye + (si.n >= si.total ? 'View attachments again' : si.n ? 'Continue reviewing' : 'Review attachments') + '</button></div>';
    else if (!a.errs.length) h += '<div class="note" style="padding:0 16px 12px">This record has no PDF or photo to look at.</div>';
    if (a.state === 'error') h += '<div class="pad" style="padding-top:0"><button class="btn gray" data-retry="1">Try loading again</button></div>';
  }
  h += pipe + '</div></div>';
  h += '<div class="sec">';   // the own-step notes, cancelled note etc. under the Attachments + pipeline card
  if (r.cancelled) h += '<div class="foot">This record is cancelled; it cannot be checked.</div>';
  // Own step
  const myStage = mine && prevOk(r, mine.step.code).ok ? mine : null;
  /* No Review / Check button under the pipeline: the bill is checked from the viewer. Review the attachments (button
     in the Attachments section); on the LAST one the green "Bill Check" pill / right arrow opens the Check popup of the
     user's step (goCheck), only once every page and photo has been seen. A short line says so. A step the user already
     checked is not re-opened from here (no "Change:" button), so a user with no pending step sees the "Waiting for" note. */
  if (myStage) {
    h += '<div class="gap"></div>';
    const lkd = lockOf(r);
    const reviewed = si.ready && si.n >= si.total;
    if (lkd) h += '<div class="note warn">Locked: bills of this series are checked in order. Check <b>' + esc(lkd.no) + '</b> first (OKAY, or HOLD it), then this one opens.</div><div class="gap"></div><button class="btn gray" data-next="' + esc(lkd.key) + '">Open ' + esc(lkd.no) + '</button>';
    else h += '<div class="note' + (reviewed ? '' : ' warn') + '">' + (si.err ? 'The attachments did not load. Load them again above, then review them.'

        : 'All seen. Open the last attachment and tap <b>Bill Check</b> to ' + (myStage.hold ? 're-check' : 'check') + ' ' + esc(myStage.step.label) + '.') + '</div>';
  } else if (!r.cancelled && stage.step && !canDo(stage.step.code, store) && started !== undefined) {
    h += stage.hold ? '<div class="note warn">On hold at <b>' + esc(stage.step.label) + '</b>' + (heldForMe(r) ? ': view only. It reaches you when ' + esc(stage.step.label) + ' passes it.' : '.') + ' The reason is under that step in the pipeline above.</div>' : '<div class="note">Waiting for ' + esc(stage.step.label) + '.</div>';
  }
  h += '</div>';
  // A signing step of mine that is OKAY but not on the Accountant Copy yet (the stamp failed, or the PIN was skipped)
  const miss = S.flow.filter(s => signOf(s) && canDo(s.code, store) && stepOf(r, s.code) && stepOf(r, s.code).status === 'OKAY' && CUR.acc && CUR.acc.hasBase && !(CUR.acc.stamps && CUR.acc.stamps[s.code]) && meIs(stepOf(r, s.code)));
  miss.forEach(s => { h += '<div class="gap"></div><button class="btn gray" data-restamp="' + esc(s.code) + '">Sign Accountant Copy: ' + esc(s.label) + '</button>'; });
  // Debit Note (not on an Issue)
  if (!ISSUE_MODE) h += debitHtml(r, store, db);
  // (History now sits under each step of the pipeline above.)

  body.scrollTop = keepScroll;
  body.querySelectorAll('[data-keep]').forEach(i => { if (keep[i.dataset.keep] != null) i.value = keep[i.dataset.keep]; });
  if (a && a.slides.length) body.querySelectorAll('[data-th]').forEach(b => { const s = a.slides[+b.dataset.th]; if (s) fillThumb(b, s); });
  document.querySelectorAll('.viewer [data-vpipe]').forEach(v => { const y = v.scrollTop; v.innerHTML = pipeSlideHtml(r); v.scrollTop = y; });
}
/* Party Consent: a step of the pipeline only while the bill has a Debit Note (raised at MD-1 / MD-2), drawn right after
   MD-1. It is the Accountant's verification of that Debit Note (scs_debit_verify): consent person, 10-digit mobile,
   approval document(s), Debit No. and amount. Until it is done the Accounts Check cannot pass (server DEBIT_PENDING). */
function consentStepHtml(r, store){
  const d = debitOf(r); if (!d) return '';
  const done = d.status === 'VERIFIED', canV = canDo('DEBIT_VERIFY', store) && !r.cancelled;
  const sub = done ? [d.consentName ? 'Consent: ' + d.consentName : '', d.consentMobile ? d.consentMobile : '', d.debitNo ? 'Debit No. ' + d.debitNo : '', d.amount != null ? '₹' + d.amount : '',
                      d.proofs ? d.proofs + ' approval doc' + (d.proofs > 1 ? 's' : '') : '', d.verifiedBy ? d.verifiedBy : '', d.verifiedAt ? fmtStamp(d.verifiedAt) : ''].filter(Boolean).join(' · ')
    : 'Debit Note: “' + (d.reason || '') + '”' + (d.amount != null ? ' · ₹' + d.amount : '') + ' · waiting for the Accountant';
  return '<div class="step' + (done ? ' done' : '') + '"><span class="dot ' + (done ? 'ok' : 'next') + '">' + (done ? IC.check : '') + '</span><div class="bd"><b>Party Consent</b>'
    + '<span class="pill ' + (done ? 'ok' : 'red') + ' me">' + (done ? 'DONE' : 'DEBIT NOTE') + '</span>' + (canV && !done ? '<span class="pill blue me">Your step</span>' : '')
    + '<small>' + esc(sub) + '</small>'
    + (canV && !done ? '<button class="btn sm" style="margin-top:8px" data-debit="verify">Fill Party Consent</button>' : '') + '</div></div>';
}
function debitHtml(r, store, d){
  const old = (rowOf(r) || {}).debit, canR = canDo('DEBIT_RAISE', store) && !r.cancelled, canV = canDo('DEBIT_VERIFY', store) && !r.cancelled;
  let h = '<div class="sec"><h3>Debit Note</h3><div class="grp">';
  const proofs = () => {
    if (!d || !d.proofs) return '<div class="kv"><span>Proof</span><span style="color:var(--label2)">None attached yet</span></div>';
    if (CUR.proofs == null) return '<div class="kv"><span>Proof</span><span>Loading…</span></div>';
    return '<div class="pf">' + CUR.proofs.map(p => '<div class="it" data-pview="' + p.id + '">' + (/^image\//.test(p.mime) ? '<img src="' + esc(p.data) + '" alt="">' : '<div class="pd">PDF</div>') + '<span>' + esc(p.name || 'proof') + '</span>'
      + (canV && d.status === 'RAISED' ? '<button class="rm" data-pdel="' + p.id + '" aria-label="Remove">' + IC.x + '</button>' : '') + '</div>').join('') + '</div>';
  };
  if (!d) {
    if (old && old.status === 'WITHDRAWN') h += '<div class="kv"><span>Earlier</span><span>Withdrawn by ' + esc(old.withdrawnBy || '') + (old.withdrawReason ? ': “' + esc(old.withdrawReason) + '”' : '') + '</span></div>';
    h += '<div class="kv"><span>Status</span><span style="color:var(--label2)">No Debit Note</span></div></div>';
    if (canR) h += '<div class="gap"></div><button class="btn gray" data-debit="raise">Raise a Debit Note</button>'; else h += '<div class="foot">Only MD-1 / MD-2 can raise a Debit Note.</div>';
    return h + '</div>';
  }
  h += '<div class="kv"><span>Status</span><span><span class="pill ' + (d.status === 'VERIFIED' ? 'ok' : 'red') + '">' + (d.status === 'VERIFIED' ? 'Verified' : 'Raised · waiting for Accountant') + '</span></span></div>'
    + '<div class="kv"><span>' + (d.status === 'RAISED' ? 'Remarks for Accountant' : 'Reason') + '</span><span style="' + (d.status === 'RAISED' ? 'color:var(--red);font-weight:600' : '') + '">' + esc(d.reason || '') + '</span></div>' + (d.raisedStep ? '<div class="kv"><span>Raised at</span><span>' + esc(labelOf(d.raisedStep)) + '</span></div>' : '') + (d.debitNo ? '<div class="kv"><span>Debit No.</span><span>' + esc(d.debitNo) + '</span></div>' : '') + (d.amount != null ? '<div class="kv"><span>Amount</span><span>' + esc(fmtAmt(+d.amount) || '₹' + d.amount) + '</span></div>' : '')
    + '<div class="kv"><span>Raised by</span><span>' + esc((d.raisedBy || '') + (d.raisedEmp ? ' (' + d.raisedEmp + ')' : '') + (d.raisedAt ? ' · ' + fmtStamp(d.raisedAt) : '')) + '</span></div>'
    + (d.consentName ? '<div class="kv"><span>Party Consent</span><span>' + esc(d.consentName + (d.consentMobile ? ' · ' + d.consentMobile : '')) + '</span></div>' : '')
    + (d.status === 'VERIFIED' ? '<div class="kv"><span>Verified by</span><span>' + esc((d.verifiedBy || '') + (d.verifiedEmp ? ' (' + d.verifiedEmp + ')' : '') + (d.verifiedAt ? ' · ' + fmtStamp(d.verifiedAt) : '')) + '</span></div>' + (d.verifyRemarks ? '<div class="kv"><span>Remarks</span><span>' + esc(d.verifyRemarks) + '</span></div>' : '') : '')
    + proofs() + '</div>';
  if (d.status === 'RAISED') {
    if (canV) h += '<div class="gap"></div><button class="btn green" data-debit="verify">Fill Party Consent</button>';
    else h += '<div class="foot">The Accountant fills the Party Consent: consent person, mobile, approval document, Debit No. and amount.</div>';
    if (canR) h += '<div class="gap"></div><button class="btn gray" style="color:var(--red)" data-debit="withdraw">Withdraw Debit Note</button>';
  }
  return h + '</div>';
}

/* ══ Accountant Copy: PIN, then the sign / time / remark stamped on the latest file ══ */
const SIGN_FALLBACK = { GM:'gm', MD1:'md', MD2:'md2', SA:'gm', AUTH:'md' };   // Issue: Stock Auditor Sign = gm cell, Authority Sign = md cell
const signOf = s => (s && (s.sign || SIGN_FALLBACK[s.code])) || '';
const BUCKET = 'sarv-pdfs';
const pubUrl = path => SUPABASE_URL + '/storage/v1/object/public/' + BUCKET + '/' + path.split('/').map(encodeURIComponent).join('/');
const two = n => String(n).padStart(2, '0');
const stampText = d => { d = new Date(d); return two(d.getDate()) + '/' + two(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + two(d.getHours()) + ':' + two(d.getMinutes()); };
const winAnsi = t => String(t == null ? '' : t).replace(/₹/g, 'Rs ').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/[^\x20-\x7E\xA0-\xFF]/g, '?');
const meIs = x => { const u = S.user || {}; return !!x && ((u.emp_code && x.emp === u.emp_code) || (!u.emp_code && (x.by || '') === (u.user_name || u.name || ''))); };
async function accOf(r){ const d = await rpc('acc_get', { p_kind:r.kind, p_record_id:String(r.id) }); return d.row || {}; }
/* Own PIN → {name, signature|null}. Null when cancelled; a wrong PIN says so and returns null. */
async function askPin(step, why){
  const c = await iosAlert({ title:'Enter your PIN', message:why || ('To sign the Accountant Copy for ' + step.label), input:'PIN', inputType:'password', auto:4, buttons:[{ t:'Cancel' }, { t:'Sign', s:'b' }] });
  if (c.i !== 1) return null;
  if (!c.value) { toast('Enter your PIN.', true); return null; }
  busy(true);
  try { const d = await rpc('acc_sign_pin', { p_pin:c.value }); busy(false); return { name:d.name || '', signature:d.signature || null }; }
  catch (e) { busy(false); toast(e.message || String(e), true); return null; }
}
function wrapText(text, font, size, maxW){
  const out = []; let line = '';
  String(text).split(/\s+/).forEach(w => {
    const t = line ? line + ' ' + w : w;
    if (font.widthOfTextAtSize(t, size) <= maxW) line = t;
    else { if (line) out.push(line); line = w; while (font.widthOfTextAtSize(line, size) > maxW && line.length > 1) { let k = line.length - 1; while (k > 1 && font.widthOfTextAtSize(line.slice(0, k), size) > maxW) k--; out.push(line.slice(0, k)); line = line.slice(k); } }
  });
  if (line) out.push(line); return out;
}
/* Adds this step's sign (image, NAME, time) into its cell and rewrites the CHECK REMARKS box with every
   step's remark so far, on the latest copy; uploads it over the copy and records it. Geometry = the ERP's
   SIG_SLOT_LAYOUT (image box 8 mm above the line, name 3.4 mm, time 1 mm) as the mobile app stamps it. */
async function stampCopy(r, step, sig, remarks){
  if (!window.PDFLib) throw new Error('pdf-lib did not load (check the internet connection).');
  const a = await accOf(r);
  if (!a.hasBase) return false;                                    // a bill from before the Accountant Copy existed
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib, MM = 72 / 25.4;
  const src = a.currentPath || a.basePath;
  const res = await fetch(pubUrl(src) + '?v=' + Date.now(), { cache:'no-store' });
  if (!res.ok) throw new Error('The Accountant Copy could not be downloaded (' + res.status + ').');
  const pdf = await PDFDocument.load(await res.arrayBuffer());
  const bold = await pdf.embedFont(StandardFonts.HelveticaBold), reg = await pdf.embedFont(StandardFonts.Helvetica), ink = rgb(30 / 255, 58 / 255, 138 / 255);
  const pages = pdf.getPages(), slots = (a.layout && a.layout.slots) || [], now = new Date(), at = stampText(now);
  let img = null;
  if (sig.signature) { try { img = /^data:image\/jpe?g/i.test(sig.signature) ? await pdf.embedJpg(sig.signature) : await pdf.embedPng(sig.signature); } catch (e) { img = null; } }
  slots.filter(s => s.st === signOf(step)).forEach(s => {
    const page = pages[s.p - 1]; if (!page) return;
    const H = page.getHeight();
    page.drawRectangle({ x:s.x * MM, y:H - (s.y - 0.3) * MM, width:s.w * MM, height:14 * MM, color:rgb(1, 1, 1) });   // a re-check never prints over an older sign
    if (img) { const boxH = 8, top = s.y - 13.5, k = Math.min(s.w / img.width, boxH / img.height), iw = img.width * k, ih = img.height * k;
      page.drawImage(img, { x:(s.x + (s.w - iw) / 2) * MM, y:H - (top + (boxH - ih) / 2 + ih) * MM, width:iw * MM, height:ih * MM }); }
    const line = (txt, font, yMm) => { let t = winAnsi(txt), size = 5; while (font.widthOfTextAtSize(t, size) > s.w * MM && size > 3) size -= .25;
      page.drawText(t, { x:(s.x + s.w / 2) * MM - font.widthOfTextAtSize(t, size) / 2, y:H - yMm * MM, size, font, color:ink }); };
    line(String(sig.name || '').toUpperCase(), bold, s.y - 3.4); line(at, reg, s.y - 1);
  });
  // CHECK REMARKS: one line per step that has checked, oldest step first, rewritten as a whole
  const stamps = Object.assign({}, a.stamps || {}); stamps[step.code] = { by:sig.name, at:now.toISOString(), remarks:remarks || '' };
  const rb = slots.find(s => s.st === 'remarks');
  if (rb && pages[rb.p - 1]) {
    const page = pages[rb.p - 1], H = page.getHeight(), size = 5.5, lh = size * 1.28, maxW = (rb.w - 4) * MM;
    page.drawRectangle({ x:(rb.x + .4) * MM, y:H - (rb.y + rb.h - .4) * MM, width:(rb.w - .8) * MM, height:(rb.h - 3.6) * MM, color:rgb(1, 1, 1) });
    let y = rb.y + 3.6 + size * .3528 + .9; const maxY = rb.y + rb.h - .6;
    S.flow.forEach(s => {
      const x = stamps[s.code]; if (!x) return;
      const txt = s.short + ': ' + (String(x.remarks || '').replace(/^\[DEBIT\]\s*/, 'DEBIT - ') || 'Checked') + '  (' + String(x.by || '').toUpperCase() + ', ' + stampText(x.at) + ')';
      wrapText(winAnsi(txt), reg, size, maxW).forEach((ln, i) => {
        if (y > maxY) return;
        page.drawText(ln, { x:(rb.x + 2) * MM + (i ? 6 : 0), y:H - y * MM, size, font:reg, color:ink }); y += lh * .3528;
      });
    });
  }
  const blob = new Blob([await pdf.save()], { type:'application/pdf' });
  const path = /_ACCOUNT_BASE\.pdf$/.test(a.basePath) ? a.basePath.replace(/_ACCOUNT_BASE\.pdf$/, '_ACCOUNT.pdf') : a.basePath + '.account.pdf';
  const up = await fetch(SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + path.split('/').map(encodeURIComponent).join('/'),
    { method:'POST', headers:{ apikey:SUPABASE_ANON, Authorization:'Bearer ' + SUPABASE_ANON, 'Content-Type':'application/pdf', 'x-upsert':'true', 'cache-control':'3600' }, body:blob });
  if (!up.ok) throw new Error('The stamped copy could not be saved (' + up.status + ').');
  const d = await rpc('acc_stamp_save', { p_kind:r.kind, p_record_id:String(r.id), p_step:step.code, p_path:path, p_url:pubUrl(path) + '?v=' + Date.now(), p_remarks:remarks || '', p_signed:!!img });
  if (CUR && CUR.r === r) CUR.acc = d.row || CUR.acc;
  S.seen[r.key] = new Set(); loadAttachments(r, true);
  return true;
}

/* ── Check form: a small sheet. OKAY forwards the bill, HOLD keeps it at this step (the next step
   sees it view only), DEBIT forwards it too and raises a highlighted Debit Note with a remark for the
   Accountant (not on the last step, which is the Accountant's own). ── */
function openCheck(code){
  const r = CUR && CUR.r, step = S.flow.find(s => s.code === code); if (!r || !step) return;
  LOCKS = null;
  if (SAVING[r.key]) { toast('This bill is still saving. One moment.', true); return; }
  const lkd = lockOf(r), nowStep = mineStep(r);
  if (lkd && nowStep && nowStep.step.code === code) { toast('Check ' + lkd.no + ' first (OKAY, or HOLD it).', true); return; }
  /* last = the Accounts Check (Actual Invoice No., no DEBIT). An Issue has neither a Debit Note nor an invoice:
     every step there is OKAY / HOLD only. */
  const f = { pick:'' }, last = !ISSUE_MODE && S.flow[S.flow.length - 1].code === code;
  const opts = last || ISSUE_MODE ? ['OKAY', 'HOLD'] : ['OKAY', 'HOLD', 'DEBIT'];
  const COL = { OKAY:'var(--green)', HOLD:'var(--orange)', DEBIT:'var(--red)' };
  const SAYS = { OKAY:'The bill goes on to the next step.', HOLD:'The bill stays at this step; the next step does not see it until you pass it.', DEBIT:'The bill goes on, and the Accountant gets a highlighted Debit Note with your remark.' };
  const l = openSheet({ small:true, left:'Cancel' });
  const val = k => ((l.body.querySelector('[data-keep="' + k + '"]') || {}).value || '');
  const paint = () => {
    const wasRm = val('rm'), wasAmt = val('amt'), wasInv = val('inv');
    const si2 = seenInfo(r), ok = si2.ready && si2.n >= si2.total, cur = stepOf(r, code), d = debitOf(r);
    const okBlocked = last && d && d.status === 'RAISED', debBlocked = !!d;
    l.el.querySelector('.tt').textContent = step.label;
    const idx = Math.max(0, opts.indexOf(f.pick));
    l.body.innerHTML = '<div class="grp"><div class="kv"><span>Bill</span><span>' + esc(r.no) + '</span></div><div class="kv"><span>Party</span><span>' + esc(r.party || '—') + '</span></div>'
      + '<div class="kv"><span>Looked at</span><span style="color:' + (ok ? 'var(--green)' : 'var(--orange)') + '">' + (si2.ready ? si2.n + ' of ' + si2.total : si2.err ? 'Not loaded' : 'Loading…') + '</span></div></div>'
      + (ok ? '' : '<div class="note warn">OKAY and DEBIT are possible only after every page and photo of this bill has been looked at. HOLD can be given any time.</div><div class="gap"></div><button class="btn gray" data-fview="1">' + IC.eye + 'Review attachments</button>')
      + (okBlocked ? '<div class="note warn">This bill has a Debit Note: fill the Party Consent (consent person, mobile, approval document, Debit No., amount) before passing this step.</div>'
          + (canDo('DEBIT_VERIFY', r.store) ? '<div class="gap"></div><button class="btn" data-pc="1">Fill Party Consent</button>' : '') : '')
      + '<div class="gap"></div><div class="seg2" style="grid-template-columns:repeat(' + opts.length + ',1fr)"><div class="thumb" style="width:calc(' + (100 / opts.length) + '% - 2px);background:' + (COL[f.pick] || 'var(--green)') + ';transform:translateX(' + (idx * 100) + '%);opacity:' + (f.pick ? 1 : 0) + '"></div>'
      + opts.map(o => '<button data-p="' + o + '" class="' + (f.pick === o ? 'on' : '') + '"' + (((o === 'OKAY' || o === 'DEBIT') && !ok) || (o === 'OKAY' && okBlocked) || (o === 'DEBIT' && debBlocked) ? ' disabled' : '') + '>' + o + '</button>').join('') + '</div>'
      + (f.pick ? '<div class="note">' + esc(SAYS[f.pick]) + '</div>' : '') + (debBlocked && !last ? '<div class="note">A Debit Note is already raised on this bill.</div>' : '')
      + '<div class="gap"></div><textarea class="field" data-keep="rm" rows="3" placeholder="' + (f.pick === 'DEBIT' ? 'Debit: remarks for the Accountant (needed)' : f.pick === 'HOLD' ? 'Reason (needed for HOLD)' : 'Remarks (optional)') + '"></textarea>'
      + (f.pick === 'DEBIT' ? '<input class="field" data-keep="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Debit amount, ₹ (optional)">' : '')
      // Accounts Check (the last step): OKAY needs the Actual Invoice No. (server INVOICE_REQUIRED)
      + (last && f.pick === 'OKAY' ? '<input class="field" data-keep="inv" maxlength="60" autocomplete="off" placeholder="Actual Invoice No. (needed)' + (r.invoice ? ' · entered: ' + esc(r.invoice) : '') + '">' : '')
      + '<div class="gap"></div><button class="btn ' + (f.pick === 'HOLD' ? 'orange' : f.pick === 'DEBIT' ? 'red' : 'green') + '" data-go="1" disabled>' + (f.pick ? 'Confirm ' + f.pick : 'Pick ' + opts.join(', ').replace(/, ([A-Z]+)$/, ' or $1')) + '</button>'
      + (cur ? '<div class="note">Now: ' + esc(cur.status) + (cur.by ? ' by ' + esc(cur.by) : '') + '</div>' : '');
    const a = l.body.querySelector('[data-keep="rm"]'); if (a) a.value = wasRm;
    const b = l.body.querySelector('[data-keep="amt"]'); if (b) b.value = wasAmt;
    const iv = l.body.querySelector('[data-keep="inv"]'); if (iv) iv.value = wasInv;
    sync();
  };
  const sync = () => { const go = l.body.querySelector('[data-go]'); if (go) go.disabled = !f.pick || ((f.pick === 'HOLD' || f.pick === 'DEBIT') && val('rm').trim().length < 3)
    || (last && f.pick === 'OKAY' && !val('inv').trim()); };
  l.body.addEventListener('input', sync);
  l.body.addEventListener('click', async e => {
    const p = e.target.closest('[data-p]');
    if (p && !p.disabled) { f.pick = p.dataset.p; paint(); return buzz(); }
    if (e.target.closest('[data-fview]')) { openViewer(r, 'next', () => paint()); return; }
    if (e.target.closest('[data-pc]')) { closeLayer(l); setTimeout(() => debitAct('verify'), 320); return; }
    if (e.target.closest('[data-go]')) {
      const rm = val('rm').trim(), amt = val('amt'), si3 = seenInfo(r);
      /* OKAY: no "are you sure" box. A signing step goes straight to the PIN (it submits itself once typed) and is
         then saved; any other step is saved at once. HOLD / DEBIT still ask to confirm (they stop or flag the bill). */
      if (f.pick !== 'OKAY') {
        const c = await iosAlert({ title:step.label + ': ' + f.pick + '?', message:(r.no || '') + (rm ? '\n“' + rm + '”' : '') + (f.pick === 'DEBIT' && amt ? '\n₹' + amt : ''), buttons:[{ t:'Cancel' }, { t:'Confirm', s:'b' }] });
        if (c.i !== 1) return;
      }
      /* A signing step passing the bill asks the checker's own PIN FIRST (a wrong PIN saves nothing); the
         Accountant Copy is stamped after the check is saved. A bill without a copy base is checked as before. */
      let sig = null;
      if (signOf(step) && f.pick !== 'HOLD') {
        let has = false; try { has = !!(await accOf(r)).hasBase; } catch (e) {}
        if (has) { sig = await askPin(step); if (!sig) return; }
      }
      /* The PIN (if any) is already in. From here the save, the Accountant Copy stamp, the remarks and the history refresh run in
         the BACKGROUND: the bill shows its new step at once (optimistic), this form closes and the next bill of the series opens. */
      const before = S.map[r.key] ? JSON.parse(JSON.stringify(S.map[r.key])) : null, nowM = mineStep(r), wasTodo = !!nowM && nowM.step.code === code;
      const u = S.user || {}, row0 = S.map[r.key] || (S.map[r.key] = { key:r.key, steps:{} });
      row0.steps = row0.steps || {}; row0.steps[code] = { status:f.pick === 'HOLD' ? 'HOLD' : 'OKAY', remarks:rm, by:u.user_name || u.name || '', emp:u.emp_code || '', at:new Date().toISOString(), seen:si3.n, total:si3.total };
      SAVING[r.key] = true;
      const body = Object.assign({ p_kind:r.kind, p_record_id:String(r.id), p_step:code, p_status:f.pick, p_remarks:rm, p_seen:si3.n, p_total:si3.total },
        f.pick === 'DEBIT' ? { p_amount:amt === '' ? null : Number(amt) } : {}, last && f.pick === 'OKAY' ? { p_invoice_no:val('inv').trim() } : {});
      const pickWas = f.pick;
      (async () => {
        try {
          const res = await rpc('scs_check_save', body);
          if (res.row) S.map[res.row.key] = res.row;
          let stampErr = '';
          if (sig) { try { await stampCopy(r, step, sig, pickWas === 'DEBIT' ? '[DEBIT] ' + rm : rm); } catch (se) { stampErr = se.message || String(se); } }
          if (stampErr) toast(r.no + ' checked, but the Accountant Copy could not be signed: ' + stampErr + ' Open the bill and press Sign Accountant Copy.', true);
          else toast(r.no + ' · ' + step.label + ' · ' + pickWas + (sig ? ' · Accountant Copy signed' : '') + ' saved');
        } catch (er) {
          if (before) S.map[r.key] = before; else delete S.map[r.key];   // the old state comes back; the bill is in the list again
          iosAlert({ title:'Check not saved', message:(r.no || '') + ': ' + (er.message || String(er)) + '\nThe bill is back in your list. Please check it again.', buttons:[{ t:'OK', s:'b' }] });
        } finally {
          delete SAVING[r.key]; LOCKS = null;
          if (CUR && CUR.r === r) { CUR.hist = null; CUR.proofs = null; loadHistory(r); loadProofs(r); paintSheet(); }
          paintAll();
        }
      })();
      closeLayer(l);
      if (wasTodo) {
        const nx = pickNext(r, code);
        if (nx) { openRecord(nx.key); toast(r.no + ' saved in the background · next: ' + nx.no); }
        else {
          toast(r.no + ' saved in the background · nothing more waiting');
          const rec = CUR && CUR.layer; if (rec) { const w = () => { if (l.closed) closeLayer(rec); else setTimeout(w, 60); }; w(); }
        }
      } else { paintSheet(); }
      paintAll();
    }
  });
  CHECK_FORM = { l, paint };
  l.onClose = () => { if (CHECK_FORM && CHECK_FORM.l === l) CHECK_FORM = null; };
  paint();
}
let CHECK_FORM = null, VF = null;

/* ── Debit Note actions ── */
async function debitAct(a){
  const r = CUR && CUR.r; if (!r) return;
  const act = async (fn, args, msg) => { busy(true); try { const res = await rpc(fn, Object.assign({ p_kind:r.kind, p_record_id:String(r.id) }, args)); if (res.row) S.map[res.row.key] = res.row; busy(false); toast(msg); CUR.hist = null; CUR.proofs = null; loadHistory(r); loadProofs(r); paintSheet(); paintAll(); return true; } catch (e) { busy(false); toast(e.message || String(e), true); return false; } };
  if (a === 'raise') {
    const l = openSheet({ small:true, left:'Cancel' }); l.el.querySelector('.tt').textContent = 'Debit Note';
    l.body.innerHTML = '<div class="grp"><div class="kv"><span>Bill</span><span>' + esc(r.no) + '</span></div></div><div class="gap"></div><textarea class="field" id="dbWhy" rows="3" maxlength="500" placeholder="Why is a Debit Note needed? (needed)"></textarea>'
      + '<input class="field" id="dbAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount, ₹ (optional)"><div class="gap"></div><button class="btn red" id="dbGo" disabled>Raise Debit Note</button><div class="note">The Accountant verifies it with a proof.</div>';
    const why = l.body.querySelector('#dbWhy'), go = l.body.querySelector('#dbGo');
    why.addEventListener('input', () => { go.disabled = why.value.trim().length < 3; });
    go.addEventListener('click', async () => {
      const amt = l.body.querySelector('#dbAmt').value;
      const c = await iosAlert({ title:'Raise a Debit Note?', message:r.no + '\n' + why.value.trim() + (amt ? '\n₹' + amt : ''), buttons:[{ t:'Cancel' }, { t:'Raise', s:'d' }] });
      if (c.i === 1 && await act('scs_debit_raise', { p_reason:why.value.trim(), p_amount:amt === '' ? null : Number(amt) }, 'Debit Note raised')) closeLayer(l);
    });
    return;
  }
  if (a === 'withdraw') {
    const c = await iosAlert({ title:'Withdraw this Debit Note?', message:'Give the reason.', input:'Reason', buttons:[{ t:'Cancel' }, { t:'Withdraw', s:'d' }] });
    if (c.i !== 1) return; if (c.value.length < 3) return toast('Write a reason of at least 3 letters.', true);
    return void await act('scs_debit_withdraw', { p_reason:c.value }, 'Debit Note withdrawn');
  }
  if (a === 'verify') {
    /* Party Consent (the Accountant): who of the party agreed (name + 10-digit mobile), the approval document(s),
       the Debit No. and amount. Done = the Debit Note is verified and the Accounts Check can pass. */
    const d = debitOf(r); if (!d) return;
    const l = openSheet({ small:true, left:'Cancel' }); l.el.querySelector('.tt').textContent = 'Party Consent';
    const val = k => ((l.body.querySelector('[data-keep="' + k + '"]') || {}).value || '').trim();
    const mob10 = s => { let m = String(s || '').replace(/\D/g, ''); if (m.length === 12 && m.startsWith('91')) m = m.slice(2); if (m.length === 11 && m.startsWith('0')) m = m.slice(1); return /^[6-9]\d{9}$/.test(m) ? m : ''; };
    const paint = () => {
      const keep = { cn:val('cn'), mob:val('mob'), no:val('no'), amt:val('amt'), rm:val('rm') }, n = (debitOf(r) || {}).proofs || 0;
      l.body.innerHTML = '<div class="grp"><div class="kv"><span>Bill</span><span>' + esc(r.no) + '</span></div><div class="kv"><span>Party</span><span>' + esc(r.party || '—') + '</span></div>'
        + '<div class="kv"><span>Debit Note</span><span>' + esc(d.reason || '') + (d.amount != null ? ' · ₹' + esc(String(d.amount)) : '') + '</span></div></div><div class="gap"></div>'
        + '<input class="field" data-keep="cn" maxlength="120" autocomplete="off" placeholder="Consent person name (needed)">'
        + '<input class="field" data-keep="mob" type="tel" inputmode="numeric" maxlength="15" autocomplete="off" placeholder="Contact mobile no. (10 digits, needed)">'
        + '<div class="grp"><div class="kv"><span>Approval documents</span><span style="color:' + (n ? 'var(--green)' : 'var(--red)') + '">' + (n ? n + ' attached' : 'Needed') + '</span></div></div><div class="gap"></div>'
        + '<label class="btn gray" style="cursor:pointer">' + IC.plus + 'Attach approval document (photo / PDF)<input type="file" data-proof="1" data-up="bc-debit-proof" accept="image/*,application/pdf" multiple hidden></label><div class="gap"></div>'
        + '<input class="field" data-keep="no" maxlength="60" placeholder="Debit No. (needed)"><input class="field" data-keep="amt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount, ₹ (needed)">'
        + '<input class="field" data-keep="rm" maxlength="500" placeholder="Remarks (optional)">'
        + '<div class="gap"></div><button class="btn green" data-vgo="1" disabled>Done: Party Consent</button>';
      const first = !keep.no && !keep.amt && !keep.rm && !keep.cn && !keep.mob;
      [['cn', keep.cn], ['mob', keep.mob], ['no', keep.no], ['amt', keep.amt || (first && d.amount != null ? String(d.amount) : '')], ['rm', keep.rm]].forEach(([k, v]) => { const i = l.body.querySelector('[data-keep="' + k + '"]'); if (i) i.value = v; });
      sync();
    };
    const sync = () => { const g = l.body.querySelector('[data-vgo]'), nn = (debitOf(r) || {}).proofs || 0;
      if (g) g.disabled = val('cn').length < 2 || !mob10(val('mob')) || nn < 1 || !val('no') || !(Number(val('amt')) > 0); };
    l.body.addEventListener('input', sync);
    l.body.addEventListener('click', async e => {
      if (!e.target.closest('[data-vgo]')) return;
      const c = await iosAlert({ title:'Party Consent done?', message:val('cn') + ' · ' + mob10(val('mob')) + '\nDebit No. ' + val('no') + ' · ₹' + val('amt'), buttons:[{ t:'Cancel' }, { t:'Done', s:'b' }] });
      if (c.i === 1 && await act('scs_debit_verify', { p_remarks:val('rm'), p_debit_no:val('no'), p_amount:Number(val('amt')), p_consent_name:val('cn'), p_consent_mobile:mob10(val('mob')) }, 'Party Consent done')) closeLayer(l);

/* A photo is shrunk to about 1600 px JPEG (the server takes 2.5 MB); a PDF goes as it is (max 1.8 MB). */
function readProof(file){
  return new Promise((resolve, reject) => {
    if (file.type === 'application/pdf') {
      if (file.size > 1800000) return reject(new Error(file.name + ': the PDF is too big (max 1.8 MB).'));
      const fr = new FileReader(); fr.onload = () => resolve({ name:file.name, mime:file.type, data:fr.result }); fr.onerror = () => reject(new Error(file.name + ': not readable.')); return fr.readAsDataURL(file);
    }
    if (!/^image\//.test(file.type)) return reject(new Error(file.name + ': only a photo or a PDF.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = .82, d = c.toDataURL('image/jpeg', q); while (d.length > 2000000 && q > .4) { q -= .12; d = c.toDataURL('image/jpeg', q); }
      resolve({ name:file.name.replace(/\.[^.]+$/, '') + '.jpg', mime:'image/jpeg', data:d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(file.name + ': this photo format cannot be read.')); };
    img.src = url;
  });
}
async function addProofs(files){
  const r = CUR && CUR.r; if (!r || !files || !files.length) return;
  busy(true);
  for (const f of [...files]) {
    try { const p = await readProof(f); const res = await rpc('scs_debit_proof_add', { p_kind:r.kind, p_record_id:String(r.id), p_name:p.name, p_mime:p.mime, p_data:p.data }); if (res.row) S.map[res.row.key] = res.row; }
    catch (e) { toast(e.message || String(e), true); if (e.code === 'TOO_MANY_FILES') break; }
  }
  busy(false); CUR.proofs = null; await loadProofs(r); paintSheet(); paintAll(); if (VF) VF.paint();
}
async function delProof(id){

  try { const res = await rpc('scs_debit_proof_remove', { p_proof_id:Number(id) }); if (res.row) S.map[res.row.key] = res.row; CUR.proofs = null; await loadProofs(r); paintSheet(); paintAll(); }

function viewProof(id){            // a data: URL cannot be opened as a page, so it goes through a blob

  try { const b = p.data.split(','), bin = atob(b[1] || ''), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); window.open(URL.createObjectURL(new Blob([u], { type:p.mime })), '_blank', 'noopener'); }
  catch (e) { toast('The proof could not be opened.', true); }
}

/* ══ Viewer: swipe through every page / photo, pinch to zoom ═══════════ */
function openViewer(r, start, onDone){
  const a = S.att[r.key]; if (!a || !a.slides.length) return;
  const slides = a.slides, ss = seenSet(r.key);
  let idx = typeof start === 'number' ? start : Math.max(0, slides.findIndex(s => !ss.has(s.n)));
  if (start === 'next' && slides.every(s => ss.has(s.n))) idx = 0;
  if (idx < 0) idx = 0;
  const el = document.createElement('div'); el.className = 'viewer'; el.style.zIndex = String(80 + LAYERS.length * 2);
  el.innerHTML = '<div class="vbar"><button class="nbtn" data-x="1">' + IC.back + '<span>Done</span></button><div class="vt"><b data-t="1"></b><small data-s="1"></small></div><span style="min-width:70px;display:flex;justify-content:flex-end"><button class="vgo" data-go="1">Bill Check</button></span></div>'
    + '<div class="car" id="car">' + slides.map(s => '<div class="vs" data-n="' + s.n + '"></div>').join('') + '</div>'
    + '<button class="vnav l" data-nv="-1" aria-label="Previous">' + IC.back + '</button><button class="vnav r" data-nv="1" aria-label="Next" style="transform:translateY(-50%) scaleX(-1)">' + IC.back + '</button>'
    + '<div class="vfoot"><div class="vcap" data-c="1"></div><div class="vcmrow"><button class="vdl" data-dl="1">Download</button><button class="vcm" data-cm="1">' + IC.cmt + '<span>Comment</span><span class="n" data-cmn="1" hidden></span></button><span class="vcml" data-cml="1"></span></div><div class="vfilm">' + slides.map(s => '<button class="vf' + (ss.has(s.n) ? ' seen' : '') + '" data-f="' + s.n + '"><span class="tk"></span></button>').join('') + '</div></div>';
  $('layer').appendChild(el);
  const l = { kind:'viewer', el, onClose:() => { if (onDone) onDone(); if (CUR) paintSheet(); } };
  pushLayer(l); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  const car = el.querySelector('#car'), boxes = [...el.querySelectorAll('.vs')], films = [...el.querySelectorAll('.vf')], zooms = new Map();
  films.forEach((b, i) => fillThumb(b, slides[i]));
  const mount = async i => {
    const s = slides[i], box = boxes[i]; if (!s || box.dataset.m) return; box.dataset.m = '1';
    box.innerHTML = '<div class="ld"><div class="spin"></div></div>';
    try {
      let node;
      if (s.type === 'img') { node = new Image(); node.alt = ''; node.draggable = false; await new Promise((ok, no) => { node.onload = ok; node.onerror = () => no(new Error('This photo could not be shown.')); node.src = s.src; }); }
      // a page that opens zoomed (desktop TOP HALF) is drawn wider, so it stays sharp at that zoom
      else if (s.type === 'pdf') node = await pdfCanvas(s, topHalfOf(s) ? Math.min(window.innerWidth, 1800) : Math.min(window.innerWidth, 900));
      else if (s.type === 'pipe') { box.innerHTML = '<div class="vpipe" data-vpipe="1">' + pipeSlideHtml(r) + '</div>'; return; }
      else throw new Error('Nothing to show.');
      node.className = 'vi'; box.innerHTML = ''; box.appendChild(node); zooms.set(i, attachZoom(box, car, topHalfOf(s)));
    } catch (e) { box.innerHTML = '<div class="msg"><b>Could not show this</b>' + esc(e.message || '') + '</div>'; }
  };
  /* Every attachment seen and the last one on screen: the right arrow (and the green Bill Check pill, for touch screens where
     there is no arrow) leaves the viewer and opens the Bill Check popup of the user's pending step. Not offered when the user has
     no step to check here, the bill is locked / still saving, or the Check popup is already open under the viewer (then it just returns). */
  const ckCode = () => {
    if (!CUR || CUR.r !== r || r.cancelled || SAVING[r.key]) return null;
    LOCKS = null; const m = mineStep(r); if (!m || lockOf(r) || !prevOk(r, m.step.code).ok) return null;
    const si = seenInfo(r); return si.ready && si.n >= si.total ? m.step.code : null;
  };
  const goCheck = () => {
    const code = ckCode(); if (!code) return false;
    const under = CHECK_FORM && !CHECK_FORM.l.closed;
    closeLayer(l);
    if (!under) { const w = () => { if (l.closed) openCheck(code); else setTimeout(w, 60); }; w(); }
    return true;
  };
  let cur = -1;
  // this page's comments: count on the button, the latest one beside it
  const cmPaint = () => {
    const s = slides[cur]; if (!s) return;
    // comments are on the attachments themselves; Download stays on every slide
    el.querySelector('[data-cm]').style.display = s.type === 'pipe' ? 'none' : ''; el.querySelector('[data-cml]').style.display = s.type === 'pipe' ? 'none' : '';
    const list = cmtsOf(r).filter(c => c.attKey === attKey(s)), n = el.querySelector('[data-cmn]'), t = el.querySelector('[data-cml]');
    n.hidden = !list.length; n.textContent = list.length;
    const lastC = list[list.length - 1];
    t.textContent = lastC ? (lastC.by || '') + ': ' + lastC.text : (CUR && CUR.cmtOff ? '' : 'Anything wrong on this page? Comment, it shows under your step.');
  };
  const show = (i, jump) => {
    if (i === cur) return; cur = i; const s = slides[i];
    ss.add(s.n); films[i].classList.add('seen');
    films.forEach((f, k) => f.classList.toggle('on', k === i));
    films[i].scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
    el.querySelector('[data-t]').textContent = s.label + (s.of > 1 ? ' ' + s.pos + ' / ' + s.of : '');
    { const need = needSeen(a); el.querySelector('[data-s]').textContent = (i + 1) + ' of ' + slides.length + ' · looked at ' + need.filter(x => ss.has(x.n)).length + ' of ' + need.length; }
    el.querySelector('[data-c]').innerHTML = esc(s.caption || '') + (s.open ? '<a class="open" href="' + esc(s.open) + '" target="_blank" rel="noopener">Open original</a>' : '');
    cmPaint();
    [i - 1, i, i + 1].forEach(k => { if (k >= 0 && k < slides.length) mount(k); });
    zooms.forEach((z, k) => { if (k !== i) z.reset(); });
    car.classList.toggle('lock', boxes[i].classList.contains('zoomed'));   // only the slide on screen decides (a preloaded neighbour may open zoomed)
    const last = i === slides.length - 1, can = last && !!ckCode();
    el.querySelectorAll('.vnav').forEach(b => { const fwd = +b.dataset.nv > 0; b.disabled = (!fwd && i === 0) || (fwd && last && !can); b.classList.toggle('go', fwd && can); b.title = fwd && can ? 'Bill Check' : ''; });
    el.querySelector('.vgo').classList.toggle('on', can);

  };
  let st = null;
  car.addEventListener('scroll', () => { clearTimeout(st); st = setTimeout(() => { const i = Math.round(car.scrollLeft / Math.max(1, car.clientWidth)); if (i >= 0 && i < slides.length) show(i); }, 60); }, { passive:true });
  el.addEventListener('click', e => {
    if (e.target.closest('[data-x]')) return closeLayer(l);

    if (e.target.closest('[data-cm]')) { const s = slides[cur]; if (s) addComment(r, s).then(ok => { if (ok) cmPaint(); }); return; }
    if (e.target.closest('.vgo')) return goCheck();
    const nv = e.target.closest('[data-nv]'); if (nv && !nv.disabled && +nv.dataset.nv > 0 && cur === slides.length - 1) return goCheck();
    if (nv && !nv.disabled) return car.scrollTo({ left:(cur + +nv.dataset.nv) * car.clientWidth, behavior:'smooth' });

  });
  const key = e => { if (l.closed || LAYERS[LAYERS.length - 1] !== l) return; if (e.key === 'ArrowRight') { if (cur === slides.length - 1) goCheck(); else car.scrollTo({ left:(cur + 1) * car.clientWidth, behavior:'smooth' }); } else if (e.key === 'ArrowLeft') car.scrollTo({ left:(cur - 1) * car.clientWidth, behavior:'smooth' }); else if (e.key === 'Escape') closeLayer(l); };
  document.addEventListener('keydown', key); const oc = l.onClose; l.onClose = () => { document.removeEventListener('keydown', key); oc(); };

}
/* Pinch, double-tap and wheel zoom on one slide; a one-finger drag pans only while zoomed
   (otherwise the browser swipes the carousel). */
/* DESKTOP TOP HALF: on a desktop (mouse + a screen 1024 px or wider; never a phone or tablet) the pages of the PR, PO,
   Actual Bill and Supplier / Receiver Copy open zoomed: the page as wide as the viewer allows, at most twice its
   fitted size, with its TOP half on screen (number, party, items). The mouse wheel then scrolls it down (Ctrl +
   wheel / a trackpad pinch zooms), a drag pans, a double-click goes to the whole page and back; going to another
   slide and back opens it the same way again. */
const TOP_HALF_GROUPS = ['STORE', 'PR', 'PO', 'BILL'];
const isDesktop = () => !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches) && window.innerWidth >= 1024;
const topHalfOf = s => !!s && s.type === 'pdf' && TOP_HALF_GROUPS.indexOf(s.group) >= 0 && isDesktop();
function attachZoom(box, car, topHalf){
  const el = box.firstElementChild; let s = 1, tx = 0, ty = 0, last = 0, startD = 0, startS = 1; const ptrs = new Map();
  const onScreen = () => Math.abs(box.getBoundingClientRect().left - car.getBoundingClientRect().left) < 4;
  // the carousel's swipe lock follows the slide on screen only (a neighbour is loaded, and may open zoomed, beforehand)
  const apply = () => { el.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + s + ')'; box.classList.toggle('zoomed', s > 1.01); if (onScreen()) car.classList.toggle('lock', s > 1.01); };
  const clamp = () => { const r = box.getBoundingClientRect(), w = el.offsetWidth * s, h = el.offsetHeight * s, mx = Math.max(0, (w - r.width) / 2), my = Math.max(0, (h - r.height) / 2); tx = Math.max(-mx, Math.min(mx, tx)); ty = Math.max(-my, Math.min(my, ty)); };
  const zoomAt = (ns, cx, cy) => { ns = Math.max(1, Math.min(6, ns)); const r = box.getBoundingClientRect(), ox = cx - (r.left + r.width / 2), oy = cy - (r.top + r.height / 2); tx = ox - (ox - tx) * ns / s; ty = oy - (oy - ty) * ns / s; s = ns; if (s <= 1.01) { s = 1; tx = ty = 0; } clamp(); apply(); };

  });

    const p = ptrs.get(e.pointerId); if (!p) return;
    if (ptrs.size === 2) { p.x = e.clientX; p.y = e.clientY; const [a, b] = [...ptrs.values()]; zoomAt(startS * Math.hypot(a.x - b.x, a.y - b.y) / Math.max(1, startD), (a.x + b.x) / 2, (a.y + b.y) / 2); }
    else if (s > 1.01) { tx += e.clientX - p.x; ty += e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; clamp(); apply(); }
    else { p.x = e.clientX; p.y = e.clientY; }

}

/* ══ Events ════════════════════════════════════════════════════════════ */
document.addEventListener('click', async e => {
  const t = e.target;

  const open = t.closest('[data-open]');
  if (open && (S.seg === 'PRINT' || S.seg === 'PRINTED')) { const rr = S.rows.find(x => x.key === open.dataset.open); if (rr) accPrintAct(rr); return; }
  if (t.closest('#accPrint')) { S.seg = S.seg === 'PRINT' ? 'TODO' : 'PRINT'; paintAll(); return buzz(6); }
  if (t.closest('#accPrinted')) { S.seg = S.seg === 'PRINTED' ? 'TODO' : 'PRINTED'; paintAll(); return buzz(6); }
  if (open) {
    const rr = S.rows.find(x => x.key === open.dataset.open), lk = rr && S.seg === 'TODO' ? lockOf(rr) : null;
    if (lk) {
      const c = await iosAlert({ title:'Check ' + lk.no + ' first', message:(rr.no || '') + ' comes after ' + lk.no + ' in its series. Give ' + lk.no + ' OKAY, or HOLD it, and this one opens.', buttons:[{ t:'Close' }, { t:'Open ' + lk.no, s:'b' }] });
      if (c.i === 1) openRecord(lk.key);
      return;
    }
    return openRecord(open.dataset.open);
  }
  const sg = t.closest('[data-seg]'); if (sg) { S.seg = sg.dataset.seg; paintAll(); return buzz(6); }
  const ty = t.closest('[data-type]'); if (ty) { S.type = ty.dataset.type; return paintAll(); }
  const so = t.closest('[data-store]'); if (so) { S.store = so.dataset.store; return paintAll(); }
  const more = t.closest('[data-more]'); if (more) { S.show[more.dataset.more] = (S.show[more.dataset.more] || 40) + 40; return paintList(); }
  if (t.closest('#bkBtn')) { location.href = 'launcher.html'; return; }
  if (t.closest('#meBtn')) return meMenu();
  if (t.closest('[data-role]')) return chooseRole(true);
  if (t.closest('#qx')) { $('q').value = ''; S.q = ''; $('searchBox').classList.remove('has'); return paintAll(); }
  // record sheet
  const nxt = t.closest('[data-next]'); if (nxt) return openRecord(nxt.dataset.next);
  const vw = t.closest('[data-view]'); if (vw && CUR) { const v = vw.dataset.view; return openViewer(CUR.r, v === 'next' ? 'next' : +v); }
  if (t.closest('[data-retry]') && CUR) return loadAttachments(CUR.r, true);
  const ck = t.closest('[data-check]'); if (ck) return openCheck(ck.dataset.check);
  const rs = t.closest('[data-restamp]');
  if (rs && CUR) {
    const stp = S.flow.find(s => s.code === rs.dataset.restamp), x = stp && stepOf(CUR.r, stp.code); if (!stp || !x) return;
    const sg = await askPin(stp); if (!sg) return;
    busy(true); try { await stampCopy(CUR.r, stp, sg, x.remarks || ''); busy(false); toast('Accountant Copy signed'); paintSheet(); } catch (er) { busy(false); toast(er.message || String(er), true); }
    return;
  }
  const dg = t.closest('[data-dlg]'); if (dg && CUR) return dlGroup(CUR.r, dg.dataset.dlg);
  const dbt = t.closest('[data-debit]'); if (dbt && !dbt.disabled) return debitAct(dbt.dataset.debit);
  const pd = t.closest('[data-pdel]'); if (pd) { e.stopPropagation(); return delProof(pd.dataset.pdel); }
  const pv = t.closest('[data-pview]'); if (pv) return viewProof(pv.dataset.pview);
  const cd = t.closest('[data-cmdel]'); if (cd) { e.stopPropagation(); return delComment(cd.dataset.cmdel); }
});
document.addEventListener('change', e => { if (e.target.matches('[data-proof]')) { const f = e.target.files; addProofs(f); e.target.value = ''; } });
$('q').addEventListener('input', e => { S.q = e.target.value.trim(); $('searchBox').classList.toggle('has', !!e.target.value); paintAll(); });
async function meMenu(){
  const u = S.user || {};
  const multi = myRoles().length > 1;
  const i = await iosMenu({ title:u.user_name || u.name || 'Account', message:[u.emp_code, u.role].filter(Boolean).join(' · '), items:[{ t:'Refresh' }, { t:'Open ERP' }, { t:'Log out', s:'d' }].concat(multi ? [{ t:'Change role' }] : []) });
  if (i === 3) return chooseRole(true);
  if (i === 0) refresh(true); else if (i === 1) location.href = 'index.html';
  else if (i === 2) { const c = await iosAlert({ title:'Log out?', message:'This ends the session in every app.', buttons:[{ t:'Cancel' }, { t:'Log out', s:'d' }] }); if (c.i === 1) SARV_GATE.logout({ url:SUPABASE_URL, key:SUPABASE_ANON }); }
}
async function refresh(manual){ if (manual) toast('Refreshing…'); await loadList(); }

/* Large title collapses into the bar; pull down to refresh. */
(function(){
  const sc = $('scroll'), ctrl = $('ctrl'), ptr = $('ptr');
  const fit = () => document.documentElement.style.setProperty('--ctrl-h', ctrl.offsetHeight + 'px');
  fit(); if (window.ResizeObserver) new ResizeObserver(fit).observe(ctrl); else window.addEventListener('resize', fit);
  let y0 = null, pull = 0;
  sc.addEventListener('touchstart', e => { if (sc.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive:true });
  sc.addEventListener('touchmove', e => { if (y0 == null) return; pull = Math.max(0, (e.touches[0].clientY - y0) * .45); if (pull > 0) { ptr.style.transition = 'none'; ptr.style.height = Math.min(pull, 70) + 'px'; } }, { passive:true });
  sc.addEventListener('touchend', () => { if (y0 == null) return; ptr.style.transition = 'height .4s cubic-bezier(.32,.72,0,1)'; if (pull > 56) { ptr.style.height = '44px'; refresh().finally(() => { ptr.style.height = '0'; }); buzz(10); } else ptr.style.height = '0'; y0 = null; pull = 0; });
})();

/* ══ Boot ══════════════════════════════════════════════════════════════ */
(async function boot(){
