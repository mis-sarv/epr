// Sattan width + kg per blanket by fabric — exactly the figures the Fabric Type
// dropdown states. Unknown / imported fabrics fall back to 5" / 0.24 kg, which
// is what the original code did for every non-MINK fabric.
const FABRIC_SPECS = {
  MINK:        { size:'4 INCH', kg:0.12 },
  SUPERSOFT:   { size:'5 INCH', kg:0.24 },
  SUPERCLOUDY: { size:'5 INCH', kg:0.24 },
  FLANNEL:     { size:'4 INCH', kg:0.15 },
};
function fabricSpec(f){ return FABRIC_SPECS[String(f||'').trim().toUpperCase()] || { size:'5 INCH', kg:0.24 }; }

function getColorHex(color){
  const c=(color||'').trim().toUpperCase();
  return ({'RED':'#ef4444','MAROON':'#800000','NAVY BLUE':'#000080','ROYAL BLUE':'#4169e1','BLUE':'#2563eb','GOLD':'#eab308','SILVER':'#94a3b8','COFFEE':'#78350f','BLACK':'#0f172a','CREAM':'#fef08a','PINK':'#f43f5e','RUST':'#c2410c','BOTTLE GREEN':'#14532d','GREY':'#64748b'})[c]||'#64748b';
}

/* Factory Sattan Bundle Rounding:
   4.3 → 4, 4.8 → 4 (any decimal < 0.9 stays at the lower integer),
   4.9 → 5 (decimal ≥ 0.9 rounds up) — "0.9 wali decimal ke baad 9 wali value ko poora kar de" */
function getRoundedBundles(bundles){
  if(bundles<=0) return 0;
  const integerPart=Math.floor(bundles);
  const decimalPart=Number((bundles-integerPart).toFixed(4));   // avoids 4.9-4 = 0.8999…
  if(decimalPart>=0.899) return integerPart+1;
  return integerPart;
}

// Pieces per printing roll — DOUBLE: 1 ply 54 / else 27 · SINGLE: 1 ply 84 / else 42
function getPcsPerRoll(size, ply){
  if(size==='DOUBLE') return ply==='1'?54:27;
  return ply==='1'?84:42;
}

// ═══════════════════════ SUPABASE DATA LAYER ═══════════════════════════════
async function fetchAll(table, cols, orderCol, asc){
  const out=[]; const PAGE=1000;
  for(let from=0;;from+=PAGE){
    let q=SB.from(table).select(cols).range(from,from+PAGE-1);
    if(orderCol) q=q.order(orderCol,{ascending:!!asc});
    const {data,error}=await q; if(error) throw error;
    out.push(...(data||[])); if(!data||data.length<PAGE) break;
  }
  return out;
}

function fmtWt(v){ return (Number(v)||0).toFixed(2); }

// DB row (+children) → LotData shape the UI works with (types.ts)
function rowToLot(r){
  const tiers=Array.isArray(r.packing_tiers)?r.packing_tiers:[];
  const matchings=(r.mfg_lot_matchings||[]).slice().sort((a,b)=>a.line_no-b.line_no)
    .map(m=>({ rolls:m.rolls==null?'':m.rolls, pcs:m.pcs==null?'':m.pcs, color:m.color||'RED', allocations:m.allocations||{} }));
  const trims=(r.mfg_lot_trims||[]).slice().sort((a,b)=>a.line_no-b.line_no).map(t=>({ name:t.name, qty:t.qty==null?'':t.qty }));
  return {
    id:r.id, lotNo:r.lot_no, brandName:r.brand_name, fabricType:r.fabric_type, bedSize:r.bed_size, blanketPly:String(r.blanket_ply||'1'),
    packingMode:r.packing_mode||'single', masterPack1:r.master_pack1||'BORA', stdPacking:r.std_packing==null?10:Number(r.std_packing),
    slavePack:r.slave_pack||'PVC BAG', packingTiers:tiers,
    splitConfigs:tiers.map(t=>({ id:t.id, name:t.masterPack, stdPacking:t.stdSlavePcs, slavePack:t.slavePack })),
    totalPcs:Number(r.total_pcs)||0, sattanSize:r.sattan_size||'', totalSattanWeight:fmtWt(r.total_sattan_weight),
    sattanBundleWeight:Number(r.sattan_bundle_weight)||BUNDLE_KG,
    colorSattanBreakdown:Array.isArray(r.color_sattan_breakdown)?r.color_sattan_breakdown:[],
    matchings, trims, createdAt:r.lot_date||'', notes:r.notes||undefined,
    createdBy:r.created_by||'', updatedBy:r.updated_by||'', updatedAt:r.updated_at,
  };
}

// LotData → mfg_save_lot arguments
function lotToRpc(lot){
  const nOrNull=v=>(v===''||v==null||isNaN(Number(v)))?null:Number(v);
  const tiers=normalizeTiers(lot);
  const totalSattanWeight=num(lot.totalSattanWeight);
  const bundleWt=Number(lot.sattanBundleWeight)||BUNDLE_KG;
  return {
    p_lot:{
      lot_no:String(lot.lotNo||'').trim(), brand_name:lot.brandName||'SARV INDIA', fabric_type:lot.fabricType||'MINK',
      bed_size:lot.bedSize||'DOUBLE', blanket_ply:String(lot.blanketPly||'1'), packing_mode:tiers.length>1?'split':'single',
      master_pack1:tiers[0]?tiers[0].masterPack:(lot.masterPack1||'BORA'),
      std_packing:tiers[0]?Number(tiers[0].stdSlavePcs)||10:(Number(lot.stdPacking)||10),
      slave_pack:tiers[0]?tiers[0].slavePack:(lot.slavePack||'PVC BAG'),
      packing_tiers:tiers, total_pcs:num(lot.totalPcs), sattan_size:lot.sattanSize||fabricSpec(lot.fabricType).size,
      per_pc_sattan_kg:lot.perPcSattanKg!=null?lot.perPcSattanKg:fabricSpec(lot.fabricType).kg,
      total_sattan_weight:totalSattanWeight, sattan_bundle_weight:bundleWt,
      exact_bundles:Number((totalSattanWeight/bundleWt).toFixed(4)), total_bundles:getRoundedBundles(totalSattanWeight/bundleWt),
      color_sattan_breakdown:Array.isArray(lot.colorSattanBreakdown)&&lot.colorSattanBreakdown.length?lot.colorSattanBreakdown:computeColorBreakdown(lot),
      notes:lot.notes||null, lot_date:/^\d{4}-\d{2}-\d{2}/.test(lot.createdAt||'')?String(lot.createdAt).slice(0,10):todayISO(),
      updated_by:erpUserLabel()||null
    },
    p_matchings:(lot.matchings||[]).map((m,i)=>({ line_no:i+1, rolls:nOrNull(m.rolls), color:m.color||'RED', pcs:nOrNull(m.pcs), allocations:m.allocations||{} })),
    p_trims:(lot.trims||[]).map((t,i)=>({ line_no:i+1, name:String(t.name||'').trim(), qty:nOrNull(t.qty) })),
  };
}

// PrintLotCard / Sheets fallback: tiers from packingTiers → splitConfigs → single masterPack1
function normalizeTiers(lot){
  if(lot.packingTiers&&lot.packingTiers.length) return lot.packingTiers;
  if(lot.splitConfigs&&lot.splitConfigs.length) return lot.splitConfigs.map(sc=>({ id:sc.id, masterPack:sc.name, stdSlavePcs:sc.stdPacking, slavePack:sc.slavePack||lot.slavePack||'PVC BAG' }));
  return [{ id:'tier_1', masterPack:lot.masterPack1||'BORA', stdSlavePcs:Number(lot.stdPacking)||10, slavePack:lot.slavePack||'PVC BAG' }];
}

// Colour-wise sattan (used when a lot has no stored breakdown, e.g. imported)
function computeColorBreakdown(lot){
  const spec=fabricSpec(lot.fabricType);
  const colorMap={};
  (lot.matchings||[]).forEach(m=>{ const c=(m.color||'RED').trim().toUpperCase(); const pcs=num(m.pcs); if(pcs>0) colorMap[c]=(colorMap[c]||0)+pcs; });
  return Object.entries(colorMap).map(([color,pcs])=>{
    const weight=pcs*spec.kg, bundlesExact=weight/BUNDLE_KG;
    return { color, size:lot.sattanSize||spec.size, pcs, weightKg:Number(weight.toFixed(2)), bundles:getRoundedBundles(bundlesExact),
      exactBundles:Number(bundlesExact.toFixed(2)), fullBundles:Math.floor(bundlesExact), leftoverKg:Number((weight%BUNDLE_KG).toFixed(2)) };
  });
}

async function loadLots(){
  const rows=await fetchAll('mfg_lot_cards','*, mfg_lot_matchings(*), mfg_lot_trims(*)','created_at',false);
  S.lots=rows.map(rowToLot);
}
async function loadLibraries(){
  const [mp,sp]=await Promise.all([fetchAll('mfg_master_packings','*','sort_order',true), fetchAll('mfg_slave_packings','*','sort_order',true)]);
  if(mp.length) S.masterPackings=mp.map(r=>({ id:r.id, name:r.name, defaultPcs:Number(r.default_pcs)||10, description:r.description||undefined, isDefault:!!r.is_default }));
  if(sp.length) S.slavePackings=sp.map(r=>({ id:r.id, name:r.name, description:r.description||undefined, isDefault:!!r.is_default }));
}

async function saveLotRpc(p_id, lot, overwrite){
  const a=lotToRpc(lot);
  const {data,error}=await SB.rpc('mfg_save_lot',{ p_id:p_id||null, p_lot:a.p_lot, p_matchings:a.p_matchings, p_trims:a.p_trims, p_overwrite:!!overwrite });
  if(error) throw error;
  return data||{success:false,error:'No response'};
}

// Library modal saves the whole list → mirror it in the table (upsert + delete removed)
async function syncLibrary(table, list, toRow){
  const rows=list.map((p,i)=>Object.assign(toRow(p),{ sort_order:i+1 }));
  const {data:existing,error:e1}=await SB.from(table).select('id'); if(e1) throw e1;
  const keep=new Set(rows.map(r=>r.id));
  const gone=(existing||[]).map(r=>r.id).filter(id=>!keep.has(id));
  if(gone.length){ const {error}=await SB.from(table).delete().in('id',gone); if(error) throw error; }
  if(rows.length){ const {error}=await SB.from(table).upsert(rows,{onConflict:'id'}); if(error) throw error; }
}

// ═══════════════════════ APP HANDLERS (App.tsx) ════════════════════════════
async function handleSaveLot(lotData){
  if(S.saving) return;
  S.saving=true; setSaveBusy(true);
  try{
    const isEdit=!!S.editingLot && !S.editingIsDuplicate;
    let res=await saveLotRpc(isEdit?S.editingLot.id:null, lotData, false);
    let msg;
    if(!res.success && res.code==='EXISTS'){
      if(!window.confirm(`Lot #${lotData.lotNo} already exists! Overwrite it?`)) return;
      res=await saveLotRpc(null, lotData, true);
      msg=`Lot #${lotData.lotNo} updated!`;
    }
    if(!res.success){ F.formError=res.error||'Save failed'; renderFormError(); return; }
    if(!msg) msg=isEdit?`Lot #${lotData.lotNo} details updated successfully!`:`New Lot #${lotData.lotNo} created successfully!`;
    await loadLots();
    showToast(msg);
    S.editingLot=null; S.editingIsDuplicate=false;
    S.activePrintLot=S.lots.find(l=>l.id===res.id)||null;
    setTab('print');
  }catch(e){
    F.formError='❌ '+errMsg(e); renderFormError();
  }finally{
    S.saving=false; setSaveBusy(false);
  }
}

function handleSelectEdit(lot){ S.editingLot=lot; S.editingIsDuplicate=false; setTab('new',true); }
function handleSelectPrint(lot){ S.activePrintLot=lot; setTab('print'); }

async function handleDeleteLot(lot){
  if(!window.confirm(`Are you sure you want to delete Lot #${lot.lotNo}?`)) return;
  try{
    const {error}=await SB.from('mfg_lot_cards').delete().eq('id',lot.id);
    if(error) throw error;
    S.lots=S.lots.filter(l=>l.id!==lot.id);
    if(S.activePrintLot&&S.activePrintLot.id===lot.id) S.activePrintLot=null;
    showToast(`Lot #${lot.lotNo||''} deleted`,'info');
    renderNavbar(); renderMain();
  }catch(e){ showToast('❌ '+errMsg(e),'info'); }
}

function handleDuplicateLot(lot){
  const nextLotNo=/^\d+$/.test(lot.lotNo)?String(parseInt(lot.lotNo,10)+1):`${lot.lotNo}-COPY`;
  const duplicated=JSON.parse(JSON.stringify(lot));
  duplicated.id=null; duplicated.lotNo=nextLotNo; duplicated.createdAt=todayISO(); duplicated._from=lot.lotNo;
  S.editingLot=duplicated; S.editingIsDuplicate=true;   // saved as a NEW lot
  setTab('new',true);
  showToast(`Duplicated Lot #${lot.lotNo} as #${nextLotNo}. Review and save!`);
}

// ═══════════════════════ NAVIGATION ════════════════════════════════════════
function setTab(tab, keepEditing){
  if(tab==='new' && !keepEditing){ S.editingLot=null; S.editingIsDuplicate=false; }
  if(tab==='new') F=null;   // the form remounts fresh every time, like <LotForm key=…>
  if(tab!=='new') closeModal();
  S.tab=tab;
  renderNavbar(); renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderMain(){
  if(!S.ready) return;
  if(S.tab==='new') renderForm();
  else if(S.tab==='list') renderList();
  else renderPrint();
  refreshIcons();
}

function initForm(initialData){
  const mp=S.masterPackings, sp=S.slavePackings;
  let packingTiers;
  if(initialData&&initialData.packingTiers&&initialData.packingTiers.length){
    packingTiers=initialData.packingTiers.map(t=>Object.assign({},t));
  } else if(initialData&&initialData.splitConfigs&&initialData.splitConfigs.length){
    packingTiers=initialData.splitConfigs.map((sc,idx)=>({ id:sc.id||'tier_'+idx, masterPack:sc.name, stdSlavePcs:sc.stdPacking||10, slavePack:sc.slavePack||initialData.slavePack||'PVC BAG' }));
  } else {
    packingTiers=[{ id:'tier_1',
      masterPack:(initialData&&initialData.masterPack1)||(mp[0]?mp[0].name:'BORA'),
      stdSlavePcs:(initialData&&initialData.stdPacking)?Number(initialData.stdPacking):(mp[0]?mp[0].defaultPcs:10),
      slavePack:(initialData&&initialData.slavePack)||(sp[0]?sp[0].name:'PVC BAG') }];
  }
  const now=Date.now();
  const matchings=(initialData&&initialData.matchings&&initialData.matchings.length)
    ? initialData.matchings.map((m,idx)=>({ id:'m_'+idx+'_'+now, rolls:m.rolls, color:m.color||'RED', pcs:m.pcs, allocations:Object.assign({},m.allocations||{}) }))
    : [{ id:'m_init', rolls:'', color:'RED', pcs:'', allocations:{} }];
  const trims=(initialData&&initialData.trims&&initialData.trims.length)
    ? initialData.trims.map((t,idx)=>({ id:'t_'+idx+'_'+now, name:t.name, qty:t.qty, manual:true }))
    : [{ id:'t_1', name:'Small Label', qty:'', manual:false },{ id:'t_2', name:'Main Label', qty:'', manual:false },{ id:'t_3', name:'Washing Label', qty:'', manual:false },{ id:'t_4', name:'Dori', qty:'', manual:false }];
  F={
    initialData:initialData||null,
    lotNo:(initialData&&initialData.lotNo)||'',
    brandName:(initialData&&initialData.brandName)||'SARV INDIA', customBrand:'', showCustomBrand:false,
    fabricType:(initialData&&initialData.fabricType)||'MINK', bedSize:(initialData&&initialData.bedSize)||'DOUBLE', blanketPly:(initialData&&initialData.blanketPly)||'1',
    notes:(initialData&&initialData.notes)||'', formError:null,
    packingTiers, quick:{tierId:null,type:null,input:'',pcs:'10'}, matchings, trims, lastTotal:null,
  };
  syncTrims();
}

// Derived values — exactly the "Calculations" block of LotForm.tsx
function calc(){
  const totalPcs=F.matchings.reduce((s,r)=>s+(num(r.pcs)),0);
  const spec=fabricSpec(F.fabricType);
  const sattanSize=spec.size, perPcWeight=spec.kg;
  const totalSattanWeight=(totalPcs*perPcWeight).toFixed(2);
  const exactTotalBundles=totalPcs>0?parseFloat(totalSattanWeight)/BUNDLE_KG:0;
  const roundedTotalBundles=getRoundedBundles(exactTotalBundles);
  const totalBundles=exactTotalBundles.toFixed(2);
  const colorMap={};
  F.matchings.forEach(m=>{ const c=(m.color||'RED').trim().toUpperCase(); const pcs=num(m.pcs); if(pcs>0) colorMap[c]=(colorMap[c]||0)+pcs; });
  const colorBreakdown=Object.entries(colorMap).map(([color,pcs])=>{
    const weight=pcs*perPcWeight, bundlesExact=weight/BUNDLE_KG;
    return { color, size:sattanSize, pcs, weightKg:Number(weight.toFixed(2)), bundles:getRoundedBundles(bundlesExact),
      exactBundles:Number(bundlesExact.toFixed(2)), fullBundles:Math.floor(bundlesExact), leftoverKg:Number((weight%BUNDLE_KG).toFixed(2)) };
  });
  return { totalPcs, sattanSize, perPcWeight, totalSattanWeight, exactTotalBundles, roundedTotalBundles, totalBundles, colorBreakdown };
}

// Equal split across tiers: floor(pcs/n) each, remainder to the last tier
function evenAlloc(pcs, tiers){
  const out={}; if(!tiers.length) return out;
  const portion=Math.floor(pcs/tiers.length);
  tiers.forEach((t,i)=>{ out[t.id]=(i===tiers.length-1)?pcs-portion*(tiers.length-1):portion; });
  return out;
}

// Trims qty follows total pieces unless the user typed one (useEffect on totalPcs)
function syncTrims(){
  const total=calc().totalPcs;
  if(F.lastTotal===total) return;
  F.lastTotal=total;
  F.trims.forEach((t,i)=>{
    if(!t.manual){ t.qty=total>0?total:''; const el=$('t-qty-'+i); if(el) el.value=t.qty; }
    const el=$('t-qty-'+i); if(el) el.placeholder=String(total||'0');
  });
  const s=$('lf-trims-total'); if(s) s.textContent=total||0;
}

const LF={
  lotNo(v){ F.lotNo=v; },
  brand(v){ F.brandName=v; },
  customBrand(v){ F.customBrand=v; },
  toggleCustomBrand(){ F.showCustomBrand=!F.showCustomBrand; renderBrandCell(); },
  fabric(v){ F.fabricType=v; afterValues(); },
  bedSize(v){ F.bedSize=v; handleSpecsChange(); },
  ply(v){ F.blanketPly=v; handleSpecsChange(); },
  notes(v){ F.notes=v; },

  // Matching rows
  rolls(i,val){
    const m=F.matchings[i]; m.rolls=val;
    const rollsNum=parseFloat(val)||0;
    const newPcs=rollsNum>0?Math.round(rollsNum*getPcsPerRoll(F.bedSize,F.blanketPly)):'';
    m.pcs=newPcs;
    if(F.packingTiers.length>1 && typeof newPcs==='number' && newPcs>0) m.allocations=evenAlloc(newPcs,F.packingTiers);
    const p=$('m-pcs-'+i); if(p) p.value=m.pcs;
    renderMatchingDerived(i); afterValues();
  },
  pcs(i,val){
    const m=F.matchings[i]; m.pcs=val;
    const pcsNum=parseFloat(val)||0;
    if(F.packingTiers.length>1 && pcsNum>0) m.allocations=evenAlloc(pcsNum,F.packingTiers);
    renderMatchingDerived(i); afterValues();
  },
  color(i,c){ F.matchings[i].color=c; afterValues(); },
  alloc(i,tierId,val){
    const m=F.matchings[i]; m.allocations=Object.assign({},m.allocations||{}); m.allocations[tierId]=val;
    const tier=F.packingTiers.find(t=>t.id===tierId);
    const a=num(val), units=a>0?Math.ceil(a/tier.stdSlavePcs):0;
    const u=$(`a-units-${i}-${tierId}`); if(u) u.textContent=`${units} ${tier.masterPack}`;
    renderMatchingBadge(i); renderDerived();
  },
  splitEvenly(i){
    const m=F.matchings[i]; const rowPcs=num(m.pcs);
    if(rowPcs<=0||!F.packingTiers.length) return;
    m.allocations=evenAlloc(rowPcs,F.packingTiers);
    renderMatchingDerived(i); renderDerived();
  },
  splitAllEvenly(){
    F.matchings.forEach(m=>{ const rowPcs=num(m.pcs); if(rowPcs>0&&F.packingTiers.length) m.allocations=evenAlloc(rowPcs,F.packingTiers); });
    renderMatchings(); renderDerived();
  },
  addMatching(){
    F.matchings.push({ id:'m_'+Date.now(), rolls:'', color:DEFAULT_SATTAN_COLORS[F.matchings.length%DEFAULT_SATTAN_COLORS.length]||'RED', pcs:'', allocations:{} });
    renderMatchings(); afterValues();
  },
  removeMatching(i){
    if(F.matchings.length===1) F.matchings=[{ id:'m_'+Date.now(), rolls:'', color:'RED', pcs:'', allocations:{} }];
    else F.matchings.splice(i,1);
    renderMatchings(); afterValues();
  },

  // Packing tiers
  addTier(){
    const tiers=F.packingTiers, mp=S.masterPackings, sp=S.slavePackings;
    const nextIdx=tiers.length+1;
    const availableMaster=mp.find(p=>!tiers.some(t=>t.masterPack.toUpperCase()===p.name.toUpperCase()))||mp[nextIdx%mp.length]||mp[0];
    const availableSlave=sp.find(p=>!tiers.some(t=>t.slavePack.toUpperCase()===p.name.toUpperCase()))||sp[nextIdx%sp.length]||sp[0];
    tiers.push({ id:'tier_'+Date.now(), masterPack:availableMaster?availableMaster.name:'BOX', stdSlavePcs:availableMaster?availableMaster.defaultPcs:10, slavePack:availableSlave?availableSlave.name:'GIFT BOX' });
    F.matchings.forEach(m=>{ const rowPcs=num(m.pcs); if(rowPcs>0) m.allocations=evenAlloc(rowPcs,tiers); });   // auto distribute evenly
    afterTiers();
  },
  removeTier(id){
    if(F.packingTiers.length<=1){ F.formError='At least one Master Packing tier is required.'; renderFormError(); return; }
    F.formError=null; renderFormError();
    F.packingTiers=F.packingTiers.filter(t=>t.id!==id);
    F.matchings.forEach(m=>{ const rowPcs=num(m.pcs); if(rowPcs>0) m.allocations=evenAlloc(rowPcs,F.packingTiers); });
    afterTiers();
  },
  tierMaster(id,name,noRender){
    const found=S.masterPackings.find(p=>p.name.toUpperCase()===name.toUpperCase());
    F.packingTiers=F.packingTiers.map(t=>t.id===id?Object.assign({},t,{ masterPack:name, stdSlavePcs:found?found.defaultPcs:t.stdSlavePcs }):t);
    if(!noRender) afterTiers();
  },
  tierStd(id,v,noRender){
    const pcs=parseInt(v,10)||1;
    F.packingTiers=F.packingTiers.map(t=>t.id===id?Object.assign({},t,{ stdSlavePcs:pcs }):t);
    if(noRender) return;
    const t=F.packingTiers.find(x=>x.id===id); const s=$('tier-sum-'+id); if(s) s.innerHTML=tierSummary(t);
    renderMatchings(); renderDerived();
  },
  tierStdBlur(id,el){ const t=F.packingTiers.find(x=>x.id===id); if(t) el.value=t.stdSlavePcs; },
  tierSlave(id,name){ F.packingTiers=F.packingTiers.map(t=>t.id===id?Object.assign({},t,{ slavePack:name }):t); afterTiers(); },
  openQuick(id,type){ F.quick={ tierId:id, type, input:'', pcs:F.quick.pcs||'10' }; renderTiers(); const el=$('quick-input'); if(el) el.focus(); },
  closeQuick(){ F.quick.tierId=null; renderTiers(); },
  quickInput(v){ F.quick.input=v; },
  quickPcs(v){ F.quick.pcs=v; },
  execQuick(id){
    const trimmed=F.quick.input.trim().toUpperCase();
    if(!trimmed) return;
    if(F.quick.type==='master'){ const pcs=parseInt(F.quick.pcs,10)||10; LF.tierMaster(id,trimmed,true); LF.tierStd(id,pcs,true); }
    else if(F.quick.type==='slave'){ F.packingTiers=F.packingTiers.map(t=>t.id===id?Object.assign({},t,{ slavePack:trimmed }):t); }
    F.quick={ tierId:null, type:null, input:'', pcs:F.quick.pcs };
    afterTiers();
  },

  // Trims
  addTrim(name){ const total=calc().totalPcs; F.trims.push({ id:'t_'+Date.now(), name:name||'Piping', qty:total||'', manual:false }); renderTrims(); },
  removeTrim(i){ F.trims.splice(i,1); renderTrims(); },
  trimName(i,v){ F.trims[i].name=v; },
  trimQty(i,v){ F.trims[i].qty=v; F.trims[i].manual=true; },
};

function handleSpecsChange(){
  const rate=getPcsPerRoll(F.bedSize,F.blanketPly);
  F.matchings=F.matchings.map(m=>{
    const rollsNum=num(m.rolls);
    if(rollsNum>0){
      const newPcs=Math.round(rollsNum*rate);
      return Object.assign({},m,{ pcs:newPcs, allocations:F.packingTiers.length>1?evenAlloc(newPcs,F.packingTiers):m.allocations });
    }
    return m;
  });
  renderFormula(); renderMatchings(); afterValues();
}
function afterTiers(){ renderTiers(); renderMatchHead(); renderMatchings(); renderDerived(); }
function afterValues(){ renderMatchHead(); renderDerived(); syncTrims(); }

function setSaveBusy(on){
  document.querySelectorAll('.lf-save').forEach(b=>{ b.disabled=on; b.style.opacity=on?'.6':''; b.style.cursor=on?'wait':''; });

function handleSubmit(e){
  if(e) e.preventDefault();
  if(!F.lotNo.trim()){ F.formError='Please enter a Lot Number (e.g. 501)'; renderFormError(); return; }
  F.formError=null; renderFormError();
  const c=calc();
  const finalBrand=F.showCustomBrand&&F.customBrand.trim()?F.customBrand.trim():F.brandName;
  const tiers=F.packingTiers, isMultiTier=tiers.length>1;
  const init=F.initialData;
  const lotPayload={
    id:(init&&!S.editingIsDuplicate)?init.id:null,
    lotNo:F.lotNo.trim(), brandName:finalBrand, fabricType:F.fabricType, bedSize:F.bedSize, blanketPly:F.blanketPly,
    packingMode:isMultiTier?'split':'single',
    masterPack1:(tiers[0]&&tiers[0].masterPack)||'BORA', stdPacking:(tiers[0]&&tiers[0].stdSlavePcs)||10, slavePack:(tiers[0]&&tiers[0].slavePack)||'PVC BAG',
    packingTiers:tiers,
    splitConfigs:tiers.map(t=>({ id:t.id, name:t.masterPack, stdPacking:t.stdSlavePcs, slavePack:t.slavePack })),
    totalPcs:c.totalPcs, sattanSize:c.sattanSize, perPcSattanKg:c.perPcWeight, totalSattanWeight:c.totalSattanWeight,
    colorSattanBreakdown:c.colorBreakdown,
    matchings:F.matchings.map(m=>{
      let alloc=m.allocations||{};
      if(!isMultiTier&&tiers[0]) alloc={ [tiers[0].id]:m.pcs };   // single tier → tier 1 gets all pcs
      return { rolls:m.rolls, pcs:m.pcs, color:m.color, allocations:alloc };
    }),
    trims:F.trims.map(t=>({ name:t.name, qty:t.qty })),
    createdAt:(init&&init.createdAt)||todayISO(),
    notes:F.notes.trim()||undefined,
  };
  handleSaveLot(lotPayload);
}

          <h3 class="text-base font-bold text-slate-900 uppercase tracking-wide flex items-center gap-2">${ic('tag','w-5 h-5 text-blue-600')} 2. Trims Data (Labels, Tags, Dori &amp; Piping)</h3>

      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

      <div class="text-xs text-slate-500">Verify matching pieces and master/slave packing allocation before saving.</div>

        <button type="button" onclick="cancelForm()" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition-colors cursor-pointer">Cancel</button>

  </form>`;
  renderFormError(); renderBrandCell(); renderFormula(); renderTiers(); renderMatchHead(); renderMatchings(); renderDerived(); renderTrims();
  F.lastTotal=null; syncTrims();
}

function cancelForm(){ S.editingLot=null; S.editingIsDuplicate=false; F=null; setTab('list'); }

function fabricOptions(sel){
  const opts=[['MINK','MINK (0.120 kg/pc - 4" Sattan)'],['SUPERSOFT','SUPERSOFT (0.240 kg/pc - 5" Sattan)'],['SUPERCLOUDY','SUPERCLOUDY (0.240 kg/pc - 5" Sattan)'],['FLANNEL','FLANNEL (0.150 kg/pc - 4" Sattan)']];
  if(sel && !opts.some(o=>o[0]===sel)) opts.push([sel,sel]);
  return opts.map(o=>`<option value="${esc(o[0])}" ${o[0]===sel?'selected':''}>${esc(o[1])}</option>`).join('');
}

function renderFormError(){
  const el=$('lf-error'); if(!el) return;
  el.innerHTML=F.formError?`<div class="p-4 bg-red-50 border border-red-200 text-red-800 text-xs font-bold rounded-xl flex items-center justify-between gap-3">
    <div class="flex items-center gap-2">${ic('triangle-alert','w-4 h-4 text-red-600 shrink-0')}<span>${esc(F.formError)}</span></div>
    <button type="button" onclick="F.formError=null;renderFormError()" class="text-red-500 hover:text-red-700 cursor-pointer font-bold px-1">✕</button></div>`:'';
  if(F.formError) el.scrollIntoView({behavior:'smooth',block:'center'});
  refreshIcons();
}

function renderBrandCell(){
  const el=$('lf-brand'); if(!el) return;
  const brands=DEFAULT_BRANDS.slice(); if(F.brandName&&!brands.includes(F.brandName)) brands.push(F.brandName);
  el.innerHTML=`<div class="flex justify-between items-center mb-1.5">
      <label class="block text-xs font-bold text-slate-700 uppercase">Brand Name</label>
      <button type="button" onclick="LF.toggleCustomBrand()" class="text-[11px] text-blue-600 hover:underline cursor-pointer">${F.showCustomBrand?'Select Standard':'+ Custom Brand'}</button>
    </div>
    ${F.showCustomBrand
      ?`<input type="text" value="${esc(F.customBrand)}" oninput="LF.customBrand(this.value)" placeholder="Enter Brand Name" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 font-semibold text-slate-900">`
      :`<select onchange="LF.brand(this.value)" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:bg-white focus:ring-2 focus:ring-blue-500 font-semibold text-slate-900">${brands.map(b=>`<option value="${esc(b)}" ${b===F.brandName?'selected':''}>${esc(b)}</option>`).join('')}</select>`}`;
}

function renderFormula(){
  const el=$('lf-formula'); if(!el) return;
  el.innerHTML=`Formula: ${esc(F.bedSize)} Bed (${esc(F.blanketPly)} Ply) = <span class="font-bold text-slate-800">${getPcsPerRoll(F.bedSize,F.blanketPly)} Pieces per roll</span>`;
}

        <div class="flex flex-wrap items-center gap-2">

        </div>

      </div>

        <div class="sm:col-span-4">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-slate-700 uppercase">1. Master Packing ${n} Type *</label>
            <button type="button" onclick="LF.openQuick('${tier.id}','master')" class="text-[11px] font-semibold text-blue-600 hover:underline cursor-pointer">+ Add Master</button>
          </div>
          <select onchange="LF.tierMaster('${tier.id}',this.value)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 font-bold text-slate-900 uppercase text-sm">
            ${masters.map(p=>`<option value="${esc(p.name)}" ${p.name===tier.masterPack?'selected':''}>${esc(p.name)}</option>`).join('')}
          </select>
        </div>

          <label class="block text-xs font-bold text-slate-700 mb-1 uppercase">2. Standard Slave Pcs *</label>
          <div class="relative">
            <input type="number" min="1" value="${esc(tier.stdSlavePcs)}" oninput="LF.tierStd('${tier.id}',this.value)" onblur="LF.tierStdBlur('${tier.id}',this)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 font-bold font-mono text-slate-900 text-sm">
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-slate-400 pointer-events-none">Pcs/Unit</span>
          </div>
        </div>
        <div class="sm:col-span-5">
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold text-emerald-900 uppercase">3. Slave Packing for Master ${n} *</label>
            <button type="button" onclick="LF.openQuick('${tier.id}','slave')" class="text-[11px] font-semibold text-emerald-700 hover:underline cursor-pointer">+ Add Slave</button>
          </div>
          <select onchange="LF.tierSlave('${tier.id}',this.value)" class="w-full px-3 py-2 bg-white border border-emerald-300 rounded-xl focus:ring-2 focus:ring-emerald-500 font-bold text-emerald-950 uppercase text-sm">
            ${slaves.map(p=>`<option value="${esc(p.name)}" ${p.name===tier.slavePack?'selected':''}>${esc(p.name)}</option>`).join('')}

        </div>
      </div>

        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-slate-800">${F.quick.type==='master'?`Quick Add New Master Packing for Tier ${n}:`:`Quick Add New Slave / Inner Packing for Tier ${n}:`}</span>
          <button type="button" onclick="LF.closeQuick()" class="text-slate-400 hover:text-slate-700 text-xs cursor-pointer">✕ Close</button>
        </div>
        <div class="flex flex-wrap gap-2 items-center">
          <input type="text" id="quick-input" value="${esc(F.quick.input)}" oninput="LF.quickInput(this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();LF.execQuick('${tier.id}')}" placeholder="${F.quick.type==='master'?'e.g. JUMBO BORA, CARTON':'e.g. LOOSER, VACUUM PACK'}" class="flex-1 min-w-[200px] px-3 py-1.5 text-xs border border-slate-300 rounded-lg font-bold uppercase">

function renderMatchHead(){
  const el=$('lf-match-head'); if(!el) return;
  el.innerHTML=`${F.packingTiers.length>1&&F.matchings.length>0?`<button type="button" onclick="LF.splitAllEvenly()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-amber-50 hover:bg-amber-100 text-amber-900 font-bold rounded-xl text-xs transition-colors cursor-pointer border border-amber-300" title="Split all matchings equally across configured master packings">${ic('equal','w-3.5 h-3.5 text-amber-700')} Split All Evenly (सबको 50/50 बाँटें)</button>`:''}
    <button type="button" onclick="LF.addMatching()" class="inline-flex items-center gap-1.5 px-4 py-2 bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold rounded-xl text-xs transition-colors cursor-pointer border border-blue-200">${ic('plus')} Add New Matching</button>`;
  refreshIcons();
}

function renderMatchings(){
  const el=$('lf-matchings'); if(!el) return;
  el.innerHTML=F.matchings.map((row,idx)=>`<div class="p-4 bg-slate-50/80 rounded-xl border-l-4 border-l-blue-600 border border-slate-200 relative hover:shadow-xs transition-all space-y-3">
      <div class="flex justify-between items-center">
        <div class="flex flex-wrap items-center gap-2">
          <span class="font-black text-xs uppercase tracking-wider text-slate-800 bg-white px-2.5 py-1 rounded border border-slate-200 shadow-2xs">Matching #${idx+1}</span>
          <span id="m-badge-${idx}"></span>
        </div>
        <button type="button" onclick="LF.removeMatching(${idx})" class="text-xs text-red-600 hover:text-red-700 hover:bg-red-50 px-2 py-1 rounded border border-red-200 transition-colors inline-flex items-center gap-1 cursor-pointer" title="Remove this matching">${ic('trash-2','w-3.5 h-3.5')} Delete</button>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Printing Roll(s)</label>
          <input type="number" step="any" min="0" value="${esc(row.rolls)}" oninput="LF.rolls(${idx},this.value)" placeholder="No. of Rolls" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-bold text-slate-900">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Sattan Color</label>
          <select onchange="LF.color(${idx},this.value)" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-bold text-slate-900 uppercase">
            ${colorOptions(row.color)}
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Total Matching Blanket Pieces</label>
          <input type="number" min="0" id="m-pcs-${idx}" value="${esc(row.pcs)}" oninput="LF.pcs(${idx},this.value)" placeholder="e.g. 1000 Pieces" class="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 font-black text-slate-900 font-mono text-base">
        </div>
      </div>
      <div id="m-alloc-${idx}"></div>
    </div>`).join('');
  F.matchings.forEach((_,i)=>renderMatchingDerived(i));
  refreshIcons();
}

function colorOptions(sel){
  const list=DEFAULT_SATTAN_COLORS.slice(); if(sel&&!list.includes(sel)) list.push(sel);
  return list.map(c=>`<option value="${esc(c)}" ${c===sel?'selected':''}>${esc(c)}</option>`).join('');
}

function renderMatchingDerived(i){ renderMatchingBadge(i); renderAllocBlock(i); }

function renderMatchingBadge(i){
  const el=$('m-badge-'+i); if(!el) return;
  const row=F.matchings[i], tiers=F.packingTiers;
  const rowPcsNum=num(row.pcs);
  if(!(tiers.length>1&&rowPcsNum>0)){ el.innerHTML=''; return; }
  const allocatedSum=tiers.reduce((s,t)=>s+num(row.allocations&&row.allocations[t.id]),0);
  const remaining=rowPcsNum-allocatedSum, balanced=rowPcsNum>0&&remaining===0;
  el.innerHTML=`<span class="text-[11px] font-bold px-2 py-0.5 rounded-full inline-flex items-center gap-1 ${balanced?'bg-emerald-100 text-emerald-800 border border-emerald-300':'bg-amber-100 text-amber-900 border border-amber-300'}">
    ${balanced?`${ic('check','w-3 h-3 text-emerald-600')} All ${rowPcsNum} Pcs Packed`:`${ic('triangle-alert','w-3 h-3 text-amber-600')} ${remaining>0?`${remaining} Pcs Remaining`:`${Math.abs(remaining)} Pcs Over-allocated`}`}</span>`;
  refreshIcons();
}

function renderAllocBlock(i){
  const el=$('m-alloc-'+i); if(!el) return;
  const row=F.matchings[i], tiers=F.packingTiers;
  if(tiers.length<=1){ el.innerHTML=''; return; }
  const rowPcsNum=num(row.pcs);
  el.innerHTML=`<div class="mt-2 pt-3 bg-white p-3 rounded-lg border border-amber-200 shadow-2xs">
    <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
      <span class="text-xs font-extrabold text-amber-950 uppercase flex items-center gap-1.5">${ic('boxes','w-3.5 h-3.5 text-amber-600')} Pack Matching #${i+1} into Multiple Master Packings:</span>
      <button type="button" onclick="LF.splitEvenly(${i})" class="text-[11px] font-bold text-blue-700 hover:text-blue-900 bg-blue-50 hover:bg-blue-100 px-2.5 py-1 rounded border border-blue-200 inline-flex items-center gap-1 cursor-pointer">${ic('equal','w-3 h-3')} Auto Split 50/50 (${Math.floor(rowPcsNum/2)} pcs each)</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
      ${tiers.map((tier,tIdx)=>{
        const a=num(row.allocations&&row.allocations[tier.id]);
        const units=a>0?Math.ceil(a/tier.stdSlavePcs):0;
        const v=row.allocations&&row.allocations[tier.id]!=null?row.allocations[tier.id]:'';
        return `<div class="p-2.5 bg-slate-50 border border-slate-200 rounded-lg space-y-1.5">
          <div class="flex justify-between items-center text-xs">
            <span class="font-extrabold text-slate-900 uppercase">Master ${tIdx+1}: ${esc(tier.masterPack)}</span>
            <span id="a-units-${i}-${tier.id}" class="text-[11px] font-mono font-bold text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded border border-blue-200">${units} ${esc(tier.masterPack)}</span>
          </div>
          <div class="text-[10px] text-emerald-800 font-medium">Slave: ${esc(tier.slavePack)} (${esc(tier.stdSlavePcs)} pcs/unit)</div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-slate-500 whitespace-nowrap">Pcs:</span>
            <input type="number" min="0" value="${esc(v)}" oninput="LF.alloc(${i},'${tier.id}',this.value)" placeholder="0" class="w-full px-2.5 py-1.5 text-xs bg-white border border-slate-300 rounded font-bold font-mono text-slate-900 focus:ring-1 focus:ring-amber-500">
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
  refreshIcons();
}

async function saveMasterPackings(updated, okMsg){
  try{
    await syncLibrary('mfg_master_packings', updated, p=>({ id:p.id, name:p.name, default_pcs:p.defaultPcs, description:p.description||null, is_default:!!p.isDefault }));
    S.masterPackings=updated;
    showToast(okMsg||'Master packing options updated!');
    if(S.tab==='new'&&F) renderTiers();
  }catch(e){ MM.error='❌ '+errMsg(e); }
  renderMasterModal();
}
function masterAdd(e){
  e.preventDefault();
  const trimmed=$('mm-new-name').value.trim().toUpperCase();
  if(!trimmed){ MM.error='Packing name is required'; renderMasterModal(); return; }
  if(S.masterPackings.some(p=>p.name.toUpperCase()===trimmed)){ MM.error=`"${trimmed}" already exists in Master Packing options`; renderMasterModal(); return; }
  const pcs=parseInt($('mm-new-pcs').value,10);
  if(isNaN(pcs)||pcs<=0){ MM.error='Standard Pieces per pack must be a positive number'; renderMasterModal(); return; }
  MM.error='';
  const opt={ id:'custom_'+Date.now(), name:trimmed, defaultPcs:pcs, description:$('mm-new-desc').value.trim()||undefined, isDefault:false };
  saveMasterPackings([...S.masterPackings,opt], `Master packing "${trimmed}" selected!`);
}
function masterSaveEdit(id){
  const trimmed=$('mm-edit-name').value.trim().toUpperCase(); if(!trimmed) return;
  const pcs=parseInt($('mm-edit-pcs').value,10)||10;
  const desc=$('mm-edit-desc').value.trim()||undefined;
  MM.editingId=null;
  saveMasterPackings(S.masterPackings.map(p=>p.id===id?Object.assign({},p,{ name:trimmed, defaultPcs:pcs, description:desc }):p));
}
function masterDelete(id){
  const p=S.masterPackings.find(x=>x.id===id); if(!p) return;
  if(S.masterPackings.length<=1){ MM.error='You must have at least one Master Packing option.'; renderMasterModal(); return; }
  if(!window.confirm(`Are you sure you want to remove "${p.name}" from master packing options?`)) return;
  saveMasterPackings(S.masterPackings.filter(x=>x.id!==id));
}

function slaveAdd(e){

  if(S.slavePackings.some(p=>p.name.toUpperCase()===trimmed)){ SM.error=`"${trimmed}" already exists in Slave / Inner Packing options`; renderSlaveModal(); return; }
  SM.error='';

function csvCell(v){ const s=String(v==null?'':v); return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }
function downloadCsv(filename, rows){
  const csv='﻿'+rows.map(r=>(r||[]).map(csvCell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
}
// getOrCalculateColorSattan() of googleSheetsService.ts
function sheetColorSattan(lot){
  if(lot.colorSattanBreakdown&&lot.colorSattanBreakdown.length) return lot.colorSattanBreakdown;
  const totalPcs=Number(lot.totalPcs)||0, totalWt=Number(lot.totalSattanWeight)||0, bw=Number(lot.sattanBundleWeight)||BUNDLE_KG;
  const map=new Map();
  (lot.matchings||[]).forEach(m=>{ const c=(m.color||'STANDARD').trim().toUpperCase(); map.set(c,(map.get(c)||0)+(Number(m.pcs)||0)); });
  const out=[];
  map.forEach((pcs,color)=>{ const w=Number((totalWt*(totalPcs>0?pcs/totalPcs:0)).toFixed(2)); const ex=bw>0?w/bw:0;
    out.push({ color, size:lot.sattanSize||'5 INCH', pcs, weightKg:w, exactBundles:Number(ex.toFixed(2)), bundles:getRoundedBundles(ex), fullBundles:Math.floor(w/bw), leftoverKg:Number((w%bw).toFixed(2)) }); });
  return out;
}

// CSV parser (quoted fields, BOM)
function parseCsv(text){
  text=String(text).replace(/^﻿/,'');
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows;
}
// importLotsFromSpreadsheet() — header detection on a Master Register sheet
function lotsFromRegisterRows(rows){
  let headerIndex=-1;
  for(let i=0;i<Math.min(rows.length,10);i++){
    const s=rows[i].map(c=>String(c).toLowerCase()).join(' ');
    if(s.includes('lot')&&(s.includes('brand')||s.includes('fabric')||s.includes('number'))){ headerIndex=i; break; }
  }
  const out=[];
  if(headerIndex<0||headerIndex>=rows.length-1) return out;
  const h=rows[headerIndex].map(x=>String(x||'').trim().toLowerCase());
  const col=f=>h.findIndex(f);
  const lotCol=col(x=>x.includes('lot')), brandCol=col(x=>x.includes('brand')), fabricCol=col(x=>x.includes('fabric')), sizeCol=col(x=>x.includes('size')&&!x.includes('sattan')), plyCol=col(x=>x.includes('ply'));
  const pcsCol=col(x=>x.includes('total pcs')||x==='pcs'||x.includes('pieces'));
  const m1Col=col(x=>x.includes('master pack 1')||x==='master 1'||x.includes('master')), std1Col=col(x=>x.includes('std pcs 1')||x.includes('std packing')), s1Col=col(x=>x.includes('slave pack 1')||x==='slave 1'||x.includes('slave'));
  const m2Col=col(x=>x.includes('master pack 2')||x==='master 2'), std2Col=col(x=>x.includes('std pcs 2')), s2Col=col(x=>x.includes('slave pack 2')||x==='slave 2');
  const sattanSizeCol=col(x=>x.includes('sattan width')||x.includes('sattan size')), sattanWtCol=col(x=>x.includes('sattan weight')||x.includes('sattan wt')), notesCol=col(x=>x.includes('note')), dateCol=col(x=>x.includes('date'));
  for(let r=headerIndex+1;r<rows.length;r++){
    const row=rows[r]; if(!row||!row.length) continue;
    const rawLotNo=lotCol>=0?String(row[lotCol]||'').replace(/^#/,'').trim():''; if(!rawLotNo) continue;
    const m1=m1Col>=0&&row[m1Col]?String(row[m1Col]).trim():'BORA', std1=std1Col>=0&&row[std1Col]?Number(row[std1Col])||10:10, s1=s1Col>=0&&row[s1Col]?String(row[s1Col]).trim():'PVC BAG';
    const tiers=[{ id:'sp_1', masterPack:m1, stdSlavePcs:std1, slavePack:s1 }];
    if(m2Col>=0&&row[m2Col]&&String(row[m2Col]).trim()!=='-'&&String(row[m2Col]).trim()!=='')
      tiers.push({ id:'sp_2', masterPack:String(row[m2Col]).trim(), stdSlavePcs:std2Col>=0?Number(row[std2Col])||10:10, slavePack:s2Col>=0&&row[s2Col]?String(row[s2Col]).trim():'GIFT BOX' });
    const totalPcs=pcsCol>=0?Number(row[pcsCol])||0:0;
    const d=dateCol>=0?String(row[dateCol]||'').trim():'';
    out.push({ id:null, lotNo:rawLotNo, brandName:brandCol>=0&&row[brandCol]?String(row[brandCol]).trim():'SARV INDIA',
      fabricType:fabricCol>=0&&row[fabricCol]?String(row[fabricCol]).trim():'MINK', bedSize:sizeCol>=0&&row[sizeCol]?String(row[sizeCol]).trim():'DOUBLE',
      blanketPly:plyCol>=0&&row[plyCol]?String(row[plyCol]).replace(/[^0-9]/g,'').trim()||'1':'1', totalPcs,
      masterPack1:m1, stdPacking:std1, slavePack:s1, packingMode:tiers.length>1?'split':'single', packingTiers:tiers,
      sattanSize:sattanSizeCol>=0&&row[sattanSizeCol]?String(row[sattanSizeCol]).trim():'5 INCH',
      totalSattanWeight:sattanWtCol>=0&&row[sattanWtCol]?String(row[sattanWtCol]).replace(/[^0-9.]/g,''):'0',
      matchings:[{ rolls:1, pcs:totalPcs, color:'STANDARD', allocations:{ sp_1:totalPcs } }],
      trims:[{ name:'Small Label', qty:totalPcs },{ name:'Main Label', qty:totalPcs },{ name:'Washing Label', qty:totalPcs },{ name:'Dori', qty:totalPcs }],
      createdAt:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:todayISO(), notes:notesCol>=0&&row[notesCol]?String(row[notesCol]):'Imported from Google Sheets' });
  }
  return out;
}
let pendingImportLibs=null;
function onImportFile(input){
  const file=input.files&&input.files[0]; input.value=''; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const text=String(e.target.result||'');
      pendingImportLibs=null;
      let lots=[], msg='';
      if(/\.json$/i.test(file.name)||/^\s*[\[{]/.test(text)){
        const parsed=JSON.parse(text);
        if(Array.isArray(parsed)) lots=parsed;
        else if(parsed&&Array.isArray(parsed.lots)){ lots=parsed.lots; pendingImportLibs={ masterPackings:parsed.masterPackings, slavePackings:parsed.slavePackings }; }
        else throw new Error('Invalid backup file format');
        msg=`Read ${lots.length} lot(s) from backup "${file.name}".`;
      } else {
        lots=lotsFromRegisterRows(parseCsv(text));
        if(!lots.length) throw new Error('Could not identify recognizable lot records in this file.');
        msg=`Successfully read ${lots.length} lot(s) from "${file.name}".`;
      }
      DM.preview=lots.filter(l=>l&&l.lotNo); DM.previewMsg=msg; DM.sub='import';
      if(modalKind!=='data'){ modalKind='data'; }
      renderDataModal();
    }catch(err){ showToast('Failed to parse file: '+(err.message||err),'info'); }
  };
  reader.readAsText(file);
}
// JSON restore from the navbar → same preview / merge / replace flow
function onRestoreFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  openDataModal(); DM.sub='import'; renderDataModal();
  onImportFile(input);
}
async function applyImport(mode){
  const lots=DM.preview; if(!lots.length) return;
  if(mode==='replace' && !window.confirm(`This will replace all your current ${S.lots.length} lots with ${lots.length} imported lot(s). This action cannot be undone. Continue?`)) return;
  try{
    if(pendingImportLibs){
      if(Array.isArray(pendingImportLibs.masterPackings)&&pendingImportLibs.masterPackings.length){
        await syncLibrary('mfg_master_packings', pendingImportLibs.masterPackings, p=>({ id:String(p.id), name:String(p.name).toUpperCase(), default_pcs:Number(p.defaultPcs)||10, description:p.description||null, is_default:!!p.isDefault }));
      }
      if(Array.isArray(pendingImportLibs.slavePackings)&&pendingImportLibs.slavePackings.length){
        const sp=pendingImportLibs.slavePackings.map((s,i)=>typeof s==='string'?{ id:'sp_opt_'+i, name:s.toUpperCase(), isDefault:true }:s);
        await syncLibrary('mfg_slave_packings', sp, p=>({ id:String(p.id), name:String(p.name).toUpperCase(), description:p.description||null, is_default:!!p.isDefault }));
      }
    }
    if(mode==='replace'){
      const keep=new Set(lots.map(l=>String(l.lotNo).trim().toLowerCase()));
      const del=S.lots.filter(l=>!keep.has(String(l.lotNo).trim().toLowerCase())).map(l=>l.id);
      for(let i=0;i<del.length;i+=100){ const {error}=await SB.from('mfg_lot_cards').delete().in('id',del.slice(i,i+100)); if(error) throw error; }
    }
    let done=0, failed=[];
    for(const l of lots){
      DM.busy=`Saving ${done+1} / ${lots.length}…`; renderDataModal();
      try{
        const r=await saveLotRpc(null, Object.assign({},l,{ colorSattanBreakdown:(l.colorSattanBreakdown&&l.colorSattanBreakdown.length)?l.colorSattanBreakdown:[] }), true);
        if(!r.success) failed.push(l.lotNo+': '+r.error); else done++;
      }catch(e){ failed.push(l.lotNo+': '+errMsg(e)); }
    }
    DM.busy=''; DM.preview=[]; DM.previewMsg='';
    await Promise.all([loadLots(), loadLibraries()]);
    closeModal(); renderNavbar(); setTab('list');
    showToast(failed.length?`Imported ${done} lot(s), ${failed.length} failed`:(mode==='replace'?`Replaced lots with ${done} imported lots!`:`Added ${done} lots!`), failed.length?'info':'success');
    if(failed.length) console.warn('Import failures:',failed);
  }catch(e){ DM.busy=''; renderDataModal(); showToast('❌ '+errMsg(e),'info'); }
}

// JSON backup (handleExportData)
function handleExportData(){
  const bundle={ lots:S.lots, masterPackings:S.masterPackings, slavePackings:S.slavePackings, version:'sarvIndia_v3', exportedAt:new Date().toISOString() };
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(bundle,null,2)],{type:'application/json'}));
  a.download=`sarv_india_lots_backup_${todayISO()}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
  showToast('Lot records and packing configurations exported!');
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&modalKind) closeModal(); });
