function friendlyError(e){
  if (!e) return "Something went wrong.";
  const m = String(e.message || e.error_description || e.error || e);
  if (/Invalid login credentials/i.test(m)) return "Wrong name or password. Please try again.";
  // The unit triggers raise "UNIT_NOT_SET: <plain sentence>"; show the sentence.
  const unitMsg = m.match(/\bUNIT_[A-Z_]+:\s*(.+)$/);

// ============================================================
// 3b. WEB PUSH — Service Worker + Push Subscription
// ============================================================
// Convert VAPID base64url to Uint8Array (for applicationServerKey)
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}

// Register the Service Worker (sw.js must sit next to index.html)
async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    const swUrl = new URL('sw.js', window.location.href).href;
    const reg = await navigator.serviceWorker.register(swUrl, { scope: './' });
    // Wait for the SW to be active
    if (reg.installing) {
      await new Promise(resolve => {
        reg.installing.addEventListener('statechange', function handler() {
          if (this.state === 'activated') { this.removeEventListener('statechange', handler); resolve(); }
        });
      });
    }
    return reg;
  } catch (e) { console.warn('SW registration failed:', e); return null; }
}

// Subscribe to Web Push and save subscription to Supabase
async function subscribePush(userId) {
  try {
    if (!('PushManager' in window)) return;
    const reg = await registerSW();
    if (!reg) return;

    // Request notification permission
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;

    // Check existing subscription
    let sub = await reg.pushManager.getSubscription();
    if (!sub) {
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC),
      });
    }

    // Extract keys and save to DB
    const subJson = sub.toJSON();
    const endpoint = subJson.endpoint;
    const p256dh = subJson.keys?.p256dh || '';
    const auth_key = subJson.keys?.auth || '';

    if (!endpoint || !p256dh || !auth_key) return;

    // Upsert — same user+endpoint just refreshes keys
    await sb.from('cmp_push_subscriptions').upsert(
      { user_id: userId, endpoint, p256dh, auth_key },
      { onConflict: 'user_id,endpoint' }
    );
  } catch (e) { console.warn('Push subscription failed:', e); }
}

// ============================================================
// Upsert the timestamp when user opens a tab or sub-tab.
async function markTabSeen(tabKey) {
  try {
    const { data:{ session:s } } = await sb.auth.getSession();
    if (!s) return;
    await sb.from("cmp_user_tab_seen").upsert(
      { user_id: s.user.id, tab_key: tabKey, seen_at: new Date().toISOString() },
      { onConflict: "user_id,tab_key" }
    );
  } catch(e) { /* ignore */ }
}

// Hook: load all tab_seen rows for the logged-in user.
function useTabSeen(userId) {
  const [map, setMap] = useState({});
  const load = useCallback(async () => {
    if (!userId) return;
    const { data } = await sb.from("cmp_user_tab_seen").select("tab_key,seen_at").eq("user_id", userId);
    if (data) {
      const m = {};
      data.forEach(r => m[r.tab_key] = r.seen_at);
      setMap(m);
    }
  }, [userId]);
  useEffect(() => { load(); }, [load]);
  return [map, load];
}

// ============================================================
// 3e. SWIPE HOOK — detect horizontal swipe on a container ref
// ============================================================
function useSwipe(onLeft, onRight) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    let startX = 0, startY = 0, tracking = false;
    const onStart = e => {
      const t = e.touches ? e.touches[0] : e;
      startX = t.clientX; startY = t.clientY; tracking = true;
    };
    const onEnd = e => {
      if (!tracking) return;
      tracking = false;
      const t = e.changedTouches ? e.changedTouches[0] : e;
      const dx = t.clientX - startX, dy = t.clientY - startY;
      if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * 0.6) return; // too short or too vertical
      if (dx < 0) onLeft(); else onRight();
    };
    el.addEventListener("touchstart", onStart, { passive: true });
    el.addEventListener("touchend", onEnd, { passive: true });
    return () => { el.removeEventListener("touchstart", onStart); el.removeEventListener("touchend", onEnd); };
  });
  return ref;
}

// ============================================================
// 3f. BLUE TICK — mark complaint as seen by host
// ============================================================
// `table` is passed in because the same tick is used by both registers —
// it defaults to the machine table so any older call site still works.
async function markComplaintSeen(complaintId, table) {
  try {
    await sb.from(table || "cmp_machine_complaints")
      .update({ seen_by_host_at: new Date().toISOString() })
      .eq("id", complaintId)
      .is("seen_by_host_at", null);
  } catch(e) { /* ignore */ }
}

function StatusBadge({c, D}){

// ============================================================
// 5B. BARCODE SCANNER — uses device camera to scan machine no barcodes.
//     Falls back to manual text entry if BarcodeDetector is unsupported.
//     Works on Chrome Android 83+, Chrome Desktop 83+, Edge, Samsung Internet.
// ============================================================
function BarcodeScannerModal({onResult, onClose}){
  const videoRef = useRef(null);
  const streamRef = useRef(null);
  const [err, setErr] = useState("");
  const [manualMode, setManualMode] = useState(false);
  const [manualVal, setManualVal] = useState("");
  const scanningRef = useRef(true);

  // Check if BarcodeDetector API is available
  const hasBarcodeAPI = typeof window.BarcodeDetector !== "undefined";

  useEffect(()=>{
    if (manualMode || !hasBarcodeAPI) return;
    let detector;
    let animFrame;

    const startCamera = async () => {
      try {
        detector = new BarcodeDetector({ formats: ["code_128","code_39","ean_13","ean_8","qr_code","upc_a","upc_e","itf","codabar"] });
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          videoRef.current.play();
        }

        const scan = async () => {
          if (!scanningRef.current || !videoRef.current) return;
          try {
            const barcodes = await detector.detect(videoRef.current);
            if (barcodes.length > 0 && scanningRef.current) {
              scanningRef.current = false;
              const code = barcodes[0].rawValue.trim();
              // Vibrate feedback
              try { navigator.vibrate && navigator.vibrate(200); } catch(e){}
              onResult(code);
              return; // don't schedule next frame
            }
          } catch(e) { /* detection can fail on blank frames — ignore */ }
          animFrame = requestAnimationFrame(scan);
        };
        // Wait for video to be ready then start scanning
        videoRef.current.onloadeddata = () => { animFrame = requestAnimationFrame(scan); };
      } catch(e) {
        setErr("Could not open the camera. Please use manual mode.");
        setManualMode(true);
      }
    };
    startCamera();

    return () => {
      scanningRef.current = false;
      cancelAnimationFrame(animFrame);
      if (streamRef.current) {
        streamRef.current.getTracks().forEach(t => t.stop());
        streamRef.current = null;
      }
    };
  },[manualMode, hasBarcodeAPI]); // eslint-disable-line

  // Cleanup stream on close
  useEffect(()=> () => {
    if (streamRef.current) { streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
  },[]);

  const submitManual = () => {
    const v = manualVal.trim();
    if (v) onResult(v);
  };

  return (
    <div className="fixed inset-0 z-[70] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4" onClick={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden">
        <div className="flex items-center gap-2 px-4 py-3 border-b border-slate-200">
          <Ico d={I.scan} className="w-5 h-5 text-teal-600" />
          <h3 className="font-semibold text-[15px]">Scan Machine No</h3>
          <span className="text-[11px] text-slate-500">बारकोड स्कैन</span>
          <Btn size="sm" icon={I.x} onClick={onClose} className="ml-auto" />
        </div>

        {(!manualMode && hasBarcodeAPI) ? (
          <div className="relative bg-black">
            <video ref={videoRef} className="w-full h-56 object-cover" muted playsInline />
            {/* Scan guide overlay */}
            <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
              <div className="w-3/4 h-16 border-2 border-teal-400/80 rounded-lg" />
            </div>
            <p className="absolute bottom-2 left-0 right-0 text-center text-white/80 text-[11px]">
              Keep the barcode inside the box
            </p>
          </div>
        ) : null}

        <div className="p-4 space-y-3">
          {err && <p className="text-[12px] text-rose-600 bg-rose-50 rounded-lg px-3 py-2">{err}</p>}

          {!hasBarcodeAPI && !manualMode && (
            <div className="text-center py-2">
              <p className="text-[13px] text-slate-600 mb-2">This browser does not support barcode scanning.</p>
              <p className="text-[12px] text-slate-500">Use manual mode, or try Chrome on Android.</p>
            </div>
          )}

          {/* Manual entry — always available as fallback */}
          <div>
            {(!manualMode && hasBarcodeAPI) && (
              <button onClick={()=>setManualMode(true)} className="text-[12px] text-teal-600 hover:underline mb-2">
                Type it in manually?
              </button>
            )}
            {(manualMode || !hasBarcodeAPI) && (
              <div className="flex gap-2">
                <input className={inputCls(false)+" flex-1"} value={manualVal} onChange={e=>setManualVal(e.target.value)}
                  placeholder="Type the machine no…" autoFocus
                  onKeyDown={e=>{ if(e.key==="Enter") submitManual(); }} />
                <Btn variant="primary" size="sm" onClick={submitManual} disabled={!manualVal.trim()}>Done</Btn>
              </div>
            )}
          </div>

          {(!manualMode && hasBarcodeAPI) && (
            <p className="text-[11px] text-slate-400 text-center">Scanning with the camera… or type it in manually</p>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================
// 6. PHOTO CAPTURE
//    Phone cameras emit 3-8 MB JPEGs. We downscale to 1280px and step the
//    quality down until the base64 fits the column cap, so the DB and the
//    factory's mobile data both survive.
// ============================================================
function compressImage(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type||"")) return reject(new Error("This is not an image file."));
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("The file could not be read."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("The image could not be opened."));
      img.onload = () => {
        try{
          const renderAt = (maxDim, q) => {
            const s = Math.min(1, maxDim / Math.max(img.width, img.height));
            const cv = document.createElement("canvas");
            cv.width = Math.max(1, Math.round(img.width*s));
            cv.height = Math.max(1, Math.round(img.height*s));
            const cx = cv.getContext("2d");
            cx.fillStyle = "#fff"; cx.fillRect(0,0,cv.width,cv.height);
            cx.drawImage(img,0,0,cv.width,cv.height);
            return cv.toDataURL("image/jpeg", q);
          };
          let q = 0.72, out = renderAt(1280, q);
          while (out.length > MAX_IMG_CHARS && q > 0.32){ q -= 0.12; out = renderAt(1280, q); }
          if (out.length > MAX_IMG_CHARS) out = renderAt(900, 0.6);
          if (out.length > MAX_IMG_CHARS) out = renderAt(700, 0.5);
          if (out.length > MAX_IMG_CHARS) return reject(new Error("The photo is too large. Please take it from closer."));
          if (!isDataImage(out)) return reject(new Error("The photo could not be encoded."));
          resolve(out);
        } catch(err){ reject(new Error("The photo could not be processed on this device.")); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function PhotoCapture({photos, setPhotos, onView, toast}){
  const camRef = useRef(null), upRef = useRef(null);
  const [busy, setBusy] = useState(0);

  const handle = async (fileList) => {
    let files = Array.from(fileList || []);
    if (!files.length) return;
    const room = MAX_PHOTOS - photos.length;
    if (room <= 0) return toast(`A maximum of ${MAX_PHOTOS} photos.`, true);
    if (files.length > room){ toast(`Only ${room} more photo(s) can be added.`, true); files = files.slice(0, room); }
    setBusy(files.length);
    for (const f of files){
      try { const d = await compressImage(f); setPhotos(p => [...p, d]); }
      catch(e){ toast(e.message, true); }
      finally { setBusy(b => b-1); }
    }
    if (camRef.current) camRef.current.value = "";
    if (upRef.current) upRef.current.value = "";
  };

  return (
    <div className="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
      <div className="flex gap-2 flex-wrap">
        <Btn size="sm" variant="outline" icon={I.camera} type="button" onClick={()=>camRef.current?.click()}>Take photo</Btn>
        <Btn size="sm" variant="outline" icon={I.upload} type="button" onClick={()=>upRef.current?.click()}>Upload</Btn>
      </div>
      {/* capture="environment" opens the rear camera straight away on a phone */}
      <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>handle(e.target.files)} />
      <input ref={upRef} type="file" accept="image/*" multiple className="hidden" onChange={e=>handle(e.target.files)} />
      {(photos.length > 0 || busy > 0) && (
        <div className="flex gap-2 flex-wrap mt-3">
          {photos.map((src,i)=>(
            <div key={i} className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-slate-100">
              <img src={src} alt={`Photo ${i+1}`} className="w-full h-full object-cover cursor-zoom-in" onClick={()=>onView && onView(src)} />
              <button type="button" aria-label="Remove photo"
                onClick={()=>setPhotos(p => p.filter((_,j)=>j!==i))}
                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
                <Ico d={I.x} className="w-3 h-3" />
              </button>
            </div>
          ))}
          {Array.from({length:busy}).map((_,i)=>(
            <div key={"b"+i} className="w-20 h-20 rounded-lg border border-slate-300 bg-slate-100 flex items-center justify-center">
              <Spinner className="w-4 h-4 text-slate-500" />
            </div>
          ))}
        </div>
      )}
      <p className="text-[11px] text-slate-500 mt-2.5">
        On a phone, &ldquo;Take photo&rdquo; opens the camera. Up to {MAX_PHOTOS} photos, compressed automatically.
      </p>
    </div>
  );
}

// ============================================================
// 7. SIGNATURE PAD
//    Dark ink on a white ground, exported as PNG, so the saved signature
//    reads the same wherever it is later displayed.
// ============================================================
const SignaturePad = React.forwardRef(function SignaturePad(props, ref){
  const canvasRef = useRef(null);
  const stateRef = useRef({ drawing:false, ink:false, last:null, ctx:null });
  const [hasInk, setHasInk] = useState(false);

  useEffect(()=>{
    const cv = canvasRef.current; if (!cv) return;
    const dpr = window.devicePixelRatio || 1;
    const r = cv.getBoundingClientRect();
    const w = Math.max(1, Math.round(r.width || 300)), h = Math.max(1, Math.round(r.height || 150));
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2.3; ctx.lineCap = "round"; ctx.lineJoin = "round";
    stateRef.current.ctx = ctx;
  },[]);

  const pos = e => {
    const r = canvasRef.current.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    return { x:(e.clientX ?? t?.clientX ?? 0) - r.left, y:(e.clientY ?? t?.clientY ?? 0) - r.top };
  };
  const start = e => {
    const s = stateRef.current; if (!s.ctx) return;
    s.drawing = true; s.last = pos(e);
    if (!s.ink){ s.ink = true; setHasInk(true); }
    s.ctx.beginPath(); s.ctx.arc(s.last.x, s.last.y, 1.15, 0, Math.PI*2);
    s.ctx.fillStyle = "#0f172a"; s.ctx.fill();
    e.preventDefault?.();
  };
  const move = e => {
    const s = stateRef.current; if (!s.drawing || !s.ctx) return;
    const p = pos(e);
    s.ctx.beginPath(); s.ctx.moveTo(s.last.x, s.last.y); s.ctx.lineTo(p.x, p.y); s.ctx.stroke();
    s.last = p; e.preventDefault?.();
  };
  const end = () => { stateRef.current.drawing = false; stateRef.current.last = null; };

  React.useImperativeHandle(ref, () => ({
    hasInk: () => stateRef.current.ink,
    toDataURL: () => { try { return canvasRef.current.toDataURL("image/png"); } catch(e){ return null; } },
    clear: () => {
      const cv = canvasRef.current, s = stateRef.current; if (!cv || !s.ctx) return;
      s.ctx.save(); s.ctx.setTransform(1,0,0,1,0,0);
      s.ctx.fillStyle = "#ffffff"; s.ctx.fillRect(0,0,cv.width,cv.height); s.ctx.restore();
      s.ctx.strokeStyle = "#0f172a"; s.ctx.lineWidth = 2.3; s.ctx.lineCap="round"; s.ctx.lineJoin="round";
      s.ink = false; setHasInk(false);
    }
  }));

  return (
    <div>
      <div className="relative rounded-xl overflow-hidden border border-slate-300 bg-white">
        <canvas ref={canvasRef} className="sigpad block w-full h-[150px] cursor-crosshair"
          onPointerDown={e=>{ e.currentTarget.setPointerCapture?.(e.pointerId); start(e); }}
          onPointerMove={move} onPointerUp={end} onPointerCancel={end} onPointerLeave={end}
          onTouchStart={start} onTouchMove={move} onTouchEnd={end} />
        {!hasInk && (
          <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-slate-500 text-sm">
            Sign here with your finger or a pen
          </div>
        )}
        <div className="absolute left-5 right-5 bottom-7 border-b border-dashed border-slate-300 pointer-events-none" />
      </div>
      <div className="flex items-center gap-2 mt-2">
        <Btn size="sm" variant="outline" type="button" onClick={()=>ref.current?.clear()}>Clear</Btn>
        <span className="ml-auto text-[11px] text-slate-500">Draw &amp; save</span>
      </div>
    </div>
  );
});

function Lightbox({src, onClose}){
  useEffect(()=>{
    const h = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return ()=>window.removeEventListener("keydown", h);
  },[onClose]);
  return (
    // Deliberately kept dark regardless of the app's light theme — a photo
    // viewer reads best on black, and it keeps the Btn "outline" variant
    // (now styled for a white page) out of this overlay entirely.
    <div className="fixed inset-0 z-[90] bg-slate-950/95 flex items-center justify-center p-5"
         onClick={onClose}>
      <img src={src} alt="Complaint photo" className="max-w-full max-h-full rounded-xl" />
      <button onClick={onClose} type="button"
        className="absolute top-4 right-4 inline-flex items-center gap-2 rounded-lg border border-white/25 bg-white/10 hover:bg-white/20 text-white px-4 py-2.5 text-[15px] backdrop-blur-sm">
        <Ico d={I.x} className="w-4 h-4" />Close
      </button>
    </div>
  );
}

// ============================================================
// 8. LOGIN: removed from this app
// ============================================================
/* `LoginScreen` (email + password login, and the signup that created a
   new account) has been removed completely, along with both the
   `sb.auth.signInWithPassword()` and `sb.auth.signUp()` paths.

   Reason: login now happens only on `launcher.html`. Behind that single
   entry point the identity comes from `app_users`, and this app's auth
   session is created by `erp-sso` (see the gate at the top of the file).
   Two logins meant two user lists, two passwords and two names for the
   same person; all of this went to remove that confusion.

   Adding a new person also happens in one place now: the launcher's Signup, and
   Admin Panel › Users › Apps me "Complaint App" ON. */
// ============================================================
// 9. NEW COMPLAINT
//    Name and Department are NOT asked — the database stamps them from the
//    signed-in user (mc_stamp_owner), so they cannot be faked either.
// ============================================================
/* Machine and fabric subjects are picked, never typed:
     Machine        — ERP Master Data › Machine Master (`machines`). Only a Host
                      or Admin sees "+ Add new machine", which saves the machine
                      into Machine Master first and then logs the complaint on it.
     Fabric         — ERP Fabric Master › FABRIC NAME values (numbers such as
                      1.8), saved in the complaint's fabric_quality column.
     Lot Card No.   — Lot Card Manager lots (optional).
   The lot_card_no column needs CMP_FABRIC_LOT_MIGRATION.sql (see migrationHint_ below). */
const NEW_MACHINE = "__new_machine";
const normKey_ = v => String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
function migrationHint_(e){
  const m = (e && e.message) || "";
  return /lot_card_no/i.test(m)
    ? "The database update for Lot Card No. has not been run yet. Ask the Admin to run CMP_FABRIC_LOT_MIGRATION.sql."
    : null;
}
function NewComplaintModal({profile, machines: allMachines, processes, fabricQualities, lotCards, D, onClose, onSaved, toast, onView}){
  const isFabric = D.key === "fabric";
  const canAddMachine = profile.role === "Host" || profile.role === "Admin";
  const qualities = fabricQualities || [], lots = lotCards || [];
  const units = React.useContext(UnitsCtx);
  /* The unit is the raiser's own and the database stamps it. Only someone
     covering every unit (Admin, or "All units") picks one here, defaulting
     to their own; the trigger ignores a value sent by anybody else. */
  const hasUnits = unitsOn(profile);
  const pickUnit = hasUnits && seesAllUnits(profile);
  const [unit, setUnit] = useState(profile.unit || (units[0] && units[0].code) || "");
  // A machine with no unit is shared by every unit; others only in their own.
  const machines = useMemo(() => hasUnits
    ? allMachines.filter(m => !m.unit || m.unit === unit)
    : allMachines, [allMachines, unit, hasUnits]);
  const [f, setF] = useState({
    // Nothing pre-picked: a pre-selected first machine was too easy to submit by mistake.
    machine_pick: "",
    machine_no: "",
    new_machine_name: "",     // Host / Admin only, with machine_pick = NEW_MACHINE
    new_machine_no: "",
    // Fabric side: which production stage, its quality and the lot.
    process_pick: processes && processes.length ? processes[0].process_name : "Other",
    other_process_name: "",
    fabric_quality: "",
    lot_card_no: "",
    problem_desc: "",
    // complaint_type is NOT here any more. Whoever reports a problem rarely
    // knows whether it is mechanical or electrical, or which fabric defect
    // family it belongs to, and a wrong guess routed the complaint to the
    // wrong host. The triager (D.triager) sets it while assigning a host.
  });
  const [photos, setPhotos] = useState([]);
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const [showScan, setShowScan] = useState(false);
  // Shown as the auto-stamped "Date of problem" — the real value is set by the
  // database trigger at insert time (mc_stamp_owner), so this is a display-only
  // clock, not the value that gets saved. Frozen at mount so it doesn't tick.
  const nowRef = useRef(new Date().toISOString());

  const isNewMachine = f.machine_pick === NEW_MACHINE;
  const isOtherProcess = f.process_pick === "Other";
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const pickMachine = (val) => {
    if (val === NEW_MACHINE){ setF(s=>({...s, machine_pick:NEW_MACHINE, machine_no:"", new_machine_name:"", new_machine_no:""})); return; }
    const [, no] = String(val || "").split("||");
    setF(s=>({...s, machine_pick:val || "", machine_no:no||""}));
  };

  // Switching unit can drop the picked machine out of the list; clear the
  // pick rather than submit one from the other unit.
  useEffect(() => {
    if (!f.machine_pick || f.machine_pick === NEW_MACHINE) return;
    if (machines.some(m => `${m.machine_name}||${m.machine_no}` === f.machine_pick)) return;
    pickMachine("");
  }, [machines]);   // eslint-disable-line

  const pickLot = (no) => set("lot_card_no", no);

  // Barcode scan → the Machine Master machine with that number. A number that
  // isn't there is never accepted as typed; a Host / Admin may add it instead.
  const handleScanResult = (code) => {
    setShowScan(false);
    const c = code.trim();
    if (isNewMachine){ set("new_machine_no", c.toUpperCase()); return; }
    const match = machines.find(m => m.machine_no && m.machine_no.trim().toLowerCase() === c.toLowerCase());
    if (match) return pickMachine(`${match.machine_name}||${match.machine_no}`);
    if (canAddMachine){
      setF(s=>({...s, machine_pick:NEW_MACHINE, machine_no:"", new_machine_name:"", new_machine_no:c.toUpperCase()}));
      return toast(`Machine no. ${c} is not in the Machine Master. Enter its name to add it.`);
    }
    toast(`Machine no. ${c} is not in the Machine Master. Pick the machine from the list, or ask a Host / Admin to add it.`, true);
  };

  const save = async () => {
    const e = {};
    if (!f.problem_desc || f.problem_desc.trim().length < 4) e.problem_desc = "Please describe the problem in a little more detail.";
    if (!photos.length) e.photos = "At least one photo is required.";
    if (isFabric){
      if (isOtherProcess && !f.other_process_name.trim()) e.other_process_name = "Please enter the process name.";
      // Required, and only a Fabric Master fabric name, so reports group cleanly.
      if (!f.fabric_quality) e.fabric_quality = "Choose the fabric.";
    } else if (isNewMachine) {
      if (!canAddMachine) e.machine_pick = "Only a Host or Admin can add a machine.";
      if (!f.new_machine_name.trim()) e.new_machine_name = "Enter the machine name.";
      if (!f.new_machine_no.trim()) e.new_machine_no = "Enter the machine number.";
    } else if (!f.machine_pick) {
      e.machine_pick = "Choose the machine.";
    }
    setErrs(e);
    if (Object.keys(e).length) return;

    if (hasUnits && !unit) return toast("Choose the unit.", true);

    setBusy(true);
    /* A new machine (Host / Admin) goes into Machine Master BEFORE the
       complaint, so the complaint always names a machine that is in the list.
       The pair (name + no) is unique there: an existing pair is simply reused. */
    let mName = "", mNo = "";
    if (!isFabric){
      if (isNewMachine){
        mName = f.new_machine_name.trim().toUpperCase(); mNo = f.new_machine_no.trim().toUpperCase();
        const have = allMachines.some(m => normKey_(m.machine_name) === normKey_(mName) && normKey_(m.machine_no) === normKey_(mNo));
        if (!have){
          const { error: mErr } = await sb.from("machines").insert({ machine_name:mName, machine_no:mNo, is_active:true });
          if (mErr && mErr.code !== "23505"){ setBusy(false); return toast("Could not add the machine to Machine Master: " + friendlyError(mErr), true); }
          if (!mErr) toast(`Added to Machine Master: ${mName} (${mNo})`);
        }
      } else {
        [mName, mNo] = f.machine_pick.split("||");
      }
    }
    // problem_date, entered_by, department, status and raised_by_user_id are
    // NOT sent for either domain — the insert trigger stamps them from the
    // session and the server clock, so none of them can be faked or backdated.
    // `unit` is sent only by someone allowed to pick it (see pickUnit).
    const unitPart = pickUnit ? { unit } : {};
    const row = isFabric
      ? {
          process_name: (isOtherProcess ? f.other_process_name.trim() : f.process_pick),
          fabric_quality: f.fabric_quality,
          // Sent only when picked, so a complaint without a lot doesn't need the column
          ...(f.lot_card_no ? { lot_card_no: f.lot_card_no } : {}),
          problem_desc: f.problem_desc.trim(),
          entered_by: profile.name, department: profile.department,
          ...unitPart,
        }
      : {
          machine_name: mName,
          machine_no: mNo || null,
          other_machine_name: null,
          problem_desc: f.problem_desc.trim(),
          entered_by: profile.name, department: profile.department,
          ...unitPart,
        };

    const { data, error } = await sb.from(D.table).insert(row).select("id, complaint_no").single();
    if (error){ setBusy(false); return toast(migrationHint_(error) || friendlyError(error), true); }

    let photoOk = true;
    if (photos.length){
      const { error: pErr } = await sb.from(D.photoTable)
        .insert(photos.map(p => ({ complaint_id: data.id, image_data: p, mime: "image/jpeg" })));
      if (pErr) photoOk = false;
    }

    /* A process that wasn't in the list is added to it, so the next person
       finds it in the dropdown instead of typing a variant spelling.
       Duplicates are expected and ignored — two people can report the same
       new process within seconds of each other. (Machines are no longer
       auto-added: only a Host / Admin adds one, above, into Machine Master.) */
    if (isFabric && isOtherProcess && f.other_process_name.trim()){
      const newP = { process_name: f.other_process_name.trim(), department: profile.department };
      const { error: pcErr } = await sb.from("cmp_fabric_processes").insert(newP);
      if (!pcErr) toast("Also added to the process list: " + newP.process_name);
      else if (!/duplicate|unique/i.test(pcErr.message || "")) console.warn("process auto-add failed:", pcErr.message);
    }

    setBusy(false);
    toast(`Complaint ${data.complaint_no} has been logged.${photos.length && photoOk ? ` With ${photos.length} photo(s).` : ""}`);
    if (!photoOk) toast("The complaint was saved, but the photo did not upload. Open the complaint and add it again.", true);
    onSaved();
  };

  return (
    <Modal title={"New " + D.title} subtitle={"नई " + D.hi} onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy ? <Spinner/> : null}{busy?"Saving…":"Log complaint"}</Btn>
      </>}>

      {/* Auto-picked identity — shown, not editable */}
      <div className="rounded-xl bg-slate-100 border border-slate-200 px-3.5 py-3 mb-4 flex items-center gap-3">
        <div className="w-9 h-9 rounded-full bg-teal-500/15 text-teal-700 grid place-items-center font-bold text-sm shrink-0">
          {profile.name.slice(0,1).toUpperCase()}
        </div>
        <div className="min-w-0">
          <p className="text-sm font-semibold truncate">{profile.name}</p>
          <p className="text-[11.5px] text-slate-500 truncate">{profile.department} · {profile.designation}</p>
        </div>
        <span className="ml-auto text-[10px] uppercase tracking-wide text-slate-500 shrink-0">Auto</span>
      </div>

      <div className="rounded-xl bg-slate-100 border border-slate-200 px-3.5 py-3 mb-4 flex items-center gap-3">
        <Ico d={I.clock} className="w-5 h-5 text-teal-700 shrink-0" />
        <div className="min-w-0">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500">Date of problem · तारीख</p>
          <p className="text-sm font-semibold text-slate-800">{fmtDateTime(nowRef.current)}</p>
        </div>
        <span className="ml-auto text-[10px] uppercase tracking-wide text-slate-500 shrink-0 text-right">Auto<br/>not editable</span>
      </div>

      {/* Unit: fixed for almost everybody (set on their user by the Admin),
          so it is shown like name and date. Only someone who covers every
          unit gets a choice. */}
      {hasUnits && (pickUnit ? (
        <Field label="Unit" hindi="यूनिट" required hint="You cover every unit, so choose where this problem is.">
          <div className="flex gap-2">
            {units.map(u => (
              <button key={u.code} type="button" onClick={()=>setUnit(u.code)} aria-pressed={unit === u.code}
                className={`flex-1 rounded-lg border-2 px-3 py-2 text-[13px] font-semibold transition-colors ${
                  unit === u.code ? "bg-slate-800 border-slate-800 text-white" : "bg-white border-slate-200 text-slate-600 hover:border-slate-300"}`}>
                {u.name}
              </button>
            ))}
          </div>
        </Field>
      ) : (
        <div className="rounded-xl bg-slate-100 border border-slate-200 px-3.5 py-3 mb-4 flex items-center gap-3">
          <Ico d={I.home} className="w-5 h-5 text-teal-700 shrink-0" />
          <div className="min-w-0">
            <p className="text-[10.5px] uppercase tracking-wide text-slate-500">Unit · यूनिट</p>
            <p className="text-sm font-semibold text-slate-800">{unitName(units, profile.unit)}</p>
          </div>
          <span className="ml-auto text-[10px] uppercase tracking-wide text-slate-500 shrink-0 text-right">Auto<br/>not editable</span>
        </div>
      ))}

      {/* ── What the complaint is about ─────────────────────────────
          Machine: which machine, and its number (scannable).
          Fabric:  which process stage, and the fabric quality number.     */}
      {isFabric ? (
        <>
          <Field label="Process name" hindi="प्रोसेस का नाम" required>
            <select className={inputCls(false)} value={f.process_pick}
                    onChange={e=>setF(s=>({...s, process_pick:e.target.value, other_process_name:""}))}>
              {(processes||[]).map(p => (
                <option key={p.process_name} value={p.process_name}>{p.process_name}</option>
              ))}
              <option value="Other">Other / not in the list</option>
            </select>
          </Field>

          <div className="grid sm:grid-cols-2 gap-x-3">
            {isOtherProcess && (
              <Field label="Process name" hindi="प्रोसेस का नाम लिखें" required error={errs.other_process_name}>
                <input className={inputCls(errs.other_process_name)} value={f.other_process_name}
                       onChange={e=>set("other_process_name", e.target.value)} placeholder="Process ka naam" />
              </Field>
            )}
            <Field label="Fabric name" hindi="फैब्रिक नाम" required error={errs.fabric_quality}
                   hint={qualities.length ? "From ERP › Master Data › Fabric Master" : "No fabric found in ERP › Master Data › Fabric Master."}>
              <select className={inputCls(errs.fabric_quality)} value={f.fabric_quality}
                      onChange={e=>set("fabric_quality", e.target.value)}>
                <option value="">Select fabric…</option>
                {qualities.map(q => <option key={q} value={q}>{q}</option>)}
              </select>
            </Field>
            <Field label="Lot Card No." hindi="लॉट कार्ड नंबर"
                   hint={lots.length ? "From Lot Card Manager · leave blank if not known" : "No lot found in Lot Card Manager."}>
              <select className={inputCls(false)} value={f.lot_card_no} onChange={e=>pickLot(e.target.value)}>
                <option value="">Select lot…</option>
                {lots.map(l => (
                  <option key={l.lot_no} value={l.lot_no}>
                    {l.lot_no}{(l.brand_name || l.fabric_type) ? " — " + [l.brand_name, l.fabric_type].filter(Boolean).join(" · ") : ""}
                  </option>
                ))}
              </select>
            </Field>
          </div>
        </>
      ) : (
        <>
          <Field label="Machine" hindi="मशीन का नाम" required error={errs.machine_pick}
                 hint={machines.length ? "From ERP › Master Data › Machine Master" : "No machine in ERP › Master Data › Machine Master yet. Ask a Host / Admin."}>
            <select className={inputCls(errs.machine_pick)} value={f.machine_pick} onChange={e=>pickMachine(e.target.value)}>
              <option value="">Select machine…</option>
              {machines.map(m => (
                <option key={m.machine_name+"||"+m.machine_no} value={`${m.machine_name}||${m.machine_no}`}>
                  {m.machine_no} — {m.machine_name}
                </option>
              ))}
              {canAddMachine && <option value={NEW_MACHINE}>+ Add new machine to Machine Master</option>}
            </select>
          </Field>

          <div className="grid sm:grid-cols-2 gap-x-3">
            {isNewMachine && (
              <Field label="New machine name" hindi="नई मशीन का नाम" required error={errs.new_machine_name}
                     hint="Host / Admin only · saved into Machine Master">
                <input className={inputCls(errs.new_machine_name)+" uppercase"} value={f.new_machine_name}
                       onChange={e=>set("new_machine_name", e.target.value)} placeholder="e.g. PRINTING" />
              </Field>
            )}
            <Field label="Machine no" hindi={isNewMachine ? "मशीन नंबर · स्कैन / टाइप" : "मशीन नंबर · स्कैन"}
                   required={isNewMachine} error={errs.new_machine_no}>
              <div className="flex gap-2">
                {isNewMachine
                  ? <input className={inputCls(errs.new_machine_no)+" flex-1 uppercase"} value={f.new_machine_no}
                           onChange={e=>set("new_machine_no", e.target.value)} placeholder="e.g. 3" />
                  : <input className={inputCls(false)+" flex-1 bg-slate-100 text-slate-600"} value={f.machine_no} readOnly
                           placeholder="Comes with the machine" title="Pick the machine, or scan its barcode" />}
                <button type="button" onClick={()=>setShowScan(true)}
                  className="shrink-0 w-10 h-10 rounded-lg bg-teal-500/10 text-teal-600 hover:bg-teal-500/20 transition grid place-items-center"
                  title="Scan a barcode">
                  <Ico d={I.scan} className="w-5 h-5" />
                </button>
              </div>
            </Field>
          </div>

          {showScan && <BarcodeScannerModal onResult={handleScanResult} onClose={()=>setShowScan(false)} />}
        </>
      )}

      <Field label="Describe problem" hindi="शिकायत का विवरण" required error={errs.problem_desc}>
        <textarea className={inputCls(errs.problem_desc)+" min-h-[90px] resize-y"} value={f.problem_desc}
                  onChange={e=>set("problem_desc", e.target.value)}
                  placeholder="What is the problem, since when, which part…" />
      </Field>

      <Field label="Photo" hindi="शिकायत की फोटो" required error={errs.photos}>
        <PhotoCapture photos={photos} setPhotos={setPhotos} toast={toast} onView={onView} />
      </Field>

      {/* The complaint-type field used to sit here. It is gone on purpose,
          so say who decides instead — otherwise its absence reads as a bug
          to anyone who used the old form. */}
      <div className="mt-1 flex items-start gap-2 rounded-lg bg-slate-100 border border-slate-200 px-3 py-2.5 text-[12px] text-slate-600">
        <Ico d={I.info} className="w-4 h-4 mt-0.5 shrink-0 text-slate-500" />
        <span>
          You don't choose the complaint <b>type</b> or <b>host</b>. <b>{D.triager}</b> will review the
          complaint, decide the type and assign it to the right host.
        </span>
      </div>
    </Modal>
  );
}

// ============================================================
// 10. COMPLAINT DETAIL — the action panel changes with your role
// ============================================================
function ComplaintDetail({complaint, profile, hosts, D, onClose, onSaved, toast, onView}){
  const c = complaint;
  const isFabric = D.key === "fabric";
  const [photos, setPhotos] = useState(null);        // null = loading
  const [proofPhotos, setProofPhotos] = useState(null); // host proof photos
  const [newPhotos, setNewPhotos] = useState([]);
  const [newProofs, setNewProofs] = useState([]);     // host proof uploads
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  // Maintenance assign form state
  const [selHost, setSelHost] = useState(c.host_user_id || "");
  const [eta, setEta] = useState(toLocalInput(c.expected_completion || new Date(Date.now()+4*3600e3).toISOString()));
  const [remarks, setRemarks] = useState(c.remarks || "");

  // Host complete form state
  const [compRemarks, setCompRemarks] = useState(c.completion_remarks || "");

  // User feedback state
  const [fbRemarks, setFbRemarks] = useState("");

  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);

  /* The triage type the Production Manager / Maintenance picks while
     assigning. A complaint arrives untriaged (complaint_type NULL) because
     the person reporting it no longer guesses; once set it is frozen by the
     database guard, so this only ever starts empty on a fresh complaint. */
  const [triageType, setTriageType] = useState(c.complaint_type || "");
  const effType = c.complaint_type || triageType;

  // Role-based permissions
  const isOwner = c.raised_by_user_id === profile.id;
  /* Who triages THIS domain: Maintenance for machines, Production Manager
     for fabric. Admin triages both. Named isMaint still because every
     branch below reads "the person who assigns", not "the maintenance
     department" — renaming it would touch 20 call sites for no gain. */
  const isMaint = profile.role === "Admin" || profile.role === D.triager;
  const isAssignedHost = profile.role === "Host" && c.host_user_id === profile.id;
  const canAssign = isMaint && c.status === "Pending";
  const canComplete = (isAssignedHost || isMaint) && c.status === "In Progress";
  /* Re-assigning: the triager may move the complaint to another host at
     any point until that host marks it Completed. The database enforces the
     same window and roles (cmp_unit_guard). */
  const canChangeHost = isMaint && c.status === "In Progress" && !!c.host_user_id;
  const [chOpen, setChOpen] = useState(false);
  const [chHost, setChHost] = useState("");
  const [chEta, setChEta] = useState(toLocalInput(c.expected_completion || new Date(Date.now()+4*3600e3).toISOString()));
  const [chReason, setChReason] = useState("");
  const canFeedback = isOwner && c.status === "Completed";
  const canDelete = profile.role === "Admin" || (isOwner && c.status === "Pending");

  /* Hosts who answer for this type come first. Before triage there is no
     type to match on, so everyone is "other" and the picker simply lists
     them all — which is correct: the type is being decided in the same
     breath as the host. */
  const filteredHosts = useMemo(() => {
    if (!hosts?.length) return { matched:[], others:[] };
    /* Only hosts of this complaint's unit (or hosts covering every unit).
       The database refuses any other assignment anyway (cmp_unit_guard);
       this keeps the picker from offering a choice that would then fail. */
    const pool = c.unit ? hosts.filter(h => h.all_units || h.unit === c.unit) : hosts;
    if (!effType) return { matched:[], others: pool };
    const matched = pool.filter(h => (h.host_types || []).includes(effType));
    const others  = pool.filter(h => !(h.host_types || []).includes(effType));
    return { matched, others };
  }, [hosts, effType, c.unit]);

  // Blue tick — when host opens assigned complaint, mark seen
  useEffect(() => {
    if ((isAssignedHost || isMaint) && !c.seen_by_host_at) markComplaintSeen(c.id, D.table);
  }, [c.id]); // eslint-disable-line

  // Load complaint photos + proof photos
  useEffect(()=>{
    let alive = true;
    sb.from(D.photoTable).select("id,image_data,photo_type").eq("complaint_id", c.id).order("created_at")
      .then(({data,error}) => {
        if (!alive) return;
        const all = error ? [] : (data||[]);
        setPhotos(all.filter(p => p.photo_type === "complaint"));
        setProofPhotos(all.filter(p => p.photo_type === "proof"));
      });
    return ()=>{ alive = false; };
  },[c.id]);

  const savePhotos = async (photoArr, type) => {
    if (!photoArr.length) return true;
    const { error } = await sb.from(D.photoTable)
      .insert(photoArr.map(p => ({ complaint_id: c.id, image_data: p, mime:"image/jpeg", photo_type: type })));
    if (error){ toast("The photo did not upload.", true); return false; }
    return true;
  };

  const run = async (patch, successMsg) => {
    setBusy(true); setErr("");
    const ok1 = await savePhotos(newPhotos, "complaint");
    const ok2 = await savePhotos(newProofs, "proof");
    if (!ok1 || !ok2){ setBusy(false); return; }
    const { error } = await sb.from(D.table).update(patch).eq("id", c.id);
    setBusy(false);
    if (error){ setErr(friendlyError(error)); return; }
    toast(successMsg);
    onSaved();
  };

  /* --- STEP 2: the triager classifies AND assigns, in one action.
     Type and host are decided together on purpose: the type is only useful
     because it picks the host, so splitting them into two saves would let a
     complaint sit classified-but-unassigned with nobody owning it. */
  const assignHost = () => {
    if (!c.complaint_type && !triageType) return setErr("Choose a complaint type.");
    if (!selHost) return setErr("Select a host.");
    if (!eta) return setErr("Choose the planned date & time.");
    const when = new Date(eta);
    if (isNaN(when)) return setErr("The date and time are not valid.");
    const hostObj = hosts.find(h => h.id === selHost);
    run({
      status: "In Progress",
      // Only sent when still unset — the database freezes it after the first
      // triage, so re-sending the same value on a later edit would be refused.
      ...(c.complaint_type ? {} : { complaint_type: triageType }),
      host_user_id: selHost,
      host_name: hostObj?.name || "—",
      assigned_by_user_id: profile.id,
      assigned_by_name: profile.name,
      assigned_at: new Date().toISOString(),
      expected_completion: when.toISOString(),
      remarks: remarks.trim() || null,
    }, `${c.complaint_no} assigned to ${hostObj?.name || "Host"}.`);
  };

  /* --- Change host (In Progress only). The reason is required and is kept
     as a dated line in Remarks, so the record shows who moved it, from whom,
     to whom and why; there is no separate history table to look in.
     seen_by_host_at is cleared so the blue tick waits for the NEW host. */
  const changeHost = () => {
    if (!chHost) return setErr("Select the new host.");
    if (chHost === c.host_user_id) return setErr("That is already the assigned host.");
    if (chReason.trim().length < 3) return setErr("Write the reason for changing the host.");
    const when = new Date(chEta);
    if (!chEta || isNaN(when)) return setErr("Choose the planned date & time.");
    const hostObj = hosts.find(h => h.id === chHost);
    const nowIso = new Date().toISOString();
    const line = `[${fmtDateTime(nowIso)}] Host changed by ${profile.name}: ${c.host_name || "—"} → ${hostObj?.name || "—"}. Reason: ${chReason.trim()}`;
    run({
      host_user_id: chHost,
      host_name: hostObj?.name || "—",
      assigned_by_user_id: profile.id,
      assigned_by_name: profile.name,
      assigned_at: nowIso,
      expected_completion: when.toISOString(),
      remarks: c.remarks ? `${c.remarks}\n${line}` : line,
      seen_by_host_at: null,
    }, `${c.complaint_no} moved to ${hostObj?.name || "the new host"}.`);
  };

  // --- STEP 3: Host resolves with proof photos -> Completed
  const markCompleted = () => {
    if (newProofs.length === 0 && (!proofPhotos || proofPhotos.length === 0))
      return setErr("A proof photo is required.");
    run({
      status: "Completed",
      completed_at: new Date().toISOString(),
      completion_remarks: compRemarks.trim() || null,
    }, `${c.complaint_no} completed. Ab user confirm karega.`);
  };

  // --- STEP 4: User feedback -> Closed or kick back
  const confirmFixed = () =>
    run({ status:"Closed", closed_at: new Date().toISOString(),
          feedback_resolved:true, feedback_remarks: fbRemarks.trim() || null, feedback_at: new Date().toISOString() },
        `${c.complaint_no} has been closed. Thank you!`);
  const notFixed = () =>
    run({ status:"In Progress", feedback_resolved:false, feedback_remarks: fbRemarks.trim() || null },
        `${c.complaint_no} sent back to the host.`);

  // --- Delete
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from(D.table).delete().eq("id", c.id);
    setDelBusy(false); setConfirmDel(false);
    if (error){ toast(friendlyError(error), true); return; }
    toast(`${c.complaint_no} has been deleted.`);
    onSaved();
  };

  const Row = ({k, v}) => (
    <div className="min-w-0">
      <p className="text-[10.5px] uppercase tracking-wide text-slate-500">{k}</p>
      <p className="text-[13.5px] text-slate-800 break-words">{v}</p>
    </div>
  );

  return (
    <Modal title={c.complaint_no} subtitle={`${c.machine_no || "—"} · ${fmtDateTime(c.problem_date)}`} onClose={onClose} wide
      footer={
        <>
          {canDelete &&
            <Btn variant="danger" icon={I.x} className="mr-auto" onClick={()=>setConfirmDel(true)} disabled={busy}>Delete</Btn>}
          <Btn variant="outline" onClick={onClose}>Close</Btn>
          {canAssign &&
            <Btn variant="primary" onClick={assignHost} disabled={busy}>{busy?<Spinner/>:null}Assign &amp; Start</Btn>}
          {canComplete &&
            <Btn variant="ok" onClick={markCompleted} disabled={busy}>{busy?<Spinner/>:null}Mark Completed</Btn>}
          {canFeedback && <>
            <Btn variant="outline" onClick={notFixed} disabled={busy}>No, the problem is still there</Btn>
            <Btn variant="ok" onClick={confirmFixed} disabled={busy}>{busy?<Spinner/>:null}Yes, it's fixed</Btn>
          </>}
        </>
      }>

      <div className="flex items-center gap-2 flex-wrap mb-4">
        <StatusBadge c={c} D={D} />
        {/* An untriaged complaint says so rather than showing a blank chip —
            amber, because it is a thing somebody still has to do. */}
        <Badge tone={c.complaint_type ? "slate" : "amber"}>{typeLabel(c)}</Badge>
        {c.unit ? <Badge tone="violet">{c.unit}</Badge> : null}
        <Badge tone="slate">{c.department}</Badge>
      </div>

      <div className="grid grid-cols-2 gap-4 mb-4">
        <Row k={`${D.unitWord} / ${D.unitWordHi}`}
             v={<><span className="font-semibold">{subjectOf(c, D)}</span>
                 {subjectDetailOf(c, D) ? ` · ${subjectDetailOf(c, D)}` : ""}</>} />
        <Row k="Reported by" v={c.entered_by} />
      </div>

      <div className="mb-4">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Problem / विवरण</p>
        <p className="rounded-lg bg-slate-100 px-3.5 py-3 text-[13.5px] whitespace-pre-wrap leading-relaxed">{c.problem_desc}</p>
      </div>

      {/* ---- Assigned host info card (visible to everyone when In Progress+) ---- */}
      {c.host_name && c.status !== "Pending" && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-3.5 mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-teal-700 font-semibold mb-2">Assigned Host / ज़िम्मेदार व्यक्ति</p>
          <div className="grid grid-cols-2 gap-3">
            <Row k="Host Name" v={<span className="font-semibold text-teal-800">{c.host_name}</span>} />
            {c.assigned_by_name && <Row k="Assigned by" v={c.assigned_by_name} />}
            {c.expected_completion && <Row k="Plan Date" v={<span className="text-teal-700 font-semibold">{fmtDateTime(c.expected_completion)}</span>} />}
            {c.assigned_at && <Row k="Assigned at" v={fmtDateTime(c.assigned_at)} />}
          </div>
          {c.remarks && (
            <div className="mt-2.5 pt-2.5 border-t border-teal-500/20">
              <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1">Remarks</p>
              <p className="text-[13px] text-slate-700 whitespace-pre-wrap">{c.remarks}</p>
            </div>
          )}
        </div>
      )}

      {/* Timeline */}
      <div className="rounded-xl border border-slate-200 divide-y divide-slate-200 mb-4">
        <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
          <Ico d={I.clipboard} className="w-4 h-4 text-slate-500 shrink-0" />
          <span className="text-slate-500">Logged</span>
          <span className="ml-auto text-slate-700">{fmtDateTime(c.created_at)}</span>
        </div>
        {c.assigned_at && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
            <Ico d={I.userPlus} className="w-4 h-4 text-teal-600 shrink-0" />
            <span className="text-slate-500">Assigned to {c.host_name || "Host"}</span>
            <span className="ml-auto text-teal-700 font-semibold">{fmtDateTime(c.assigned_at)}</span>
          </div>
        )}
        {c.expected_completion && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
            <Ico d={I.clock} className="w-4 h-4 text-teal-600 shrink-0" />
            <span className="text-slate-500">Completion target</span>
            <span className="ml-auto text-teal-700 font-semibold">{fmtDateTime(c.expected_completion)}</span>
          </div>
        )}
        {c.completed_at && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
            <Ico d={I.check} className="w-4 h-4 text-violet-600 shrink-0" />
            <span className="text-slate-500">Host completed</span>
            <span className="ml-auto text-slate-700">{fmtDateTime(c.completed_at)}</span>
          </div>
        )}
        {c.closed_at && (
          <div className="flex items-center gap-2.5 px-3.5 py-2.5 text-[12.5px]">
            <Ico d={I.check} className="w-4 h-4 text-emerald-600 shrink-0" />
            <span className="text-slate-500">Closed by user</span>
            <span className="ml-auto text-slate-700">{fmtDateTime(c.closed_at)}</span>
          </div>
        )}
      </div>

      {/* Completion remarks from host */}
      {c.completion_remarks && (
        <div className="mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Host completion remarks</p>
          <p className="text-[13.5px] text-slate-700 whitespace-pre-wrap">{c.completion_remarks}</p>
        </div>
      )}
      {c.feedback_remarks && (
        <div className="mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">User feedback</p>
          <p className="text-[13.5px] text-slate-700 whitespace-pre-wrap">{c.feedback_remarks}</p>
        </div>
      )}

      {/* Complaint Photos (from user) */}
      <div className="mb-4">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-2">Complaint Photos / शिकायत फोटो</p>
        {photos === null ? <Spinner className="w-4 h-4 text-slate-500" /> :
         photos.length === 0 ? <p className="text-[12.5px] text-slate-500 mb-2">No photos.</p> :
         <div className="flex gap-2 flex-wrap mb-2">
           {photos.map((p,i)=>(
             <img key={p.id} src={p.image_data} alt={`Photo ${i+1}`} onClick={()=>onView(p.image_data)}
                  className="w-20 h-20 rounded-lg object-cover border border-slate-300 cursor-zoom-in" />
           ))}
         </div>}
        {isOwner && c.status === "Pending" && (
          <PhotoCapture photos={newPhotos} setPhotos={setNewPhotos} toast={toast} onView={onView} />
        )}
      </div>

      {/* Proof Photos (from host) — visible after completion */}
      {(proofPhotos?.length > 0 || newProofs.length > 0) && (
        <div className="mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-emerald-600 mb-2">Proof Photos / प्रमाण फोटो</p>
          <div className="flex gap-2 flex-wrap mb-2">
            {(proofPhotos||[]).map((p,i)=>(
              <img key={p.id} src={p.image_data} alt={`Proof ${i+1}`} onClick={()=>onView(p.image_data)}
                   className="w-20 h-20 rounded-lg object-cover border-2 border-emerald-300 cursor-zoom-in" />
            ))}
          </div>
        </div>
      )}

      {/* ========== STEP 2: TRIAGE + ASSIGN PANEL ==========
           Shown to whoever triages this domain — Maintenance for machines,
           Production Manager for fabric (Admin for both). */}
      {canAssign && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-4 mt-5">
          <p className="text-[11px] uppercase tracking-wide text-teal-700 font-semibold mb-3">
            Check &amp; Assign / देखकर होस्ट को भेजें
          </p>

          {/* The classification step. Only on an untriaged complaint: the
              database freezes complaint_type once set, so there is nothing
              to edit here afterwards and the field would only mislead. */}
          {!c.complaint_type && (
            <Field label="Complaint type" hindi="शिकायत का प्रकार" required
                   hint="Decide the type after reviewing the complaint; matching hosts are listed first.">
              <select className={inputCls(false)} value={triageType}
                      onChange={e=>{ setTriageType(e.target.value); setSelHost(""); }}>
                <option value="">— Choose a type —</option>
                {D.types.map(t => <option key={t} value={t}>{t}</option>)}
              </select>
            </Field>
          )}

          <Field label="Select Host" hindi="होस्ट चुनें" required
                 hint={effType ? `Hosts for ${effType} are listed first`
                               : "Choose a type first; matching hosts will move to the top."}>
            <select className={inputCls(false)} value={selHost} onChange={e=>setSelHost(e.target.value)}>
              <option value="">— Choose a host —</option>
              {filteredHosts.matched.length > 0 && (
                <optgroup label={`${effType} Hosts`}>
                  {filteredHosts.matched.map(h => (
                    <option key={h.id} value={h.id}>{h.name} · {h.department} · {h.mobile}</option>
                  ))}
                </optgroup>
              )}
              {filteredHosts.others.length > 0 && (
                <optgroup label={effType ? "Other Hosts" : "All Hosts"}>
                  {filteredHosts.others.map(h => (
                    <option key={h.id} value={h.id}>{h.name} · {h.department} · {(h.host_types||[]).join(", ")}</option>
                  ))}
                </optgroup>
              )}
              {filteredHosts.matched.length === 0 && filteredHosts.others.length === 0 && (
                <option disabled>{c.unit ? `No ${c.unit} host found. Ask the Admin to add one.` : "No host found. Ask the Admin to add a host."}</option>
              )}
            </select>
          </Field>
          <Field label="Plan Date &amp; Time" hindi="कब तक ठीक होगा" required
                 hint="The user sees this date under In Progress.">
            <input type="datetime-local" className={inputCls(false)} value={eta} onChange={e=>setEta(e.target.value)} />
          </Field>
          <Field label="Remarks / Instructions" hindi="निर्देश">
            <textarea className={inputCls(false)+" min-h-[64px] resize-y"} value={remarks}
                      onChange={e=>setRemarks(e.target.value)} placeholder="What needs doing, spares needed, priority…" />
          </Field>
        </div>
      )}

      {/* ========== CHANGE HOST (triager, In Progress) ==========
           Collapsed by default: most visits to an In Progress complaint are
           to check on it, not to move it. */}
      {canChangeHost && (
        <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 p-4 mt-5">
          <div className="flex items-center gap-2">
            <div className="min-w-0">
              <p className="text-[11px] uppercase tracking-wide text-amber-700 font-semibold">Change Host / होस्ट बदलें</p>
              <p className="text-[12.5px] text-slate-600 mt-0.5">
                Now with <b>{c.host_name || "—"}</b>. Can be changed until the host marks it Completed.
              </p>
            </div>
            {!chOpen && (
              <Btn variant="outline" size="sm" className="ml-auto shrink-0"
                   onClick={()=>{ setChOpen(true); setErr(""); }}>Change</Btn>
            )}
          </div>
          {chOpen && (
            <div className="mt-3">
              <Field label="New Host" hindi="नया होस्ट" required
                     hint={c.complaint_type ? `Hosts for ${c.complaint_type} are listed first` : undefined}>
                <select className={inputCls(false)} value={chHost} onChange={e=>setChHost(e.target.value)}>
                  <option value="">— Choose the new host —</option>
                  {filteredHosts.matched.filter(h => h.id !== c.host_user_id).length > 0 && (
                    <optgroup label={`${c.complaint_type} Hosts`}>
                      {filteredHosts.matched.filter(h => h.id !== c.host_user_id).map(h => (
                        <option key={h.id} value={h.id}>{h.name} · {h.department} · {h.mobile}</option>
                      ))}
                    </optgroup>
                  )}
                  {filteredHosts.others.filter(h => h.id !== c.host_user_id).length > 0 && (
                    <optgroup label={c.complaint_type ? "Other Hosts" : "All Hosts"}>
                      {filteredHosts.others.filter(h => h.id !== c.host_user_id).map(h => (
                        <option key={h.id} value={h.id}>{h.name} · {h.department} · {(h.host_types||[]).join(", ")}</option>
                      ))}
                    </optgroup>
                  )}
                </select>
              </Field>
              <Field label="Plan Date &amp; Time" hindi="कब तक ठीक होगा" required
                     hint="Kept as it was unless you change it.">
                <input type="datetime-local" className={inputCls(false)} value={chEta} onChange={e=>setChEta(e.target.value)} />
              </Field>
              <Field label="Reason for change" hindi="बदलने का कारण" required>
                <textarea className={inputCls(false)+" min-h-[56px] resize-y"} value={chReason}
                          onChange={e=>setChReason(e.target.value)} placeholder="e.g. Host on leave, needs an electrician…" />
              </Field>
              <div className="flex gap-2 justify-end">
                <Btn variant="outline" size="sm" disabled={busy}
                     onClick={()=>{ setChOpen(false); setChHost(""); setChReason(""); setErr(""); }}>Cancel</Btn>
                <Btn variant="primary" size="sm" onClick={changeHost} disabled={busy}>{busy?<Spinner/>:null}Save new host</Btn>
              </div>
            </div>
          )}
        </div>
      )}

      {/* ========== STEP 3: HOST COMPLETE PANEL ========== */}
      {canComplete && (
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4 mt-5">
          <p className="text-[11px] uppercase tracking-wide text-emerald-700 font-semibold mb-3">
            Complete &amp; Upload Proof / पूरा करें
          </p>
          <Field label="Proof Photos" hindi="प्रमाण फोटो" required
                 hint="Attach a photo of the fix, from the camera or gallery">
            <PhotoCapture photos={newProofs} setPhotos={setNewProofs} toast={toast} onView={onView} />
          </Field>
          <Field label="Completion Remarks" hindi="क्या किया गया">
            <textarea className={inputCls(false)+" min-h-[64px] resize-y"} value={compRemarks}
                      onChange={e=>setCompRemarks(e.target.value)} placeholder="What was done, which spare was used…" />
          </Field>
        </div>
      )}

      {/* ========== STEP 4: USER FEEDBACK PANEL ========== */}
      {canFeedback && (
        <div className="rounded-xl border border-violet-500/30 bg-violet-500/5 p-4 mt-5">
          <p className="text-[13px] font-semibold text-violet-800 mb-1">Complaint resolved? / शिकायत ठीक हुई?</p>
          <p className="text-[12.5px] text-slate-500 mb-3">
            {c.host_name || "Host"} has marked the complaint as complete. Is the machine really fixed?
          </p>
          <Field label="Your remarks" hindi="आपकी टिप्पणी">
            <textarea className={inputCls(false)+" min-h-[60px] resize-y"} value={fbRemarks}
                      onChange={e=>setFbRemarks(e.target.value)} placeholder="Optional" />
          </Field>
        </div>
      )}

      {/* User info panel — In Progress read-only view */}
      {isOwner && c.status === "In Progress" && c.expected_completion && !isMaint && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-4 mt-5 flex items-start gap-3">
          <Ico d={I.clock} className="w-5 h-5 text-teal-700 mt-0.5 shrink-0" />
          <div>
            <p className="text-[13px] font-semibold text-teal-800">{c.host_name || "Host"} is working on it</p>
            <p className="text-[13px] text-slate-700 mt-0.5">Expected to be fixed by {fmtDateTime(c.expected_completion)}.</p>
          </div>
        </div>
      )}

      {err ? (
        <div className="flex items-start gap-2 rounded-lg bg-rose-500/10 text-rose-700 px-3 py-2.5 text-[13px] mt-4">
          <Ico d={I.alert} className="w-4 h-4 mt-0.5 shrink-0" /><span>{err}</span>
        </div>
      ) : null}

      {confirmDel && (
        <div className="fixed inset-0 z-[70] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4"
             onMouseDown={e=>{ if(e.target===e.currentTarget && !delBusy) setConfirmDel(false); }}>
          <div className="bg-white border border-slate-200 w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl">
            <div className="px-5 py-4 border-b border-slate-200">
              <h3 className="font-semibold text-[15px]">Delete complaint?</h3>
              <p className="text-xs text-slate-500 mt-0.5">{c.complaint_no}</p>
            </div>
            <div className="px-5 py-4">
              <p className="text-[13.5px] text-slate-700">
                <strong>{c.complaint_no}</strong> will be deleted permanently, along with all its photos.
              </p>
            </div>
            <div className="px-5 py-3.5 border-t border-slate-200 flex gap-2 justify-end">
              <Btn variant="outline" onClick={()=>setConfirmDel(false)} disabled={delBusy}>Cancel</Btn>
              <Btn variant="danger" onClick={doDelete} disabled={delBusy}>{delBusy?<Spinner/>:null}Delete permanently</Btn>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function ComplaintRow({c, profile, D, onOpen, showUnit}){
  // needsMe logic per workflow:
  // Pending → this domain's triager needs to classify + assign
  // In Progress → assigned Host needs to complete
  // Completed → complaint raiser needs to give feedback
  const isMaint = profile.role === "Admin" || profile.role === D.triager;
  const needsMe =
    (c.status === "Pending" && isMaint) ||
    (c.status === "In Progress" && profile.role === "Host" && c.host_user_id === profile.id) ||
    (c.status === "Completed" && c.raised_by_user_id === profile.id);
  // Blue double-tick: complaint raiser sees it when host has opened the complaint
  const showBlueTick = c.seen_by_host_at && c.raised_by_user_id === profile.id;
  /* Rose means "machine is down". A fabric complaint stops no machine, so
     that domain keeps the plain status colour instead. */
  const borderColor = c.status==="Closed" ? "#10b981"
    : (D.tracksDowntime && isDown(c)) ? "#f43f5e"
    : c.status==="In Progress" ? "#14b8a6"
    : c.status==="Completed" ? "#a78bfa" : "#f59e0b";
  return (
    <button onClick={()=>onOpen(c)}
      className="w-full text-left px-3 sm:px-4 py-3 sm:py-3.5 hover:bg-slate-100/80 active:bg-slate-100 transition-colors border-l-[3px] card-press"
      style={{borderLeftColor: borderColor}}>
      {/* Top row: what it is about + status.
          Machine reads "KM-04 · Raschel"; fabric reads "RASCHEL · Quality 220". */}
      <div className="flex items-center gap-2 mb-1">
        <span className="font-semibold text-[13px] sm:text-[13.5px] truncate flex-1">
          {D.key === "fabric"
            ? <>{subjectOf(c, D)} <span className="font-normal text-slate-500">·</span> <span className="font-normal text-[12px] text-slate-600">{subjectDetailOf(c, D) || "—"}</span></>
            : <>{c.machine_no || "—"} <span className="font-normal text-slate-500">·</span> <span className="font-normal text-[12px] text-slate-600">{machineLabel(c)}</span></>}
        </span>
        <div className="flex items-center gap-1.5 shrink-0">
          {showBlueTick && <Ico d={I.checkCheck} className="w-3.5 h-3.5 text-blue-500" title="Seen by the host" />}
          {needsMe ? <span className="w-2 h-2 rounded-full bg-amber-400 animate-pulse" title="Needs your action" /> : null}
          <StatusBadge c={c} D={D} />
        </div>
      </div>
      {/* Problem description */}
      <p className="text-[12.5px] sm:text-[13px] text-slate-700 truncate leading-snug">{c.problem_desc}</p>
      {/* Bottom row: meta info */}
      <div className="flex items-center gap-2 mt-1.5 text-[10.5px] sm:text-[11.5px] text-slate-500">
        <span className="font-mono">{c.complaint_no}</span>
        {/* Only for someone looking at more than one unit; for everybody
            else every row would carry the same tag. */}
        {showUnit && c.unit ? <span className="shrink-0 rounded px-1.5 py-[1px] bg-violet-500/15 text-violet-700 font-semibold">{c.unit}</span> : null}
        <span>·</span>
        <span>{fmtDate(c.problem_date)}</span>
        <span>·</span>
        <span className="truncate">{c.entered_by}</span>
        {c.photo_count > 0 && <span className="ml-auto shrink-0">{c.photo_count}</span>}
      </div>
      {/* In Progress: show assigned host + plan date */}
      {c.status === "In Progress" && (c.host_name || c.expected_completion) ? (
        <div className="mt-1.5 flex items-center gap-2 text-[10.5px] text-teal-700 font-medium">
          {c.host_name && <span>{c.host_name}</span>}
          {c.expected_completion && <span>· Plan: {fmtDateTime(c.expected_completion)}</span>}
        </div>
      ) : null}
    </button>
  );
}

function ComplaintsView({profile, rows, loading, D, onRefresh, onOpen, toast, tabSeenMap, onTabSeenRefresh, showUnit}){
  const [tab, setTab] = useState("Pending");
  const [q, setQ] = useState("");
  const [type, setType] = useState("All");

  // Mark sub-tab as seen when user switches to it
  const switchTab = (key) => { setTab(key); markTabSeen("complaints:" + key); if (onTabSeenRefresh) onTabSeenRefresh(); };
  useEffect(() => { markTabSeen("complaints:" + tab); }, []); // eslint-disable-line

  const counts = useMemo(()=>{
    const o = {};
    TABS.forEach(t => o[t.key] = rows.filter(r => t.statuses.includes(r.status)).length);
    return o;
  },[rows]);

  // Unseen count per sub-tab: items created_at > last seen time for that sub-tab
  const unseenCounts = useMemo(()=>{
    const o = {};
    TABS.forEach(t => {
      const lastSeen = tabSeenMap?.["complaints:" + t.key];
      if (!lastSeen) { o[t.key] = rows.filter(r => t.statuses.includes(r.status)).length; return; }
      o[t.key] = rows.filter(r => t.statuses.includes(r.status) && r.updated_at > lastSeen).length;
    });
    return o;
  },[rows, tabSeenMap]);

  const shown = useMemo(()=>{
    const tabDef = TABS.find(t => t.key === tab);
    const needle = q.trim().toLowerCase();
    return rows.filter(r => {
      if (!tabDef.statuses.includes(r.status)) return false;
      if (type === "__none") { if (r.complaint_type) return false; }
      else if (type !== "All" && r.complaint_type !== type) return false;
      if (needle){
        const hay = [r.complaint_no, r.entered_by, subjectSearch(r, D), r.problem_desc, r.complaint_type, r.unit]
          .join(" ").toLowerCase();
        if (!hay.includes(needle)) return false;
      }
      return true;
    });
  },[rows, tab, q, type, D]);

  // Swipe to switch sub-tabs
  const tabKeys = TABS.map(t=>t.key);
  const swipeRef = useSwipe(
    () => { const i = tabKeys.indexOf(tab); if (i < tabKeys.length-1) switchTab(tabKeys[i+1]); },
    () => { const i = tabKeys.indexOf(tab); if (i > 0) switchTab(tabKeys[i-1]); }
  );

  // Tab colors per status
  const tabColors = { "Pending": { active:"bg-amber-500/15 border-amber-500/60 text-amber-800", dot:"bg-amber-500" },
                      "In Progress": { active:"bg-teal-500/15 border-teal-500/60 text-teal-800", dot:"bg-teal-500" },
                      "Awaiting": { active:"bg-violet-500/15 border-violet-500/60 text-violet-800", dot:"bg-violet-500" },
                      "Completed": { active:"bg-emerald-500/15 border-emerald-500/60 text-emerald-800", dot:"bg-emerald-500" } };
  const ownLabel = profile.role === "User";

  return (
    <div ref={swipeRef}>
      {/* Sub-tabs — compact pill style for mobile */}
      <div className="flex gap-1.5 mb-3 overflow-x-auto pb-0.5">
        {TABS.map(t => {
          const tc = tabColors[t.key] || tabColors["Pending"];
          const isActive = tab === t.key;
          const unseen = unseenCounts[t.key] || 0;
          return (
            <button key={t.key} onClick={()=>switchTab(t.key)}
              className={`shrink-0 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-left transition-all border relative ${
                isActive ? tc.active : "bg-white border-slate-200 hover:border-slate-300 text-slate-700"}`}>
              {unseen > 0 && !isActive && (
                <span className={`absolute -top-1 -right-1 min-w-[16px] h-[16px] rounded-full ${tc.dot} text-white text-[9px] font-bold flex items-center justify-center px-0.5 shadow-sm`}>
                  {unseen > 99 ? "99+" : unseen}
                </span>
              )}
              <span className="block text-[12px] sm:text-[13px] font-semibold">
                {(ownLabel ? t.label : (t.labelOthers || t.label))} <span className="font-mono text-[10.5px] sm:text-[11.5px] opacity-70">{counts[t.key]}</span>
              </span>
              <span className="block text-[9.5px] sm:text-[11px] text-slate-500">{ownLabel ? t.hi : (t.hiOthers || t.hi)}</span>
            </button>
          );
        })}
      </div>

      {/* Filters — stacked on small mobile */}
      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-0 w-full sm:w-auto sm:min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9 text-[14px]"} value={q} onChange={e=>setQ(e.target.value)}
                 placeholder={`Search ${D.unitWord.toLowerCase()}, problem…`} />
        </div>
        <div className="flex gap-2 w-full sm:w-auto">
          {/* Types are per domain, plus a filter for the ones nobody has
              classified yet — that is the triager's actual work queue. */}
          <select className={inputCls(false)+" flex-1 sm:w-auto text-[14px]"} value={type} onChange={e=>setType(e.target.value)}>
            <option value="All">All types</option>
            <option value="__none">Type pending (untriaged)</option>
            {D.types.map(t=><option key={t} value={t}>{t}</option>)}
          </select>
          <Btn variant="outline" icon={I.refresh} onClick={onRefresh} aria-label="Refresh" className="shrink-0" />
        </div>
      </div>

      {/* Complaint list — card-style on mobile */}
      <div className="rounded-xl border border-slate-200 bg-white sm:bg-slate-50 overflow-hidden divide-y divide-slate-100 sm:divide-slate-200 shadow-sm">
        {loading ? (
          Array.from({length:4}).map((_,i)=>(
            <div key={i} className="px-3 py-3.5 sm:px-4 sm:py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} /></div>
          ))
        ) : shown.length === 0 ? (
          <div className="px-4 py-12 sm:py-16 text-center">
            <Ico d={I.clipboard} className="w-8 h-8 sm:w-9 sm:h-9 mx-auto text-slate-300 mb-2.5" />
            <p className="font-semibold text-slate-700 text-[13.5px] sm:text-[14px]">
              {tab === "Pending" ? "No pending complaints" : tab === "In Progress" ? "Nothing in progress"
                : tab === "Awaiting" ? "Nothing waiting for an OK" : "Nothing completed yet"}
            </p>
            <p className="text-[12px] sm:text-[13px] text-slate-500 mt-1">
              {rows.length ? "Try clearing the filter or search." : 'Log a new complaint with "New Complaint".'}
            </p>
          </div>
        ) : shown.map(c => <ComplaintRow key={c.id} c={c} profile={profile} D={D} onOpen={onOpen} showUnit={showUnit} />)}
      </div>
    </div>
  );
}
