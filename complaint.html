function MachineFormModal({editing, onClose, onSaved, toast, unitsEnabled}){
  const isEdit = !!editing;
  const units = React.useContext(UnitsCtx);
  const knownDept = editing?.department && DEPARTMENTS.includes(editing.department);
  const [f, setF] = useState({
    machine_name: editing?.machine_name || "",
    machine_no: editing?.machine_no || "",
    department: knownDept ? editing.department : (editing?.department ? "Other" : DEPARTMENTS[0]),
    department_other: (editing?.department && !knownDept) ? editing.department : "",
    unit: editing?.unit || "",   // "" = shared by every unit
  });
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const [showScan, setShowScan] = useState(false);
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const save = async () => {
    const e = {};
    if (!f.machine_name.trim()) e.machine_name = "Please enter the machine name.";
    if (!f.machine_no.trim()) e.machine_no = "Please enter the machine number.";
    if (f.department === "Other" && !f.department_other.trim()) e.department_other = "Enter the new department's name.";
    setErrs(e);
    if (Object.keys(e).length) return;

    const finalDept = f.department === "Other" ? f.department_other.trim() : f.department;
    setBusy(true);
    const row = { machine_name: f.machine_name.trim(), machine_no: f.machine_no.trim(), department: finalDept,
                  ...(unitsEnabled ? { unit: f.unit || null } : {}) };
    const { error } = isEdit
      ? await sb.from("cmp_machine_list").update(row).eq("id", editing.id)
      : await sb.from("cmp_machine_list").insert(row);
    setBusy(false);
    if (error) return toast(friendlyError(error), true);
    toast(isEdit ? "Machine updated." : "Machine added.");
    onSaved();
    onClose();
  };

  return (
    <Modal title={isEdit ? "Edit machine" : "Add new machine"} subtitle={isEdit ? editing.machine_no : "नई मशीन जोड़ें"} onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy?<Spinner/>:null}{busy?"Saving…":(isEdit?"Save changes":"Add machine")}</Btn>
      </>}>
      <Field label="Machine name" hindi="मशीन का नाम" required error={errs.machine_name}>
        <input className={inputCls(errs.machine_name)} value={f.machine_name}
               onChange={e=>set("machine_name", e.target.value)} placeholder="Circular Knitting Machine" />
      </Field>
      <Field label="Machine no" hindi="मशीन नंबर · स्कैन / टाइप" required error={errs.machine_no}>
        <div className="flex gap-2">
          <input className={inputCls(errs.machine_no)+" flex-1"} value={f.machine_no}
                 onChange={e=>set("machine_no", e.target.value)} placeholder="KM-05" />
          <button type="button" onClick={()=>setShowScan(true)}
            className="shrink-0 w-10 h-10 rounded-lg bg-teal-500/10 text-teal-600 hover:bg-teal-500/20 transition grid place-items-center"
            title="Scan a barcode">
            <Ico d={I.scan} className="w-5 h-5" />
          </button>
        </div>
      </Field>
      {showScan && <BarcodeScannerModal onResult={(code)=>{ setShowScan(false); set("machine_no", code.trim()); }} onClose={()=>setShowScan(false)} />}
      <Field label="Department" hindi="विभाग" required>
        <select className={inputCls(false)} value={f.department} onChange={e=>set("department", e.target.value)}>
          {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
      </Field>
      {f.department === "Other" && (
        <Field label="New department name" hindi="नया विभाग का नाम" required error={errs.department_other}>
          <input className={inputCls(errs.department_other)} value={f.department_other}
                 onChange={e=>set("department_other", e.target.value)} placeholder="e.g. QUALITY CHECK" />
        </Field>
      )}
      {unitsEnabled && (
        <Field label="Unit" hindi="यूनिट" hint="Users see only their own unit's machines. Shared machines appear in every unit.">
          <select className={inputCls(false)} value={f.unit} onChange={e=>set("unit", e.target.value)}>
            <option value="">Shared · every unit</option>
            {units.map(u=><option key={u.code} value={u.code}>{u.name}</option>)}
          </select>
        </Field>
      )}
    </Modal>
  );
}

function AdminMachines({toast, onMachinesChanged, unitsEnabled}){
  const units = React.useContext(UnitsCtx);
  const [unitF, setUnitF] = useState("All");
  const [list, setList] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const [deptF, setDeptF] = useState("All");
  const [editing, setEditing] = useState(undefined);   // undefined = closed, null = new
  const [confirm, setConfirm] = useState(null);
  const [delBusy, setDelBusy] = useState(false);

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("cmp_machine_list").select("*")
      .order("department").order("machine_name").order("machine_no");
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setList(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  const shown = useMemo(()=>{
    const n = q.trim().toLowerCase();
    return list.filter(m => {
      if (deptF !== "All" && m.department !== deptF) return false;
      if (unitF === "__shared" ? !!m.unit : (unitF !== "All" && m.unit !== unitF)) return false;
      if (n && ![m.machine_name,m.machine_no,m.department].join(" ").toLowerCase().includes(n)) return false;
      return true;
    });
  },[list,q,deptF,unitF]);

  const saved = () => { load(); onMachinesChanged && onMachinesChanged(); };

  const doDelete = async (m) => {
    setDelBusy(true);
    const { error } = await sb.from("cmp_machine_list").delete().eq("id", m.id);
    setDelBusy(false);
    setConfirm(null);
    if (error) return toast(friendlyError(error), true);
    toast(`${m.machine_no} has been deleted.`);
    saved();
  };

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <div>
          <h2 className="font-bold text-[15px] sm:text-[17px]">Machine List</h2>
          <p className="text-[11px] sm:text-[12.5px] text-slate-500">मशीन सूची &mdash; admin only</p>
          <p className="text-[11px] sm:text-[12px] text-amber-700 mt-0.5">The New Machine Complaint form now picks machines from ERP › Master Data › Machine Master. This old list is kept for reference only.</p>
        </div>
        <Btn variant="primary" size="sm" icon={I.plus} className="ml-auto" onClick={()=>setEditing(null)}>Add machine</Btn>
      </div>

      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-0 w-full sm:w-auto sm:min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9 text-[14px]"} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search machine, no, department…" />
        </div>
        <div className="flex gap-2 w-full sm:w-auto">
          <select className={inputCls(false)+" flex-1 sm:w-auto text-[14px]"} value={deptF} onChange={e=>setDeptF(e.target.value)}>
            <option value="All">All departments</option>
            {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
          {unitsEnabled && (
            <select className={inputCls(false)+" flex-1 sm:w-auto text-[14px]"} value={unitF} onChange={e=>setUnitF(e.target.value)}>
              <option value="All">All units</option>
              {units.map(u=><option key={u.code} value={u.code}>{u.name}</option>)}
              <option value="__shared">Shared</option>
            </select>
          )}
          <Btn variant="outline" icon={I.refresh} onClick={load} aria-label="Refresh" className="shrink-0" />
        </div>
      </div>

      <div className="rounded-xl border border-slate-200 bg-slate-50 overflow-hidden divide-y divide-slate-200 shadow-sm">
        {loading ? Array.from({length:4}).map((_,i)=>(
          <div key={i} className="px-4 py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${50+i*10}%`}}/></div>
        )) : shown.length === 0 ? (
          <div className="px-5 py-14 text-center">
            <Ico d={I.clipboard} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
            <p className="font-semibold text-slate-700">No machines found</p>
          </div>
        ) : shown.map(m => (

            </div>

            <div className="flex gap-1.5 shrink-0">
              <Btn size="sm" variant="outline" icon={I.pen} onClick={()=>setEditing(m)}>Edit</Btn>

      <p className="text-[11.5px] text-slate-400 mt-3 leading-relaxed">
        Delete is permanent; it is removed from the list for good. Old complaints keep the machine name as text.
      </p>

            <strong>{confirm.machine_name} ({confirm.machine_no})</strong> will be removed from the list permanently.
          </p>

}

function NoticeComposer({profile, users, toast}){
  const isAdmin = profile.role === "Admin";
  const [msg, setMsg] = useState("");
  const [att, setAtt] = useState(null);   // {data, mime, name}
  const [imgBusy, setImgBusy] = useState(false);
  const [busy, setBusy] = useState(false);
  const [audience, setAudience] = useState("all");   // "all" | "selected"
  const [picked, setPicked] = useState([]);          // user ids
  const imgRef = useRef(null), pdfRef = useRef(null);

  const togglePick = (id) => setPicked(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);

  const pickImage = async (file) => {
    if (!file) return;
    setImgBusy(true);
    try { const d = await compressImage(file); setAtt({data:d, mime:"image/jpeg", name:null}); }
    catch(e){ toast(e.message, true); }
    finally { setImgBusy(false); if (imgRef.current) imgRef.current.value = ""; }
  };
  const pickPdf = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { toast("Only PDF files are allowed.", true); return; }
    if (file.size > NB_MAX_PDF_BYTES) { toast("The PDF is larger than 3 MB. Please attach a smaller file.", true); return; }
    const reader = new FileReader();
    reader.onerror = () => toast("The PDF could not be read.", true);
    reader.onload = () => setAtt({data:reader.result, mime:"application/pdf", name:file.name});
    reader.readAsDataURL(file);
    if (pdfRef.current) pdfRef.current.value = "";
  };

  const post = async () => {
    if (!msg.trim() && !att) return toast("Write something or attach a photo/PDF.", true);
    if (isAdmin && audience === "selected" && picked.length === 0)
      return toast("Select at least one user, or choose \"Everyone\".", true);
    setBusy(true);
    const { error } = await sb.from("cmp_notice_board").insert({
      message: msg.trim() || null,
      attachment_data: att?.data || null,
      attachment_mime: att?.mime || null,
      attachment_name: att?.name || null,
      recipient_ids: (isAdmin && audience === "selected") ? picked : null,
    });
    setBusy(false);
    if (error) return toast(friendlyError(error), true);
    setMsg(""); setAtt(null); setAudience("all"); setPicked([]);
    // No manual refresh — the Realtime INSERT event appends it for everyone the DB lets see it.
  };

  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-3.5 mb-4">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-full bg-teal-500/15 text-teal-700 grid place-items-center font-bold text-sm shrink-0">
          {profile.name.slice(0,1).toUpperCase()}
        </div>
        <textarea className={inputCls(false)+" min-h-[54px] resize-y"} value={msg}
          onChange={e=>setMsg(e.target.value)} placeholder="Write something on the notice board… सूचना यहाँ लिखें" />
      </div>
      {att && (
        <div className="mt-2.5 ml-12">
          {att.mime === "application/pdf" ? (
            <div className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-[12.5px]">
              <Ico d={I.doc} className="w-4 h-4 text-rose-500" /><span className="truncate max-w-[180px]">{att.name}</span>
              <button type="button" onClick={()=>setAtt(null)} className="ml-1 text-slate-400 hover:text-slate-700">
                <Ico d={I.x} className="w-3.5 h-3.5"/>
              </button>
            </div>
          ) : (
            <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-slate-100">
              <img src={att.data} className="w-full h-full object-cover" alt="Attachment preview" />
              <button type="button" onClick={()=>setAtt(null)}
                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
                <Ico d={I.x} className="w-3 h-3"/>
              </button>
            </div>
          )}
        </div>
      )}

      {isAdmin && (
        <div className="ml-12 mt-2.5">
          <div className="flex items-center gap-1.5 mb-2">
            <button type="button" onClick={()=>setAudience("all")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="all" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Everyone
            </button>
            <button type="button" onClick={()=>setAudience("selected")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="selected" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Specific users{picked.length>0 ? ` (${picked.length})` : ""}
            </button>
          </div>
          {audience === "selected" && (
            <div className="rounded-lg border border-slate-200 bg-slate-50 max-h-40 overflow-y-auto p-1.5 mb-1">
              {users.length === 0 ? (
                <p className="text-[12px] text-slate-500 px-2 py-1.5">No users found.</p>
              ) : users.map(u => (
                <label key={u.id} className="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-white cursor-pointer text-[12.5px]">
                  <input type="checkbox" checked={picked.includes(u.id)} onChange={()=>togglePick(u.id)} className="accent-teal-500" />
                  <span className="truncate">{u.name}</span>
                  <span className="text-slate-400 truncate ml-auto text-[11px]">{u.department}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="flex items-center gap-2 mt-2.5 ml-12 flex-wrap">
        <Btn size="sm" variant="outline" icon={I.camera} type="button" disabled={!!att || imgBusy} onClick={()=>imgRef.current?.click()}>
          {imgBusy ? "Adding…" : "Photo"}
        </Btn>
        <Btn size="sm" variant="outline" icon={I.doc} type="button" disabled={!!att} onClick={()=>pdfRef.current?.click()}>PDF</Btn>
        <input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
        <input ref={pdfRef} type="file" accept="application/pdf" className="hidden" onChange={e=>pickPdf(e.target.files?.[0])} />
        <Btn size="sm" variant="primary" icon={I.send} className="ml-auto" onClick={post} disabled={busy}>
          {busy ? <Spinner/> : null}Post
        </Btn>
      </div>
    </div>
  );
}

function NoticeBoard({profile, toast, onView}){
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [users, setUsers] = useState([]);   // for the Admin's "specific users" picker + name badges

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("cmp_notice_board").select("*").order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setPosts(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  useEffect(()=>{
    if (profile.role !== "Admin") return;   // only Admin can target — no need elsewhere
    sb.from("cmp_profiles").select("id,name,department").eq("is_active", true).order("name")
      .then(({data}) => setUsers(data || []));
  },[profile.role]);

  // Live updates for everyone looking at the board — no polling, no manual refresh.
  useEffect(()=>{
    const channel = sb.channel("notice_board_live")
      .on("postgres_changes", {event:"*", schema:"public", table:"cmp_notice_board"}, payload => {
        setPosts(prev => {
          if (payload.eventType === "INSERT"){
            if (prev.some(p=>p.id===payload.new.id)) return prev;
            return [payload.new, ...prev];
          }
          if (payload.eventType === "UPDATE") return prev.map(p => p.id===payload.new.id ? payload.new : p);
          if (payload.eventType === "DELETE") return prev.filter(p => p.id !== payload.old.id);
          return prev;
        });
      })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[]);

  return (
    <div>
      <div className="mb-3">
        <h2 className="font-bold text-[15px] sm:text-[17px]">Notice Board</h2>
        <p className="text-[11px] sm:text-[12.5px] text-slate-500">सूचना पट्ट &middot; real-time{profile.role==="Admin" ? " · The Admin can post to everyone" : ""}</p>
      </div>

      <NoticeComposer profile={profile} users={users} toast={toast} />

      {loading ? (
        <div className="space-y-3">
          {Array.from({length:3}).map((_,i)=>(
            <div key={i} className="rounded-xl border border-slate-200 bg-white p-3.5">
              <div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} />
            </div>
          ))}
        </div>
      ) : posts.length === 0 ? (
        <div className="rounded-xl border border-slate-200 bg-slate-50 px-5 py-16 text-center">
          <Ico d={I.doc} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
          <p className="font-semibold text-slate-700">No notices yet</p>
          <p className="text-[13px] text-slate-500 mt-1">Be the first to post.</p>
        </div>
      ) : (
        <div className="space-y-3">
          {posts.map(p => <NoticeCard key={p.id} post={p} profile={profile} users={users} toast={toast} onView={onView} />)}
        </div>
      )}
    </div>
  );
}

function Stats({rows, profile, D}){
  const s = useMemo(()=>{
    const open = rows.filter(r => r.status === "Pending" || r.status === "In Progress");
    // What a complaint is counted against: a machine, or a process+quality.
    const keyOf = r => D.key === "fabric"
      ? `${r.process_name||""}|${r.fabric_quality ?? ""}`
      : `${machineLabel(r)}|${r.machine_no||""}`;
    const subjects = new Set(open.map(keyOf));
    const awaiting = rows.filter(r => r.status === "Completed" &&
      (profile.role === "User" ? r.raised_by_user_id === profile.id : true)).length;
    const base = [
      { n: rows.filter(r=>r.status==="Pending").length, l:"Pending", c:"text-amber-600" },
      { n: rows.filter(r=>r.status==="In Progress").length, l:"In-progress", c:"text-teal-600" },
      { n: awaiting, l: profile.role==="User" ? "Needs your OK" : "Awaiting user OK", c:"text-violet-600" },
    ];
    /* The fourth tile differs because the two domains measure different
       damage. For machines it is downtime — how many are stopped right now.
       For fabric nothing is stopped, so the useful number is how many
       complaints are still waiting to be classified, which is exactly the
       Production Manager's queue. */
    if (D.tracksDowntime){
      const down = new Set(open.filter(isDown).map(keyOf));
      base.push({ n: down.size, l:"Machines down", c:"text-rose-600" });
      base.push({ n: subjects.size, l:"Machines affected", c:"text-slate-800" });
    } else {
      base.push({ n: open.filter(r=>!r.complaint_type).length, l:"Type pending", c:"text-rose-600" });
      base.push({ n: subjects.size, l:"Qualities affected", c:"text-slate-800" });
    }
    return base;
  },[rows, profile, D]);
  return (
    <div className="flex gap-2 mb-4 overflow-x-auto pb-1 sm:grid sm:grid-cols-5 sm:overflow-visible">
      {s.map(t=>(
        <div key={t.l} className="shrink-0 w-[110px] sm:w-auto rounded-xl border border-slate-200 bg-white sm:bg-slate-50 px-3 py-2.5 sm:px-3.5 sm:py-3 shadow-sm">
          <p className={`font-mono font-semibold text-xl sm:text-2xl leading-none ${t.c}`}>{t.n}</p>
          <p className="text-[9.5px] sm:text-[10.5px] uppercase tracking-wide text-slate-500 mt-1">{t.l}</p>
        </div>
      ))}
    </div>
  );
}

function BellButton({toast}){
  const [perm, setPerm] = useState(()=> (window.Notification ? Notification.permission : "unsupported"));
  if (perm === "unsupported" || perm === "granted") return null;
  const ask = async () => {
    try{
      const p = await Notification.requestPermission();
      setPerm(p);
      toast(p === "granted" ? "Complaint alerts are on." : "Alerts were not allowed; complaint updates will show only inside the app.");
    } catch(e){ toast("This browser does not support notifications.", true); }
  };
  return (
    <Btn variant="ghost" icon={I.bell} onClick={ask} className="shrink-0" title="Turn on complaint alerts">
      <span className="hidden sm:inline">Alerts</span>
    </Btn>
  );
}

function App(){
  const [session, setSession] = useState(undefined);   // undefined = still checking
  const [profile, setProfile] = useState(null);
  const [profileErr, setProfileErr] = useState("");
  const [rows, setRows] = useState([]);
  const [machines, setMachines] = useState([]);
  const [processes, setProcesses] = useState([]);   // fabric side's subject master
  const [fabricQualities, setFabricQualities] = useState([]);   // ERP Fabric Master › FABRIC NAME values
  const [lotCards, setLotCards] = useState([]);                 // Lot Card Manager (mfg_lot_cards)
  const [hosts, setHosts] = useState([]);   // Host role profiles — for the assign flow
  const [units, setUnits] = useState(UNIT_FALLBACK);   // from cmp_units
  /* Unit filter, for someone who sees every unit (Admin / "All units").
     Remembered per device like the register, because an Admin who looks
     after Unit-2 today will look after it tomorrow too. */
  const [unitF, setUnitF] = useState(() => {
    try { return localStorage.getItem(UNIT_FILTER_KEY) || "All"; } catch(e){ return "All"; }
  });
  useEffect(()=>{ try { localStorage.setItem(UNIT_FILTER_KEY, unitF); } catch(e){} },[unitF]);
  /* Which register is on screen. Remembered per device, because a fabric
     inspector opens this app twenty times a day and should not have to
     switch every time. Falls back to machine if the stored value is stale. */
  const [domainKey, setDomainKey] = useState(() => {
    try { const v = localStorage.getItem(DOMAIN_STORE_KEY); return DOMAIN_KEYS.includes(v) ? v : "machine"; }
    catch(e){ return "machine"; }
  });
  /* The register actually shown: the remembered one if this role may see
     it, else the role's own. Worked out here from the profile (not fixed up
     in an effect), so a Maintenance login never fetches the fabric table
     even for one frame, whatever this device remembered from someone else. */
  const myDomains = domainsFor(profile);
  const D = DOMAINS[myDomains.includes(domainKey) ? domainKey : myDomains[0]] || DOMAINS.machine;
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("complaints");
  const [detail, setDetail] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [toasts, setToasts] = useState([]);

  const toastSeq = useRef(0);
  const toast = useCallback((msg, bad=false)=>{
    const id = ++toastSeq.current;
    setToasts(t => [...t, {id,msg,bad}]);
    setTimeout(()=> setToasts(t => t.filter(x=>x.id!==id)), 4200);
  },[]);
  const dismiss = useCallback(id => setToasts(t=>t.filter(x=>x.id!==id)),[]);

  // ---- auth ----
  useEffect(()=>{
    sb.auth.getSession().then(({data}) => setSession(data.session ?? null));
    const { data:{ subscription } } = sb.auth.onAuthStateChange((_e, s) => {
      setSession(s ?? null);
      /* The ERP single login has NO Supabase Auth session, and this
         listener fires once on boot with `null`. Without this guard that
         teardown wiped the profile set from the ERP and the app fell back
         to the login screen. SSO users log out through sarvLogoutAll()
         (which sends them to the ERP), so no teardown is needed here. */
      const ssoActive = !!(window.__SARV_SSO && window.__SARV_SSO.cmp_profile_id);
      if (!s && !ssoActive){
        // Tear down EVERY view holding data. An open complaint modal that
        // survives sign-out would show the previous user's complaint to
        // whoever signs in next on the same shared factory phone.
        setProfile(null); setRows([]); setMachines([]);
        setView("complaints"); setDetail(null); setShowNew(false); setLightbox(null);
        setToasts([]);   // old toasts can name the previous user's complaints
      }
    });
    return ()=> subscription.unsubscribe();
  },[]);

  /* ── ERP single login ─────────────────────────────────────────────
     The SSO identity that came from the ERP (the gate at the top of the
     file). For a user whose Complaint account is LINKED in the Admin Panel
     (app_users.cmp_profile_id), the profile loads straight from that id.
     No Supabase Auth session has to be created, so this app never asks
     for its own password again.

     If it is NOT linked, SSO steps aside and the app's old login appears.
     That allows a gradual rollout: as the Admin links people, their
     passwords drop away. Who is linked shows in Admin Panel › Users as
     the C pill.

     The role also comes from that cmp_profiles row (Admin / Host / User /
     Maintenance / Production Manager), so this app's own role setup stays
     as it is; the ERP only says who the person is. */
  const [ssoWait, setSsoWait] = useState(true);
  useEffect(()=>{
    let alive = true;
    /* `ssoWait` turning false is the moment the app is ready to show. The
       splash (sso-preboot.js) must go at that same moment, so both happen
       in one place; otherwise one would go and the other would stay.
       (This used to say "or its own login" as well; that path no longer
       exists, login happens only on the launcher.) */
    const ssoReady = () => {
      setSsoWait(false);
      if (window.sarvSsoPrebootDone) window.sarvSsoPrebootDone();
    };
    const apply = u => {
      if (!alive) return;
      if (!u || !u.cmp_profile_id){ ssoReady(); return; }
      sb.from("cmp_profiles").select("*").eq("id", u.cmp_profile_id).maybeSingle()
        .then(({data,error}) => {
          if (!alive) return;
          ssoReady();
          /* A missing profile is not a "show the login" situation. The
             gate has created a session, so the row exists but is not
             visible (RLS). That is the Admin's job, so we say so and stop;
             leaving a blank screen would be the worst outcome. */
          if (error || !data){
            SARV_GATE.halt("Your profile could not be read",
              "The auth session was created, but your <code>cmp_profiles</code> row is not visible. This is an RLS policy issue. Please show this screen to the Admin.",
              (error && (error.message || error.code)) || ("id " + u.cmp_profile_id));
            return;
          }
          if (!data.is_active){ setProfileErr("Your account is inactive. Please contact the Admin."); return; }
          setProfile(data); setProfileErr("");
        });
    };
    // The gate may already have answered; otherwise wait for its event.
    if (window.__SARV_SSO !== undefined){ apply(window.__SARV_SSO); return ()=>{ alive = false; }; }
    const h = e => apply(e.detail);
    window.addEventListener("sarv-sso-ready", h);
    /* There used to be a 4 second timeout here so the app wouldn't hang
       and the login screen would appear if the gate never answered. That
       timeout has been REMOVED: there is no login screen any more, and the
       gate always does something (this event on success, otherwise its own
       reason screen or the launcher, both of which also remove the splash).
       The only effect a timeout still had was that on a slow connection
       the splash vanished and the user stared at a blank screen. */
    return ()=>{ alive = false; window.removeEventListener("sarv-sso-ready", h); };
  },[]);

  // ---- profile ----
  useEffect(()=>{
    if (!session){ return; }   // the SSO profile may already have been set above
    let alive = true;
    sb.from("cmp_profiles").select("*").eq("id", session.user.id).maybeSingle()
      .then(({data,error}) => {
        if (!alive) return;
        if (error) return setProfileErr(friendlyError(error));
        if (!data){ setProfileErr("Your profile was not found. Please contact the Admin."); return; }
        if (!data.is_active){ setProfileErr("Your account is inactive. Please contact the Admin."); sb.auth.signOut(); return; }
        setProfile(data); setProfileErr("");
      });
    return ()=>{ alive = false; };
  },[session]);

  // ---- Web Push: register SW + subscribe on login ----
  useEffect(()=>{
    if (!profile?.id) return;
    subscribePush(profile.id);
  },[profile?.id]);

  // ---- data ----
  const loadRows = useCallback(async (showSpinner)=>{
    if (showSpinner) setLoading(true);
    // RLS decides what comes back — no role filtering is done here on purpose.
    /* The embedded photo table is named inside the select string, so it has
       to be the right one for this domain; PostgREST resolves it through the
       <photoTable>.complaint_id -> <table>.id foreign key. Only the COUNT is
       embedded, never image_data — the list would otherwise pull megabytes
       of base64 per page. */
    const { data, error } = await sb.from(D.table)
      .select(`*, photo_count:${D.photoTable}(count)`)
      .order("problem_date", {ascending:false}).order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setRows((data||[]).map(r => ({...r, photo_count: r.photo_count?.[0]?.count ?? 0})));
  },[toast, D.table, D.photoTable]);

  /* The machine to complain about comes ONLY from the ERP's Master Data ›
     Machine Master (table `machines`), the same list the Store uses, so a
     machine has one name everywhere. cmp_machine_list (this app's old list)
     is no longer read by the form. `machines` has no unit, so every machine
     shows in every unit. A new machine can be added only by a Host or Admin,
     from the New Complaint form (it goes into `machines`). */
  const loadMachines = useCallback(async ()=>{
    const { data, error } = await sb.from("machines").select("id,machine_name,machine_no,is_active").eq("is_active",true)
      .order("machine_name").order("machine_no");
    if (error) return console.warn("Machine Master:", error.message);
    setMachines(data||[]);
  },[]);

  /* Fabric complaint pickers, both from ERP data (read-only here):
       Fabric         — the distinct FABRIC NAME values of active rows in
                        Master Data › Fabric Master (fabric_master.fabric_name,
                        a number such as 1.8), lowest first. It is saved in the
                        complaint's fabric_quality column, which is numeric too.
       Lot Card No.   — lots saved in Manufacturing › Lot Card Manager (mfg_lot_cards), newest first */
  const loadFabricMasters = useCallback(async ()=>{
    const [fq, lc] = await Promise.all([
      sb.from("fabric_master").select("fabric_name,is_active"),
      sb.from("mfg_lot_cards").select("lot_no,brand_name,fabric_type,lot_date,created_at").order("created_at",{ascending:false}),
    ]);
    if (fq.error) console.warn("Fabric Master:", fq.error.message);
    else setFabricQualities([...new Set((fq.data||[]).filter(r => r.is_active !== false)
      .map(r => String(r.fabric_name ?? "").trim()).filter(Boolean))]
      .sort((a, b) => (Number(a) - Number(b)) || a.localeCompare(b)));
    if (lc.error) console.warn("Lot Card Manager:", lc.error.message);
    else setLotCards((lc.data||[]).filter(r => String(r.lot_no||"").trim()));
  },[]);

  const loadProcesses = useCallback(async ()=>{
    const { data, error } = await sb.from("cmp_fabric_processes").select("process_name,department")
      .eq("is_active",true).order("process_name");
    if (!error) setProcesses(data||[]);
  },[]);

  const loadHosts = useCallback(async ()=>{
    // "*" for the same reason as loadMachines: unit / all_units ride along.
    const { data, error } = await sb.from("cmp_profiles")
      .select("*")
      .eq("role","Host").eq("is_active",true).order("name");
    if (!error) setHosts(data||[]);
  },[]);

  // Missing table (migration not run) or empty: keep the fallback list.
  const loadUnits = useCallback(async ()=>{
    const { data, error } = await sb.from("cmp_units").select("code,name,sort_order")
      .eq("is_active",true).order("sort_order").order("code");
    if (!error && data && data.length) setUnits(data);
  },[]);

  /* loadRows is in the dependency list and is itself keyed to D.table, so
     switching register re-fetches on its own — there is no separate "domain
     changed" effect to fall out of step with this one. */
  useEffect(()=>{
    if (!profile) return;
    loadRows(true);
    loadMachines();
    loadProcesses();
    loadFabricMasters();
    loadHosts();
    loadUnits();
    const iv = setInterval(()=>{
      if (document.visibilityState === "visible" && !detail && !showNew) loadRows(false);
    }, 60000);
    return ()=> clearInterval(iv);
  },[profile, loadRows, loadMachines, loadProcesses]);   // eslint-disable-line

  // Keep the open detail in sync with refreshed data
  useEffect(()=>{
    if (!detail) return;
    const fresh = rows.find(r => r.id === detail.id);
    if (fresh && fresh.updated_at !== detail.updated_at) setDetail(fresh);
  },[rows]);   // eslint-disable-line

  // ---- Tab badge system (MUST be before early returns — hooks can't be conditional) ----
  const [tabSeenMap, reloadTabSeen] = useTabSeen(profile?.id);

  /* Switching register. Anything holding a row from the old table has to go
     with it: an open ComplaintDetail would keep its `D` from the new domain
     while its complaint came from the old one, and its next save would hit
     the wrong table. The new-complaint form is closed for the same reason —
     a half-filled machine form must not be submitted as a fabric one. */
  const switchDomain = useCallback((key) => {
    if (!DOMAIN_KEYS.includes(key)) return;
    /* Idempotent on purpose. A 50px swipe usually stops the browser
       synthesising a click, but not on every device — and the title carries
       BOTH handlers, so the same gesture can arrive twice. Returning `prev`
       when it already matches means a double fire lands on the same register
       instead of toggling straight back. */
    setDomainKey(prev => (prev === key ? prev : key));
    setDetail(null); setShowNew(false); setLightbox(null);
    setRows([]);           // don't show the other register's rows for a frame
    setView("complaints"); // the switch is meaningless on Notices/Users
  },[]);
  // Persisted here rather than inside the updater above — a state updater
  // must stay free of side effects.
  useEffect(()=>{
    try { localStorage.setItem(DOMAIN_STORE_KEY, domainKey); } catch(e){}
  },[domainKey]);
  // With a single register (Maintenance / Production Manager) there is
  // nothing to swipe to, so the gesture does nothing.
  const otherKey = myDomains.find(k => k !== D.key);
  // Swipe either way on the register buttons toggles between the two.
  const domainSwipeRef = useSwipe(
    () => { if (otherKey) switchDomain(otherKey); },
    () => { if (otherKey) switchDomain(otherKey); }
  );

  // Mark main tab as seen on switch
  const switchView = useCallback((key) => { setView(key); markTabSeen("main:" + key); reloadTabSeen(); },[reloadTabSeen]);
  useEffect(() => { if (profile?.id) markTabSeen("main:" + view); }, [profile?.id]); // eslint-disable-line

  // Unseen counts for main nav tabs
  const mainUnseenCounts = useMemo(()=>{
    const c = {};
    // Complaints: total unseen across all sub-tabs
    const compTimes = TABS.map(t => tabSeenMap["complaints:" + t.key] || "").filter(Boolean).map(d => new Date(d).getTime());
    const mainCompTime = tabSeenMap["main:complaints"] ? new Date(tabSeenMap["main:complaints"]).getTime() : 0;
    const compLastSeen = compTimes.length > 0 ? Math.max(...compTimes, mainCompTime) : mainCompTime;
    c.complaints = compLastSeen > 0 ? rows.filter(r => new Date(r.updated_at).getTime() > compLastSeen).length : rows.length;
    // Notices: items updated after last notice tab seen
    const notLastSeen = tabSeenMap["main:notices"];
    c.notices = 0;
    if (!notLastSeen) c.notices = -1; // flag: show dot without number
    return c;
  },[rows, tabSeenMap]);

  // Swipe to switch main tabs (uses navItems computed below but stable keys)
  const mainSwipeRef = useSwipe(
    () => { setView(v => { const keys = _navKeys(profile); const i = keys.indexOf(v); return i < keys.length-1 ? (markTabSeen("main:"+keys[i+1]), reloadTabSeen(), keys[i+1]) : v; }); },
    () => { setView(v => { const keys = _navKeys(profile); const i = keys.indexOf(v); return i > 0 ? (markTabSeen("main:"+keys[i-1]), reloadTabSeen(), keys[i-1]) : v; }); }
  );

  // ---- render ----
  if (session === undefined) return null;      // boot overlay is still showing
  /* The login screen used to appear here. Not any more: the gate (at the
     top of the file) doesn't let the app run without a session; it
     redirects to the launcher or shows the reason screen itself. So this
     state only means "still waiting", and the boot overlay should stay.
     Showing a login form here would only mislead: there is no path left
     behind that form. */
  if (!session && !profile) return null;

  if (profileErr) return (
    <div className="min-h-screen grid place-items-center p-6 text-center">
      <div>
        <Ico d={I.alert} className="w-10 h-10 mx-auto text-rose-600 mb-3" />
        <p className="font-semibold">{profileErr}</p>
        <Btn variant="outline" className="mt-4" onClick={sarvLogoutAll}>Logout</Btn>
      </div>
    </div>
  );
  if (!profile) return <div className="min-h-screen grid place-items-center"><Spinner className="w-7 h-7 text-teal-600" /></div>;

  const scopeLine =
    profile.role === "Admin" ? "Sab complaints" :
    profile.role === D.triager ? "Sab hosts ki complaints" :
    profile.role === "Host" ? `${(profile.host_types||[]).join(", ")} complaints` :
    "Only your complaints";

  // ---- units ----
  const hasUnits = unitsOn(profile);
  const allUnits = hasUnits && seesAllUnits(profile);
  // A unit filter left over from another login (or a unit since retired)
  // must not silently empty the list.
  /* "__mine" (My Complaints) sits in the same row: the complaints this
     person raised themselves, across every unit. The Admin sees every
     unit's complaints, so their own were otherwise lost among them. */
  const MINE = "__mine";
  const isMine = r => r.raised_by_user_id === profile.id;
  const effUnitF = allUnits && (unitF === MINE || units.some(u => u.code === unitF)) ? unitF : "All";
  const viewRows = effUnitF === "All" ? rows
    : effUnitF === MINE ? rows.filter(isMine)
    : rows.filter(r => r.unit === effUnitF);
  /* No unit on this user yet (an older account, or one whose unit the Admin
     hasn't set in ERP › Admin Panel › Users). The database would refuse the
     complaint anyway; saying so before the form is filled in saves them the
     typing. */
  const unitBlocked = hasUnits && !profile.unit && !allUnits;
  const openNew = () => {
    if (unitBlocked) return toast("Your unit is not set yet. Ask the Admin to set Unit-1 / Unit-2 on your user (ERP › Admin Panel › Users).", true);
    setShowNew(true);
  };

  // Nav items with icons for bottom nav
  const navItems = [
    { key:"complaints", label:"Complaints", hi:"शिकायत", icon:I.clipboard, color:"text-amber-600", bg:"bg-amber-500", dot:"bg-amber-500" },
    { key:"notices", label:"Notices", hi:"सूचना", icon:I.megaphone, color:"text-blue-600", bg:"bg-blue-500", dot:"bg-blue-500" },
    ...(profile.role === "Admin" ? [
      { key:"machines", label:"Machines", hi:"मशीन", icon:I.wrench, color:"text-purple-600", bg:"bg-purple-500", dot:"bg-purple-500" },
      // Users: managed in ERP › Admin Panel › Users now (see section 12).
    ] : []),
  ];

  return (
    <UnitsCtx.Provider value={units}>
    <div className="min-h-screen flex flex-col bg-slate-50 sm:bg-white">

      {/* ===== MOBILE TOP BAR =====
           The register switch is the pair of large buttons under the title:
           Machine Complaint and Fabric Complaint, split side by side. The
           selected one grows wider and fills with its colour, so which
           register is on screen is obvious at a glance; the other stays
           smaller and outlined. They are real buttons (keyboard and screen
           readers reach them, aria-pressed says which is on), and a swipe
           either way across the pair still toggles, as the title used to. */}
      <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-sm">
        <div className="max-w-3xl mx-auto flex items-center gap-2.5 px-3 pt-2.5 pb-2 sm:px-4 sm:pt-3">
          <div className={`w-8 h-8 sm:w-9 sm:h-9 rounded-lg text-white grid place-items-center font-extrabold text-[12px] sm:text-[13px] shrink-0 transition-colors ${D.badgeCls}`}>
            {D.badge}
          </div>
          <div className="min-w-0 flex-1">
            <h1 className="font-bold text-[14px] sm:text-[15px] leading-tight truncate">{D.title}</h1>
            <p className="text-[10.5px] sm:text-[11.5px] text-slate-500 truncate">
              {profile.name} · {profile.role}
              {hasUnits && <> · <span className="font-semibold text-violet-700">{allUnits ? "All units" : (profile.unit ? unitName(units, profile.unit) : "No unit")}</span></>}
            </p>
          </div>
          <BellButton toast={toast} />
          <Btn variant="ghost" size="sm" icon={I.logout} onClick={sarvLogoutAll} aria-label="Logout" className="shrink-0" />
        </div>
        {/* Only when there is a choice: a Maintenance / Production Manager
            login has one register, already named in the title above. */}
        {myDomains.length > 1 && (
        <div ref={domainSwipeRef} role="group" aria-label="Complaint register"
          className="max-w-3xl mx-auto flex items-stretch gap-2 px-3 pb-2.5 sm:px-4 sm:pb-3 select-none"
          style={{touchAction:'pan-y'}}>
          {myDomains.map(k => {
            const X = DOMAINS[k], on = k === D.key;
            return (
              <button key={k} type="button" onClick={()=>switchDomain(k)}
                aria-pressed={on}
                title={on ? X.title : `${X.title} par jayein`}
                className={`min-w-0 rounded-xl border-2 flex items-center justify-center gap-2 px-2 font-bold transition-all duration-200 active:scale-[0.98] ${
                  on ? `flex-[1.6] py-3.5 text-[15px] sm:text-[16px] ${X.segOnCls}`
                     : `flex-1 py-2.5 text-[12.5px] sm:text-[13.5px] ${X.segOffCls}`}`}>
                <Ico d={I[X.segIcon]} className={on ? "w-6 h-6 shrink-0" : "w-4 h-4 shrink-0"} />
                <span className="min-w-0 text-left leading-tight">
                  <span className="block truncate">{X.title}</span>
                  <span className={`block truncate font-medium ${on ? "text-[11px] opacity-90" : "text-[10px] opacity-75"}`}>{X.hi}</span>
                </span>
              </button>
            );
          })}
        </div>
        )}
        {/* Unit filter — only for someone who sees more than one unit, and
            only on the complaint lists (Notices are company-wide). */}
        {allUnits && view === "complaints" && (
          <div role="group" aria-label="Unit filter"
            className="max-w-3xl mx-auto flex items-center gap-1.5 px-3 pb-2.5 sm:px-4 overflow-x-auto">
            <span className="text-[10.5px] uppercase tracking-wide text-slate-500 shrink-0 mr-0.5">Unit</span>
            {[{ code:"All", name:"All units" }, ...units, { code:MINE, name:"My Complaints" }].map(u => {
              const on = effUnitF === u.code;
              const n = u.code === "All" ? rows.length
                : u.code === MINE ? rows.filter(isMine).length
                : rows.filter(r => r.unit === u.code).length;
              return (
                <button key={u.code} type="button" onClick={()=>setUnitF(u.code)} aria-pressed={on}
                  className={`shrink-0 rounded-full border px-3 py-1 text-[12px] font-semibold transition-colors ${
                    on ? "bg-slate-800 border-slate-800 text-white" : "bg-white border-slate-200 text-slate-600 hover:border-slate-300"}`}>
                  {u.name} <span className="font-mono text-[10.5px] opacity-70">{n}</span>
                </button>
              );
            })}
          </div>
        )}
      </header>

      {/* ===== MAIN CONTENT — scrollable, padded for bottom nav ===== */}
      <main ref={mainSwipeRef} className="flex-1 max-w-3xl mx-auto w-full px-3 sm:px-4 pt-3 sm:pt-4 pb-24 sm:pb-6">
        {view === "machines" && profile.role === "Admin" ? (
          <AdminMachines toast={toast} onMachinesChanged={loadMachines} unitsEnabled={hasUnits} />
        ) : view === "notices" ? (
          <NoticeBoard profile={profile} toast={toast} onView={setLightbox} />
        ) : (
          <>
            {unitBlocked && (
              <div className="mb-3 flex items-start gap-2 rounded-lg bg-amber-500/10 border border-amber-500/30 px-3 py-2.5 text-[12.5px] text-amber-800">
                <Ico d={I.alert} className="w-4 h-4 mt-0.5 shrink-0" />
                <span><b>Your unit is not set yet.</b> You can't raise a complaint until the Admin sets Unit-1 / Unit-2 on your user.</span>
              </div>
            )}
            <Stats rows={viewRows} profile={profile} D={D} />
            <ComplaintsView profile={profile} rows={viewRows} loading={loading} D={D}
              onRefresh={()=>loadRows(true)} onOpen={setDetail} toast={toast}
              tabSeenMap={tabSeenMap} onTabSeenRefresh={reloadTabSeen}
              showUnit={allUnits && (effUnitF === "All" || effUnitF === MINE)} />
          </>
        )}
      </main>

      {/* ===== FAB — New Complaint (mobile: bottom-right above nav, desktop: inline) ===== */}
      <button onClick={openNew}
        title={`New ${D.title}`}
        className={`sm:hidden fixed z-50 right-4 bottom-20 w-14 h-14 rounded-full text-white shadow-lg flex items-center justify-center active:scale-95 transition-transform ${D.fabCls}`}
        style={{marginBottom:'env(safe-area-inset-bottom,0px)'}}>
        <Ico d={I.plus} className="w-7 h-7" />
      </button>

      {/* ===== BOTTOM NAVIGATION BAR (Android-style) ===== */}
      <nav className="fixed bottom-0 inset-x-0 z-40 bg-white border-t border-slate-200 shadow-[0_-2px_10px_rgba(0,0,0,0.06)] sm:hidden pb-safe">
        <div className="flex items-stretch">
          {navItems.map(n => {
            const isActive = view === n.key;
            const unseen = mainUnseenCounts[n.key] || 0;
            return (
              <button key={n.key} onClick={()=>switchView(n.key)}
                className={`flex-1 flex flex-col items-center justify-center py-1.5 min-h-[56px] relative transition-colors ${
                  isActive ? n.color + " font-semibold" : "text-slate-400"}`}>
                {/* Unseen badge */}
                {(unseen > 0 || unseen === -1) && !isActive && (
                  <span className={`absolute top-1 left-1/2 ml-2 min-w-[16px] h-[16px] rounded-full ${n.dot} text-white text-[9px] font-bold flex items-center justify-center px-0.5`}>
                    {unseen === -1 ? "" : (unseen > 99 ? "99+" : unseen)}
                  </span>
                )}
                <Ico d={n.icon} className={`w-5 h-5 ${isActive ? "nav-pop" : ""}`} />
                <span className="text-[10px] mt-0.5 leading-tight">{n.label}</span>
                {/* Active indicator dot */}
                {isActive && <span className={`absolute bottom-0.5 w-5 h-[3px] rounded-full ${n.bg}`} />}
              </button>
            );
          })}
        </div>
      </nav>

      {/* ===== DESKTOP TOP TABS (hidden on mobile, shown on sm+) ===== */}
      <div className="hidden sm:block fixed bottom-0 inset-x-0 z-40 pointer-events-none">
        {/* Empty — desktop uses the tabs in header area instead */}
      </div>
      {/* Desktop inline tab row — visible only on sm+ */}
      <div className="hidden sm:flex gap-1.5 max-w-3xl mx-auto px-4 mt-[-0.5rem] mb-3">
        {navItems.map(n => {
          const isActive = view === n.key;
          const unseen = mainUnseenCounts[n.key] || 0;
          const activeCls = {
            complaints:"bg-amber-500/15 border-amber-500/60 text-amber-800",
            notices:"bg-blue-500/15 border-blue-500/60 text-blue-800",
            machines:"bg-purple-500/15 border-purple-500/60 text-purple-800",
            users:"bg-rose-500/15 border-rose-500/60 text-rose-800",
          }[n.key] || "";
          return (
            <button key={n.key} onClick={()=>switchView(n.key)}
              className={`shrink-0 rounded-xl px-4 py-2 text-left transition-all border relative ${
                isActive ? activeCls : "bg-white border-slate-200 hover:border-slate-300 text-slate-600"}`}>
              {(unseen > 0 || unseen === -1) && !isActive && (
                <span className={`absolute -top-1 -right-1 min-w-[16px] h-[16px] rounded-full ${n.dot} text-white text-[9px] font-bold flex items-center justify-center px-0.5 shadow-sm`}>
                  {unseen === -1 ? "" : (unseen > 99 ? "99+" : unseen)}
                </span>
              )}
              <span className="block text-[13px] font-semibold leading-tight">{n.label}</span>
              <span className="block text-[11px] text-slate-500 leading-tight">{n.hi}</span>
            </button>
          );
        })}
        <Btn variant="primary" icon={I.plus} onClick={openNew} className="ml-auto shrink-0">{"New " + D.title}</Btn>
      </div>

      {showNew && (
        <NewComplaintModal profile={profile} machines={machines} processes={processes} D={D}
          fabricQualities={fabricQualities} lotCards={lotCards}
          toast={toast} onView={setLightbox}
          onClose={()=>setShowNew(false)}
          onSaved={()=>{ setShowNew(false); loadRows(false); loadMachines(); loadProcesses(); loadFabricMasters(); }} />
      )}
      {detail && (
        <ComplaintDetail complaint={detail} profile={profile} hosts={hosts} D={D} toast={toast} onView={setLightbox}
          onClose={()=>setDetail(null)} onSaved={()=>{ setDetail(null); loadRows(false); }} />
      )}
      {lightbox && <Lightbox src={lightbox} onClose={()=>setLightbox(null)} />}
      <Toasts items={toasts} dismiss={dismiss} />
    </div>
    </UnitsCtx.Provider>
  );
}

// ============================================================
// 15. MOUNT
// ============================================================
const boot = document.getElementById("boot");
if (boot) boot.remove();
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
