function UserFormModal({editing, onClose, onSaved, toast, callAdmin}){
  const isEdit = !!editing;
  const knownDept = editing?.department && DEPARTMENTS.includes(editing.department);
  const [f, setF] = useState({
    name: editing?.name || "", mobile: editing?.mobile || "",
    department: knownDept ? editing.department : (editing?.department ? "Other" : DEPARTMENTS[0]),
    department_other: (editing?.department && !knownDept) ? editing.department : "",
    designation: editing?.designation || "",
    dob: editing?.dob || "", role: editing?.role || "User",
    host_types: editing?.host_types || [],
  });
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const [result, setResult] = useState(null);
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const preview = useMemo(()=>({
    username: makeUsername(f.name),
    password: makePassword(f.mobile, f.dob),
  }),[f.name, f.mobile, f.dob]);

  const toggleType = (t) =>
    set("host_types", f.host_types.includes(t) ? f.host_types.filter(x=>x!==t) : [...f.host_types, t]);

  const save = async () => {
    const e = {};
    if (f.name.trim().length < 2) e.name = "Poora naam likhein.";
    if (!/^\d{10}$/.test(digits(f.mobile))) e.mobile = "Exactly 10 digit ka mobile number.";
    if (!f.designation.trim()) e.designation = "Designation likhein.";
    if (!/^\d{4}-\d{2}-\d{2}$/.test(f.dob)) e.dob = "Janm tithi chunein.";
    if (f.department === "Other" && !f.department_other.trim()) e.department_other = "Naya department ka naam likhein.";
    if (f.role === "Host" && f.host_types.length === 0) e.host_types = "Host ko kam se kam ek complaint type dein.";
    setErrs(e);
    if (Object.keys(e).length) return;

    const finalDept = f.department === "Other" ? f.department_other.trim() : f.department;
    setBusy(true);
    const payload = {
      action: isEdit ? "update" : "create",
      id: editing?.id,
      name: f.name.trim(), mobile: digits(f.mobile),
      department: finalDept, designation: f.designation.trim(),
      dob: f.dob, role: f.role,
      host_types: f.role === "Host" ? f.host_types : [],
    };
    const res = await callAdmin(payload);
    setBusy(false);
    if (!res.ok) return toast(res.error, true);
    setResult(res);       // show the credentials so the admin can hand them over
    onSaved();
  };

  if (result){
    return (
      <Modal title={isEdit ? "User updated" : "User created"} subtitle={f.name} onClose={onClose}
        footer={<Btn variant="primary" onClick={onClose}>Done</Btn>}>
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4">
          <p className="text-[13px] text-emerald-800 font-semibold mb-3">
            {isEdit && !result.password_changed ? "Details update ho gayi. Password wahi hai." : "Yeh login details user ko dein:"}
          </p>
          <div className="space-y-2.5 font-mono text-[13.5px]">
            <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Name</span><span className="text-slate-900 break-all">{f.name}</span></div>
            <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Password</span><span className="text-teal-700 break-all">{result.password}</span></div>
          </div>
          <Btn size="sm" variant="outline" className="mt-3.5"
            onClick={()=>{
              const text = `Sarv MIS login\nName: ${f.name}\nPassword: ${result.password}`;
              if (navigator.clipboard) navigator.clipboard.writeText(text).then(()=>toast("Copy ho gaya."), ()=>toast("Copy nahi hua.", true));
              else toast("Copy nahi hua.", true);
            }}>Copy details</Btn>
        </div>
        <p className="text-[11.5px] text-slate-500 mt-3 leading-relaxed">
          Password rule: mobile number, phir @, phir DDMMYYYY janm tithi.
          Mobile ya DOB badalne par password apne aap badal jata hai.
        </p>
      </Modal>
    );
  }

  return (
    <Modal title={isEdit ? "Edit user" : "Add new user"} subtitle={isEdit ? editing.name : "नया यूज़र जोड़ें"} onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy?<Spinner/>:null}{busy?"Saving…":(isEdit?"Save changes":"Create user")}</Btn>
      </>}>
      <div className="grid sm:grid-cols-2 gap-x-3">
        <Field label="Name" hindi="नाम" required error={errs.name}>
          <input className={inputCls(errs.name)} value={f.name} onChange={e=>set("name", e.target.value)} placeholder="Ramesh Kumar" />
        </Field>
        <Field label="Mobile" hindi="मोबाइल" required error={errs.mobile}>
          <input className={inputCls(errs.mobile)} value={f.mobile} inputMode="numeric" maxLength={14}
                 onChange={e=>set("mobile", e.target.value)} placeholder="9896011223" />
        </Field>
        <Field label="Department" hindi="विभाग" required>
          <select className={inputCls(false)} value={f.department} onChange={e=>set("department", e.target.value)}>
            {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
          </select>
        </Field>
        {f.department === "Other" && (
          <Field label="New department name" hindi="नया विभाग का नाम" required error={errs.department_other}>
            <input className={inputCls(errs.department_other)} value={f.department_other}
                   onChange={e=>set("department_other", e.target.value)} placeholder="e.g. QUALITY CHECK" />
          </Field>
        )}
        <Field label="Designation" hindi="पद" required error={errs.designation}>
          <input className={inputCls(errs.designation)} value={f.designation}
                 onChange={e=>set("designation", e.target.value)} placeholder="Machine Operator" />
        </Field>
        <Field label="Date of birth" hindi="जन्म तिथि" required error={errs.dob}>
          <input type="date" className={inputCls(errs.dob)} value={f.dob} max={todayStr()}
                 onChange={e=>set("dob", e.target.value)} />
        </Field>
        <Field label="Role" hindi="भूमिका" required>
          <select className={inputCls(false)} value={f.role} onChange={e=>set("role", e.target.value)}>
            {ROLES.map(r=><option key={r} value={r}>{r}</option>)}
          </select>
        </Field>
      </div>

      {f.role === "Host" && (
        /* Machine and fabric types are grouped but stored in ONE array
           (cmp_profiles.host_types), so one person can be the host for, say,
           Electrical and Width at the same time — common on a small floor
           where the same fitter covers both. */
        <Field label="Host for which complaint types" hindi="किन शिकायतों का होस्ट" required error={errs.host_types}
               hint="Host sirf inhi types ki complaints dekh payega. Machine aur Fabric dono chun sakte hain.">
          <div className="space-y-2.5">
            {HOST_TYPE_GROUPS.map(g=>(
              <div key={g.label}>
                <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">
                  {g.label} · {g.hi}
                </p>
                <div className="flex flex-wrap gap-2">
                  {g.types.map(t=>(
                    <button key={t} type="button" onClick={()=>toggleType(t)}
                      className={`rounded-full px-3 py-1.5 text-[12px] font-medium border transition-colors ${
                        f.host_types.includes(t)
                          ? (g.label === "Fabric"
                              ? "bg-blue-600 border-blue-600 text-white"
                              : "bg-teal-500 border-teal-500 text-slate-950")
                          : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
                      {t}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </Field>
      )}
      {f.role === "Maintenance" && (
        <p className="text-[12.5px] text-slate-500 rounded-lg bg-slate-100 px-3.5 py-2.5">
          Maintenance role sabhi hosts ki complaints dekh sakta hai.
        </p>
      )}
      {f.role === "Admin" && (
        <p className="text-[12.5px] text-amber-700 rounded-lg bg-amber-500/10 px-3.5 py-2.5">
          Admin ko poora access milega — sab complaints aur user management.
        </p>
      )}

      {/* Live credential preview — the rule made visible */}
      <div className="rounded-xl border border-slate-300 bg-slate-100 p-3.5 mt-2">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-2">Login banega</p>
        <div className="font-mono text-[13px] space-y-1.5">
          <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Name</span>
            <span className={preview.username ? "text-slate-800" : "text-slate-400"}>{preview.username || "—"}</span></div>
          <div className="flex gap-3"><span className="text-slate-500 w-20 shrink-0">Password</span>
            <span className={preview.password ? "text-teal-700" : "text-slate-400"}>{preview.password || "mobile@DDMMYYYY"}</span></div>
        </div>
      </div>
    </Modal>
  );
}

function AdminUsers({profile, toast, callAdmin}){
  const [users, setUsers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [q, setQ] = useState("");
  const [roleF, setRoleF] = useState("All");
  const [editing, setEditing] = useState(undefined);   // undefined = closed, null = new
  const [confirm, setConfirm] = useState(null);

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("cmp_profiles").select("*").order("role").order("name");
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setUsers(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  const shown = useMemo(()=>{
    const n = q.trim().toLowerCase();
    return users.filter(u => {
      if (roleF !== "All" && u.role !== roleF) return false;
      if (n && ![u.name,u.mobile,u.department,u.designation].join(" ").toLowerCase().includes(n)) return false;
      return true;
    });
  },[users,q,roleF]);

  const setActive = async (u, active) => {
    const res = await callAdmin({ action:"set_active", id:u.id, is_active:active });
    if (!res.ok) return toast(res.error, true);
    toast(`${u.name} ${active ? "active" : "deactivate"} ho gaya.`);
    load();
  };
  const doDelete = async (u) => {
    const res = await callAdmin({ action:"delete", id:u.id });
    setConfirm(null);
    if (!res.ok) return toast(res.error, true);
    toast(`${u.name} delete ho gaya.`);
    load();
  };

  const roleTone = r => r==="Admin"?"rose":r==="Maintenance"?"violet":r==="Host"?"teal":"slate";

  return (
    <div>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <div>
          <h2 className="font-bold text-[15px] sm:text-[17px]">User Management</h2>
          <p className="text-[11px] sm:text-[12.5px] text-slate-500">यूज़र प्रबंधन &mdash; admin only</p>
        </div>
        <Btn variant="primary" size="sm" icon={I.plus} className="ml-auto" onClick={()=>setEditing(null)}>Add user</Btn>
      </div>

function MachineFormModal({editing, onClose, onSaved, toast}){
  const isEdit = !!editing;
  const knownDept = editing?.department && DEPARTMENTS.includes(editing.department);
  const [f, setF] = useState({
    machine_name: editing?.machine_name || "",
    machine_no: editing?.machine_no || "",
    department: knownDept ? editing.department : (editing?.department ? "Other" : DEPARTMENTS[0]),
    department_other: (editing?.department && !knownDept) ? editing.department : "",
  });
  const [errs, setErrs] = useState({});
  const [busy, setBusy] = useState(false);
  const [showScan, setShowScan] = useState(false);
  const set = (k,v) => setF(s => ({...s, [k]:v}));

  const save = async () => {
    const e = {};
    if (!f.machine_name.trim()) e.machine_name = "Machine ka naam likhein.";
    if (!f.machine_no.trim()) e.machine_no = "Machine number likhein.";
    if (f.department === "Other" && !f.department_other.trim()) e.department_other = "Naya department ka naam likhein.";
    setErrs(e);
    if (Object.keys(e).length) return;

    const finalDept = f.department === "Other" ? f.department_other.trim() : f.department;
    setBusy(true);
    const row = { machine_name: f.machine_name.trim(), machine_no: f.machine_no.trim(), department: finalDept };
    const { error } = isEdit
      ? await sb.from("cmp_machine_list").update(row).eq("id", editing.id)
      : await sb.from("cmp_machine_list").insert(row);
    setBusy(false);
    if (error) return toast(friendlyError(error), true);
    toast(isEdit ? "Machine update ho gayi." : "Machine add ho gayi.");
    onSaved();
    onClose();
  };

  return (
    <Modal title={isEdit ? "Edit machine" : "Add new machine"} subtitle={isEdit ? editing.machine_no : "नई मशीन जोड़ें"} onClose={onClose}
      footer={<>
        <Btn variant="outline" onClick={onClose}>Cancel</Btn>
        <Btn variant="primary" onClick={save} disabled={busy}>{busy?<Spinner/>:null}{busy?"Saving…":(isEdit?"Save changes":"Add machine")}</Btn>
      </>}>
      <Field label="Machine name" hindi="मशीन का नाम" required error={errs.machine_name}>
        <input className={inputCls(errs.machine_name)} value={f.machine_name}
               onChange={e=>set("machine_name", e.target.value)} placeholder="Circular Knitting Machine" />
      </Field>
      <Field label="Machine no" hindi="मशीन नंबर · स्कैन / टाइप" required error={errs.machine_no}>
        <div className="flex gap-2">
          <input className={inputCls(errs.machine_no)+" flex-1"} value={f.machine_no}
                 onChange={e=>set("machine_no", e.target.value)} placeholder="KM-05" />
          <button type="button" onClick={()=>setShowScan(true)}
            className="shrink-0 w-10 h-10 rounded-lg bg-teal-500/10 text-teal-600 hover:bg-teal-500/20 transition grid place-items-center"
            title="Barcode scan karein">
            <Ico d={I.scan} className="w-5 h-5" />
          </button>
        </div>
      </Field>
      {showScan && <BarcodeScannerModal onResult={(code)=>{ setShowScan(false); set("machine_no", code.trim()); }} onClose={()=>setShowScan(false)} />}
      <Field label="Department" hindi="विभाग" required>
        <select className={inputCls(false)} value={f.department} onChange={e=>set("department", e.target.value)}>
          {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
      </Field>
      {f.department === "Other" && (
        <Field label="New department name" hindi="नया विभाग का नाम" required error={errs.department_other}>
          <input className={inputCls(errs.department_other)} value={f.department_other}
                 onChange={e=>set("department_other", e.target.value)} placeholder="e.g. QUALITY CHECK" />
        </Field>
      )}
    </Modal>
  );
}

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("cmp_machine_list").select("*")

          <input className={inputCls(false)+" pl-9 text-[14px]"} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search machine, no, department…" />

function NoticeAttachment({post, onView}){
  if (!post.attachment_data) return null;
  if ((post.attachment_mime||"").startsWith("image/")) {
    return (
      <img src={post.attachment_data} alt="Notice attachment" onClick={()=>onView(post.attachment_data)}
        className="mt-2.5 w-28 h-28 rounded-lg object-cover border border-slate-300 cursor-zoom-in" />
    );
  }
  if (post.attachment_mime === "application/pdf") {
    return (
      <a href={post.attachment_data} download={post.attachment_name || "notice.pdf"} target="_blank" rel="noreferrer"
        className="mt-2.5 inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-[12.5px] text-slate-700 hover:border-slate-400 max-w-full">
        <Ico d={I.doc} className="w-4 h-4 text-rose-500 shrink-0" /><span className="truncate">{post.attachment_name || "Attachment.pdf"}</span>
      </a>
    );
  }
  return null;
}

function NoticeComposer({profile, users, toast}){
  const isAdmin = profile.role === "Admin";
  const [msg, setMsg] = useState("");
  const [att, setAtt] = useState(null);   // {data, mime, name}
  const [imgBusy, setImgBusy] = useState(false);
  const [busy, setBusy] = useState(false);
  const [audience, setAudience] = useState("all");   // "all" | "selected"
  const [picked, setPicked] = useState([]);          // user ids
  const imgRef = useRef(null), pdfRef = useRef(null);

  const togglePick = (id) => setPicked(p => p.includes(id) ? p.filter(x=>x!==id) : [...p, id]);

  const pickImage = async (file) => {
    if (!file) return;
    setImgBusy(true);
    try { const d = await compressImage(file); setAtt({data:d, mime:"image/jpeg", name:null}); }
    catch(e){ toast(e.message, true); }
    finally { setImgBusy(false); if (imgRef.current) imgRef.current.value = ""; }
  };
  const pickPdf = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { toast("Sirf PDF file allowed hai.", true); return; }
    if (file.size > NB_MAX_PDF_BYTES) { toast("PDF 3 MB se badi hai. Chhoti file lagayein.", true); return; }
    const reader = new FileReader();
    reader.onerror = () => toast("PDF padh nahi paaye.", true);
    reader.onload = () => setAtt({data:reader.result, mime:"application/pdf", name:file.name});
    reader.readAsDataURL(file);
    if (pdfRef.current) pdfRef.current.value = "";
  };

  const post = async () => {
    if (!msg.trim() && !att) return toast("Kuch likhein ya photo/PDF lagayein.", true);
    if (isAdmin && audience === "selected" && picked.length === 0)
      return toast("Kam se kam ek user select karein, ya \"Sabko\" chunein.", true);
    setBusy(true);
    const { error } = await sb.from("cmp_notice_board").insert({
      message: msg.trim() || null,
      attachment_data: att?.data || null,
      attachment_mime: att?.mime || null,
      attachment_name: att?.name || null,
      recipient_ids: (isAdmin && audience === "selected") ? picked : null,
    });
    setBusy(false);
    if (error) return toast(friendlyError(error), true);
    setMsg(""); setAtt(null); setAudience("all"); setPicked([]);
    // No manual refresh — the Realtime INSERT event appends it for everyone the DB lets see it.
  };

  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-3.5 mb-4">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-full bg-teal-500/15 text-teal-700 grid place-items-center font-bold text-sm shrink-0">
          {profile.name.slice(0,1).toUpperCase()}
        </div>
        <textarea className={inputCls(false)+" min-h-[54px] resize-y"} value={msg}
          onChange={e=>setMsg(e.target.value)} placeholder="Notice board par kuch likhein… सूचना यहाँ लिखें" />
      </div>
      {att && (
        <div className="mt-2.5 ml-12">
          {att.mime === "application/pdf" ? (
            <div className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-slate-50 px-3 py-2 text-[12.5px]">
              <Ico d={I.doc} className="w-4 h-4 text-rose-500" /><span className="truncate max-w-[180px]">{att.name}</span>
              <button type="button" onClick={()=>setAtt(null)} className="ml-1 text-slate-400 hover:text-slate-700">
                <Ico d={I.x} className="w-3.5 h-3.5"/>
              </button>
            </div>
          ) : (
            <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-slate-100">
              <img src={att.data} className="w-full h-full object-cover" alt="Attachment preview" />
              <button type="button" onClick={()=>setAtt(null)}
                className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
                <Ico d={I.x} className="w-3 h-3"/>
              </button>
            </div>
          )}
        </div>
      )}

      {isAdmin && (
        <div className="ml-12 mt-2.5">
          <div className="flex items-center gap-1.5 mb-2">
            <button type="button" onClick={()=>setAudience("all")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="all" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Sabko
            </button>
            <button type="button" onClick={()=>setAudience("selected")}
              className={`rounded-full px-3 py-1 text-[11.5px] font-medium border ${
                audience==="selected" ? "bg-teal-500 border-teal-500 text-slate-950" : "bg-white border-slate-300 text-slate-500 hover:border-slate-400"}`}>
              Specific users{picked.length>0 ? ` (${picked.length})` : ""}
            </button>
          </div>
          {audience === "selected" && (
            <div className="rounded-lg border border-slate-200 bg-slate-50 max-h-40 overflow-y-auto p-1.5 mb-1">
              {users.length === 0 ? (
                <p className="text-[12px] text-slate-500 px-2 py-1.5">Koi user nahi mila.</p>
              ) : users.map(u => (
                <label key={u.id} className="flex items-center gap-2 px-2 py-1.5 rounded-md hover:bg-white cursor-pointer text-[12.5px]">
                  <input type="checkbox" checked={picked.includes(u.id)} onChange={()=>togglePick(u.id)} className="accent-teal-500" />
                  <span className="truncate">{u.name}</span>
                  <span className="text-slate-400 truncate ml-auto text-[11px]">{u.department}</span>
                </label>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="flex items-center gap-2 mt-2.5 ml-12 flex-wrap">
        <Btn size="sm" variant="outline" icon={I.camera} type="button" disabled={!!att || imgBusy} onClick={()=>imgRef.current?.click()}>
          {imgBusy ? "Adding…" : "Photo"}
        </Btn>
        <Btn size="sm" variant="outline" icon={I.doc} type="button" disabled={!!att} onClick={()=>pdfRef.current?.click()}>PDF</Btn>
        <input ref={imgRef} type="file" accept="image/*" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
        <input ref={pdfRef} type="file" accept="application/pdf" className="hidden" onChange={e=>pickPdf(e.target.files?.[0])} />
        <Btn size="sm" variant="primary" icon={I.send} className="ml-auto" onClick={post} disabled={busy}>
          {busy ? <Spinner/> : null}Post
        </Btn>
      </div>
    </div>
  );
}

function NoticeCard({post, profile, users, toast, onView}){
  const isAdmin = profile.role === "Admin";
  const isOwner = post.created_by === profile.id;
  const recipientNames = useMemo(()=>{
    if (!post.recipient_ids?.length) return null;
    const byId = Object.fromEntries(users.map(u=>[u.id,u.name]));
    return post.recipient_ids.map(id => byId[id] || "…").join(", ");
  },[post.recipient_ids, users]);
  const [busy, setBusy] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);

  const setStatus = async (status) => {
    setBusy(true);
    const { error } = await sb.from("cmp_notice_board").update({status}).eq("id", post.id);
    setBusy(false);
    if (error) toast(friendlyError(error), true);
  };
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from("cmp_notice_board").delete().eq("id", post.id);
    setDelBusy(false); setConfirmDel(false);
    if (error) toast(friendlyError(error), true);
  };

  const canDelete = isAdmin || (isOwner && post.status === "Open");
  const roleTone = r => r==="Admin"?"rose":r==="Maintenance"?"violet":r==="Host"?"teal":"slate";

  return (
    <div className="rounded-xl border border-slate-200 bg-white shadow-sm p-3.5">
      <div className="flex items-start gap-3">
        <div className="w-9 h-9 rounded-full bg-slate-100 text-slate-700 grid place-items-center font-bold text-sm shrink-0">
          {post.created_by_name.slice(0,1).toUpperCase()}
        </div>
        <div className="min-w-0 grow">

function NoticeBoard({profile, toast, onView}){
  const [posts, setPosts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [users, setUsers] = useState([]);   // for the Admin's "specific users" picker + name badges

  const load = useCallback(async ()=>{
    setLoading(true);
    const { data, error } = await sb.from("cmp_notice_board").select("*").order("created_at", {ascending:false});
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setPosts(data || []);
  },[toast]);
  useEffect(()=>{ load(); },[load]);

  useEffect(()=>{
    if (profile.role !== "Admin") return;   // only Admin can target — no need elsewhere
    sb.from("cmp_profiles").select("id,name,department").eq("is_active", true).order("name")
      .then(({data}) => setUsers(data || []));
  },[profile.role]);

  // Live updates for everyone looking at the board — no polling, no manual refresh.
  useEffect(()=>{
    const channel = sb.channel("notice_board_live")
      .on("postgres_changes", {event:"*", schema:"public", table:"cmp_notice_board"}, payload => {
        setPosts(prev => {
          if (payload.eventType === "INSERT"){
            if (prev.some(p=>p.id===payload.new.id)) return prev;
            return [payload.new, ...prev];
          }
          if (payload.eventType === "UPDATE") return prev.map(p => p.id===payload.new.id ? payload.new : p);
          if (payload.eventType === "DELETE") return prev.filter(p => p.id !== payload.old.id);
          return prev;
        });
      })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[]);

  return (
    <div>
      <div className="mb-3">
        <h2 className="font-bold text-[15px] sm:text-[17px]">Notice Board</h2>
        <p className="text-[11px] sm:text-[12.5px] text-slate-500">सूचना पट्ट &mdash; real-time{profile.role==="Admin" ? " · Admin sabko bhej sakta hai" : ""}</p>

        <div className="space-y-3">
          {Array.from({length:3}).map((_,i)=>(
            <div key={i} className="rounded-xl border border-slate-200 bg-white p-3.5">
              <div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} />
            </div>
          ))}
        </div>

        <div className="rounded-xl border border-slate-200 bg-slate-50 px-5 py-16 text-center">
          <Ico d={I.doc} className="w-9 h-9 mx-auto text-slate-300 mb-3" />
          <p className="font-semibold text-slate-700">Abhi koi notice nahi</p>
          <p className="text-[13px] text-slate-500 mt-1">Sabse pehle aap likhein.</p>

  );
}

// ============================================================
// 12C. TASKS — Admin delegates with a planned date, the doer confirms it,
//      Admin can revise the date up to 3 times, completion needs proof.
// ============================================================
const TASK_STAGES = [
  { key:"Pending Confirmation", label:"Awaiting confirmation", hi:"पुष्टि बाकी" },
  { key:"Assigned",             label:"Assigned",              hi:"सौंपा गया" },
  { key:"Completed",            label:"Completed",             hi:"पूरा हुआ" },
];

// Yellow while on track, red once the planned date has passed — only meaningful
// once a task is actually Assigned (confirmed); Pending/Completed aren't "due".
function taskUrgency(t){
  if (t.status !== "Assigned") return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const pd = new Date(t.planned_date + "T00:00:00");
  const diffDays = Math.round((pd - today) / 86400000);
  if (diffDays < 0) return { tone:"rose",  border:"#f43f5e", label:`${-diffDays} din late` };
  if (diffDays === 0) return { tone:"amber", border:"#f59e0b", label:"Aaj" };
  if (diffDays === 1) return { tone:"amber", border:"#f59e0b", label:"Kal" };
  return { tone:"amber", border:"#f59e0b", label:`${diffDays} din baad` };
}
function TaskStatusBadge({t}){
  if (t.status === "Pending Confirmation") return <Badge tone="violet">Awaiting confirmation</Badge>;
  if (t.status === "Completed") return <Badge tone="emerald">Completed</Badge>;
  const u = taskUrgency(t);
  return <Badge tone={u.tone}>{u.tone==="rose" ? `Overdue · ${u.label}` : `On track · ${u.label}`}</Badge>;
}

// Shared single-attachment picker (image from camera OR gallery, OR one PDF) — used for
// task completion proof. Mirrors the Notice Board attachment pattern.
function ProofPicker({att, setAtt, toast}){
  const [imgBusy, setImgBusy] = useState(false);
  const camRef = useRef(null), galRef = useRef(null), pdfRef = useRef(null);

  const pickImage = async (file) => {
    if (!file) return;
    setImgBusy(true);
    try { const d = await compressImage(file); setAtt({data:d, mime:"image/jpeg", name:null}); }
    catch(e){ toast(e.message, true); }
    finally { setImgBusy(false); if (camRef.current) camRef.current.value = ""; if (galRef.current) galRef.current.value = ""; }
  };
  const pickPdf = (file) => {
    if (!file) return;
    if (file.type !== "application/pdf") { toast("Sirf PDF file allowed hai.", true); return; }
    if (file.size > NB_MAX_PDF_BYTES) { toast("PDF 3 MB se badi hai.", true); return; }
    const reader = new FileReader();
    reader.onerror = () => toast("PDF padh nahi paaye.", true);
    reader.onload = () => setAtt({data:reader.result, mime:"application/pdf", name:file.name});
    reader.readAsDataURL(file);
    if (pdfRef.current) pdfRef.current.value = "";
  };

  return (
    <div className="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-3">
      {!att ? (
        <div className="flex gap-2 flex-wrap">
          <Btn size="sm" variant="outline" icon={I.camera} type="button" disabled={imgBusy} onClick={()=>camRef.current?.click()}>
            {imgBusy ? "Adding…" : "Camera"}
          </Btn>
          <Btn size="sm" variant="outline" icon={I.image} type="button" disabled={imgBusy} onClick={()=>galRef.current?.click()}>
            Gallery
          </Btn>
          <Btn size="sm" variant="outline" icon={I.doc} type="button" onClick={()=>pdfRef.current?.click()}>PDF</Btn>
        </div>
      ) : att.mime === "application/pdf" ? (
        <div className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-[12.5px]">
          <Ico d={I.doc} className="w-4 h-4 text-rose-500" /><span className="truncate max-w-[200px]">{att.name}</span>
          <button type="button" onClick={()=>setAtt(null)} className="ml-1 text-slate-400 hover:text-slate-700"><Ico d={I.x} className="w-3.5 h-3.5"/></button>
        </div>
      ) : (
        <div className="relative w-20 h-20 rounded-lg overflow-hidden border border-slate-300 bg-white">
          <img src={att.data} className="w-full h-full object-cover" alt="Proof preview" />
          <button type="button" onClick={()=>setAtt(null)}
            className="absolute top-1 right-1 w-5 h-5 rounded-full bg-slate-900/70 text-white flex items-center justify-center">
            <Ico d={I.x} className="w-3 h-3"/>
          </button>
        </div>
      )}
      {/* Camera input: capture="environment" opens rear camera directly */}
      <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
      {/* Gallery input: NO capture attr → opens gallery / file picker */}
      <input ref={galRef} type="file" accept="image/*" className="hidden" onChange={e=>pickImage(e.target.files?.[0])} />
      <input ref={pdfRef} type="file" accept="application/pdf" className="hidden" onChange={e=>pickPdf(e.target.files?.[0])} />
      <p className="text-[11px] text-slate-500 mt-2.5">Camera se photo lo ya Gallery se pehle ki photo chunein. PDF bhi laga sakte hain.</p>
    </div>
  );
}

// Ring Alarm section with delivery status (online/offline, push sent, ring received)
function RingAlarmSection({t, ringMsg, setRingMsg, ringAlarm, ringBusy, ringSent}){
  const [doerStatus, setDoerStatus] = useState(null); // {online, lastSeen}
  const [reminders, setReminders] = useState([]);

  // Fetch doer's last_online_at + recent reminders for this task
  useEffect(()=>{
    let alive = true;
    (async()=>{
      const [profRes, remRes] = await Promise.all([
        sb.from("cmp_profiles").select("last_online_at").eq("id", t.assigned_to).maybeSingle(),
        sb.from("cmp_task_reminders").select("id,sent_at,acknowledged_at,received_at").eq("task_id", t.id).order("sent_at",{ascending:false}).limit(5),
      ]);
      if (!alive) return;
      if (profRes.data){
        const last = profRes.data.last_online_at;
        const online = last && (Date.now() - new Date(last).getTime()) < 90000; // 90s threshold
        setDoerStatus({online, lastSeen: last});
      }
      if (remRes.data) setReminders(remRes.data);
    })();
    return ()=>{ alive = false; };
  },[t.id, t.assigned_to, ringSent]); // re-fetch after sending ring

  // Live-update reminders when received_at or acknowledged_at changes
  useEffect(()=>{
    const ch = sb.channel(`ring_status_${t.id}`)
      .on("postgres_changes", {event:"UPDATE", schema:"public", table:"cmp_task_reminders", filter:`task_id=eq.${t.id}`},
        payload => { setReminders(prev => prev.map(r => r.id===payload.new.id ? {...r, ...payload.new} : r)); })
      .subscribe();
    return ()=>{ sb.removeChannel(ch); };
  },[t.id]);

  const fmtAgo = (iso) => {
    if (!iso) return "—";
    const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (sec < 60) return "abhi abhi";
    if (sec < 3600) return Math.floor(sec/60) + " min pehle";
    if (sec < 86400) return Math.floor(sec/3600) + " hrs pehle";
    return Math.floor(sec/86400) + " din pehle";
  };

  return (
    <div className="rounded-xl border border-amber-500/30 bg-amber-500/5 p-4 mb-4">
      <p className="text-[11px] uppercase tracking-wide text-amber-700 font-semibold mb-2 flex items-center gap-1.5">
        <Ico d={I.bell} className="w-3.5 h-3.5" /> Ring alarm — doer ke device par
      </p>

      {/* Doer status indicator */}
      <div className="flex items-center gap-3 mb-3 flex-wrap">
        <div className="flex items-center gap-1.5">
          <span className={`w-2.5 h-2.5 rounded-full ${doerStatus?.online ? "bg-emerald-500 animate-pulse" : "bg-slate-400"}`} />
          <span className="text-[12.5px] font-medium text-slate-700">
            {t.assigned_to_name}: {doerStatus?.online ? "Online" : "Offline"}
          </span>
        </div>
        {doerStatus && !doerStatus.online && doerStatus.lastSeen && (
          <span className="text-[11px] text-slate-500">Last seen: {fmtAgo(doerStatus.lastSeen)}</span>
        )}
      </div>

      <p className="text-[12px] text-slate-500 mb-2.5">
        Ring bhejne par — in-app alarm + push notification dono jaayenge. Browser band ho tab bhi push notification aayega.
      </p>

      <div className="flex items-center gap-2 flex-wrap mb-3">
        <input className={inputCls(false)+" flex-1 min-w-[160px]"} value={ringMsg}
               onChange={e=>setRingMsg(e.target.value)} placeholder="Message (optional)…" />
        <Btn size="sm" variant="primary" icon={I.bell} onClick={ringAlarm} disabled={ringBusy}>
          {ringBusy?<Spinner/>:null}{ringSent ? "Bhej diya" : "Ring alarm"}
        </Btn>
      </div>

      {/* Recent ring delivery status */}
      {reminders.length > 0 && (
        <div className="space-y-1.5">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500">Recent rings — delivery status</p>
          {reminders.map(r => (
            <div key={r.id} className="flex items-center gap-2 text-[12px] bg-white/60 rounded-lg px-3 py-1.5 flex-wrap">
              <span className="text-slate-500 shrink-0">{fmtDateTime(r.sent_at)}</span>
              <span className="flex items-center gap-1">
                <Ico d={I.send} className="w-3 h-3 text-slate-400" />
                <span className="text-slate-600">Sent</span>
              </span>
              {r.received_at ? (
                <span className="flex items-center gap-1 text-emerald-700">
                  <Ico d={I.wifi} className="w-3 h-3" />
                  <span>Device pe mila</span>
                </span>
              ) : (
                <span className="flex items-center gap-1 text-slate-400">
                  <Ico d={I.wifiOff} className="w-3 h-3" />
                  <span>Device pe abhi nahi mila</span>
                </span>
              )}
              {r.acknowledged_at ? (
                <span className="flex items-center gap-1 text-teal-700 font-semibold">
                  <Ico d={I.check} className="w-3 h-3" />
                  <span>Dekh liya</span>
                </span>
              ) : (
                <span className="flex items-center gap-1 text-amber-600">
                  <Ico d={I.clock} className="w-3 h-3" />
                  <span>Pending</span>
                </span>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TaskDetailModal({task, profile, doers, onClose, onSaved, toast}){
  const t = task;
  const isAdmin = profile.role === "Admin";
  const isDoer = t.assigned_to === profile.id;
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [newDate, setNewDate] = useState(t.planned_date);
  const [dateRemark, setDateRemark] = useState("");
  const [doerMode, setDoerMode] = useState(null); // null | "confirm" | "change"
  const [doerRemark, setDoerRemark] = useState("");
  const [note, setNote] = useState("");
  const [proof, setProof] = useState(null);
  const [confirmDel, setConfirmDel] = useState(false);
  const [delBusy, setDelBusy] = useState(false);
  const [ringMsg, setRingMsg] = useState("");
  const [ringBusy, setRingBusy] = useState(false);
  const [ringSent, setRingSent] = useState(false);

  const run = async (patch, msg) => {
    setBusy(true); setErr("");
    const { error } = await sb.from("cmp_tasks").update(patch).eq("id", t.id);
    setBusy(false);
    if (error){ setErr(friendlyError(error)); return; }
    toast(msg); onSaved(); onClose();
  };

  const updateDate = () => {
    if (!newDate) return setErr("Date chunein.");
    if (newDate === t.planned_date) return onClose();
    run({ planned_date:newDate, date_remarks: dateRemark.trim() || null },
      t.status === "Pending Confirmation" ? "Planned date update ho gayi." : `Planned date revise ho gayi (${t.revision_count+1}/3).`);
  };
  const confirmDate = () => run({ status:"Assigned", doer_remarks: doerRemark.trim() || null }, "Task confirm ho gayi — ab yeh assigned hai.");
  const requestChange = () => {
    if (!doerRemark.trim()) return setErr("Date change ki wajah likhein.");
    run({ doer_remarks: doerRemark.trim() }, "Admin ko date change ki request bhej di.");
  };
  const markDone = () => {
    if (!proof) return setErr("Photo ya document lagana zaroori hai.");
    run({ status:"Completed", proof_data:proof.data, proof_mime:proof.mime, proof_name:proof.name, completion_note: note.trim() || null },
      `Task complete mark ho gayi.`);
  };
  const doDelete = async () => {
    setDelBusy(true);
    const { error } = await sb.from("cmp_tasks").delete().eq("id", t.id);
    setDelBusy(false); setConfirmDel(false);
    if (error) return toast(friendlyError(error), true);
    toast("Task delete ho gayi."); onSaved(); onClose();
  };
  const ringAlarm = async () => {
    setRingBusy(true); setErr("");
    const { error } = await sb.from("cmp_task_reminders").insert({ task_id: t.id, message: ringMsg.trim() || null });
    setRingBusy(false);
    if (error) return setErr(friendlyError(error));
    // Also fire server-side Web Push (background notification even if browser is closed)
    sendPushToUser(t.assigned_to, t.task_desc, ringMsg.trim() || null);
    setRingMsg(""); setRingSent(true);
    toast("Reminder bhej diya + Push notification bhi.");
    setTimeout(()=>setRingSent(false), 4000);
  };

  const Row = ({k, v}) => (
    <div className="min-w-0"><p className="text-[10.5px] uppercase tracking-wide text-slate-500">{k}</p><p className="text-[13.5px] text-slate-800 break-words">{v}</p></div>
  );

  return (
    <Modal title="Task" subtitle={`${t.assigned_to_name} · ${fmtDate(t.planned_date)}`} onClose={onClose}
      footer={<>
        {isAdmin && <Btn variant="danger" icon={I.trash} className="mr-auto" onClick={()=>setConfirmDel(true)} disabled={busy}>Delete</Btn>}
        <Btn variant="outline" onClick={onClose}>Close</Btn>
      </>}>
      <div className="flex items-center gap-2 flex-wrap mb-4">
        <TaskStatusBadge t={t} />
        {t.first_planned_date !== t.planned_date && <Badge tone="slate">First date: {fmtDate(t.first_planned_date)}</Badge>}
        {t.date_change_requested && <Badge tone="amber">Doer ne date change maangi hai</Badge>}
      </div>

      <div className="grid grid-cols-2 gap-4 mb-4">
        <Row k="Doer" v={<>{t.assigned_to_name}<br/><span className="text-slate-500 font-mono text-[12px]">{t.assigned_to_mobile}</span></>} />
        <Row k="Assigned by" v={t.assigned_by_name} />
      </div>

      <div className="mb-4">
        <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Task / विवरण</p>
        <p className="rounded-lg bg-slate-100 px-3.5 py-3 text-[13.5px] whitespace-pre-wrap leading-relaxed">{t.task_desc}</p>
      </div>

      {t.revision_history?.length > 0 && (
        <div className="mb-4">
          <p className="text-[10.5px] uppercase tracking-wide text-slate-500 mb-1.5">Revision history</p>
          <div className="rounded-xl border border-slate-200 divide-y divide-slate-200">
            {t.revision_history.map((r,i)=>(
              <div key={i} className="px-3.5 py-2 text-[12.5px]">
                <div className="flex items-center gap-2.5 flex-wrap">
                  {r.event === "confirmed" ? (
                    <><Ico d={I.check} className="w-3.5 h-3.5 text-emerald-500 shrink-0" />
                      <span className="text-slate-700 font-semibold">Confirmed {fmtDate(r.date)}</span></>
                  ) : r.event === "change_requested" ? (
                    <><Ico d={I.alert} className="w-3.5 h-3.5 text-amber-500 shrink-0" />
                      <span className="text-slate-700 font-semibold">Date change maangi (tha {fmtDate(r.date)})</span></>
                  ) : (
                    <><Ico d={I.refresh} className="w-3.5 h-3.5 text-slate-400 shrink-0" />
                      <span className="text-slate-500">{fmtDate(r.old_date)} → <span className="text-slate-800 font-semibold">{fmtDate(r.new_date)}</span></span>
                      {r.stage === "Pending Confirmation" && <Badge tone="slate">Pre-confirm</Badge>}</>
                  )}
                  <span className="ml-auto text-slate-400 shrink-0">{r.revised_by} · {fmtDateTime(r.revised_at)}</span>
                </div>
                {r.remarks ? <p className="text-slate-600 mt-1 pl-6 whitespace-pre-wrap">"{r.remarks}"</p> : null}
              </div>
            ))}
          </div>
        </div>
      )}

      {isAdmin && t.status !== "Completed" && (
        <RingAlarmSection t={t} ringMsg={ringMsg} setRingMsg={setRingMsg} ringAlarm={ringAlarm} ringBusy={ringBusy} ringSent={ringSent} />
      )}

      {t.status === "Completed" && (
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4 mb-4">
          <p className="text-[11px] uppercase tracking-wide text-emerald-700 font-semibold mb-2">Completed · {fmtDateTime(t.completed_at)}</p>
          {t.completion_note ? <p className="text-[13px] text-slate-700 whitespace-pre-wrap mb-2">{t.completion_note}</p> : null}
          {t.proof_mime === "application/pdf" ? (
            <a href={t.proof_data} download={t.proof_name || "proof.pdf"} target="_blank" rel="noreferrer"
              className="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-[12.5px] text-slate-700 hover:border-slate-400">
              <Ico d={I.doc} className="w-4 h-4 text-rose-500" />{t.proof_name || "Proof.pdf"}
            </a>
          ) : (
            <img src={t.proof_data} alt="Completion proof" className="w-28 h-28 rounded-lg object-cover border border-slate-300" />
          )}
        </div>
      )}

      {/* ---------- ADMIN: free edit before confirmation / capped revision after ---------- */}
      {isAdmin && t.status !== "Completed" && (
        <div className="rounded-xl border border-teal-500/30 bg-teal-500/5 p-4 mb-4">
          <p className="text-[11px] uppercase tracking-wide text-teal-700 font-semibold mb-3">
            {t.status === "Pending Confirmation" ? "Planned date badlein (confirm hone tak free)" : `Planned date revise karein (${t.revision_count}/3 used)`}
          </p>
          {t.status === "Assigned" && t.revision_count >= 3 ? (
            <p className="text-[13px] text-rose-600">Revision limit (3/3) khatam ho chuki hai — ab date badal nahi sakte.</p>
          ) : (
            <>
              <div className="flex items-center gap-2 flex-wrap mb-2.5">
                <input type="date" className={inputCls(false)+" w-auto"} value={newDate} min={todayStr()} onChange={e=>setNewDate(e.target.value)} />
                <Btn size="sm" variant="primary" onClick={updateDate} disabled={busy}>{busy?<Spinner/>:null}Save date</Btn>
              </div>
              <textarea className={inputCls(false)+" min-h-[52px] resize-y"} value={dateRemark}
                        onChange={e=>setDateRemark(e.target.value)} placeholder="Date badalne ki wajah (optional) — remarks…" />
            </>
          )}
        </div>
      )}

      {/* ---------- DOER: confirm the date, or ask admin to change it ---------- */}
      {isDoer && t.status === "Pending Confirmation" && (
        <div className="rounded-xl border border-violet-500/30 bg-violet-500/5 p-4 mb-4">
          <p className="text-[13px] font-semibold text-violet-800 mb-1">Is planned date ko confirm karein?</p>
          <p className="text-[12.5px] text-slate-500 mb-3">Confirm karne ke baad hi yeh task aapko assign maani jayegi.</p>

          {doerMode === null && (
            <div className="flex items-center gap-2 flex-wrap">
              <Btn variant="ok" icon={I.check} onClick={()=>setDoerMode("confirm")}>Confirm {fmtDate(t.planned_date)}</Btn>
              <Btn variant="outline" icon={I.calendar} onClick={()=>setDoerMode("change")}>Date change chahiye</Btn>
            </div>
          )}

          {doerMode === "confirm" && (
            <>
              <textarea className={inputCls(false)+" min-h-[52px] resize-y mb-2.5"} value={doerRemark}
                        onChange={e=>setDoerRemark(e.target.value)} placeholder="Remark (optional)…" />
              <div className="flex items-center gap-2 flex-wrap">
                <Btn variant="ok" icon={I.check} onClick={confirmDate} disabled={busy}>{busy?<Spinner/>:null}Confirm {fmtDate(t.planned_date)}</Btn>
                <Btn variant="outline" onClick={()=>{setDoerMode(null); setDoerRemark("");}} disabled={busy}>Wapas</Btn>
              </div>
            </>
          )}

          {doerMode === "change" && (
            <>
              <p className="text-[12px] text-slate-500 mb-2">Date aap khud nahi badal sakte — Admin ko wajah bata dein, wahi date revise karega.</p>
              <textarea className={inputCls(false)+" min-h-[52px] resize-y mb-2.5"} value={doerRemark}
                        onChange={e=>setDoerRemark(e.target.value)} placeholder="Date change ki wajah likhein… (zaroori)" />
              <div className="flex items-center gap-2 flex-wrap">
                <Btn variant="primary" icon={I.alert} onClick={requestChange} disabled={busy}>{busy?<Spinner/>:null}Request bhejein</Btn>
                <Btn variant="outline" onClick={()=>{setDoerMode(null); setDoerRemark("");}} disabled={busy}>Wapas</Btn>
              </div>
            </>
          )}
        </div>
      )}

      {/* ---------- DOER: mark complete with mandatory proof ---------- */}
      {isDoer && t.status === "Assigned" && (
        <div className="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-4 mb-4">
          <p className="text-[11px] uppercase tracking-wide text-emerald-700 font-semibold mb-3">Task complete karein</p>
          <Field label="Proof" hindi="फोटो / दस्तावेज़" required>
            <ProofPicker att={proof} setAtt={setProof} toast={toast} />
          </Field>
          <Field label="Note" hindi="टिप्पणी (optional)">
            <textarea className={inputCls(false)+" min-h-[64px] resize-y"} value={note}
                      onChange={e=>setNote(e.target.value)} placeholder="Kya kiya gaya…" />
          </Field>
          <Btn variant="ok" icon={I.check} onClick={markDone} disabled={busy}>{busy?<Spinner/>:null}Mark complete</Btn>
        </div>
      )}

      {err ? (
        <div className="flex items-start gap-2 rounded-lg bg-rose-500/10 text-rose-700 px-3 py-2.5 text-[13px]">
          <Ico d={I.alert} className="w-4 h-4 mt-0.5 shrink-0" /><span>{err}</span>
        </div>
      ) : null}

      {confirmDel && (
        <div className="fixed inset-0 z-[70] bg-slate-900/40 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4"
             onMouseDown={e=>{ if(e.target===e.currentTarget && !delBusy) setConfirmDel(false); }}>
          <div className="bg-white border border-slate-200 w-full sm:max-w-sm rounded-t-2xl sm:rounded-2xl shadow-2xl">
            <div className="px-5 py-4 border-b border-slate-200"><h3 className="font-semibold text-[15px]">Delete this task?</h3></div>
            <div className="px-5 py-4"><p className="text-[13.5px] text-slate-700">Yeh task hamesha ke liye hat jayegi.</p></div>
            <div className="px-5 py-3.5 border-t border-slate-200 flex gap-2 justify-end">
              <Btn variant="outline" onClick={()=>setConfirmDel(false)} disabled={delBusy}>Cancel</Btn>
              <Btn variant="danger" onClick={doDelete} disabled={delBusy}>{delBusy?<Spinner/>:null}Delete</Btn>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

// Both the Admin's full board and everyone's "My Tasks" view share this list
// engine — realtime-subscribed, filterable, tabbed by stage.
function TaskList({profile, doers, scope, toast, tabSeenMap, onTabSeenRefresh}){
  const [tasks, setTasks] = useState([]);
  const [loading, setLoading] = useState(true);
  const [stage, setStage] = useState("Assigned");
  const [q, setQ] = useState("");
  const [doerF, setDoerF] = useState("All");
  const [openTask, setOpenTask] = useState(null);
  const [showNew, setShowNew] = useState(false);

  const load = useCallback(async ()=>{
    setLoading(true);
    let query = sb.from("cmp_tasks").select("*").order("created_at", {ascending:false});
    if (scope === "mine") query = query.eq("assigned_to", profile.id);
    const { data, error } = await query;
    setLoading(false);
    if (error) return toast(friendlyError(error), true);
    setTasks(data || []);
  },[toast, scope, profile.id]);
  useEffect(()=>{ load(); },[load]);

  useEffect(()=>{
    const channel = sb.channel(`tasks_live_${scope}`)
      .on("postgres_changes", {event:"*", schema:"public", table:"cmp_tasks"}, payload => {
        setTasks(prev => {
          const belongs = row => scope !== "mine" || row.assigned_to === profile.id;
          if (payload.eventType === "INSERT"){
            if (!belongs(payload.new) || prev.some(x=>x.id===payload.new.id)) return prev;
            return [payload.new, ...prev];
          }
          if (payload.eventType === "UPDATE"){
            if (!belongs(payload.new)) return prev.filter(x=>x.id!==payload.new.id);
            return prev.map(x => x.id===payload.new.id ? payload.new : x);
          }
          if (payload.eventType === "DELETE") return prev.filter(x => x.id !== payload.old.id);
          return prev;
        });
      }).subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[scope, profile.id]);

  // Keep an open detail modal in sync with live updates.
  useEffect(()=>{
    if (!openTask) return;
    const fresh = tasks.find(x=>x.id===openTask.id);
    if (fresh && fresh.updated_at !== openTask.updated_at) setOpenTask(fresh);
    if (!fresh) setOpenTask(null);
  },[tasks]);   // eslint-disable-line

  // Mark current sub-tab as seen on mount
  const switchStage = (key) => { setStage(key); markTabSeen("tasks:" + key); if (onTabSeenRefresh) onTabSeenRefresh(); };
  useEffect(() => { markTabSeen("tasks:" + stage); }, []); // eslint-disable-line

  const counts = useMemo(()=>{
    const o = {}; TASK_STAGES.forEach(s => o[s.key] = tasks.filter(t=>t.status===s.key).length); return o;
  },[tasks]);

  // Unseen count per sub-tab
  const unseenCounts = useMemo(()=>{
    const o = {};
    TASK_STAGES.forEach(s => {
      const lastSeen = tabSeenMap?.["tasks:" + s.key];
      if (!lastSeen) { o[s.key] = tasks.filter(t=>t.status===s.key).length; return; }
      o[s.key] = tasks.filter(t => t.status===s.key && t.updated_at > lastSeen).length;
    });
    return o;
  },[tasks, tabSeenMap]);

  const shown = useMemo(()=>{
    const n = q.trim().toLowerCase();
    return tasks.filter(t => {
      if (t.status !== stage) return false;
      if (doerF !== "All" && t.assigned_to !== doerF) return false;
      if (n && ![t.assigned_to_name, t.task_desc, t.assigned_by_name].join(" ").toLowerCase().includes(n)) return false;
      return true;
    }).sort((a,b) => (a.planned_date||"").localeCompare(b.planned_date||""));
  },[tasks, stage, q, doerF]);

  // Swipe to switch sub-tabs
  const stageKeys = TASK_STAGES.map(s=>s.key);
  const swipeRef = useSwipe(
    () => { const i = stageKeys.indexOf(stage); if (i < stageKeys.length-1) switchStage(stageKeys[i+1]); },
    () => { const i = stageKeys.indexOf(stage); if (i > 0) switchStage(stageKeys[i-1]); }
  );

  // Stage tab colors
  const stageColors = {
    "Pending Confirmation": { active:"bg-violet-500/15 border-violet-500/60 text-violet-800", dot:"bg-violet-500" },
    "Assigned":            { active:"bg-teal-500/15 border-teal-500/60 text-teal-800", dot:"bg-teal-500" },
    "Completed":           { active:"bg-emerald-500/15 border-emerald-500/60 text-emerald-800", dot:"bg-emerald-500" },
  };

  return (
    <div ref={swipeRef}>
      <div className="flex items-center gap-2 mb-3 flex-wrap">
        <div>
          <h2 className="font-bold text-[15px] sm:text-[17px]">{scope==="mine" ? "My Tasks" : "All Tasks"}</h2>
          <p className="text-[11px] sm:text-[12.5px] text-slate-500">{scope==="mine" ? "आपके टास्क" : "सब टास्क — admin only"}</p>
        </div>
        {scope !== "mine" && (
          <Btn variant="primary" size="sm" icon={I.plus} className="ml-auto" onClick={()=>setShowNew(true)}>Add Task</Btn>
        )}
      </div>

      <div className="flex gap-1.5 mb-3 overflow-x-auto pb-0.5">
        {TASK_STAGES.map(s => {
          const sc = stageColors[s.key] || stageColors["Assigned"];
          const isActive = stage === s.key;
          const unseen = unseenCounts[s.key] || 0;
          return (
            <button key={s.key} onClick={()=>switchStage(s.key)}
              className={`shrink-0 rounded-xl px-3 sm:px-4 py-2 sm:py-2.5 text-left transition-all border relative ${
                isActive ? sc.active : "bg-white border-slate-200 hover:border-slate-300 text-slate-700"}`}>
              {unseen > 0 && !isActive && (
                <span className={`absolute -top-1 -right-1 min-w-[16px] h-[16px] rounded-full ${sc.dot} text-white text-[9px] font-bold flex items-center justify-center px-0.5 shadow-sm`}>
                  {unseen > 99 ? "99+" : unseen}
                </span>
              )}
              <span className="block text-[12px] sm:text-[13px] font-semibold">
                {s.label} <span className="font-mono text-[10.5px] sm:text-[11.5px] opacity-70">{counts[s.key]||0}</span>
              </span>
              <span className="block text-[9.5px] sm:text-[11px] text-slate-500">{s.hi}</span>
            </button>
          );
        })}
      </div>

      <div className="flex gap-2 mb-3 flex-wrap">
        <div className="relative grow min-w-0 w-full sm:w-auto sm:min-w-[180px]">
          <Ico d={I.search} className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input className={inputCls(false)+" pl-9 text-[14px]"} value={q} onChange={e=>setQ(e.target.value)} placeholder="Search naam ya task…" />
        </div>
        <div className="flex gap-2 w-full sm:w-auto">
          {scope !== "mine" && (
            <select className={inputCls(false)+" flex-1 sm:w-auto text-[14px]"} value={doerF} onChange={e=>setDoerF(e.target.value)}>
              <option value="All">All doers</option>
              {doers.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          )}
          <Btn variant="outline" icon={I.refresh} onClick={load} aria-label="Refresh" className="shrink-0" />
        </div>
      </div>

      <div className="rounded-xl border border-slate-200 bg-white sm:bg-slate-50 overflow-hidden divide-y divide-slate-100 sm:divide-slate-200 shadow-sm">
        {loading ? Array.from({length:4}).map((_,i)=>(
          <div key={i} className="px-3 py-3.5 sm:px-4 sm:py-4"><div className="h-3 rounded bg-slate-100 animate-pulse" style={{width:`${55+i*9}%`}} /></div>
        )) : shown.length === 0 ? (
          <div className="px-4 py-12 sm:py-16 text-center">
            <Ico d={I.calendar} className="w-8 h-8 sm:w-9 sm:h-9 mx-auto text-slate-300 mb-2.5" />
            <p className="font-semibold text-slate-700 text-[13.5px]">Yahan koi task nahi</p>
            <p className="text-[12px] sm:text-[13px] text-slate-500 mt-1">
              {tasks.length ? "Filter ya search clear karke dekhein." : (scope==="mine" ? "Abhi koi task assign nahi hui." : '"Add Task" se nayi task banayein.')}
            </p>
          </div>
        ) : shown.map(t => <TaskRow key={t.id} t={t} onOpen={setOpenTask} />)}
      </div>

      {showNew && (
        <TaskFormModal profile={profile} doers={doers} toast={toast} onClose={()=>setShowNew(false)} onSaved={load} />
      )}
      {openTask && (
        <TaskDetailModal task={openTask} profile={profile} doers={doers} toast={toast}
          onClose={()=>setOpenTask(null)} onSaved={load} />
      )}
    </div>
  );
}

function TasksPanel({profile, toast, tabSeenMap, onTabSeenRefresh}){
  const [sub, setSub] = useState("mine");
  const [doers, setDoers] = useState([]);

  useEffect(()=>{
    sb.from("cmp_profiles").select("id,name,mobile,department").eq("is_active", true).order("name")
      .then(({data}) => setDoers(data || []));
  },[]);

  if (profile.role !== "Admin") return <TaskList profile={profile} doers={doers} scope="mine" toast={toast} tabSeenMap={tabSeenMap} onTabSeenRefresh={onTabSeenRefresh} />;

  return (
    <div>
      <div className="flex rounded-lg border border-slate-200 overflow-hidden w-fit mb-4">
        <button onClick={()=>setSub("mine")}
          className={`px-3.5 py-2.5 text-[13px] font-medium min-h-[40px] ${sub==="mine"?"bg-slate-100 text-slate-900":"text-slate-500 hover:text-slate-800"}`}>
          My Tasks
        </button>
        <button onClick={()=>setSub("all")}
          className={`px-3.5 py-2.5 text-[13px] font-medium min-h-[40px] ${sub==="all"?"bg-slate-100 text-slate-900":"text-slate-500 hover:text-slate-800"}`}>
          All Tasks
        </button>
      </div>
      {sub === "mine"
        ? <TaskList profile={profile} doers={doers} scope="mine" toast={toast} tabSeenMap={tabSeenMap} onTabSeenRefresh={onTabSeenRefresh} />
        : <TaskList profile={profile} doers={doers} scope="all" toast={toast} tabSeenMap={tabSeenMap} onTabSeenRefresh={onTabSeenRefresh} />}
    </div>
  );
}

// ============================================================
// 13. STATS STRIP
// ============================================================
function Stats({rows, profile, D}){
  const s = useMemo(()=>{
    const open = rows.filter(r => r.status === "Pending" || r.status === "In Progress");
    // What a complaint is counted against: a machine, or a process+quality.
    const keyOf = r => D.key === "fabric"
      ? `${r.process_name||""}|${r.fabric_quality ?? ""}`
      : `${machineLabel(r)}|${r.machine_no||""}`;
    const subjects = new Set(open.map(keyOf));
    const awaiting = rows.filter(r => r.status === "Completed" &&
      (profile.role === "User" ? r.raised_by_user_id === profile.id : true)).length;
    const base = [
      { n: rows.filter(r=>r.status==="Pending").length, l:"Pending", c:"text-amber-600" },
      { n: rows.filter(r=>r.status==="In Progress").length, l:"In-progress", c:"text-teal-600" },
      { n: awaiting, l: profile.role==="User" ? "Aapka OK chahiye" : "Awaiting user OK", c:"text-violet-600" },
    ];
    /* The fourth tile differs because the two domains measure different
       damage. For machines it is downtime — how many are stopped right now.
       For fabric nothing is stopped, so the useful number is how many
       complaints are still waiting to be classified, which is exactly the
       Production Manager's queue. */
    if (D.tracksDowntime){
      const down = new Set(open.filter(isDown).map(keyOf));
      base.push({ n: down.size, l:"Machines down", c:"text-rose-600" });
      base.push({ n: subjects.size, l:"Machines affected", c:"text-slate-800" });
    } else {
      base.push({ n: open.filter(r=>!r.complaint_type).length, l:"Type baaki", c:"text-rose-600" });
      base.push({ n: subjects.size, l:"Qualities affected", c:"text-slate-800" });
    }
    return base;
  },[rows, profile, D]);
  return (
    <div className="flex gap-2 mb-4 overflow-x-auto pb-1 sm:grid sm:grid-cols-5 sm:overflow-visible">
      {s.map(t=>(
        <div key={t.l} className="shrink-0 w-[110px] sm:w-auto rounded-xl border border-slate-200 bg-white sm:bg-slate-50 px-3 py-2.5 sm:px-3.5 sm:py-3 shadow-sm">
          <p className={`font-mono font-semibold text-xl sm:text-2xl leading-none ${t.c}`}>{t.n}</p>
          <p className="text-[9.5px] sm:text-[10.5px] uppercase tracking-wide text-slate-500 mt-1">{t.l}</p>
        </div>
      ))}
    </div>
  );
}

// ============================================================
// 13B. TASK REMINDERS — Admin "ring alarm" pings a doer's device.
//      In-tab: Sound + browser Notification fire via Realtime.
//      Background: Server-side DB trigger sends Web Push even if
//      the browser is fully closed — 100% delivery guarantee.
//      Acknowledging is mandatory so nothing silently vanishes.
// ============================================================
function BellButton({toast}){
  const [perm, setPerm] = useState(()=> (window.Notification ? Notification.permission : "unsupported"));
  if (perm === "unsupported" || perm === "granted") return null;
  const ask = async () => {
    try{
      const p = await Notification.requestPermission();
      setPerm(p);
      toast(p === "granted" ? "Reminder alerts on ho gaye." : "Alerts allow nahi hue — sirf in-app alarm bajega.");
    } catch(e){ toast("Yeh browser notifications support nahi karta.", true); }
  };
  return (
    <Btn variant="ghost" icon={I.bell} onClick={ask} className="shrink-0" title="Reminder alerts on karein">
      <span className="hidden sm:inline">Alerts</span>
    </Btn>
  );
}

function ReminderWatcher({profile}){
  const [queue, setQueue] = useState([]);
  const [busy, setBusy] = useState(false);
  const stopAlarmRef = useRef(null);
  const notifyTimerRef = useRef(null);

  // Start / stop continuous alarm based on queue
  useEffect(()=>{
    if (queue.length > 0 && !stopAlarmRef.current) {
      // Start looping alarm
      stopAlarmRef.current = playAlarm();
      // Also re-fire browser notification every 15s so it's hard to miss
      const reNotify = () => {
        const top = queue[0];
        if (top) notifyBrowser("⏰ PENDING — Task Reminder!", top.task_desc_snapshot, `task-${top.task_id}`);
      };
      notifyTimerRef.current = setInterval(reNotify, 15000);
    }
    if (queue.length === 0 && stopAlarmRef.current) {
      stopAlarmRef.current();
      stopAlarmRef.current = null;
      clearInterval(notifyTimerRef.current);
      notifyTimerRef.current = null;
    }
    return () => {
      if (stopAlarmRef.current) { stopAlarmRef.current(); stopAlarmRef.current = null; }
      if (notifyTimerRef.current) { clearInterval(notifyTimerRef.current); notifyTimerRef.current = null; }
    };
  },[queue.length]);

  // Realtime subscription
  useEffect(()=>{
    if (!profile?.id) return;
    const channel = sb.channel(`task_reminders_${profile.id}`)
      .on("postgres_changes",
        {event:"INSERT", schema:"public", table:"cmp_task_reminders", filter:`assigned_to=eq.${profile.id}`},
        payload => {
          setQueue(q => q.some(x=>x.id===payload.new.id) ? q : [...q, payload.new]);
          notifyBrowser("⏰ Task Reminder!", payload.new.task_desc_snapshot, `task-${payload.new.task_id}`);
          // Stamp received_at so Admin can see the ring reached the device
          if (!payload.new.received_at) {
            sb.from("cmp_task_reminders").update({ received_at: new Date().toISOString() }).eq("id", payload.new.id).then(()=>{});
          }
        })
      .subscribe();
    return ()=>{ sb.removeChannel(channel); };
  },[profile?.id]);

  if (!queue.length) return null;
  const r = queue[0];

  const ack = async () => {
    setBusy(true);
    await sb.from("cmp_task_reminders").update({ acknowledged_at: new Date().toISOString() }).eq("id", r.id);
    setBusy(false);
    // Drop from queue → alarm stops automatically via useEffect above
    setQueue(q => q.filter(x=>x.id!==r.id));
  };

  return (
    <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-5 border-2 border-amber-400 animate-pulse-border">
        <style>{`@keyframes pulse-border{0%,100%{border-color:#fbbf24}50%{border-color:#ef4444}} .animate-pulse-border{animation:pulse-border 1s ease-in-out infinite}`}</style>
        <div className="flex items-center gap-2 mb-2.5">
          <div className="w-9 h-9 rounded-full bg-amber-500/15 text-amber-600 grid place-items-center shrink-0">
            <Ico d={I.bell} className="w-5 h-5" />
          </div>
          <div className="min-w-0">
            <h3 className="font-bold text-[15.5px] text-slate-900">Task Reminder</h3>
            <p className="text-[11px] text-slate-500">{r.sent_by_name} · {fmtDateTime(r.sent_at)}</p>
          </div>
          <div className="ml-auto text-[11px] font-bold text-red-600 bg-red-100 px-2 py-1 rounded-full animate-pulse">
            RINGING
          </div>
        </div>
        <p className="text-[13.5px] text-slate-800 whitespace-pre-wrap leading-relaxed mb-1.5">{r.task_desc_snapshot}</p>
        <p className="text-[12px] text-slate-500 mb-2">Planned date: {fmtDate(r.planned_date_snapshot)}</p>
        {r.message ? <p className="text-[13px] text-teal-800 bg-teal-500/10 rounded-lg px-3 py-2 italic whitespace-pre-wrap mb-2">"{r.message}"</p> : null}
        {queue.length > 1 ? <p className="text-[11.5px] text-slate-400 mb-2">+{queue.length-1} aur reminder baaki</p> : null}
        <Btn variant="primary" className="w-full justify-center mt-2" onClick={ack} disabled={busy}>
          {busy?<Spinner/>:null}OK, dekh liya — Alarm band karo
        </Btn>
      </div>
    </div>
  );
}
